k","lv":6,"text":"3 出位所修法","juan":9},{"t":"p","text":"煖等四法，依四尋思、四如實智初後位立。四尋思者，尋思名、義、自性、差別，假有實無。如實遍知此四離識及識非有，名如實智，名、義相異，故別尋求，二二相同，故合思察。","juan":9},{"t":"k","lv":6,"text":"4 釋四地名","juan":9},{"t":"p","text":"依明得定，發下尋思，觀無所取，立為煖位。謂此位中，創觀所取名等四法皆自心變，假施設有，實不可得。初獲慧日前行相故，立明得名，即此所獲道火前相，故亦名煖。","juan":9},{"t":"p","text":"依明增定，發上尋思，觀無所取，立為頂位。謂此位中，重觀所取名等四法皆自心變，假施設有，實不可得。明相轉盛，故名明增，尋思位極，故復名頂。","juan":9},{"t":"p","text":"依印順定，發下如實智，於無所取決定印持，無能取中亦順樂忍。既無實境離能取識，寧有實識離所取境？所取、能取相待立故。印順忍時總立為忍，印前順後立印順名，忍境、識空故亦名忍。","juan":9},{"t":"p","text":"依無間定，發上如實智，印二取空，立世第一法。謂前上忍唯印能取空，今世第一法二空雙印，從此無間必入見道故，立無間名，異生法中此最勝故，名世第一法。","juan":9},{"t":"k","lv":6,"text":"5 總攝上義釋本頌文","juan":9},{"t":"p","text":"如是煖、頂依能取識觀所取空，下忍起時印境空相；中忍轉位，於能取識如境是空，順樂忍可；上忍起位印能取空；世第一法雙印空相，皆帶相故未能證實。故說菩薩此四位中。猶於現前安立少物，謂是唯識真勝義性，以彼空、有二相未除，帶相觀心有所得故，非實安住真唯識理。彼相滅已方實安住。依如是義，故有頌言：","juan":9},{"t":"v","num":null,"lines":["「菩薩於定位，觀影唯是心，","義⸢316⸣相⸤既滅除，審觀唯自想。","如是住內心，知所取非有，","次能取亦無，後觸無所得。」"],"juan":9},{"t":"k","lv":6,"text":"6 斷二縛位","juan":9},{"t":"p","text":"此加行位未遣相縛，於麁重縛亦未能斷，唯能伏除分別二取，違見道故。於俱生者及二隨眠，有漏觀心有所得故，有分別故，未全伏除，全未能滅。","juan":9},{"t":"k","lv":6,"text":"7 明所觀境","juan":9},{"t":"p","text":"此位菩薩於安立諦、非安立諦俱學觀察，為引當來二種見故，及伏分別二種障故，非安立諦是正所觀，非如二乘唯觀安立。","juan":9},{"t":"k","lv":6,"text":"8 辨所依處","juan":9},{"t":"p","text":"菩薩起此煖等善根，雖方便時通諸靜慮，而依第四方得成滿，託最勝依入見道故。","juan":9},{"t":"k","lv":6,"text":"9 界、趣分別","juan":9},{"t":"p","text":"唯依欲界善趣身起，餘慧、厭心非殊勝故。","juan":9},{"t":"k","lv":6,"text":"10 七地分別","juan":9},{"t":"p","text":"此位亦是解行地攝，未證唯識真勝義故。","juan":9},{"t":"k","lv":4,"text":"(三) 通達位","juan":9},{"t":"p","text":"次通達位，其相云何？","juan":9},{"t":"k","lv":5,"text":"㊀問起>","juan":9},{"t":"k","lv":5,"text":"㊁舉頌答","juan":9},{"t":"p","text":"頌曰：","juan":9}],"kepan":["㊂長行釋","1 顯位所由","2 釋位總名","3 出位所修法","4 釋四地名","5 總攝上義釋本頌文","6 斷二縛位","7 明所觀境","8 辨所依處","9 界、趣分別","10 七地分別","(三) 通達位","㊀問起>","㊁舉頌答"],"yi":"行者於現前安立少分之物，謂此即是唯識實性；然因仍有能得之心與所得之相，有所得故，並非真實安住於唯識。此即加行位。","yao":["加行位修四尋思（名、義、自性、差別）與四如實智，歷煖、頂、忍、世第一法四善根位，加行趣入見道。","四善根與觀行的配屬：煖頂二位依明得明增定觀所取空，忍位依印順定印所取空、順樂忍能取空，世第一法依無間定雙印二空，次第井然。","「現前立少物」正是本位之病：帶相觀空，仍存能所，故雖近真而未真。此語為後世判別「相似證」的重要根據。","此位仍屬有漏加行，尚未證真，故論主明言「非實住唯識」，防行者以定境為證境。"],"ming":[["加行位","五位之二。修四尋思、四如實智，起煖頂忍世第一四善根。"],["四尋思","尋思名、義、自性、差別皆假有實無。"],["四如實智","由四尋思所引，如實遍知名義自性差別之離識非有。"],["四善根","煖、頂、忍、世第一法。順決擇分，鄰近見道。"],["有所得","存能取所取之相而觀。有所得則非真見道。"]]},{"id":18,"label":"唯識位三・通達位","verses":[28],"kind":"verse","juan":[9],"chars":1437,"blocks":[{"t":"v","num":28,"lines":["若時於所緣，智都無所得，","爾時住唯識，離二取相故。"],"juan":9},{"t":"k","lv":5,"text":"㊂長行釋","juan":9},{"t":"k","lv":6,"text":"1 略解本頌","juan":9},{"t":"p","text":"論曰：若時菩薩於所緣境，無分別智都無所得，不取種種戲論相故，爾時乃名實住唯識真勝義性，即證真如智與真如平等平等，俱離能取、所取相故，能、所取相，俱是分別，有所得心，戲論現故。","juan":9},{"t":"k","lv":6,"text":"2 廣釋>","juan":9},{"t":"p","text":"有義：此智二分俱無，說無所取、能取相故。","juan":9},{"t":"p","text":"有義：此智相、見俱有，帶彼相起名緣彼故，若無彼相名緣彼者，應色智等，名聲等智，若無見分應不能緣，寧可說為緣真如智？勿真如性亦名能緣，故應許此定有見分。","juan":9},{"t":"p","text":"有義：此智見有相無，說無相取，不取相故，雖有見分而無分別，說非能取，非取全無。雖無相分，而可說此帶如相起，不離如故。如自證分緣見分時不變而緣，此亦應爾；變而緣者便非親證，如後得智應有分別，故應許此有見無相。","juan":9},{"t":"p","text":"加行無間此智生時，體會真如，名通達位；初照理故，亦名見道。","juan":9},{"t":"p","text":"然此見道，略說有二。","juan":9},{"t":"p","text":"一、真見道，謂即所說無分別智，實證二空所顯真理，實斷二障分別隨眠，雖多剎那事方究竟，而相等故，總說一心。有義：此中二空、二障漸證、漸斷，以有淺深、麁細異故。有義：此中二空、二障頓證、頓斷，由意樂力有堪能故。","juan":9},{"t":"p","text":"二、相見道，此復有二。","juan":9},{"t":"p","text":"一、觀非安立諦有三品心：一、內遣有情假緣智，能除軟品分別隨眠；二、內遣諸法假緣智，能除中品分別隨眠；三、遍遣一切有情、諸法假緣智，能除一切分別隨眠。","juan":9},{"t":"p","text":"前二名法智，各別緣故。第三名類智，總合緣故。","juan":9},{"t":"p","text":"法真見道二空見分自所斷障無間、解脫，別總建立，名相見道。","juan":9},{"t":"p","text":"有義：此三是真見道，以相見道緣四諦故。有義：此三是相見道，以真見道不別緣故。","juan":9},{"t":"p","text":"二、緣安立諦有十六心，此復有二。","juan":9},{"t":"p","text":"一者依觀所取、能取，別立法、類十六種心。","juan":9},{"t":"p","text":"謂於苦諦有四種心：一、苦法智忍，謂觀三界苦諦真如，正斷三界見苦所斷二十八種分別隨眠。二、苦法智，謂忍無間觀前真如，證前所斷煩惱解脫。三、苦類智忍，謂智無間無漏慧生，於法忍、智各別內證，言後聖法皆是此類。四、苦類智，謂此無間無漏智生，審定、印可苦類智忍。如於苦諦有四種心，集、滅、道諦應知亦爾。此十六心，八觀真如，八觀正智。法真見道無間、解脫見、自證分差別建立，名相見道。","juan":9},{"t":"p","text":"二者依觀下、上諦境，別立法、類十六種心。","juan":9},{"t":"p","text":"謂觀現前、不現前界，苦等四諦各有二心，一、現觀忍；二、現觀智，如其所應法真見道，無間、解脫見分觀諦，斷見所斷百一十二分別隨眠，名相見道。","juan":9},{"t":"p","text":"若依廣布聖教道理，說相見道有九種心。","juan":9},{"t":"p","text":"此即依前緣安立諦二十六種，止、觀別立，謂法類品忍、智合說各有四觀，即為八心，八相應止，總說為一，雖見道中止觀雙運，而於見義觀順非止，故此觀、止開合不同，由此九心名相見道。","juan":9},{"t":"p","text":"諸相見道依真假說，世第一法無間而生及斷隨眠，非實如是，真見道後方得生故，非安立後起安立故。分別隨眠真已斷故。前真見道證唯識性，後相見道證唯識相，二中初勝，故頌偏說，前真見道根本智攝，後相見道後得智攝。","juan":9},{"t":"p","text":"諸後得智有二分⸢317⸣耶⸤？","juan":9},{"t":"p","text":"有義：俱無，離二取故。","juan":9},{"t":"p","text":"有義：此智見有相無，說此智品有分別故，聖智皆能親照境故，不執著故，說離二取。","juan":9},{"t":"p","text":"有義：此智二分俱有。","juan":9},{"t":"p","text":"說此思惟似真如相，不見真實真如性故。又說此智分別諸法自、共相等，觀諸有情根性差別而為說故。又說此智現身、土等，為諸有情說正法故，若不變現似色、聲等，寧有現身說法等事？","juan":9},{"t":"p","text":"轉色蘊依不現色者，轉四蘊依應無受等。又若此智不變似境，離自體法應非所緣，緣色等時應緣聲等，又緣無法等應無所緣緣，彼體非實無緣用故。","juan":9},{"t":"p","text":"由斯後智二分俱有。","juan":9},{"t":"p","text":"此二見道與六現觀相攝云何？","juan":9},{"t":"p","text":"六現觀者：一、思現觀，謂最上品喜受相應，思所成慧，此能觀察諸法共相，引生煖等，加行道中觀察諸法此用最猛，偏立現觀，煖等不能廣分別法，又未證理故非現觀。","juan":9},{"t":"p","text":"二、信現觀，謂緣三寶世、出世間決定淨信，此助現觀令不退轉，立現觀名。","juan":9},{"t":"p","text":"三、戒現觀，謂無漏戒除破戒垢令觀增明，亦名現觀。","juan":9},{"t":"p","text":"四、現觀智諦現觀，謂一切種緣非安立根本、後得無分別智。","juan":9},{"t":"p","text":"五、現觀邊智諦現觀，謂現觀智諦現觀後，諸緣安立世、出世智。","juan":9},{"t":"p","text":"六、究竟現觀，謂盡智等究竟位智。","juan":9},{"t":"p","text":"此真見道攝彼第四現觀少分，此相見道攝彼第四、第五少分，彼第二、三雖此俱起而非自性，故不相攝。","juan":9},{"t":"p","text":"菩薩得此二見道時，生如來家，住極喜地，善達法界，得諸平等，常生諸佛大集會中，於多百門已得自在，自知不久證大菩提，能盡未來利樂一切。","juan":9},{"t":"k","lv":4,"text":"(四) 修習位","juan":9},{"t":"p","text":"次修習位，其相云何？","juan":9},{"t":"k","lv":5,"text":"㊀問起>","juan":9},{"t":"p","text":"頌曰：","juan":9},{"t":"k","lv":5,"text":"㊁舉頌答","juan":9}],"kepan":["㊂長行釋","1 略解本頌","2 廣釋>","(四) 修習位","㊀問起>","㊁舉頌答"],"yi":"若在某時，於所緣境上，能緣之智都無所得，遠離了能取所取二取之相，爾時方是真正安住唯識實性。此即通達位，亦名見道。","yao":["見道分真見道與相見道：真見道以無分別智親證真如，一心真見；相見道則帶相觀空，緣安立非安立諦作十六心或三心觀。","「智都無所得」的無所得，非無智，而是無能所相對之得。此處是唯識學與般若學交涉最密之處。","此位頓斷分別二障（煩惱障與所知障之分別起者），證得初地入心，得法身之分證，故稱通達。","「爾時住唯識」與加行位「非實住唯識」正相對照，二頌合觀方見論主判別相似與真實之嚴謹。"],"ming":[["通達位","五位之三。即見道，初證真如，入初地。"],["真見道","根本無分別智親證真如，不帶相、不安立。"],["相見道","後得智緣安立諦等作觀，帶相而證，隨真見道而起。"],["無分別智","離能所分別、親緣真如之無漏智。"],["二障","煩惱障（障涅槃）與所知障（障菩提）。各有分別起與俱生起。"]]},{"id":19,"label":"唯識位四・修習位","verses":[29],"kind":"verse","juan":[9,10],"chars":8656,"blocks":[{"t":"v","num":29,"lines":["無得不思議，是出世間智，","捨二麁重故，便證得轉依。"],"juan":9},{"t":"k","lv":5,"text":"㊂長行釋","juan":9},{"t":"k","lv":6,"text":"1 略釋頌文","juan":9},{"t":"p","text":"論曰：菩薩從前見道起已，為斷⸢318⸣餘⸤障，證得轉依，復數修習無分別智。","juan":9},{"t":"p","text":"此智遠離所取、能取，故說「無得」及「不思議」；或離戲論說為「無得」，妙用難測名「不思議」。","juan":9},{"t":"p","text":"是出世間無分別智，斷世間故，名「出世間」。二取隨眠是世間本，唯此能斷獨得「出」名。或「出世」名依二義立，謂體無漏及證真如，此智具斯二種義故，獨名「出世」，餘智不然，即十地中無分別智。","juan":9},{"t":"p","text":"數修此故，「捨二麁重」。二障種子立「麁重」名，性無堪任，違細、輕故，令彼永滅，故說為「捨」。","juan":9},{"t":"p","text":"此能捨彼二麁重故，便能證得廣大「轉依」。","juan":9},{"t":"p","text":"「依」謂所依，即依他起，與染、淨法為所依故；染謂虛妄遍計所執；淨謂真實圓成實性。轉謂二分，轉捨、轉得。由數修習無分別智，斷本識中二障麁重，故能轉捨依他起上遍計所執，及能轉得依他起中圓成實性。由轉煩惱得大涅槃，轉所知障證無上覺。成立唯識，意為有情證得如斯二轉依果。","juan":9},{"t":"p","text":"或「依」即是唯識真如，生死、涅槃之所依故。","juan":9},{"t":"p","text":"愚夫顛倒，迷此真如，故無始來受生死苦，聖者離倒，悟此真如，便得涅槃畢⸢319⸣竟⸤安樂。由數修習無分別智，斷本識中二障麁重，故能轉滅依如生死，及能轉證依如涅槃，此即真如離雜染性。如雖性淨而相雜染，故離染時假說新淨，即此新淨說為轉依，修習位中斷障證得。","juan":9},{"t":"p","text":"雖於此位亦得菩提，而非此中頌意所顯，頌意但顯轉唯識性，二乘滿位名解脫身，在大牟尼名法身故。","juan":9},{"t":"k","lv":6,"text":"2 廣前頌","juan":9},{"t":"p","text":"云何證得二種轉依？","juan":9},{"t":"p","text":"謂十地中修十勝行、斷十重障、證十真如，二種轉依由斯證得。","juan":9},{"t":"p","text":"言十地者，一、極喜地，初獲聖性，具證二空，能益自、他，生大喜故。","juan":9},{"t":"p","text":"二、離垢地，具淨尸羅，遠離能起微細毀犯煩惱垢故。","juan":9},{"t":"p","text":"三、發光地，成就勝定，大法總持，能發無邊妙慧光故。","juan":9},{"t":"p","text":"四、焰慧地，安住最勝菩提分法，燒煩惱薪，慧焰增故。","juan":9},{"t":"p","text":"五、極難勝地，真、俗兩智行相互違，合令相應極難勝故。","juan":9},{"t":"p","text":"六、現前地，住緣起智，引無分別最勝般若令現前故。","juan":9},{"t":"p","text":"七、遠行地，至無相住功用後邊，出過世間二乘道故。","juan":9},{"t":"p","text":"八、不動地，無分別智任運相續，相、用煩惱不能動故。","juan":9},{"t":"p","text":"九、善慧地，成就微妙四無⸢320⸣閡⸤解，能遍十方善說法故。","juan":9},{"t":"p","text":"十、法雲地，大法智雲含眾德水，⸢321⸣蔽⸤⸢322⸣⸤如空麁重，充滿法身故。","juan":9},{"t":"p","text":"如是十地，總攝有為、無為功德以為自性。","juan":9},{"t":"p","text":"與所修行為勝依持，令得生長，故名為地。","juan":9},{"t":"p","text":"十勝行者，即是十種波羅蜜多。","juan":9},{"t":"p","text":"施有三種：謂財施、無畏施、法施。戒有三種：謂律儀戒、攝善法戒、饒益有情戒。忍有三種：謂耐怨害忍、安受苦忍、諦察法忍。精進有三種：謂被甲精進、攝善精進、利樂精進。靜慮有三種：⸢323⸣謂⸤安住靜慮、引發靜慮、⸢324⸣辦⸤事靜慮。般若有三種：謂生空無分別慧、法空無分別慧、俱空無分別慧。方便善巧有二種：謂迴向方便善巧、拔濟方便善巧。願有二種：謂求菩提願、利樂他願。力有二種：謂思擇力、修習力。智有二種：謂受用法樂智、成熟有情智。","juan":9},{"t":"p","text":"此十性者，施以無貪及彼所起三業為性；戒以受學菩薩戒時三業為性；忍以無瞋、精進、審慧及彼所起三業為性；精進以勤及彼所起三業為性；靜慮但以等持為性；後五皆以擇法為性，說是根本、後得智故。有義：第八以欲、勝解及信為性，願以此三為自性故。","juan":9},{"t":"p","text":"此說自性，若并眷屬，一一皆以一切俱行功德為性。","juan":9},{"t":"p","text":"此十相者，要七最勝之所攝受，方可建立波羅蜜多。","juan":9},{"t":"p","text":"一、安住最勝，⸢325⸣謂⸤要安住菩薩種⸢326⸣性⸤；二、依止最勝，謂要依止大菩提心；三、意樂最勝，謂要悲愍一切有情；四、事業最勝，謂要具行一切事⸢327⸣業⸤；五、巧便最⸢328⸣勝⸤，謂要無相智所攝受；六、迴向最勝，謂要迴向無上菩提；七、清淨最勝，謂要不為二障間雜。","juan":9},{"t":"p","text":"若非此七所攝受者，所行施等非到彼岸。","juan":9},{"t":"p","text":"由斯施等十對波羅蜜多，一一皆應四句分別。","juan":9},{"t":"p","text":"此但有十不增減者，謂十地中對治十障、證十真如，無增減故。","juan":9},{"t":"p","text":"復次，前六不增減者，為除六種相違障故，漸次修行諸佛法故，漸次成熟諸有情故，此如餘論廣說應知。又施等三增上生道，感大財體及眷屬故；精進等三決定勝道，能伏煩惱、成熟有情及佛法故，諸菩薩道唯有此二。又前三種饒益有情，施彼資財、不損惱彼、堪忍彼惱而饒益故。精進等三對治煩惱，雖未伏滅，而能精勤修對治彼諸善加行，永伏永滅諸煩惱故。又由施等不住涅槃，及由後三不住生死，為無住處涅槃資糧，由此前六不增不減。","juan":9},{"t":"p","text":"後唯四者，為助前六令修滿足不增減故，方便善巧助施等三，願助精進，力助靜慮，智助般若，令修滿故，如《解深密》廣說應知。","juan":9},{"t":"p","text":"十次第者，謂由前前引發後後，及由後後持淨前前。又前前麁，後後細故，易難修習次第如是。","juan":9},{"t":"p","text":"釋總別名如餘處說。","juan":9},{"t":"p","text":"此十修者有五種修：一、依止任持修；二、依止作意修；三、依止意樂修；四、依止方便修；五、依止自在修。依此五修，修習十種波羅蜜多皆得圓滿，如《集論》等廣說其相。","juan":9},{"t":"p","text":"此十攝者，謂十一一皆攝一切波羅蜜多，互相順故，依修前行而引後者，前攝於後，必待前故，後不攝前，不待後故。依修後行，持淨前者，後攝於前，持淨前故，前不攝後，非持淨故。若依純雜而修習者，展轉相望應作四句。","juan":9},{"t":"p","text":"此實有十而說六者，應知後四第六所攝，開為十者，第六唯攝無分別智，後四皆是後得智攝，緣世俗故。","juan":9},{"t":"p","text":"此十果者，有漏有四，除離繫果；無漏有四，除異熟果。而有處說具五果者，或互相資或二合說。","juan":9},{"t":"p","text":"十與三學互相攝者，戒學有三：一、律儀戒，謂正遠離所應離法；二、攝善法戒，謂正修證應修證法；三、饒益有情戒，謂正利樂一切有情。此與二乘有共、不共，甚深廣大，如餘處說。","juan":9},{"t":"p","text":"定學有四：一、大乘光明定，謂此能發照了大乘理、教、行、果，智光明故；二、集福王定，謂此自在集無邊福，如王勢力無等雙故；三、賢守定，謂此能守世、出世間賢善法故；四、健行定，謂佛菩薩大健有情之所行故。此四所緣、對治、堪能、引發、作業，如餘處說。","juan":9},{"t":"p","text":"慧學有三：一、加行無分別慧；二、根本無分別慧；三、後得無分別慧。此三自性、所依、因緣、所緣、行等，如餘處說。","juan":9},{"t":"p","text":"如是三慧，初二位中種具有三，現唯加行，於通達位現二種三，見道位中無加行故，於修習位七地已前，若種若現俱通三種。八地以去現二種三，無功用道違加行故，所有進趣皆用後得，無漏觀中任運⸢329⸣起⸤故，究竟位中現、種俱二，加行現、種俱已捨故。","juan":9},{"t":"p","text":"若自性攝，戒唯攝戒，定攝靜慮，慧攝後五。若并助伴，皆具相攝。若隨用攝，戒攝前三，資糧、自體、眷屬性故，定攝靜慮，慧攝後五，精進三攝，遍策三故。若隨顯攝，戒攝前四，前三如前，及守護故，定攝靜慮，慧攝後五。","juan":9},{"t":"p","text":"此十位者，五位皆具，修習位中其相最顯，然初二位，頓悟菩薩種通⸢330⸣二⸤種，現唯有漏，漸悟菩薩若種、若現俱通二種，已得生空無漏觀故。通達位中，種通二種，現唯無漏。於修習位七地已前，種、現俱通有漏無漏，八地以去種通二種，現唯無漏。究竟位中，若現、若種俱唯無漏。","juan":9},{"t":"p","text":"此十因位有三種名：一名⸢331⸣遠⸤波羅蜜多，謂初無數劫，爾時施等勢力尚微，被煩惱伏，未能伏彼，由斯煩惱不覺現行。二名近波羅蜜多，謂第二無數劫，爾時施等勢力漸增，非煩惱伏，而能伏彼，由斯煩惱故意方行。三名大波羅蜜多，謂第三無數劫，爾時施等勢力轉增，能畢竟伏一切煩惱，由斯煩惱永不現行，猶有所知微細現種及煩惱種，故未究竟。","juan":9},{"t":"p","text":"此十義類差別無邊，恐厭繁文，略示綱要。","juan":9},{"t":"p","text":"十於十地雖實皆修，而隨相增，地地修一。","juan":9},{"t":"p","text":"雖十地行有無量門，而皆攝在十到彼岸。","juan":9},{"t":"p","text":"十重障者：","juan":9},{"t":"p","text":"一、異生性障，謂二障中分別起者，依彼種立異生性故。","juan":9},{"t":"p","text":"二乘見道現在前時，唯斷一種，名得聖性；菩薩見道現在前時，具斷二種，名得聖性。","juan":9},{"t":"p","text":"二真見道現在前時，彼二障種必不成就，猶明與闇定不俱生，如⸢332⸣秤⸤兩頭低昂時等，諸相違法理必應然，是故二性無俱成失。","juan":9},{"t":"p","text":"無間道時已無惑種，何用復起解脫道為？","juan":9},{"t":"p","text":"斷惑證滅，期心別故。","juan":9},{"t":"p","text":"為捨彼品麁重性故，無間道時雖無惑種，而未捨彼無堪任性，為捨此故，起解脫道，及證此品擇滅無為。","juan":9},{"t":"p","text":"雖見道生亦斷惡趣諸業果等，而今且說能起煩惱是根本故，由斯初地說斷二愚及彼麁重。","juan":9},{"t":"p","text":"一、執著我法愚，即是此中異生性障；二、惡趣雜染愚，即是惡趣諸業果等。應知愚品總說為愚，後准此釋。或彼唯說利、鈍障品俱起二愚。","juan":9},{"t":"p","text":"彼麁重言，顯彼二種，或二所起無堪任性，如入二定說斷苦根，所斷苦根雖非現、種而名麁重，此亦應然，後麁重言，例此應釋。","juan":9},{"t":"p","text":"雖初地所斷實通二障，而異生性障意取所知，說十無明非染污故；無明即是十障品愚。","juan":9},{"t":"p","text":"二乘亦能斷煩惱障，彼是共故，非此所說。又十無明不染污者，唯依十地修所斷說。","juan":9},{"t":"p","text":"雖此位中亦伏煩惱、斷彼麁重，而非正意，不斷隨眠，故此不說。","juan":9},{"t":"p","text":"理實初地修道位中，亦斷俱生、所知一分，然今且說最初斷者，後九地斷，准此應知。","juan":9},{"t":"p","text":"住、滿地中時既淹久，理應進斷所應斷障，不爾三時道應無別，故說菩薩得現觀已，復於十地修道位中，唯修永滅所知障道，留煩惱障助願受生，非如二乘速趣圓寂，故修道位不斷煩惱，將成佛時方頓斷故。","juan":9},{"t":"p","text":"二、⸢333⸣邪⸤行障，謂所知障中俱生一分及彼所起悞犯三業。","juan":9},{"t":"p","text":"彼障二地極淨尸羅，入二地時便能永斷，由斯二地說斷二愚及彼麁重：一、微細悞犯愚，即是此中俱生一分；二、種種業趣愚，即彼所起悞犯三業，或唯起業、不了業愚。","juan":9},{"t":"p","text":"三、闇鈍障，謂所知障中俱生一分，令所聞、思、修法忘失。","juan":9},{"t":"p","text":"彼障三地勝定、總持及彼所發殊勝三慧，入三地時便能永斷。","juan":9},{"t":"p","text":"由斯三地說斷二愚及彼麁重：一、欲貪愚，即是此中能障勝定及修慧者，彼昔多與欲貪俱故，名欲貪愚，今得勝定及修所成，彼既永斷，欲貪隨伏，此無始來依彼轉故。二、圓滿聞持陀羅尼愚，即是此中能障總持、聞、思慧者。","juan":9},{"t":"p","text":"四、微細煩惱現行障，謂所知障中俱生一分，第六識俱身見等攝，最下品故，不作意緣故，遠隨現行故，說名微細。","juan":9},{"t":"p","text":"彼障四地菩提分法，入四地時便能永斷。","juan":9},{"t":"p","text":"彼昔多與第六識中任運而生，執我見等同體起故，說煩惱名，⸢334⸣今⸤四地中既得無漏菩提分法，彼便永滅，此我見等亦永不行。","juan":9},{"t":"p","text":"初、二、三地行施、戒、修，相同世間，四地修得菩提分法方名出世，故能永害二身見等。","juan":9},{"t":"p","text":"寧知此與第六識俱？","juan":9},{"t":"p","text":"第七識俱執我見等，與無漏道性相違故，八地以去方永不行，七地已來猶得現起，與餘煩惱為依持故，此麁彼細，伏有前後，故此但與第六相應。","juan":9},{"t":"p","text":"「身見等」言亦攝無始所知障攝定愛、法愛。彼定、法愛三地尚增；入四地時方能永斷，菩提分法特違彼故。","juan":9},{"t":"p","text":"由斯四地說斷二愚及彼麁重。一、等至愛愚，即是此中定愛俱者；二、法愛愚，即是此中法愛俱者。所知障攝二愚斷故，煩惱二愛亦永不行。","juan":9},{"t":"p","text":"五、於下乘般涅槃障，謂所知障中俱生一分，令厭生死樂趣涅槃，同下二乘厭苦欣滅。彼障五地無差別道，入五地時便能永斷。由斯五地說斷二愚及彼麁重：一、純作意背生死愚，即是此中厭生死者；二、純作意向涅槃愚，即是此中樂涅槃者。","juan":9},{"t":"p","text":"六、麁相現行障，謂所知障中俱生一分，執有染、淨麁相現行，彼障六地無染、淨道，入六地時便能永斷。","juan":9},{"t":"p","text":"由斯六地說斷二愚及彼麁重。一、現觀察行流轉愚，即是此中執有染者，諸行流轉染分攝故；二、相多現行愚，即是此中執有淨者。","juan":9},{"t":"p","text":"取淨相故，相觀多行，未能多時住無相觀。","juan":9},{"t":"p","text":"七、細相現行障，謂所知障中俱生一分，執有生滅細相現行，彼障七地妙無相道，入七地時便能永斷。","juan":9},{"t":"p","text":"由斯七地說斷二愚及彼麁重。一、細相現行愚，即是此中執有生者，猶取流轉細生相故；二、純作意求無相愚，即是此中執有滅者，尚取還滅細滅相故。","juan":9},{"t":"p","text":"純於無相作意勤求，未能空中起有勝行。","juan":9},{"t":"p","text":"八、無相中作加行障，謂所知障中俱生一分，令無相觀不任運起。","juan":9},{"t":"p","text":"前之五地，有相觀多，無相觀少；於第六地，有相觀少，無相觀多；第七地中純無相觀，雖恒相續而有加行，由無相中有加行故，未能任運現相及土，如是加行障八地中無功用道；故若得入第八地時便能永斷。彼永斷故，得二自在。","juan":9},{"t":"p","text":"由斯八地說斷二愚及彼麁重。一、於無相作功用愚；二、於⸢335⸣相⸤自在愚，令於相中不自在故，此亦攝土、相一分故。","juan":9},{"t":"p","text":"八地以上純無漏道任運起故，三界煩惱永不現行，第七識中細所知障猶可現起，生空智果不違彼故。","juan":9},{"t":"p","text":"九、利他中不欲行障，謂所知障中俱生一分，令於利樂有情事中，不欲勤行，樂修己利。","juan":9},{"t":"p","text":"彼障九地四無閡解，入九地時便能永斷。","juan":9},{"t":"p","text":"由斯九地說斷二愚及彼麁重。","juan":9},{"t":"p","text":"一、於無量所說法、無量名句字、後後慧⸢336⸣辯⸤陀羅尼自在愚。","juan":9},{"t":"p","text":"於無量所說法陀羅尼自在者，謂義無閡解，即於所詮總持自在，於一義中現一切義故；於無量名句字陀羅尼自在者，謂法無閡解，即於能詮總持自在，於一名句字中現一切名句字故；於後後慧辯陀羅尼自在者，謂詞無閡解，即於言音展轉訓釋總持自在，於一音聲中現一切音聲故。","juan":9},{"t":"p","text":"二、辯才自在愚，辯才自在者，謂辯無閡解，善達機宜巧為說故。","juan":9},{"t":"p","text":"愚能障此四種自在，皆是此中第九障攝。","juan":9},{"t":"p","text":"十、於諸法中未得自在障，謂所知障中俱生一分，令於諸法不得自在。","juan":9},{"t":"p","text":"彼障十地大法智雲及所含藏、所起事業。","juan":9},{"t":"p","text":"入十地時便能永斷。由斯十地說斷二愚及彼麁重。一、大神通愚，即是此中障所起事業者；二、悟入微細祕密愚，即是此中障大法智雲及所含藏者。","juan":9},{"t":"p","text":"此地於法雖得自在，而有餘障，未名最極。","juan":9},{"t":"p","text":"謂有俱生微所知障，及有任運煩惱障種，金剛喻定現在前時，彼皆頓斷，入如來地。","juan":9},{"t":"p","text":"由斯佛地說斷二愚及彼麁重：一、於一切所知境極微細著愚，即是此中微所知障；二、極微細礙愚，即是此中一切任運煩惱障種。","juan":9},{"t":"p","text":"故《集論》說：得菩提時頓斷煩惱及所知障，成阿羅漢及成如來，證⸢337⸣大⸤涅槃、大菩提故。","juan":9},{"t":"p","text":"此十一障，二障所攝。","juan":10},{"t":"p","text":"煩惱障中見所斷種，於極喜地見道初斷。彼障現起，地前已伏。","juan":10},{"t":"p","text":"修所斷種，金剛喻定現在前時，一切頓斷。彼障現起，地前漸伏，初地以上，能頓伏盡，令永不行，如阿羅漢。由故意力，前七地中雖暫現起，而不為失。八地以上，畢竟不行。","juan":10},{"t":"p","text":"所知障中見所斷種，於極喜地見道初斷。彼障現起，地前已伏。","juan":10},{"t":"p","text":"修所斷種，於十地中，漸次斷滅；金剛喻定現在前時，方永斷盡。彼障現起，地前漸伏；乃至十地，方永⸢338⸣伏⸤盡。","juan":10},{"t":"p","text":"八地以上，六識俱者，不復現行，無漏觀心，及果相續，能違彼故；第七俱者，猶可現行，法空智果起位方伏。","juan":10},{"t":"p","text":"前五轉識，設未轉依，無漏伏故，障不現起。","juan":10},{"t":"p","text":"雖於修道十地位中，皆不斷滅煩惱障種，而彼麁重，亦漸斷滅，由斯故說二障麁重，一一皆有三⸢339⸣位⸤斷義。","juan":10},{"t":"p","text":"雖諸位中，皆斷麁重，而三位顯，是故偏說。","juan":10},{"t":"p","text":"斷二障種，漸、頓云何？","juan":10},{"t":"p","text":"第七識俱煩惱障種，三乘將得，無學果時，一剎那中，三界頓斷。所知障種，將成佛時，一剎那中，一切頓斷，任運內起，無麁細故。","juan":10},{"t":"p","text":"餘六識俱煩惱障種，見所斷者，三乘見位真見道中，一切頓斷；修所斷者，隨其所應：一類二乘，三界九地，一一漸次，九品別斷；一類二乘，三界九地，合為一聚，九品別斷；菩薩要起金剛喻定，一剎那中，三界頓斷。","juan":10},{"t":"p","text":"所知障種，初地初心，頓斷一切見所斷者。修所斷者，後於十地修道位中，漸次而斷，乃至正起金剛喻定，一剎那中方皆斷盡。通緣內外麁細境生，品類差別有眾多故。","juan":10},{"t":"p","text":"二乘根鈍，漸斷障時，必各別起無間、解脫；加行、勝進，或別或總。","juan":10},{"t":"p","text":"菩薩利根，漸斷障位，非要別起無間、解脫，剎那剎那能斷證故。加行等四，剎那剎那前後相望，皆容具有。","juan":10},{"t":"p","text":"十真如者：","juan":10},{"t":"p","text":"一、遍行真如：謂此真如二空所顯，無有一法而不在故。","juan":10},{"t":"p","text":"二、⸢340⸣最⸤勝真如：謂此真如具無邊德，於一切法最為勝故。","juan":10},{"t":"p","text":"三、勝流真如：謂此真如所流教法，於餘教法極為勝故。","juan":10},{"t":"p","text":"四、無攝受真如：謂此真如無所繫屬，非我執等所依取故。","juan":10},{"t":"p","text":"五、類無別真如：謂此真如類無差別，非如眼等類有異故。","juan":10},{"t":"p","text":"六、無染淨真如：謂此真如本性無染，亦不可說後方淨故。","juan":10},{"t":"p","text":"七、法無別真如：謂此真如雖多教法，種種安立而無異故。","juan":10},{"t":"p","text":"八、不增減真如：謂此真如離增減執，不隨淨染有增減故。即此亦名相土自在所依真如，謂若證得此真如已，現相、現土俱自在故。","juan":10},{"t":"p","text":"九、智自在所依真如：謂若證得此真如已，於無礙解得自在故。","juan":10},{"t":"p","text":"十、業自在等所依真如：謂若證得此真如已，普於一切神通作業、總持定門皆自在故。","juan":10},{"t":"p","text":"雖真如性實無差別，而隨勝德假立十種。","juan":10},{"t":"p","text":"雖初地中已達一切，而能證行，猶未圓滿，為令圓滿，後後建立。","juan":10},{"t":"p","text":"如是菩薩於十地中，勇猛修行十種勝行，斷十重障，證十真如，於二轉依便能證得。","juan":10},{"t":"p","text":"轉依位別，略有六種。","juan":10},{"t":"p","text":"一、損力益能轉：謂初、二位，由習勝解及慚、愧故，損本識中染種勢力，益本識內淨種功能，雖未斷障種，實證轉依，而漸伏現行，亦名為轉。","juan":10},{"t":"p","text":"二、通達轉：謂通達位，由見道力，通達真如，斷分別生二障麁重，證得一分真實轉依。","juan":10},{"t":"p","text":"三、修習轉：謂修習位，由數修習十地行故，漸斷俱生二障麁重，漸次證得真實轉依。《攝大乘》中說通達轉在前六地。有無相觀，通達真、俗間雜現前，令真、非真現、不現故。說修習轉在後四地。純無相觀長時現前，勇猛修習，斷餘麁重，多令非真不顯現故。","juan":10},{"t":"p","text":"四、果圓滿轉：謂究竟位，由三大劫阿僧企耶，修⸢341⸣集⸤無邊難行勝行，金剛喻定現在前⸢342⸣時⸤，永斷本來一切麁重，頓證佛果圓滿轉依，窮未來際利樂無盡。","juan":10},{"t":"p","text":"五、下劣轉：謂二乘位，專求自利，厭苦、欣寂，唯能通達生空真如，斷煩惱種，證真擇滅，無勝堪能，名下劣轉。","juan":10},{"t":"p","text":"六、廣大轉：謂大乘位，為利他故，趣大菩提。生死涅槃俱無欣、厭，具能通達二空真如，雙斷所知、煩惱障種，頓證無上菩提、涅槃。有勝堪能，名廣大轉。","juan":10},{"t":"p","text":"此中意說廣大轉依，捨二麁重而證得故。","juan":10},{"t":"p","text":"轉依義別，略有四種：","juan":10},{"t":"p","text":"一、能轉道，此復有二：一、能伏⸢343⸣道，謂⸤伏二障隨眠勢力，令不引起二障現行，此通有漏、無漏二道，加行、根本、後得三智，隨其所應，漸頓伏彼。","juan":10},{"t":"p","text":"二、能斷道，謂能永斷二障隨眠。此道定非有漏加行，有漏曾習、相執所引，未泯相故；加行趣求所證、所引，未成⸢344⸣辦⸤故。","juan":10},{"t":"p","text":"有義：根本無分別智，親證二空所顯真理，無境相故，能斷隨眠；後得不然，故非斷道。","juan":10},{"t":"p","text":"有義：後得無分別智，雖不親證二空真理，無力能斷迷理隨眠，而於安立、非安立相，明了現前，無倒證故，亦能永斷迷事隨眠。","juan":10},{"t":"p","text":"故《瑜伽》說：修道位中，有出世斷道；世、出世斷道。無純世間道，能永害隨眠。是曾習故，相執引故。","juan":10},{"t":"p","text":"由斯理趣，諸見所斷，及修所斷，迷理隨眠，唯有根本無分別智，親證理故，能正斷彼；餘修所斷迷事隨眠，根本、後得俱能正斷。","juan":10},{"t":"p","text":"二、所轉依，此復有二：一、持種依，謂⸢345⸣本⸤識。由此能持染、淨法種，與染、淨法俱為所依，聖道轉令捨染得淨；餘依他起性，雖亦是依，而不能持種，故此不說。","juan":10},{"t":"p","text":"二、迷悟依，謂真如。由此能作迷、悟根本，諸染、淨法依之得生，聖道轉令捨染得淨。餘雖亦作迷悟法依，而非根本，故此不說。","juan":10},{"t":"p","text":"⸢346⸣三⸤、所轉捨，此復有二：一、所斷捨，謂二障種。真無間道現在前時，障、治相違，彼便斷滅，永不成就，說之為捨。彼種斷故，不復現行妄執我、法。","juan":10},{"t":"p","text":"所執我、法，不對妄情，亦說為捨。由此名捨遍計所執。","juan":10},{"t":"p","text":"二、所棄捨，謂餘有漏、劣無漏種。金剛喻定現在前時，引極圓、明純淨本識，非彼依故，皆永棄捨。","juan":10},{"t":"p","text":"彼種捨已，現有漏法及劣無漏，畢竟不生；既永不生，亦說為捨。由此名捨生死劣法。","juan":10},{"t":"p","text":"有義：所餘有漏法種及劣無漏，金剛喻定現在前時，皆已棄捨，與二障種俱時捨故。","juan":10},{"t":"p","text":"有義：爾時猶未捨彼，與無間道不相違故。菩薩應無生死法故；此位應無所熏識故，住無間道應名佛故；後解脫道應無用故。","juan":10},{"t":"p","text":"由此應知，餘有漏等，解脫道起，方棄捨之。第八淨識，非彼依故。","juan":10},{"t":"p","text":"四、所轉得，此復有二：","juan":10},{"t":"p","text":"一、所顯得，謂大涅槃。此雖本來自性清淨，而由⸢347⸣客⸤障覆令不顯。真聖道生，斷彼障故，令其相顯名得涅槃。此依真如離障施設，故體即是清淨法界。","juan":10},{"t":"p","text":"涅槃義別，略有四種：","juan":10},{"t":"p","text":"一、本來自性清淨涅槃，謂一切法相真如理，雖有⸢348⸣客⸤染而本性淨，具無數量微妙功德，無生無滅，湛若虛空，一切有情平等共有，與一切法不一不異。離一切相、一切分別，尋思路絕，名言道斷，唯真聖者自內所證，其性本寂，故名涅槃。","juan":10},{"t":"p","text":"二、有餘依涅槃，謂即真如出煩惱障，雖有微苦所依未滅，而障永寂，故名涅槃。","juan":10},{"t":"p","text":"三、無餘依涅槃，謂即真如出生死苦，煩惱既盡，餘依亦滅，眾苦永寂，故名涅槃。","juan":10},{"t":"p","text":"四、無住處涅槃，謂即真如出所知障，大悲般若常所輔翼。由斯不住生死涅槃，利樂有情，窮未來際，用而常寂，故名涅槃。","juan":10},{"t":"p","text":"一切有情，皆有初一，二乘無學，容有前三，唯我世尊可言具四。","juan":10},{"t":"p","text":"如何善逝有有餘依？雖無實依，而現似有；或苦依盡，說無餘依，非苦依在，說有餘依。是故世尊可言具四。","juan":10},{"t":"p","text":"若聲聞等有無餘依，如何有處⸢349⸣說⸤彼非有？","juan":10},{"t":"p","text":"有處說彼都無涅槃，豈有餘依彼亦非有？","juan":10},{"t":"p","text":"然聲聞等身、智在時，有所知障，苦依未盡，圓寂義隱，說無涅槃；非彼實無煩惱障盡所顯真理有餘涅槃，爾時未證無餘圓寂，故亦說彼無無餘依；非彼後時滅身、智已，無苦依盡無餘涅槃。或說二乘無涅槃者，依無住處，不依前三。","juan":10},{"t":"p","text":"又說彼無無餘依者，依不定⸢350⸣性⸤二乘而說，彼纔證得有餘涅槃，決定迴心求無上覺，由定願力留身久住，非如一類入無餘依。謂有二乘深樂圓寂，得生空觀親證真如，永滅感生煩惱障盡，顯依真理有餘涅槃，彼能感生煩惱盡故，後有異熟無由更生，現苦所依任運滅位。餘有為法既無所依，與彼苦依同時頓捨，顯依真理無餘涅槃，爾時雖無二乘身智，而由彼證可說彼有。此位唯有清淨真如，離相湛然寂滅安樂，依斯說彼與佛無差，但無菩提利樂他業，故復說彼與佛有異。","juan":10},{"t":"p","text":"諸所知障，既不感生，如何斷彼，得無住處？彼能隱覆法空真如，令不發生大悲般若，窮未來際，利樂有情。故斷彼時顯法空理，此理即是無住涅槃，令於二邊，俱不住故。","juan":10},{"t":"p","text":"若所知障，亦障涅槃，如何斷彼，不得擇滅？","juan":10},{"t":"p","text":"擇滅離縛，彼非縛故。","juan":10},{"t":"p","text":"既爾，斷彼寧得涅槃？","juan":10},{"t":"p","text":"非諸涅槃皆擇滅攝。不爾，性淨應非涅槃。能縛有情住生死者，斷此說得擇滅無為。諸所知障不感生死，非如煩惱能縛有情，故斷彼時不得擇滅；然斷彼故，法空理顯，此理相寂，說為涅槃，非此涅槃擇滅為性。故四圓寂諸無為中，初、後即真如，中二擇滅攝。","juan":10},{"t":"p","text":"若唯斷縛得擇滅者，不動等二，四中誰攝？","juan":10},{"t":"p","text":"非擇滅攝，說暫離故；擇滅無為，唯究竟滅。有非擇滅，非永滅故。","juan":10},{"t":"p","text":"或無住處亦擇滅攝，由真擇力，滅障得故。擇滅有二：一、滅縛得，謂斷感生煩惱得者；二、滅障得，謂斷⸢351⸣餘⸤障而證得者。故四圓寂諸無為中，初一即真如，後三皆擇滅，不動等二，暫伏滅者，非擇滅攝；究竟滅者，擇滅所攝。","juan":10},{"t":"p","text":"既所知障亦障涅槃，如何但說是菩提障？說煩惱障但障涅槃，豈彼不能為菩提障？應知聖教依勝用說，理實俱能通障二果。","juan":10},{"t":"p","text":"如是所說四涅槃中，唯後三種，名所顯得。","juan":10},{"t":"p","text":"二、所生得，謂大菩提。此雖本來有能生種，而所知障礙故不生；由聖道力，斷彼障故，令從種起，名得菩提。起已相續，窮未來際。此即四智相應心品。","juan":10},{"t":"p","text":"云何四智相應心品？","juan":10},{"t":"p","text":"一、大圓鏡智相應心品：謂此心品，離諸分別，所緣、行相，微細難知，不⸢352⸣忘⸤不愚，一切境相，性相清淨，離諸雜染，純淨圓德，現種依持，能現、能生身、土智影，無間無斷，窮未來際，如大圓鏡，現眾色像。","juan":10},{"t":"p","text":"二、平等性智相應心品：謂此心品，觀一切法，自、他有情，悉皆平等。大慈悲等，恒共相應，隨諸有情所樂，示現受用身、土，影像差別。妙觀察智不共所依，無住涅槃之所建立，一味相續，窮未來際。","juan":10},{"t":"p","text":"三、妙觀察智相應心品：謂此心品，善觀諸法自相、共相，無礙而轉。攝觀無量總持⸢353⸣定⸤門，及所發生功德珍寶。於大眾會，能現無邊作用差別，皆得自在，雨大法雨，斷一切疑，令諸有情皆獲利樂。","juan":10},{"t":"p","text":"四、成所作智相應心品：謂此心品，為欲利樂諸有情故，普於十方，示現種種變化三業，成本願力所應作事。","juan":10},{"t":"p","text":"如是四智相應心品，雖各定有二十二法，能變、所變種現俱生，而智用增，以智名顯。","juan":10},{"t":"p","text":"故此四品，總攝佛地一切有為功德皆盡。","juan":10},{"t":"p","text":"此轉有漏八、七、六、五識相應品，如次而得。智雖非識，而依識轉，識為主故，說轉識得。又有漏位智劣識強，無漏位中，智強識劣。為勸有情依智捨識，故說轉八識而得此四智。","juan":10},{"t":"p","text":"大圓鏡智相應心品，有義：菩薩金剛喻定現在前時，即初現起，異熟識種與極微細所知障種，俱時捨故；若圓鏡智爾時未起，便無能持淨種識故。","juan":10},{"t":"p","text":"有義：此品解脫道時，初成佛故，乃得初起；異熟識種，金剛喻定現在前時，猶未頓捨，與無⸢354⸣間⸤道不相違故。","juan":10},{"t":"p","text":"非障有漏、劣無漏法，但與佛果定相違故；金剛喻定無所熏識，無漏不增，應成佛故。由斯此品，從初成佛，盡未來際，相續不斷，持無漏種令不失故。","juan":10},{"t":"p","text":"平等性智相應心品，菩薩見道初現前位，違二執故，方得初起。後十地中，執未斷故，有漏等位，或有間斷；法雲地後，與淨第八，相依相續，盡未來際。","juan":10},{"t":"p","text":"妙觀察智相應心品，生空觀品，二乘見位，亦得初起。此後展轉至無學位，或至菩薩解行地終，或至上位，若非有漏，或無心時，皆容現起。","juan":10},{"t":"p","text":"法空觀品，菩薩見位，方得初起，此後展轉乃至上位，若非有漏，生空智果，或無心時，皆容現起。","juan":10},{"t":"p","text":"成所作智相應心品，有義：菩薩修道位中，後得引故，亦得初起。","juan":10},{"t":"p","text":"有義：成佛方得初起。以十地中，依異熟識所變眼等非無漏故，有漏不共，必俱同境，根發無漏識，理不相應故。此二於境，明昧異故。由斯此品，要得成佛，依無漏根，方容現起，而數間斷，作意起故。","juan":10},{"t":"p","text":"此四種⸢355⸣性⸤雖皆本有，而要熏發方得現行，因位漸增，佛果圓滿，不增不減，盡未來際，但從種生；不熏成種，勿前佛德勝後佛故。","juan":10},{"t":"p","text":"大圓鏡智相應心品，有義：但緣真如為境，是無分別，非後得智，行相、所緣不可知故。","juan":10},{"t":"p","text":"有義：此品緣一切法，《莊嚴論》說：大圓鏡智，於一切境，不愚迷故。《佛地經》說：如來⸢356⸣智鏡⸤，諸處、境、識，眾像現故。又此決定緣無漏種，及身、土等諸影像故，行、緣微細，說不可知，如阿賴耶，亦緣俗故。","juan":10},{"t":"p","text":"緣真如故，是無分別；緣餘境故，後得智攝。其體是一，隨用分二。了俗由證真，故說為後得。餘一分二，准此應知。","juan":10},{"t":"p","text":"平等性智相應心品，有義：但緣第八淨識，如染第七緣藏識故。有義：但緣真如為境，緣一切法平等性故。有義：遍緣真、俗為境，《佛地經》說：平等性智，證得十種平等性故。《莊嚴論》說：緣諸有情自他平等，隨他勝解，示現無邊佛影像故。由斯此品，通緣真、俗，二智所攝，於理無違。","juan":10},{"t":"p","text":"妙觀察智相應心品，緣一切法自相、共相，皆無障礙，二智所攝。","juan":10},{"t":"p","text":"成所作智相應心品，有義：但緣五種現境，《莊嚴論》說：如來五根，一一皆於五境轉故。有義：此品亦能遍緣三世諸法，不違正理，《佛地經》說：成所作智，起作三業諸變化事，決擇有情心行差別，領受去來現在等義。若不遍緣，無此能故。然此心品，隨意樂力，或緣一法、或二、或多。且說五根於五境轉，不言唯爾，故不相違。隨作意生，緣事相境，起化業故，後得智攝。","juan":10},{"t":"p","text":"此四心品，雖皆遍能緣一切法，而用有異：謂鏡智品，現自受用身、淨土相，持無漏種；平等智品，現他受用身、淨土相；成事智品，能現變化身及土相；觀察智品，觀察自、他功能過失，雨大法雨，破諸疑網，利樂有情。","juan":10},{"t":"p","text":"如是等門，差別多種。","juan":10},{"t":"p","text":"此四心品，名所生得。","juan":10},{"t":"p","text":"此所生得，總名菩提；及前涅槃，名所轉得。","juan":10},{"t":"p","text":"雖轉依義總有四種，而⸢357⸣今⸤但取二所轉得。頌說「證得轉依」言故。","juan":10},{"t":"p","text":"此修習位說能證得，非已證得，因位攝故。","juan":10},{"t":"k","lv":4,"text":"(五) 究竟位","juan":10},{"t":"p","text":"後究竟位，其相云何？","juan":10},{"t":"k","lv":5,"text":"㊀問起>","juan":10},{"t":"k","lv":5,"text":"㊁舉頌答","juan":10},{"t":"p","text":"頌曰：","juan":10}],"kepan":["㊂長行釋","1 略釋頌文","2 廣前頌","(五) 究竟位","㊀問起>","㊁舉頌答"],"yi":"此無所得而不可思議者，即是出世間的無分別智。由於捨離了煩惱障與所知障的二種麁重，便能證得轉依。此即修習位，攝十地修道。","yao":["本節篇幅居全論之冠，因論主於此廣說十地、十波羅蜜多、十重障、十真如，並詳辨轉依之義，是修證論的主體。","「不思議」有三義：自內證故、無戲論故、超尋思故。「出世間」則簡別世間有漏智，顯此智唯無漏。","二麁重即二障之種子。捨二麁重與證轉依是一事兩面：捨染依而得淨依，故轉依非於外別得一法。","轉依開四義：能轉道、所轉依、所轉捨、所轉得。所轉得復分所顯得（大涅槃）與所生得（大菩提），此判攝直接開出第三十頌的果德。","十地與十障十真如一一相配（如初地遍行障、遍行真如），構成唯識學最細密的階位對照表，是判斷行者位次的教理依據。"],"ming":[["修習位","五位之四。初地住心以上至金剛無間道，數修無分別智，斷俱生二障。"],["二麁重","煩惱障與所知障之種子。性無堪任，故名麁重。"],["轉依","轉捨依他起上之遍計所執，轉得依他起上之圓成實。唯識修證之總目標。"],["十重障","十地各所斷之障，如異生性障、邪行障、闇鈍障等。"],["十真如","十地各所證之真如，如遍行真如、最勝真如、勝流真如等。"],["後得智","根本無分別智之後所起、能緣俗諦、起化他用之無漏智。"]]},{"id":20,"label":"唯識位五・究竟位","verses":[30],"kind":"verse","juan":[10],"chars":2932,"blocks":[{"t":"v","num":30,"lines":["此即無漏界，不思議善常，","安樂解脫身，大牟尼名法。"],"juan":10},{"t":"k","lv":5,"text":"㊂長行釋","juan":10},{"t":"k","lv":6,"text":"1 解頌>","juan":10},{"t":"p","text":"論曰：前修習位所得轉依，應知即是究竟位相。","juan":10},{"t":"p","text":"「此」謂此前二轉依果，即是究竟無漏界攝。","juan":10},{"t":"p","text":"諸漏永盡，非漏隨增，性淨圓明，故名無漏。","juan":10},{"t":"p","text":"「界」是藏義，此中含容無邊希有大功德故；或是因義，能生五乘世、出世間利樂事故。","juan":10},{"t":"p","text":"清淨法界，可唯無漏攝，四智心品，如何唯無漏？","juan":10},{"t":"p","text":"道諦攝故，唯無漏攝，謂佛功德及身、土等皆是無漏種⸢358⸣性⸤所生，有漏法種已永捨故。","juan":10},{"t":"p","text":"雖有示現作生死身、業煩惱等，似苦、集諦，而實無漏，道諦所攝。","juan":10},{"t":"p","text":"《集論》等說：十五界等，唯是有漏，如來豈無五根、五識、五外界等？","juan":10},{"t":"p","text":"有義：如來功德、身、土，甚深微妙，非有非無，離諸分別，絕諸戲論，非界、處等法門所攝，故與彼說理不相違。","juan":10},{"t":"p","text":"有義：如來五根、五境妙定生故，法界色攝，非佛五識，雖依此變，然麁、細異，非五境攝。如來五識，非五識界，經說佛心恒在定故，論說五識性散亂故。","juan":10},{"t":"p","text":"成所作智何識相應？","juan":10},{"t":"p","text":"第六相應，起化用故。與觀察智性有何別？彼觀諸法自、共相等，此唯起化，故有差別。此二智品應不並生，一類二識不俱起故。許不並起，於理無違；同體用分，俱亦非失。","juan":10},{"t":"p","text":"或與第七淨識相應，依眼等根，緣色等境，是平等智作用差別，謂淨第七起他受用身土相者，平等品攝，起變化者，成事品攝。","juan":10},{"t":"p","text":"豈不此品，⸢359⸣轉⸤五識得？","juan":10},{"t":"p","text":"非轉彼得，體即是彼。如轉生死言得涅槃，不可涅槃同生死攝，是故於此，不應為難。","juan":10},{"t":"p","text":"有義：如來功德、身、土，如應攝在蘊、處、界中，彼三皆通有漏、無漏。","juan":10},{"t":"p","text":"《集論》等說：十五界等唯有漏者，彼依二乘麁淺境說，非說一切。謂餘成就十八界中，唯有後三，通無漏攝，佛成就者，雖皆無漏，而非二乘所知境攝。","juan":10},{"t":"p","text":"然餘處說，佛功德等非界等者，不同二乘劣智所知界等相故，理必應爾。","juan":10},{"t":"p","text":"所以者何？說有為法皆蘊攝故；說一切法界、處攝故；十九界等，聖所遮故；若絕戲論，便非界等。亦不應說，即無漏界、善、常、安樂、解脫身等。又處處說：轉無常蘊，獲得常蘊，界、處亦然；寧說如來非蘊、處、界？故言非者，是密意說。","juan":10},{"t":"p","text":"又說五識性散亂者，說餘⸢360⸣成⸤者，非佛所成。","juan":10},{"t":"p","text":"故佛身中，十八界等，皆悉具足，而純無漏。","juan":10},{"t":"p","text":"此轉依果，又不思議，超過尋思言議道故；微妙甚深自內證故；非諸世間喻所喻故。","juan":10},{"t":"p","text":"此又是善，白法性故；清淨法界，遠離生滅，極安隱故；四智心品，妙用無方，極巧便故；二種皆有順益相故；違不善故俱說為善。","juan":10},{"t":"p","text":"論說處等，⸢361⸣八⸤唯無記，如來豈無五根、三境？此中三釋，廣說如前。一切如來身、土等法皆滅道攝，故唯是善，聖說滅道唯善性故，說佛土等，非苦、集故；佛識所變有漏、不善、無記相等，皆從無漏善種所生，無漏善攝。","juan":10},{"t":"p","text":"此又是常，無盡期故。清淨法界，無生無滅，性無變易，故說為常；四智心品所依常故，無斷盡故，亦說為常。非自性常，從因生故，生者歸滅，一向⸢362⸣記⸤故。不見色心，非無常故。然四智品，由本願力，所化有情，無盡期故，窮未來際無斷、無盡。","juan":10},{"t":"p","text":"此又安樂，無逼惱故。清淨法界，眾相寂靜，故名安樂。四智心品永離⸢363⸣惱⸤害，故名安樂。此二自性，皆無逼惱，及能安樂一切有情，故二轉依，俱名安樂。","juan":10},{"t":"p","text":"二乘所得二轉依果，唯永遠離煩惱障縛，無殊勝法故，⸢364⸣但⸤名解脫身。","juan":10},{"t":"p","text":"大覺世尊，成就無上寂默法，故名大牟尼。此牟尼尊所得二果，永離二障，亦名法身。無量無邊力無畏等，大功德法所莊嚴故。","juan":10},{"t":"p","text":"體、依、聚義，總說名身。故此法身，五法為性，非淨法界獨名法身，二轉依果，皆此攝故。","juan":10},{"t":"k","lv":6,"text":"2 諸門分別","juan":10},{"t":"p","text":"如是法身，有三相別：一、自性身，謂諸如來真淨法界，受用、變化平等所依，離相寂然，絕諸戲論，具無邊際真常功德，是一切法平等實性，即此自性，亦名法身，大功德法所依止故。","juan":10},{"t":"p","text":"二、受用身，此有二種：一、自受用，謂諸如來三無數劫，修集無量福慧資糧，所起無邊真實功德，及極圓、淨、常、遍色身，相續湛然，盡未來際，恒自受用廣大法樂。","juan":10},{"t":"p","text":"二、他受用，謂諸如來由平等智，示現微妙淨功德身，居純淨土，為住十地諸菩薩眾，現大神通，轉正法輪，決眾疑網，令彼受用大乘法樂。合此二種，名受用身。","juan":10},{"t":"p","text":"三、變化身：謂諸如來由成事智，變現無量隨類化身，居淨、穢土，為未登地諸菩薩眾、二乘、異生，稱彼機宜，現通說法，令各獲得諸利樂事。","juan":10},{"t":"p","text":"以五法性攝三身者，有義：初、二攝自性身，經說真如是法身故。論說轉去阿賴耶識，得自性身；圓鏡智品，轉去藏識，而證得故。中二智品，攝受用身，說平等智，於純淨土，為諸菩薩現佛身故；說觀察智，大集會中，說法斷疑現自在故；說轉諸轉識得受用身故。後一智品，攝變化身，說成事智，於十方土，現無量種難思化故。又智殊勝，具攝三身，故知三身，皆有實智。","juan":10},{"t":"p","text":"有義：初一攝自性身。","juan":10},{"t":"p","text":"說自性身本性常故；說佛法身無生滅故；說證因得非生因故；又說法身諸佛共有，遍一切法，猶若虛空，無相無為，非色心故。","juan":10},{"t":"p","text":"然說轉去藏識得者，謂由轉滅第八識中二障麁重，顯法身故。智殊勝中說法身者，是彼依止彼實性故。","juan":10},{"t":"p","text":"自性法身，雖有真實無邊功德，而無為故，不可說為色、心等物。","juan":10},{"t":"p","text":"四智品中真實功德，鏡智所起，常、遍色身，攝自受用；平等智品，所現佛身，攝他受用；成事智品，所現隨類種種身相，攝變化身。","juan":10},{"t":"p","text":"說圓鏡智是受用，佛轉諸轉識得受用故。","juan":10},{"t":"p","text":"雖轉藏識亦得受用，然說轉彼顯法身故。於得受用，略不說之。又說法身無生無滅，唯證因得，非色、心等，圓鏡智品，與此相違。若非受用，屬何身攝。","juan":10},{"t":"p","text":"又受用身，攝佛不共有為實德。故四智品，實有色、心，皆受用攝。","juan":10},{"t":"p","text":"又他受用及變化身，皆為化他方便示現，故不可說實智為體。","juan":10},{"t":"p","text":"雖說化身智殊勝攝，而似智現或智所起，假說智名，體實非智。但說平等、成所作智，能現受用、三業化身，不說二身即是二智，故此二智自受用攝。","juan":10},{"t":"p","text":"然變化身及他受用，雖無真實心及心所，而有化現心、心所法。無上覺者，神力難思，故能化現無形質法。","juan":10},{"t":"p","text":"若不爾者，云何如來現貪、瞋等？久已斷故。云何聲聞及傍生等，知如來心？如來實心，等覺菩薩尚不知故。","juan":10},{"t":"p","text":"由此經說，化無量類皆令有心；又說如來成所作智化作三業；又說變化有依他心，依他實心，相分現故。","juan":10},{"t":"p","text":"雖說變化無根心等，而依餘說，不依如來。又化色根心、心所法，無根等用，故不說有。","juan":10},{"t":"p","text":"如是三身，雖皆具足無邊功德，而各有異。謂自性身，唯有真實常、樂、我、淨，離諸雜染，眾善所依，無為功德，無色、心等差別相用。自受用身，具無量種妙色、心等真實功德；若他受用及變化身，唯具無邊似色、心等，利樂他用化相功德。","juan":10},{"t":"p","text":"又自性身，正自利攝，寂靜安樂無動作故；亦兼⸢365⸣利他⸤，為增上緣，令諸有情得利樂故；又與受用及變化身為所依止，故俱利攝。自受用身唯屬自利。若他受用及變化身，唯屬利他，為他現故。","juan":10},{"t":"p","text":"又自性身，依法性土。雖此身、土體無差別，而屬佛、法，相、性異故。此佛身、土俱非色攝。雖不可說形量小、大；然隨事相其量無邊，譬如虛空，遍一切處。","juan":10},{"t":"p","text":"自受用身，還依自土：謂圓鏡智相應淨識，由昔所修自利無漏純淨佛土因緣成熟，從初成佛，盡未來際，相續變為純淨佛土，周圓無際，眾寶莊嚴，自受用身常依而住。如淨土量，身量亦爾，諸根相好，一一無邊，無限善根所引生故。功德智慧既非色法，雖不可說形量大小，而依所證及所依身，亦可說言遍一切處。他受用身，亦依自土：謂平等智大慈悲力，由昔所修利他無漏純淨佛土，因緣成熟，隨住十地菩薩所宜變為淨土，或小或大，或劣或勝，前後改轉，他受用身依之而住。能依身量，亦無定限。若變化身，依變化土。謂成事智大慈悲力，由昔所修利他無漏淨穢佛土，因緣成熟，隨未登地有情所宜化為佛土，或淨或穢，或小或大，前後改轉，佛變化身依之而住。能依身量，亦無定限。","juan":10},{"t":"p","text":"自性身土，一切如來同所證故，體無差別；自受用身及所依土，雖一切佛各變不同，而皆無邊不相障礙。餘二身土，隨諸如來所化有情，有共、不共。所化共者，同處同時，諸佛各變為身、為土，形狀相似，不相障礙，展轉相雜為增上緣，令所化生，自識變現。謂於一土有一佛身，為現神通說法饒益。於不共者，唯一佛變。諸有情類無始時來，種⸢366⸣性⸤法爾更相繫屬，或多屬一，或一屬多，故所化生有共、不共。不爾，多佛久住世間，各事劬勞，實為無益，一佛能益一切生故。","juan":10},{"t":"p","text":"此諸身、土若淨、若穢，無漏識上所變現者，同能變識，俱善無漏，純善無漏因緣所生。是道諦攝，非苦、集故。蘊等識相不必皆同，三法因緣雜引生故。","juan":10},{"t":"p","text":"有漏識上所變現者，同能變識，皆是有漏。純從有漏因緣所生，是苦、集攝，非滅、道故。善等識相，不必皆同，⸢367⸣三⸤性因緣雜引生故。蘊等同異，類此應知，不爾，應無五、十二等。","juan":10},{"t":"p","text":"然相分等依識變現；非如識性依他中實。不爾，唯識理應不成許識內境俱實有故。","juan":10},{"t":"p","text":"或識相、見等從緣生，俱依他起，虛實如識，唯言遣外，不遮內境。不爾，真如亦應非實。內境與識，既並非虛，如何但言唯識非境？識唯內有，境亦通外，恐濫外故，但言唯識。或諸愚夫，迷執於境，起煩惱業，生死沈淪，不解觀心，勤求出離，哀愍彼故，說唯識言，令自觀心，解脫生死，非謂內境如外都無。","juan":10},{"t":"p","text":"或相分等，皆識為性，由熏習力，似多分生。真如亦是識之實性。故除識性，無別有法。此中識言，亦說心所，心與心所，定相應故。","juan":10}],"kepan":["㊂長行釋","1 解頌>","2 諸門分別"],"yi":"此轉依所得，即是無漏界，不可思議、是善、是常；是安樂，是解脫身，而具足者則名為大牟尼之法身。此即究竟位，佛果圓滿。","yao":["頌以「無漏界、不思議、善、常、安樂、解脫身、法身」七義讚佛果，論中一一釋其所以，是唯識學佛身佛土論的根本文。","解脫身通二乘，法身唯佛獨得：二乘唯斷煩惱障得解脫身，佛雙斷二障、圓證四智，方名法身。此一分判是大小乘果位差別的關鍵。","四智相應心品：大圓鏡智（轉第八）、平等性智（轉第七）、妙觀察智（轉第六）、成所作智（轉前五）。轉識成智至此圓成，與第二頌三能變首尾相扣。","三身（自性身、受用身、變化身）與四智之配屬、受用身開自受用他受用，皆於此節論定，是後世佛身論的基本框架。","全論以佛果作結，回應序分「利樂諸有情」之發願，可見唯識名相之析辨終歸於實踐與果證，非徒事分析。"],"ming":[["無漏界","諸漏永盡之界。此指佛果所依之清淨法界。"],["解脫身","斷煩惱障所顯之身，二乘所共得。"],["法身（大牟尼名法）","雙斷二障、四智圓明所顯之身，唯佛獨具。"],["四智","大圓鏡智、平等性智、妙觀察智、成所作智。轉八識而得。"],["三身","自性身、受用身（自受用・他受用）、變化身。"],["四涅槃","本來自性清淨涅槃、有餘依、無餘依、無住處涅槃。唯佛具四。"]]},{"id":21,"label":"釋結施願分・後序","verses":[],"kind":"close","juan":[10],"chars":1169,"blocks":[{"t":"k","lv":1,"text":"參、釋結施願分","juan":10},{"t":"p","text":"此論三分成立唯識，是故說為《成唯識論》。","juan":10},{"t":"k","lv":2,"text":"(壹) 結釋示正名","juan":10},{"t":"k","lv":2,"text":"(貳) 釋亦名","juan":10},{"t":"p","text":"亦說此論名淨唯識，顯唯識理極明淨故。","juan":10},{"t":"k","lv":2,"text":"(參) 示本論名，釋結施願","juan":10},{"t":"p","text":"此本論名唯識三十，由三十頌，顯唯識理，乃得圓滿，非增減故。","juan":10},{"t":"v","num":null,"lines":["已依聖教及正理，分別唯識性相義，","所獲功德施群生，願共速登無上覺。"],"juan":10},{"t":"k","lv":1,"text":"後序","juan":10},{"t":"p","text":"原夫覺海澂⸢368⸣玄⸤，涵萬流而濬宗極；神⸢369⸣幾⸤闡妙，被眾象而凝至真。朗慧日而鏡六幽，洩慈雲而⸢370⸣清⸤八㝢，演一音而懸解，逸三乘以遐騖。體陳如之半器，津有有於鹿園；照善現之滿機，繹空空於鷲嶺。雖絕塵於常斷，詎遺筌於有空？顯無上之靈宗，凝中道於茲教。逮金河滅景，派淳源而不追；玉牒霏華，緒澆風而競扇。於是二十八見迷⸢371⸣桑鴈⸤於五天，一十六師亂⸢372⸣雲牛⸤於四主。半千將聖，茲惟世親⸢373⸣寔⸤賢劫之應真，晦生知以提化，飛光毓彩誕暎資靈。曜常明於八蘊、藻初情於六足，秀談芝於俱舍、摽說有之餘宗，攝玄波於大乘，賁研空之至理，化方昇而照極，湛沖一於斯頌。唯識三十偈者，世親歸根之遺製也。理韜⸢374⸣淵⸤海，泛浮境於榮河；義欝煙飈，麗虹章於玄圃。言含萬象、字苞千訓，妙旨天逸、邃彩星華，幽緒未宣冥神絕境，孤明⸢375⸣斂⸤暎祕思潛津。後有護法、安慧等十⸢376⸣大⸤菩薩，韞玄珠於八藏、聳層搆於四圍，宅照二因、捿清三觀，升暉十地，澄智水以潤賢林；隣幾七覺，皎行月而開重夜。優柔芳烈、景躅前修，箭涌泉言、風飛寶思，咸觀本頌各裁斯釋，名曰「成唯識論」，或名「淨唯識論」。空心外之二取，息滯有之迷塗；有識內之一心，遣歸空之妄執。晦斯心境，苦海所以長淪；悟彼有空，覺岸於焉高蹈。九十外道，亂風轍而靡星旗；十八小乘，軔羬軒而扶龍轂。窮神體妙、詣賾探機，精貫十支、洞該九分，顧十翼而⸢377⸣搏⸤仙羽、頫九流以濬瓊波，盡邃理之希⸢378⸣微⸤、闡法王之奧典，稱謂雙絕、筌象兼忘，曜靈景於西申、閟虹光於震旦，濟物弘道、眇歸宗德。","juan":10},{"t":"p","text":"粵若大和上三藏法師玄奘，體睿⸢379⸣舍⸤真、履仁翔慧，九門禪宴證靜於融山、八萬玄津騰流於委海，疊金牆而月曜、峻玉宇而霞騫，軼芳粹於澄蘭、孕風華於龍翼。悼微言之匿彩、嗟大義之淪暉，用啟誓⸢380⸣言⸤、肆茲遙踐，泳祥河之輟水、攀寶樹之低枝、循鏤杠以神遊、⸢381⸣𨈆⸤霙峯而安步，昇紫階而證道、瞰玄影以嚴因。採奧觀奇，⸢382⸣徙⸤蒼龍於二紀；緘檀篆⸢383⸣貝⸤，旋白馬於三秦。我","juan":10},{"t":"p","text":"大唐慶表金輪、禎資樞電，奄大千而光宅、御六辯以天飛，神化潛通、九仙賮寶，玄猷旁闡、百靈聳職，凝旒邃拱，⸢384⸣杳⸤通夢於⸢385⸣宵⸤暉；掞組摛華，煥騰文以幽贊。⸢386⸣爰降⸤綸旨，溥令翻譯，勅尚書左僕射燕國公于志寧、中書令高陽公許敬宗等潤色，沙門釋神泰等證義，沙門釋靖邁等質文。肇自貞觀十九年，終于顯慶之末，部將六十，卷出一千。韜軼蓬萊、池湟環㴾，載隆法寶、大啟群迷，頌德序經並紆⸢387⸣宸⸤藻，玄風之盛未之前聞。粵以顯慶四年龍捿叶洽，玄英應序，厥閏惟陽，糅茲十釋四千五百頌，彙聚群分各遵其本，合為一部勒成十卷。月窮于紀，銓綜云畢，精括詁訓、研詳夷夏，調驚韶律、藻掞天⸢388⸣𨓍⸤，白鳳甄奇、紫微呈瑞，遂使文同義異若一師之製焉，斯則古聖今賢其揆一也。","juan":10},{"t":"p","text":"三藏弟子基，鼎族高門、玉田華胄，壯年味道、綺日參玄，業峻林遠、識清雲鏡，閑儀玉瑩，⸢389⸣陵⸤道邃而澄明；逸韻蘭芳，掩法汰而飛辯。緒僊音於八梵，舞⸢390⸣霄⸤鶴以翔禎；摛麗範於九章，影桐鸞而絢藻。昇光譯侶，俯潛叡而融暉；登彩義徒，顧猷暢而高視。秀初昕之琁景，晉燭玄儒；矯彌天之絕⸢391⸣翰⸤，騰邁真俗。親承四辯、言獎三明，䟽發戶牖、液導津涉，⸢392⸣繢⸤功資素、通理寄神，綜其綱領、甄其品第，兼撰義䟽傳之後學。⸢393⸣庶⸤教蟠黃陸，跨合璧於龜疇；祥浮紫宮，掩連珠於麟籀。式罄庸謏，敘其宗致云。","juan":10}],"kepan":["參、釋結施願分","(壹) 結釋示正名","(貳) 釋亦名","(參) 示本論名，釋結施願","後序"],"yi":"論末結釋論名，說明何以名為《成唯識論》，並釋其亦有他名；終以迴施願文，願以造論功德普施有情，同證唯識性。其後附沈玄明所撰後序，敘玄奘譯場始末與窺基請糅之緣由。","yao":["「成唯識」之名有二釋：成立唯識之理，及成就唯識之行果。論主兼取，故名成唯識論。","後序非論主本文，屬譯場文獻，記述糅譯十家為一部之經過，是理解本論體例（何以有「有義」層疊）的第一手史料。","後序作者沈玄明，其所述譯事細節向為唯識學史研究所重；惟後序之文獻性質與論文本身不同，讀者宜區分正論與序跋之證據層級。","迴施願文與序分歸敬頌相呼應，全論結構「敬序—廣成—結施」三分至此完足，可回看科判總覽以觀全局。"],"ming":[["成唯識","成立唯識之理、成就唯識之行。論名之二義。"],["施願","以造論功德迴施有情，共成佛道。"],["後序","附於論末之序文，唐沈玄明撰，記譯場糅譯始末。"],["糅譯十家","以護法釋為主，會集餘九家釋論裁定去取，成一部十卷。"]]}],"app":[{"i":0,"lem":"三藏","lw":["【大】"],"rdg":[{"t":"唐三藏","w":["【明】"]}]},{"i":1,"lem":"斯","lw":["【大】"],"rdg":[{"t":"此","w":["【聖】"]}]},{"i":2,"lem":"兔","lw":["【大】"],"rdg":[{"t":"菟","w":["【聖】"]}]},{"i":3,"lem":"邪","lw":["【大】"],"rdg":[{"t":"耶","w":["【聖】"]}]},{"i":4,"lem":"邪","lw":["【大】"],"rdg":[{"t":"耶","w":["【聖】"]}]},{"i":5,"lem":"邪","lw":["【大】"],"rdg":[{"t":"耶","w":["【聖】"]}]},{"i":6,"lem":"邪","lw":["【大】"],"rdg":[{"t":"耶","w":["【聖】"]}]},{"i":7,"lem":"邪","lw":["【大】"],"rdg":[{"t":"耶","w":["【聖】"]}]},{"i":8,"lem":"邪","lw":["【大】"],"rdg":[{"t":"耶","w":["【聖】"]}]},{"i":9,"lem":"邪","lw":["【大】"],"rdg":[{"t":"耶","w":["【聖】"]}]},{"i":10,"lem":"所惱","lw":["【大】"],"rdg":[{"t":"惱所","w":["【聖】"]}]},{"i":11,"lem":"外","lw":["【大】"],"rdg":[{"t":"實","w":["【流布本】"]}]},{"i":12,"lem":"剌K17n0614_p0512a15","lw":["【CB】","【麗-CB】"],"rdg":[{"t":"刺","w":["【大】"]}]},{"i":13,"lem":"耶","lw":["【大】"],"rdg":[{"t":"邪","w":["【聖】"]}]},{"i":14,"lem":"謂","lw":["【大】"],"rdg":[{"t":"論","w":["【宮】"]}]},{"i":15,"lem":"𨵗","lw":["【大】"],"rdg":[{"t":"闕","w":["【宋】","【元】","【明】","【宮】"]},{"t":"󳔞","w":["【聖】"]}]},{"i":16,"lem":"兔","lw":["【大】"],"rdg":[{"t":"菟","w":["【聖】"]}]},{"i":17,"lem":"准","lw":["【大】"],"rdg":[{"t":"唯","w":["【宮】"]}]},{"i":18,"lem":"火","lw":["【大】"],"rdg":[{"t":"火風","w":["【宋】","【元】","【明】","【宮】"]}]},{"i":19,"lem":"詰","lw":["【大】"],"rdg":[{"t":"誥","w":["【聖】"]}]},{"i":20,"lem":"偏","lw":["【大】"],"rdg":[{"t":"徧","w":["【宮】"]}]},{"i":21,"le   document.getElementById('ribbon').innerHTML=S.map((s,i)=>
    '<button class="rc'+(i===cur?' on':'')+'" data-i="'+i+'"><span class="rn">'+
    label(s)+'</span>'+s.label+'</button>').join('');
}
function render(){
  const s=S[cur], m=document.getElementById('main');
  let h='<div class="sec-hd"><span class="eyebrow">'+label(s)+' · 卷'+s.juan.join('、')+
        '</span><h2>'+s.label+'</h2><div class="meta">本節 '+s.chars.toLocaleString()+
        ' 淨字'+(s.kepan.length?' · 科判 '+s.kepan.length+' 目':'')+'</div></div>';
  if(tab===0){
    let lastJ=null;
    s.blocks.forEach(b=>{
      if(b.juan&&b.juan!==lastJ){h+='<div class="jm">卷第'+cn(b.juan)+'</div>';lastJ=b.juan;}
      if(b.t==='k')h+='<div class="k lv'+b.lv+'">'+esc(b.text)+'</div>';
      else if(b.t==='p')h+='<p class="t">'+mark(b.text)+'</p>';
      else if(b.t==='v')h+='<div class="vs">'+(b.num?'<span class="vn">頌 '+b.num+
        (D.stages[b.num]?' · '+D.stages[b.num]:'')+'</span>':'')+
        '<p class="vl">'+b.lines.map(mark).join('<br>')+'</p></div>';
    });
  }else if(tab===1){
    h+='<div class="card"><h3>頌旨語譯</h3><p>'+esc(s.yi)+'</p></div>';
    if(s.verses.length)h+='<div class="card"><h3>本節所釋頌文</h3>'+
      s.blocks.filter(b=>b.t==='v'&&b.num).map(b=>'<p style="margin-bottom:10px">'+
      '<b>'+b.num+'</b>　'+b.lines.map(x=>esc(plain(x))).join('／')+'</p>').join('')+'</div>';
  }else if(tab===2){
    h+='<div class="card"><h3>要義提點</h3><ol class="yao">'+
      s.yao.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol></div>';
    if(s.kepan.length)h+='<div class="card"><h3>本節科判</h3><p style="font-size:14.5px;'+
      'color:#4a5060">'+s.kepan.map(esc).join('　·　')+'</p></div>';
  }else{
    h+='<div class="card"><h3>本節名相</h3><dl class="ming">'+
      s.ming.map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join('')+'</dl></div>';
    h+='<div class="card"><h3>通論綱目</h3><dl class="ming">'+
      D.general.map(x=>'<dt>'+esc(x[0])+'</dt><dd>'+esc(x[1])+'</dd>').join('')+'</dl></div>';
  }
  m.innerHTML=h;
  document.getElementById('pos').textContent=(cur+1)+' / '+S.length;
  ribbon();
  const on=document.querySelector('.rc.on'); if(on)on.scrollIntoView({inline:'center',block:'nearest'});
  window.scrollTo(0,0);
  stop();
}
function cn(n){const a='〇一二三四五六七八九十';return n===10?'十':a[n];}

/* ── 導覽 ── */
function go(d){cur=Math.min(S.length-1,Math.max(0,cur+d));render();}
function jump(i){cur=i;render();closeAll();}
document.getElementById('ribbon').onclick=e=>{const b=e.target.closest('.rc');if(b)jump(+b.dataset.i);};
document.getElementById('tabs').onclick=e=>{const b=e.target.closest('.tb');if(!b)return;
  tab=+b.dataset.t;document.querySelectorAll('.tb').forEach(x=>x.classList.toggle('on',x===b));render();};
document.getElementById('main').onclick=e=>{const a=e.target.closest('.ap');if(!a)return;

/* ── 抽屜 ── */
function tog(id){const el=document.getElementById(id),o=el.classList.contains('on');

function closeAll(){['toc','chat'].forEach(i=>document.getElementById(i).classList.remove('on'));

/* ── 目錄三軸 ── */
function buildToc(){
  const jm={}; S.forEach((s,i)=>s.juan.forEach(j=>{(jm[j]=jm[j]||[]).push(i)}));
  document.getElementById('axJuan').innerHTML=Object.keys(jm).sort((a,b)=>a-b)
    .map(j=>'<button onclick="jump('+jm[j][0]+')">卷'+cn(+j)+'</button>').join('');
  let v='';for(let n=1;n<=30;n++)v+='<button onclick="jump('+D.verseIndex[n]+')">'+n+
    (D.stages[n]?'　'+D.stages[n]:'')+'</button>';
  document.getElementById('axVerse').innerHTML=v;
  document.getElementById('axKepan').innerHTML=D.kepan.map(k=>
    '<button class="l'+k.lv+'" onclick="jump('+k.sec+')">'+esc(k.text)+'</button>').join('');
}

/* ── 朗讀：句佇列 + Chrome 續播心跳 ── */
let queue=[],qi=0,speaking=false,beat=null;
function chunks(text){
  const out=[];let buf='';
  const parts=text.replace(/([。！？；：])/g,'$1\u0001').split('\u0001');
  parts.forEach(p=>{p=p.trim();if(!p)return;
    if((buf+p).length>55){if(buf)out.push(buf);
      while(p.length>55){out.push(p.slice(0,55));p=p.slice(55);}buf=p;}
    else buf+=p;});
  if(buf)out.push(buf);return out;
}
function collect(){
  const s=S[cur],t=[];
  if(tab===0)s.blocks.forEach(b=>{if(b.t==='p')t.push(plain(b.text));
    else if(b.t==='v')t.push(b.lines.map(plain).join('，'));});
  else if(tab===1)t.push(s.yi);
  else if(tab===2)s.yao.forEach(x=>t.push(x));
  else s.ming.forEach(x=>t.push(x[0]+'。'+x[1]));
  return chunks(t.join(''));
}
function tts(){
  if(speaking){stop();return;}
  if(!('speechSynthesis' in window)){alert('此瀏覽器不支援語音朗讀');return;}
  queue=collect();qi=0;speaking=true;
  document.getElementById('ttsBtn').classList.add('on');
  document.getElementById('ttsBtn').textContent='停止';
  beat=setInterval(()=>{if(speaking)speechSynthesis.resume();},6000);
  next();
}
function next(){
  if(!speaking||qi>=queue.length){stop();return;}
  const u=new SpeechSynthesisUtterance(queue[qi++]);
  u.lang='zh-TW';u.rate=.92;u.onend=next;u.onerror=stop;
  speechSynthesis.speak(u);
}
function stop(){speaking=false;queue=[];qi=0;if(beat){clearInterval(beat);beat=null;}
  if('speechSynthesis' in window)speechSynthesis.cancel();
  const b=document.getElementById('ttsBtn');if(b){b.classList.remove('on');b.textContent='朗讀';}}

/* ── 問答（需自架 proxy；GitHub Pages 直呼 API 受 CORS 阻擋） ── */
const PROXY="";   // 例：https://your-worker.workers.dev/v1/messages
let hist=[];
function push(role,text){const l=document.getElementById('log');
  l.insertAdjacentHTML('beforeend','<div class="msg '+(role==='user'?'u':'a')+'"><span>'+
    esc(text).replace(/\n/g,'<br>')+'</span></div>');l.scrollTop=l.scrollHeight;}
async function ask(){
  const box=document.getElementById('q'),q=box.value.trim();if(!q)return;
  box.value='';push('user',q);
  if(!PROXY){push('assistant','問答端點尚未設定。請於原始碼中將 PROXY 常數指向自架的 API 轉送端點；'+
    'GitHub Pages 無法自瀏覽器直接呼叫 Anthropic API（CORS 限制）。');return;}
  const s=S[cur];
  const ctx='【本節】'+s.label+'（'+label(s)+'）\n'+
    s.blocks.filter(b=>b.t==='p'||b.t==='v').map(b=>b.t==='v'?b.lines.map(plain).join('')
      :plain(b.text)).join('').slice(0,6000);
  hist.push({role:'user',content:ctx+'\n\n【提問】'+q});
  push('assistant','…');
  try{
    const r=await fetch(PROXY,{method:'POST',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({model:'claude-sonnet-4-6',max_tokens:1000,
        system:'你是《成唯識論》讀本的隨文問答助理。僅依所附論文回答，'+
          '論文未載者明言「本節未載」，不得臆補。以繁體中文作答，術語用唯識學標準譯名。',
        messages:hist})});
    const j=await r.json();
    const t=(j.content||[]).filter(c=>c.type==='text').map(c=>c.text).join('\n')||'（無回應）';
    document.getElementById('log').lastElementChild.remove();
    push('assistant',t);hist.push({role:'assistant',content:t});
  }catch(e){document.getElementById('log').lastElementChild.remove();
    push('assistant','連線失敗：'+e.message);}
}
