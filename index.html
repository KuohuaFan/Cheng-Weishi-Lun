<head>

<style>
:root{
  --ink:#141821; --ink2:#2b3242; --paper:#f2f0ea; --paper2:#e7e3d9;
  --indigo:#2f4858; --indigo2:#3f6072; --mirror:#8a7f6b; --seal:#8c3b34;
  --line:rgba(20,24,33,.14); --rule:rgba(20,24,33,.08);
  --serif:"Noto Serif TC","Songti TC","Source Han Serif TC",serif;
  --sans:"Noto Sans TC","PingFang TC","Heiti TC",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);font-family:var(--serif);
  line-height:1.95;font-size:17px;overflow-x:hidden}
button{font-family:inherit;color:inherit;border:0;background:none;cursor:pointer}

/* ── 封面 ── */
#cover{position:fixed;inset:0;z-index:60;background:var(--paper);
  display:flex;flex-direction:column;justify-content:center;padding:32px 26px;
  transition:opacity .5s}
#cover.gone{opacity:0;pointer-events:none}
.cv-seal{width:52px;height:52px;border:1.5px solid var(--seal);color:var(--seal);
  display:flex;align-items:center;justify-content:center;font-size:19px;
  letter-spacing:.06em;margin-bottom:26px}
.cv-t{font-size:33px;letter-spacing:.22em;font-weight:600;margin:0 0 6px}
.cv-s{font-size:13px;letter-spacing:.28em;color:var(--indigo2);margin-bottom:22px}
.cv-by{font-size:13.5px;color:var(--ink2);line-height:2.1}
.cv-r{margin:22px 0;border-top:1px solid var(--line);padding-top:18px;
  font-size:12.5px;color:#5a6070;line-height:2}
.cv-go{margin-top:8px;border:1px solid var(--indigo);color:var(--indigo);
  padding:13px 0;width:100%;font-size:15px;letter-spacing:.3em;font-family:var(--serif)}
.cv-go:active{background:var(--indigo);color:var(--paper)}

/* ── 頁首 ── */
header{position:sticky;top:0;z-index:40;background:rgba(242,240,234,.97);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hb{display:flex;align-items:center;gap:10px;padding:9px 12px}
.hb h1{font-size:16px;margin:0;letter-spacing:.14em;font-weight:600;flex:1}
.icb{width:34px;height:34px;display:flex;align-items:center;justify-content:center;
  font-size:13px;border:1px solid var(--line);color:var(--indigo)}
.icb.on{background:var(--indigo);color:var(--paper);border-color:var(--indigo)}

/* ── 頌組 ribbon ── */
#ribbon{display:flex;gap:6px;overflow-x:auto;padding:0 12px 9px;scrollbar-width:none}
#ribbon::-webkit-scrollbar{display:none}
.rc{flex:0 0 auto;padding:5px 11px;border:1px solid var(--line);font-size:12.5px;
  white-space:nowrap;color:var(--ink2);letter-spacing:.04em}
.rc.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.rc .rn{font-size:10.5px;opacity:.6;margin-right:4px;font-family:var(--sans)}

/* ── 分頁 ── */
#tabs{display:flex;border-bottom:1px solid var(--line);background:var(--paper)}
.tb{flex:1;padding:10px 0;font-size:13.5px;letter-spacing:.12em;color:#6b7182;
  border-bottom:2px solid transparent}
.tb.on{color:var(--ink);border-bottom-color:var(--seal)}

/* ── 內文 ── */
main{padding:18px 18px 120px;max-width:720px;margin:0 auto}
.sec-hd{margin:2px 0 18px}
.sec-hd .eyebrow{font-family:var(--sans);font-size:11px;letter-spacing:.24em;
  color:var(--mirror);display:block;margin-bottom:5px}
.sec-hd h2{font-size:20px;margin:0;letter-spacing:.1em;font-weight:600}
.sec-hd .meta{font-family:var(--sans);font-size:11.5px;color:#767c8c;margin-top:6px;
  letter-spacing:.04em}
.k{font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:var(--indigo2);
  margin:22px 0 8px;padding-left:9px;border-left:2px solid var(--indigo2)}
.k.lv3{opacity:.85;font-size:11.5px} .k.lv4,.k.lv5,.k.lv6{opacity:.7;font-size:11px;
  border-left-style:dotted}
p.t{margin:0 0 15px;text-align:justify;text-indent:2em}
.vs{margin:20px 0;padding:16px 16px 16px 20px;background:var(--paper2);
  border-left:3px solid var(--seal)}
.vs .vn{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--seal);
  display:block;margin-bottom:8px}
.vs .vl{font-size:17.5px;letter-spacing:.06em;line-height:2.15;margin:0}
.ap{border-bottom:1px dotted var(--seal);cursor:pointer}
.ap sup{font-family:var(--sans);font-size:9px;color:var(--seal);
  vertical-align:super;margin-left:1px}
.jm{font-family:var(--sans);font-size:11px;color:#8b909e;letter-spacing:.16em;
  text-align:center;margin:26px 0;border-top:1px solid var(--rule);padding-top:6px}

.card{background:#fff;border:1px solid var(--line);padding:17px 17px 14px;
  margin-bottom:14px}
.card h3{font-family:var(--sans);font-size:12px;letter-spacing:.2em;color:var(--indigo2);
  margin:0 0 11px;font-weight:600}
.card p{margin:0;text-align:justify}
ol.yao{margin:0;padding-left:1.25em} ol.yao li{margin-bottom:12px;text-align:justify}
dl.ming{margin:0} dl.ming dt{font-weight:600;letter-spacing:.06em;margin-top:13px;
  color:var(--indigo)} dl.ming dt:first-child{margin-top:0}
dl.ming dd{margin:3px 0 0;font-size:15.5px;color:var(--ink2);text-align:justify}

/* ── 抽屜 ── */
#scrim{position:fixed;inset:0;background:rgba(20,24,33,.42);z-index:45;display:none}
#scrim.on{display:block}
.drawer{position:fixed;top:0;bottom:0;width:min(88vw,380px);background:var(--paper);
  z-index:50;transition:transform .28s;overflow-y:auto;padding:16px 16px 60px}
#toc{left:0;transform:translateX(-102%);border-right:1px solid var(--line)}
#toc.on{transform:none}
#chat{right:0;transform:translateX(102%);border-left:1px solid var(--line);
  display:flex;flex-direction:column;padding:0}
#chat.on{transform:none}
.dh{font-family:var(--sans);font-size:12px;letter-spacing:.2em;color:var(--mirror);
  margin:20px 0 9px;border-bottom:1px solid var(--rule);padding-bottom:5px}
.dh:first-child{margin-top:4px}
.axis{display:flex;flex-wrap:wrap;gap:6px}
.axis button{border:1px solid var(--line);padding:5px 9px;font-size:12.5px;
  font-family:var(--sans);color:var(--ink2)}
.axis button.on{background:var(--indigo);color:var(--paper);border-color:var(--indigo)}
.ktree button{display:block;width:100%;text-align:left;font-size:13px;padding:5px 0;
  color:var(--ink2);line-height:1.7}
.ktree .l1{font-weight:600;color:var(--ink);letter-spacing:.1em;margin-top:10px}
.ktree .l2{padding-left:12px} .ktree .l3{padding-left:24px;font-size:12.5px}
.ktree .l4{padding-left:36px;font-size:12px;color:#6c7283}
.ktree .l5,.ktree .l6{padding-left:46px;font-size:11.5px;color:#7b8090}

/* ── 問答 ── */
.ch-hd{padding:13px 15px;border-bottom:1px solid var(--line);font-family:var(--sans);
  font-size:12.5px;letter-spacing:.16em;display:flex;align-items:center}
#log{flex:1;overflow-y:auto;padding:14px 15px;font-size:15px}
.msg{margin-bottom:14px;line-height:1.9}
.msg.u{text-align:right} .msg.u span{background:var(--indigo);color:var(--paper);
  padding:8px 12px;display:inline-block;text-align:left;max-width:86%}
.msg.a span{background:#fff;border:1px solid var(--line);padding:9px 12px;
  display:inline-block;max-width:94%;text-align:justify}
.ch-in{border-top:1px solid var(--line);padding:10px;display:flex;gap:8px}
.ch-in textarea{flex:1;border:1px solid var(--line);padding:8px;font-family:var(--serif);
  font-size:15px;resize:none;height:40px;background:#fff}
.ch-in button{border:1px solid var(--indigo);color:var(--indigo);padding:0 14px;
  font-size:13px}
.notice{margin:10px 15px;padding:9px 11px;border:1px dashed var(--line);
  font-family:var(--sans);font-size:11.5px;color:#6c7283;line-height:1.8}

/* ── 底部列 ── */
#foot{position:fixed;left:0;right:0;bottom:0;z-index:35;background:rgba(242,240,234,.97);
  backdrop-filter:blur(8px);border-top:1px solid var(--line);display:flex;
  align-items:center;gap:8px;padding:8px 12px;max-width:720px;margin:0 auto}
#foot button{border:1px solid var(--line);padding:8px 12px;font-size:12.5px;
  font-family:var(--sans);color:var(--ink2)}
#foot .pos{flex:1;text-align:center;font-family:var(--sans);font-size:11.5px;
  color:#767c8c;letter-spacing:.08em}
#foot .tts.on{background:var(--seal);color:var(--paper);border-color:var(--seal)}

/* ── 彈出 ── */
#pop{position:fixed;left:12px;right:12px;bottom:64px;z-index:55;background:#fff;
  border:1px solid var(--ink);padding:14px 15px;display:none;max-width:696px;
  margin:0 auto;font-size:14.5px;line-height:1.9}
#pop.on{display:block}
#pop .pt{font-family:var(--sans);font-size:11px;letter-spacing:.2em;color:var(--seal);
  margin-bottom:7px}
#pop .wit{font-family:var(--sans);font-size:12.5px;color:var(--ink2);margin-top:4px}
#modal{position:fixed;inset:0;z-index:58;background:rgba(20,24,33,.5);display:none;
  padding:26px 16px;overflow-y:auto}
#modal.on{display:block}
.mbox{background:var(--paper);max-width:620px;margin:0 auto;padding:22px 20px 30px;
  border:1px solid var(--ink)}
.mbox h2{font-size:17px;letter-spacing:.14em;margin:0 0 14px}
.mbox dt{font-family:var(--sans);font-size:11.5px;letter-spacing:.14em;
  color:var(--mirror);margin-top:14px}
.mbox dd{margin:3px 0 0;font-size:14.5px;text-align:justify;line-height:1.9}
.mbox .warn{margin-top:18px;padding:11px 12px;border:1px dashed var(--seal);
  font-size:13.5px;color:var(--ink2);line-height:1.9}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:2px solid var(--seal);outline-offset:2px}
</style>
</head>

<div id="cover">
  <div class="cv-seal">識</div>

  <div class="cv-by">護法等菩薩造<br>唐 三藏法師玄奘 奉詔譯</div>
  <div class="cv-r" id="coverNote"></div>
  <button class="cv-go" onclick="enter()">開始閱讀</button>
</div>

<header>
  <div class="hb">
    <button class="icb" onclick="tog('toc')" aria-label="目錄">目錄</button>

</div>

  <button onclick="go(-1)">上節</button>

  <button onclick="go(1)">下節</button>
</div>

<div id="pop" onclick="this.classList.remove('on')"></div>

</nav>

<aside id="chat" class="drawer" aria-label="問答">
  <div class="ch-hd">唯識問答</div>
  <div class="notice" id="chNotice"></div>
  <div id="log"></div>
  <div class="ch-in">
    <textarea id="q" placeholder="就本節論文提問…"></textarea>
    <button onclick="ask()">送出</button>
  </div>
</aside>

<div id="modal" onclick="if(event.target===this)this.classList.remove('on')">
  <div class="mbox" id="mbox"></div>

n":1},{"t":"p","text":"若唯有識，云何世間及諸聖教說有我、法？","juan":1},{"t":"k","lv":2,"text":"(壹) 明唯識相","juan":1},{"t":"k","lv":3,"text":"一、略釋難標宗","juan":1},{"t":"k","lv":4,"text":"(一) 將發論端寄問徵起","juan":1},{"t":"k","lv":4,"text":"(二) 舉頌依義正答","juan":1},{"t":"p","text":"頌曰：","juan":1}],"kepan":["壹、宗前敬序分","(壹) 以頌彰釋論之因","一、歸敬福田","二、敘釋論意","(貳) 以長行明本論主造論之意","一、安慧等悟斷得果解","二、火辨等達空悟性義","三、護法等破執顯理解","貳、依教廣成分","(壹) 明唯識相","一、略釋難標宗","(一) 將發論端寄問徵起","(二) 舉頌依義正答"],"yi":"論首以一頌歸敬：稽首禮敬唯識實性，以及圓滿清淨的佛與分證清淨的諸菩薩；我今解釋世親菩薩所說的《唯識三十頌》，是為了利益安樂一切有情。接著以長行敘明造論之意，並列舉安慧、火辨、護法等論師對「造論之意」的不同解釋：或就悟斷得果而言，或就達空悟性而言，或就破執顯理而言。","yao":["「唯識性」即圓成實性、真如；「滿清淨者」指佛果究竟圓滿，「分清淨者」指地上菩薩分證，歸敬三寶而以唯識性居首，已預示全論宗趣。","本論非世親自釋，而是玄奘揉合印度十大論師（護法、德慧、安慧、親勝、難陀、淨月、火辨、勝友、勝子、智月）之《三十頌》釋論而成，以護法一系為正義。","序分即列三家異釋，是本論體例的縮影：全論處處先出他師義，再以「有義」層層抉擇，末以護法義為斷。讀者須留意「有義」之下未必即是論主定說。","「利樂諸有情」標明造論非為論辯而為救度，唯識學的名相析辨最終指向轉依與解脫，此一意趣貫串至第三十頌。"],"ming":[["唯識性","諸法遠離遍計所執我法二性後所顯的真實性，即圓成實性、真如。第二十五頌明言「即唯識實性」。"],["滿・分清淨者","滿清淨者謂佛，二障永斷、二智圓滿；分清淨者謂地上菩薩，隨分斷證。"],["十大論師","印度註釋《唯識三十頌》的十位論師。玄奘依窺基之請，糅譯為一部，非逐家並列。"],["糅譯","會集數家釋論、以一家為主而裁定去取的譯法。本論即糅譯體，故文中「有義」多為他師義。"],["《唯識三十頌》","世親晚年所造之根本頌，三十頌攝盡唯識相、性、位。大正藏另存單行本 T31 no.1586。"]]},{"id":1,"label":"破執標宗・三能變","verses":[1,2],"kind":"verse","juan":[1,2],"chars":8859,"blocks":[{"t":"v","num":1,"lines":["由假說我、法，有種種相轉。","彼依識所變，此能變唯三："],"juan":1},{"t":"v","num":2,"lines":["謂異熟、思量，及了別境識。"],"juan":1},{"t":"k","lv":4,"text":"(三) 長行釋","juan":1},{"t":"k","lv":5,"text":"㊀釋上三句","juan":1},{"t":"k","lv":6,"text":"1 略釋頌答外徵","juan":1},{"t":"p","text":"論曰：世間、聖教說有我、法，但由假立，非實有性。我謂主宰，法謂軌持。","juan":1},{"t":"p","text":"彼二俱有種種相轉：「我種種相」謂有情、命者等，預流、一來等。「法種種相」謂實、德、業等；蘊、處、界等。「轉」謂隨緣施設有異。","juan":1},{"t":"p","text":"如是諸相若由假說，依何得成？","juan":1},{"t":"p","text":"彼相皆依識所轉變而假施設。","juan":1},{"t":"p","text":"「識」謂了別，此中識言亦攝心所，定相應故。","juan":1},{"t":"p","text":"「變」謂識體轉似二分，相、見俱依自證起故，依斯二分施設我、法，彼二離此無所依故。","juan":1},{"t":"p","text":"或復內識轉似外境。","juan":1},{"t":"p","text":"我、法分別熏習力故，諸識生時變似我、法，此我、法相雖在內識，而由分別似外境現，諸有情類無始時來緣此執為實我、實法，如患夢者，患夢力故，心似種種外境相現，緣此執為實有外境。","juan":1},{"t":"p","text":"愚夫所計實我、實法都無所有，但隨妄情而施設故，說之為假。內識所變似我、似法雖有，而非實我、法性，然似彼現，故說為假。","juan":1},{"t":"p","text":"外境隨情而施設故，非有如識；內識必依因緣生故，非無如境，由此便遮增、減二執。","juan":1},{"t":"p","text":"境依內識而假立故，唯世俗有；識是假境所依事故，亦勝義有。","juan":1},{"t":"k","lv":6,"text":"2 廣釋頌","juan":1},{"t":"p","text":"云何應知實無外境，唯有內識似外境生？","juan":1},{"t":"p","text":"實我、實法不可得故。","juan":1},{"t":"p","text":"如何實我不可得耶？","juan":1},{"t":"p","text":"諸所執我，略有三種：一者執我體常、周遍，量同虛空，隨處造業受苦、樂故；二者執我，其體雖常，而量不定，隨身大小有卷、舒故；三者執我體常、至細，如一極微，潛轉身中作事業故。","juan":1},{"t":"p","text":"初且非理，所以者何？執我常、遍，量同虛空，應不隨身受苦、樂等；又常、遍故，應無動轉，如何隨身能造諸業？又所執我，一切有情為同為異？若言同者，一作業時一切應作，一受果時一切應受，一得解脫時一切應解脫，便成大過；若言異者，諸有情我更相遍故，體應相雜，又一作業、一受果時，與一切我處無別故，應名一切所作、所受。若謂作、受各有所屬無斯過者，理亦不然，業、果及身，與諸我合，屬此非彼不應理故；一解脫時一切應解脫，所修、證法一切我合故。","juan":1},{"t":"p","text":"中亦非理，所以者何？我體常住，不應隨身而有舒、卷，既有舒、卷如槖籥風，應非常住，又我隨身應可分析，如何可執我體一耶？故彼所言如童竪戲。","juan":1},{"t":"p","text":"後亦非理，所以者何？我量至小如一極微，如何能令大身遍動？若謂雖小而速巡身，如旋火輪，似遍動者，則所執我非一、非常，諸有往來，非常、一故。","juan":1},{"t":"p","text":"又所執我，復有三種：一者即蘊；二者離蘊；三者與蘊非即非離。","juan":1},{"t":"p","text":"初即蘊我，理且不然，我應如蘊非常、一故；又內諸色定非實我，如外諸色有質礙故；心、心所法亦非實我，不恒相續，待眾緣故；餘行、餘色亦非實我，如虛空等，非覺性故。","juan":1},{"t":"p","text":"中離蘊我，理亦不然，應如虛空，無作、受故。","juan":1},{"t":"p","text":"後俱非我，理亦不然，許依蘊立，非即、離蘊，應如瓶等，非實我故。又既不可說有為、無為，亦應不可說是我、非我。","juan":1},{"t":"p","text":"故彼所執實我不成。","juan":1},{"t":"p","text":"又諸所執實有我體，為有思慮？為無思慮？若有思慮，應是無常，非一切時有思慮故；若無思慮，應如虛空，不能作業，亦不受果。故所執我，理俱不成。","juan":1},{"t":"p","text":"又諸所執實有我體，為有作用？為無作用？若有作用，如手足等，應是無常。若無作用，如⸢2⸣兔⸤角等，應非實我，故所執我，二俱不成。","juan":1},{"t":"p","text":"又諸所執實有我體，為是我見所緣境不？若非我見所緣境者，汝等云何知實有我？若是我見所緣境者，應有我見非顛倒攝，如實知故。若爾，如何執有我者所信至教皆毀我見，稱讚無我，言無我見能證涅槃；執著我見，沈淪生死。豈有⸢3⸣邪⸤見能證涅槃，正見翻令沈淪生死？","juan":1},{"t":"p","text":"又諸我見不緣實我，有所緣故，如緣餘心；我見所緣定非實我，是所緣故，如所餘法。是故我見不緣實我，但緣內識變現諸蘊，隨自妄情，種種計度。","juan":1},{"t":"p","text":"然諸我執略有二種：","juan":1},{"t":"p","text":"一者俱生；二者分別。","juan":1},{"t":"p","text":"俱生我執無始時來虛妄熏習，內因力故，恒與身俱；不待⸢4⸣邪⸤教及⸢5⸣邪⸤分別，任運而轉，故名俱生。","juan":1},{"t":"p","text":"此復二種：一、常相續，在第七識，緣第八識，起自心相，執為實我；二、有間斷，在第六識，緣識所變五取蘊相，或總、或別，起自心相，執為實我。","juan":1},{"t":"p","text":"此二我執，細故難斷，後修道中，數數修習勝生空觀，方能除滅。","juan":1},{"t":"p","text":"分別我執亦由現在外緣力故，非與身俱，要待⸢6⸣邪⸤教及⸢7⸣邪⸤分別然後方起，故名分別，唯在第六意識中有。","juan":1},{"t":"p","text":"此亦二種：一、緣⸢8⸣邪⸤教所說蘊相，起自心相，分別、計度，執為實我；二、緣⸢9⸣邪⸤教所說我相，起自心相，分別、計度，執為實我。","juan":1},{"t":"p","text":"此二我執麁故易斷，初見道時，觀一切法生空真如，即能除滅。","juan":1},{"t":"p","text":"如是所說一切我執，自心外蘊，或有、或無；自心內蘊，一切皆有。是故我執皆緣無常五取蘊相，妄執為我。","juan":1},{"t":"p","text":"然諸蘊相，從緣生故，是如幻有；妄所執我，橫計度故，決定非有。故契經說：苾芻當知，世間沙門、婆羅門等所有我見，一切皆緣五取蘊起。","juan":1},{"t":"p","text":"實我若無，云何得有憶、識、誦、習、恩、怨等事？所執實我既常無變，後應如前，是事非有；前應如後，是事非無。以後與前，體無別故。若謂我用，前後變易，非我體者，理亦不然。用不離體，應常有故；體不離用，應非常故。然諸有情，各有本識，一類相續，任持種子，與一切法更互為因，熏習力故，得有如是憶、識等事。故所設難，於汝有失，非於我宗。","juan":1},{"t":"p","text":"若無實我，誰能造業？誰受果耶？所執實我，既無變易，猶如虛空，如何可能造業、受果？若有變易，應是無常。然諸有情心、心所法因緣力故，相續無斷，造業、受果，於理無違。","juan":1},{"t":"p","text":"我若實無，誰於生死輪迴諸趣？誰復厭苦求趣涅槃？所執實我，既無生滅，如何可說生死輪迴？常如虛空，非苦⸢10⸣所惱⸤，何為厭捨求趣涅槃？故彼所言常為自害。然有情類，身、心相續，煩惱、業力輪迴諸趣，厭患苦故，求趣涅槃。","juan":1},{"t":"p","text":"由此故知定無實我，但有諸識無始時來前滅後生，因果相續，由妄熏習，似我相現，愚者於中妄執為我。","juan":1},{"t":"p","text":"如何識外實有諸法不可得耶？","juan":1},{"t":"p","text":"外道、餘乘所執⸢11⸣外⸤法，理非有故。","juan":1},{"t":"p","text":"外道所執云何非有？","juan":1},{"t":"p","text":"且數論者執我是思，受用薩埵、⸢12⸣剌⸤闍、答摩所成大等二十三法，然大等法三事合成，是實非假，現量所得。","juan":1},{"t":"p","text":"彼執非理，所以者何？","juan":1},{"t":"p","text":"大等諸法，多事成故，如軍、林等，應假非實，如何可說現量得⸢13⸣耶⸤？又大等法，若是實有，應如本事，非三合成。","juan":1},{"t":"p","text":"薩埵等三，即大等故，應如大等，亦三合成，轉變非常，為例亦爾。又三本事，各多功能，體亦應多，能、體一故。三體既遍，一處變時，餘亦應爾，體無別故。許此三事體、相各別，如何和合共成一相？不應合時變為一相，與未合時，體無別故。若⸢14⸣謂⸤三事體異相同，便違己宗體、相是一，體應如相，冥然是一，相應如體，顯然有三，故不應言三合成一。","juan":1},{"t":"p","text":"又三是別，大等是總，總、別一故，應非一、三。此三變時，若不和合成一相者，應如未變，如何現見是一色等？若三和合成一相者，應失本別相，體亦應隨失。不可說三各有二相：一、總；二、別。總即別故，總亦應三，如何見一？若謂三體各有三相，和雜難知，故見一者，既有三相，寧見為一？復如何知三事有異？若彼一一皆具三相，應一一事能成色等，何所⸢15⸣𨵗⸤少，待三和合，體亦應各三，以體即相故，又大等法皆三合成，展轉相望，應無差別，是則因、果、唯量、諸大、諸根差別皆不得成。若爾，一根應得一切境，或應一境一切根所得，世間現見情與非情、淨穢等物，現、比量等，皆應無異，便為大失。","juan":1},{"t":"p","text":"故彼所執實法不成，但是妄情計度為有。","juan":1},{"t":"p","text":"勝論所執實等句義，多實有性，現量所得。","juan":1},{"t":"p","text":"彼執非理。","juan":1},{"t":"p","text":"所以者何？","juan":1},{"t":"p","text":"諸句義中且常住者，若能生果，應是無常，有作用故，如所生果；若不生果，應非離識實有自性，如⸢16⸣兔⸤角等。諸無常者，若有質礙，便有方分，應可分析，如軍、林等，非實有性；若無質礙，如心、心所，應非離此有實自性。","juan":1},{"t":"p","text":"又彼所執地、水、火、風應非有礙，實句義攝，身根所觸故，如堅、濕、煖、動。即彼所執堅、濕、煖等，應非無礙，德句義攝，身根所觸故，如地、水、火、風，地、水、火三，對青色等，俱眼所見，⸢17⸣准⸤此應責。故知無實地、水、火、風與堅、濕等各別有性，亦非眼見實地、水、⸢18⸣火⸤。","juan":1},{"t":"p","text":"又彼所執實句義中，有礙、常者，皆有礙故，如麁地等，應是無常。諸句義中，色根所取，無質礙法，應皆有礙，許色根取故，如地、水、火、風。又彼所執非實德等，應非離識有別自性，非實攝故，如石女兒，非有實等，應非離識有別自性，非有攝故，如空花等。","juan":1},{"t":"p","text":"彼所執有，應離實等無別自性，許非無故，如實、德等。若離實等，應非有性，許異實等故，如畢竟無等。如有非無，無別有性，如何實等有別有性？若離有法，有別有性，應離無法，有別無性，彼既不然，此云何爾？故彼有性唯妄計度。","juan":1},{"t":"p","text":"又彼所執實、德、業性，異實、德、業，理定不然，勿此亦非實、德、業性，異實等故，如德、業等。又應實等非實等攝，異實等性故，如德、業、實等。地等諸性對地等體，更相徵⸢19⸣詰⸤，准此應知。如實性等，無別實等性，實等亦應無別實性等。若離實等有實等性，應離非實等，有非實等性。彼既不爾，此云何然？故同異性唯假施設。","juan":1},{"t":"p","text":"又彼所執和合句義定非實有，非有、實等諸法攝故，如畢竟無。彼許實等現量所得，以理推徵尚非實有，況彼自許和合句義非現量得，而可實有？設執和合是現量境，由前理故，亦非實有。","juan":1},{"t":"p","text":"然彼實等，非緣離識實有自體現量所得，許所知故，如龜毛等。又緣實智，非緣離識實句自體現量智攝，假合生故，如德智等。廣說乃至緣和合智，非緣離識和合自體現量智攝，假合生故，如實智等。","juan":1},{"t":"p","text":"故勝論者實等句義，亦是隨情妄所施設。","juan":1},{"t":"p","text":"有執有一大自在天，體實、遍、常，能生諸法。","juan":1},{"t":"p","text":"彼執非理，所以者何？","juan":1},{"t":"p","text":"若法能生，必非常故；諸非常者，必不遍故；諸不遍者，非真實故。體既常、遍，具諸功能，應一切處、時，頓生一切法。待欲或緣方能生者，違一因論。或欲及緣亦應頓起，因常有故。","juan":1},{"t":"p","text":"餘執有一大梵、時、方、本際、自然、虛空、我等，常住、實有，具諸功能，生一切法，皆同此破。","juan":1},{"t":"p","text":"有餘⸢20⸣偏⸤執，明論聲常，能為定量，表詮諸法；有執一切聲皆是常，待緣顯發，方有詮表。","juan":1},{"t":"p","text":"彼俱非理，所以者何？","juan":1},{"t":"p","text":"且明論聲，許能詮故，應非常住，如所餘聲。","juan":1},{"t":"p","text":"餘聲亦應非常聲體，如瓶、衣等，待眾緣故。","juan":1},{"t":"p","text":"有外道執地、水、火、風、極微實、常，能生麁色，所生麁色不越因量，雖是無常，而體實有。","juan":1},{"t":"p","text":"彼亦非理，所以者何？","juan":1},{"t":"p","text":"所執極微，若有方分，如蟻行等，體應非實。若無方分，如心、心所應不共聚生麁果色，既能生果，如彼所生，如何可說極微常住？","juan":1},{"t":"p","text":"又所生果不越因量，應如極微，不名麁色，則此果色應非眼等色根所取，便違自執。若⸢21⸣謂⸤果色，量德合故，非麁似麁，色根⸢22⸣能⸤取。所執果色，既同因量，應如極微，無麁德合；或應極微亦麁德合；如麁果色，處無別故。若謂果色遍在自因，因非一故，可名麁者，則此果色體應非一，如所在因，處各別故。既爾，此果還不成麁，由此亦非色根所取。若果多分合故成麁，多因極微合應非細，足成根境，何用果為？既多分成，應非實有，則汝所執，前後相違。","juan":1},{"t":"p","text":"又果與因俱有質礙，應不同處，如二極微。若謂果、因體相受入，如沙受水，藥入鎔銅。誰許沙、銅體受水、藥？或應離、變，非一、非常，又麁色果體若是一，得一分時應得一切，彼、此一故，彼應如此，不許違理，許便違事，故彼所執進、退不成，但是隨情虛妄計度。","juan":1},{"t":"p","text":"然諸外道品類雖多，所執有法不過四種：","juan":1},{"t":"p","text":"一、執有法與有等性其體定一，如數論等。彼執非理，所以者何？勿一切法即有性故，皆如有性，體無差別，便違三德、我等體異，亦違世間諸法差別。又若色等即色等性，色等應無青、黃等異。","juan":1},{"t":"p","text":"二、執有法與有等性其體定異，如勝論等。彼執非理，所以者何？勿一切法非有性故，如已滅無，體不可得，便違實等自體非無，亦違世間現見有物。又若色等非色等性，應如聲等非眼等境。","juan":1},{"t":"p","text":"三、執有法與有等性亦一、亦異，如無慚等，彼執非理，所以者何？一、異同前一、異過故；二相相違，體應別故，一、異體同俱不成故。勿一切法皆同一體，或應一、異是假非實，而執為實理定不成。","juan":1},{"t":"p","text":"四、執有法與有等性非一、非異，如⸢23⸣邪⸤命等。彼執非理，所以者何？非一、異執同異、一故。非一、異言為遮為表？若唯是表，應不雙非；若但是遮，應無所執；亦遮、亦表應互相違；非表、非遮應成戲論。又非一、異，違世共知有一、異物，亦違自宗色等有法決定實有。","juan":1},{"t":"p","text":"是故彼言唯矯避過，諸有智者勿謬許之。","juan":1},{"t":"p","text":"餘乘所執，離識實有色等諸法，如何非有？","juan":1},{"t":"p","text":"彼所執色、不相應行及諸無為，理非有故。","juan":1},{"t":"p","text":"且所執色總有二種：一者有對，極微所成；二者無對，非極微成。","juan":1},{"t":"p","text":"彼有對色定非實有，能成極微非實有故。","juan":1},{"t":"p","text":"謂諸極微，若有質礙，應如瓶等，是假非實。","juan":1},{"t":"p","text":"若無質礙，應如非色，如何可集成瓶、衣等？","juan":1},{"t":"p","text":"又諸極微，若有方分，必可分析，便非實有。","juan":1},{"t":"p","text":"若無方分，則如非色，云何和合承光、發影？日輪纔舉照柱等時，東、西兩邊光影各現，承光、發影處既不同，所執極微定有方分。又，若見、觸壁等物時，唯得此邊不得彼分。既和合物即諸極微，故此極微必有方分。又諸極微隨所住處，必有上、下、四方差別，不爾便無共和、集義。或相涉入應不成麁，由此極微定有方分。執有對色即諸極微，若無方分，應無障隔。若爾，便非障礙有對。","juan":1},{"t":"p","text":"是故汝等所執極微必有方分，有方分故，便可分析，定非實有。","juan":1},{"t":"p","text":"故有對色實有不成。","juan":1},{"t":"p","text":"五識豈無所依、緣色？","juan":1},{"t":"p","text":"雖非無色，而是識變。謂識生時。內因緣力，變似眼等、色等相現，即以此相為所依、緣。","juan":1},{"t":"p","text":"然眼等根非現量得，以能發識，比知是有，此但功能，非外所造。外有對色理既不成，故應但是內識變現，發眼等識，名眼等根，此為所依，生眼等識。","juan":1},{"t":"p","text":"此眼等識外所緣緣，理非有故，決定應許自識所變為所緣緣，謂能引生似自識者，汝執彼是此所緣緣。","juan":1},{"t":"p","text":"非但能生，勿因緣等亦名此識所緣緣故。","juan":1},{"t":"p","text":"眼等五識了色等時，但緣和合，似彼相故，非和合相異諸極微有實自體。分析彼時，似彼相識定不生故，彼和合相既非實有，故不可說是五識緣，勿第二月等能生五識故。","juan":1},{"t":"p","text":"非諸極微共和合位可與五識各作所緣，此識上無極微相故，非諸極微有和合相，不和合時無此相故。非和合位與不合時，此諸極微體相有異，故和合位如不合時，色等極微非五識境。","juan":1},{"t":"p","text":"有執色等一一極微不和集時，非五識境，共和集位，展轉相資，有麁相生，為此識境，彼相實有，為此所緣。彼執不然，共和集位與未集時，體相一故。瓶、甌等物極微等者，緣彼相識應無別故；共和集位一一極微，各各應捨微、圓相故；非麁相識緣細相境，勿餘境識緣餘境故；一識應緣一切境故。","juan":1},{"t":"p","text":"許有極微，尚致此失，況無識外真實極微。","juan":1},{"t":"p","text":"由此定知，自識所變似色等相為所緣緣，見託彼生，帶彼相故。然識變時，隨量大、小，頓現一相，非別變作眾多極微合成一物。為執麁色有實體者，佛說極微，⸢24⸣令⸤其除析，非謂諸色實有極微。諸瑜伽師以假想慧，於麁色相漸次除析，至不可析，假說極微，雖此極微猶有方分，而不可析，若更析之便似空現，不名為色，故說極微是色邊際。","juan":1},{"t":"p","text":"由此應知，諸有對色，皆識變現，非極微成。","juan":1},{"t":"p","text":"餘無對色是此類故，亦非實有，或無對故，如心、心所，定非實色。諸有對色現有色相，以理推究，離識尚無，況無對色現無色相，而可說為真實色法？","juan":1},{"t":"p","text":"表、無表色豈非實有？","juan":1},{"t":"p","text":"此非實有，所以者何？","juan":1},{"t":"p","text":"且身表色若是實有，以何為性？","juan":1},{"t":"p","text":"若言是形，便非實有，可分析故；長等極微不可得故。若言是動，亦非實有，纔生即滅無動義故；有為法滅不待因故；滅若待因應非滅故。若言有色非顯、非形，心所引生，能動手等，名身表業，理亦不然。此若是動，義如前破；若是動因，應即風界，風無表示，不應名表；又觸不應通善、惡性，非顯、香、味，類觸應知。","juan":1},{"t":"p","text":"故身表業定非實有。","juan":1},{"t":"p","text":"然心為因，令識所變手等色相，生滅相續，轉趣餘方，似有動作。表示心故，假名身表。","juan":1},{"t":"p","text":"語表亦非實有聲性，一剎那聲無詮表故，多念相續便非實故，外有對色，前已破故。","juan":1},{"t":"p","text":"然因心故，識變似聲，生滅相續，似有表示，假名語表，於理無違。","juan":1},{"t":"p","text":"表既實無，無表寧實？然依思願善惡分限，假立無表，理亦無違。謂此或依發勝身、語善惡思種增長位立；或依定中止身、語惡現行思立，故是假有。","juan":1},{"t":"p","text":"世尊經中說有三業，撥身、語業豈不違經？","juan":1},{"t":"p","text":"不撥為無，但言非色。","juan":1},{"t":"p","text":"能動身思說名身業，能發語思說名語業。審、決二思，意相應故，作動意故，說名意業。","juan":1},{"t":"p","text":"起身、語思，有所造作，說名為業，是審、決思所遊履故；通生苦、樂異熟果故，亦名為道。故前七業道，亦思為自性，或身、語表⸢25⸣由⸤思發故，假說為業，思所履故，說名業道。","juan":1},{"t":"p","text":"由此應知實無外色，唯有內識變似色生。","juan":1},{"t":"p","text":"不相應行亦非實有，所以者何？","juan":1},{"t":"p","text":"得、非得等，非如色、心及諸心所體相可得；非異色、心及諸心所作用可得，由此故知定非實有，但依色等分位假立。","juan":1},{"t":"p","text":"此定非異色、心、心所，有實體用，如色、心等，許蘊攝故。","juan":1},{"t":"p","text":"或心、心所及色、無為所不攝故，如畢竟無，定非實有。或餘實法所不攝故，如餘假法，非實有體。","juan":1},{"t":"p","text":"且彼如何知得、非得，異色、心等，有實體用？","juan":1},{"t":"p","text":"契經說故。如說：如是補特伽羅成就善、惡，聖者成就十無學法。又說：異生不成就聖法，諸阿羅漢不成就煩惱，成、不成言，顯得、非得。","juan":1},{"t":"p","text":"經不說此異色、心等有實體用，為證不成。","juan":1},{"t":"p","text":"亦說：輪王成就七寶。豈即成就他身、非情？","juan":1},{"t":"p","text":"若謂於寶有自在力，假說成就，於善、惡法，何不許然，而執實得？","juan":1},{"t":"p","text":"若謂七寶在現在，故可假說成，寧知所成善、惡等法離現在有？離現實法，理非有故。","juan":1},{"t":"p","text":"現在必有善種等故。","juan":1},{"t":"p","text":"又得於法有何勝用？","juan":1},{"t":"p","text":"若言能起，應起無為，一切非情應永不起，未得、已失應永不生。","juan":1},{"t":"p","text":"若俱生得為因起者，所執二生便為無用。又具善、惡、無記得者，善、惡、無記應頓現前，若待餘因，得便無用。","juan":1},{"t":"p","text":"若得於法是不失因，有情由此成就彼故，諸可成法不離有情，若離有情實不可得，故得於法俱為無用。","juan":1},{"t":"p","text":"得實無故，非得亦無。","juan":1},{"t":"p","text":"然依有情可成諸法分位，假立三種成就：一、種子成就；二、自在成就；三、現行成就。翻此假立不成就名，此類雖多，而於三界見所斷種未永害位，假立非得，名異生性，於諸聖法未成就故。","juan":1},{"t":"p","text":"復如何知異色、心等有實同分？","juan":1},{"t":"p","text":"契經說故。如契經說：此天同分、此人同分，乃至廣說。","juan":1},{"t":"p","text":"此經不說異色、心等有實同分，為證不成。","juan":1},{"t":"p","text":"若同智、言，因斯起故，知實有者，則草、木等應有同分。","juan":1},{"t":"p","text":"又，於同分起同智、言，同分復應有別同分，彼既不爾，此云何然？","juan":1},{"t":"p","text":"若謂為因起同事、欲，知實有者，理亦不然。宿習為因，起同事、欲，何要別執有實同分？","juan":1},{"t":"p","text":"然依有情身、心相似，分位差別，假立同分。","juan":1},{"t":"p","text":"復如何知異色、心等，有實命根？","juan":1},{"t":"p","text":"契經說故。如契經說：壽、煖、識三，應知命根說名為壽。","juan":1},{"t":"p","text":"此經不說異色、心等有實壽體，為證不成。","juan":1},{"t":"p","text":"又，先已成色不⸢26⸣離⸤識，應⸢27⸣此⸤離識無別命根。","juan":1},{"t":"p","text":"又，若命根異識實有，應如受等，非實命根。","juan":1},{"t":"p","text":"若爾，如何經說三法？義別說三，如四正斷。住無心位，壽、煖應無。豈不經說識不離身。既爾，如何名無心位？彼滅轉識，非阿賴⸢28⸣耶⸤。有此識因，後當廣說。此識足為界、趣、生體，是遍、恒、續。異熟果故，無勞別執有實命根。","juan":1},{"t":"p","text":"然依親生此識種子，由業所引功能差別，住時決定，假立命根。","juan":1},{"t":"p","text":"復如何知二無心定、無想異熟，異色、心等有實自性？","juan":1},{"t":"p","text":"若無實性，應不能遮心、心所法，令不現起。","juan":1},{"t":"p","text":"若無心位，有別實法，異色、心等，能遮於心，名無心定。","juan":1},{"t":"p","text":"應無色時，有別實法，異色、心等，能礙於色，名無色定。彼既不爾，此云何然？","juan":1},{"t":"p","text":"又，遮礙心何須實法，如堤塘等，假亦能遮。","juan":1},{"t":"p","text":"謂修定時，於定加行，厭患麁動心、心所故，發勝期願，遮心、心所。令心、心所漸細漸微，微微心時，熏異熟識，成極增上厭心等種。由此損伏心等種故，麁動心等暫不現行，依此分位，假立二定。此種善故，定亦名善。","juan":1},{"t":"p","text":"無想定前，求無想果，故所熏成種，招彼異熟識。依⸢29⸣定⸤麁動想等不行，於此分位，假立無想。依異熟立，得異熟名，故此三法，亦非實有。","juan":1},{"t":"p","text":"復如何知，諸有為相異色、心等，有實自性？","juan":2},{"t":"p","text":"契經說故。如契經說：有三有為之有為相，乃至廣說。","juan":2},{"t":"p","text":"此經不說異色、心等有實自性，為證不成。","juan":2},{"t":"p","text":"非第六聲便表異體，色、心之體即色、心故。","juan":2},{"t":"p","text":"非能相體定異所相，勿堅相等異地等故。","juan":2},{"t":"p","text":"若有為相異所相體，無為相體應異所相。","juan":2},{"t":"p","text":"又生等相，若體俱有，應一切時齊興作用；若相違故，用不頓興，體亦相違，如何俱有？又住、異、滅用不應俱。","juan":2},{"t":"p","text":"能相、所相體俱本有，用亦應然，無別性故。若謂彼用更待因緣，所待因緣應非本有。又執生等便為無用。","juan":2},{"t":"p","text":"所相恒有而生等合，應無為法亦有生等，彼此異因，不可得故。","juan":2},{"t":"p","text":"又去、來世，非現、非常，應似空花，非實有性。生名為有，寧在未來？滅名為無，應非現在。滅若非無，生應非有。又滅違住，寧執同時？住不違生，何容異世。故彼所執，進退非理。","juan":2},{"t":"p","text":"然有為法，因緣力故，本無今有，暫有還無，表異無為，假立四相。","juan":2},{"t":"p","text":"本無今有，有位名生；生位暫停，即說為住；住別前後，復立異名；暫有還無，無時名滅。","juan":2},{"t":"p","text":"前三有故，同在現在，後一是無，故在過去。","juan":2},{"t":"p","text":"如何無法與有為相？表此後無，為相何失？生表有法先非有，滅表有法後是無，異表此法非凝然，住表此法暫有用。故此四相，於有為法，雖俱名表，而表有異。","juan":2},{"t":"p","text":"此依剎那假立四相，一期分位亦得假立。初有名生；後無名滅；生已相似相續名住；即此相續轉變名異。","juan":2},{"t":"p","text":"是故四相皆是假立。","juan":2},{"t":"p","text":"復如何知異色、心等，有實詮表名、句、文身？","juan":2},{"t":"p","text":"契經說故。如契經說，佛得希有名、句、文身。","juan":2},{"t":"p","text":"此經不說異色、心等有實名等，為證不成。","juan":2},{"t":"p","text":"若名、句、文異聲實有，應如色等，非實能詮。","juan":2},{"t":"p","text":"謂聲能生名、句、文者，此聲必有音韻屈曲，此足能詮，何用名等。","juan":2},{"t":"p","text":"若謂聲上音韻屈曲即名、句、文，異聲實有，所見色上形量屈曲，應異色處別有實體。","juan":2},{"t":"p","text":"若謂聲上音韻屈曲，如⸢30⸣絃⸤管聲非能詮者，此應如彼聲，不別生名等。又誰說彼定不能詮？聲若能詮，風鈴聲等應有詮用，此應如彼不別生實名、句、文身。若唯語聲能生名等，如何不許唯語能詮。","juan":2},{"t":"p","text":"何理定知能詮即語？寧知異語別有能詮？語不異能詮，人天共了，執能詮異語，天愛非餘。","juan":2},{"t":"p","text":"然依語聲分位差別，而假建立名、句、文身。","juan":2},{"t":"p","text":"名詮自性；句詮差別；文即是字，為二所依。","juan":2},{"t":"p","text":"此三離聲雖無別體，而假、實異，亦不即聲。由此法、詞二無礙解，境有差別；聲與名等，蘊、處、界攝亦各有異。","juan":2},{"t":"p","text":"且依此土說名、句、文依聲假立，非謂一切；諸餘佛土亦依光明、妙香、味等假立三故。","juan":2},{"t":"p","text":"有執隨眠異心、心所，是不相應行蘊所攝。","juan":2},{"t":"p","text":"彼亦非理，名貪等故，如現貪等，非不相應。","juan":2},{"t":"p","text":"執別有餘不相應行，准前理趣皆應遮止。","juan":2},{"t":"p","text":"諸無為法離色、心等決定實有，理不可得。且定有法，略有三種：一、現所知法，如色、心等。二、現受用法，如瓶、衣等，如是二法，世共知有，不待因成。三、有作用法，如眼、耳等，由彼彼用證知是有。無為非世共知定有，又無作用，如眼、耳等。設許有用，應是無常，故不可執無為定有。然諸無為所知性故，或色、心等所顯性故，如色、心等，不應執為離色、心等實無為性。","juan":2},{"t":"p","text":"又虛空等為一、為多？","juan":2},{"t":"p","text":"若體是一，遍一切處，虛空容受色等法故，隨能合法，體應成多，一所合處餘不合故。不爾，諸法應互相遍。若謂虛空不與法合，應非容受，如餘無為。又色等中有虛空不？有應相雜，無應不遍。一部、一品結法斷時，應得餘部、餘品擇滅；一法緣⸢31⸣闕⸤得不生時，應於一切得非擇滅。執彼體一，理應爾故。","juan":2},{"t":"p","text":"若體是多，便有品類，應如色等，非實無為。虛空又應非遍容受。","juan":2},{"t":"p","text":"餘部所執離心、心所實有無為，准前應破。","juan":2},{"t":"p","text":"又諸無為許無因果故，應如⸢32⸣兔⸤角，非異心等有。","juan":2},{"t":"p","text":"然契經說，有虛空等諸無為法，略有二種：","juan":2},{"t":"p","text":"一、依識變假施設有。謂曾聞說虛空等名，隨分別有虛空等相，數習力故，心等生時，似虛空等無為相現。此所現相，前後相似，無有變易，假說為常。","juan":2},{"t":"p","text":"二、依法性，假施設有。","juan":2},{"t":"p","text":"謂空、無我所顯真如，有、無、俱非，心言路絕，與一切法非一、異等，是法真理，故名法性。","juan":2},{"t":"p","text":"離諸障礙，故名虛空；由簡擇力，滅諸雜染，究竟證會，故名擇滅；不由擇力，本性清淨，或緣⸢33⸣闕⸤所顯，故名非擇滅；苦、樂受滅，故名不動；想、受不行，名想受滅。","juan":2},{"t":"p","text":"此五皆依真如假立，真如亦是假施設名。","juan":2},{"t":"p","text":"遮撥為無，故說為有；遮執為有，故說為空；勿謂虛、幻，故說為實；理非妄倒，故名真如。不同餘宗離色、心等有實常法名曰真如。","juan":2},{"t":"p","text":"故諸無為非定實有。","juan":2},{"t":"p","text":"外道、餘乘所執諸法異心、心所非實有性，是所取故，如心、心所。","juan":2},{"t":"p","text":"能取彼覺亦不緣彼，是能取故，如緣此覺。","juan":2},{"t":"p","text":"諸心、心所依他起故，亦如幻事，非真實有。","juan":2},{"t":"p","text":"為遣妄執心、心所外實有境故，說唯有識。","juan":2},{"t":"p","text":"若執唯識真實有者，如執外境，亦是法執。","juan":2},{"t":"p","text":"然諸法執略有二種：","juan":2},{"t":"p","text":"一者俱生；二者分別。","juan":2},{"t":"p","text":"俱生法執，無始時來虛妄熏習，內因力故，恒與身俱，不待邪教及邪分別，任運而轉，故名俱生。","juan":2},{"t":"p","text":"此復二種：一、常相續，在第七識，緣第八識，起自心相，執為實法；二、有間斷，在第六識，緣識所變蘊、處、界相，或總、或別，起自心相，執為實法。","juan":2},{"t":"p","text":"此二法執細故難斷，後十地中數數修習勝法空觀，方能除滅。","juan":2},{"t":"p","text":"分別法執，亦由現在外緣力故，非與身俱，要待邪教及邪分別然後方起，故名分別。","juan":2},{"t":"p","text":"唯在第六意識中有。此亦二種：一、緣邪教所說蘊、處、界相，起自心相，分別、計度，執為實法。二、緣邪教所說自性等相，起自心相，分別、計度，執為實法。","juan":2},{"t":"p","text":"此二法執麁故易斷，入初地時，觀一切法，法空真如，即能除滅。","juan":2},{"t":"p","text":"如是所說一切法執，自心外法或有或無，自心內法一切皆有，是故法執皆緣自心所現似法，執為實有。然似法相從緣生故，是如幻有，所執實法妄計度故，決定非有。故世尊說：「慈氏當知，諸識所緣，唯識所現，依他起性，如幻事等。」","juan":2},{"t":"p","text":"如是外道、餘乘所執離識我、法皆非實有。故心、心所決定不用外色等法為所緣緣，緣用必依實有體故。","juan":2},{"t":"p","text":"現在彼聚心、心所法，非此聚識親所緣緣，如非所緣，他聚攝故。同聚心所亦非親所緣，自體異故，如餘非所取。","juan":2},{"t":"p","text":"由此應知，實無外境，唯有內識，似外境生。是故契經伽他中說：「如愚所分別，外境實皆無，習氣擾濁心，故似彼而轉。」","juan":2},{"t":"p","text":"有作是難：若無離識實我、法者，假亦應無，謂假必依真事、似事、共法而立，如有真火、有似火人、有猛赤法，乃可假說此人為火，假說牛等應知亦然。我、法若無，依何假說，無假說故，似亦不成，如何說心似外境轉。","juan":2},{"t":"p","text":"彼難非理，離識我、法，前已破故。","juan":2},{"t":"p","text":"依類、依實假說火等，俱不成故。","juan":2},{"t":"p","text":"依類假說理且不成，猛、赤等德非類有故。若無共德而假說彼，應亦於水等假說火等名。若謂猛等雖非類德，而不相離，故可假說。此亦不然，人類猛等現見亦有，互相離故。類既無德又互相離，然有於人假說火等，故知假說不依類成。","juan":2},{"t":"p","text":"依實假說，理亦不成。猛、赤等德非共有故，謂猛、赤等在火、在人其體各別，所依異故，無共假說，有過同前。若謂人、火，德相似故，可假說者，理亦不然。說火在人，非在德故。由此假說不依實成。","juan":2},{"t":"p","text":"又假必依真事立者，亦不應理。","juan":2},{"t":"p","text":"真謂自相，假智及詮俱非境故。謂假智、詮不得自相，唯於諸法共相而轉，亦非離此有別方便施設自相為假所依。然假智、詮必依聲起，聲不及處，此便不轉，能詮、所詮俱非自相，故知假說不依真事。","juan":2},{"t":"p","text":"由此但依似事而轉，似謂增益，非實有相，聲依增益，似相而轉，故不可說假必依真。","juan":2},{"t":"p","text":"是故彼難不應正理。然依識變，對遣妄執真實我、法，說假似言。由此契經伽他中說：","juan":2},{"t":"v","num":null,"lines":["「為對遣愚夫所執實我、法，","故於識所變，假說我、法名。」"],"juan":2},{"t":"k","lv":5,"text":"㊁釋下三句","juan":2},{"t":"k","lv":6,"text":"1 別解三句出能變體","juan":2},{"t":"p","text":"識所變相雖無量種，而能變識類⸢34⸣別唯⸤三：一謂異熟，即第八識，多異熟性故；二謂思量，即第七識，恒、審思量故；三謂了境，即前六識，了境相麁故。「及」言顯六合為一種。","juan":2},{"t":"k","lv":6,"text":"2 釋能變義","juan":2},{"t":"p","text":"此三皆名能變識者，能變有二種：","juan":2},{"t":"p","text":"一、因能變，謂第八識中「等流」、「異熟」二因習氣。等流習氣，由七識中善、惡、無記熏令生長；異熟習氣由六識中有漏善、惡熏令生長。","juan":2},{"t":"p","text":"二、果能變，謂前⸢35⸣二⸤種習氣力故，有八識生現種種相。","juan":2},{"t":"p","text":"等流習氣為因緣故，八識體相差別而生，名等流果，果似因故。異熟習氣為增上緣，感第八識，酬引業力，恒相續故，立異熟名；感前六識，酬滿業者，從異熟起，名異熟生，不名異熟有間斷故。即前異熟及異熟生，名異熟果，果異因故。","juan":2},{"t":"p","text":"此中且說我愛執藏，持雜染種能變果識，名為異熟，非謂一切。","juan":2},{"t":"k","lv":3,"text":"二、隨標廣釋","juan":2},{"t":"p","text":"雖已略說能變三名，而未廣⸢36⸣辯⸤能變三相。且初能變其相云何？","juan":2},{"t":"k","lv":4,"text":"(一) 明三能變識相","juan":2},{"t":"k","lv":5,"text":"㊀釋頌文廣明三能變","juan":2},{"t":"k","lv":6,"text":"1 釋初能變","juan":2},{"t":"p","text":"頌曰：","juan":2},{"t":"v","num":null,"lines":["初阿賴⸢37⸣耶⸤識，異熟一切種，"],"juan":2}],"kepan":["(三) 長行釋","㊀釋上三句","1 略釋頌答外徵","2 廣釋頌","㊁釋下三句","1 別解三句出能變體","2 釋能變義","二、隨標廣釋","(一) 明三能變識相","㊀釋頌文廣明三能變","1 釋初能變"],"yi":"世間與聖教所說的「我」與「法」，種種相狀展轉施設，都只是假說，並非實有。這些假說所依託的，是識所變現的見分與相分；而能變的識，總說唯有三類：即異熟識（第八）、思量識（第七），與了別境識（前六）。","yao":["破執的次第：先破外道所執實我（即蘊、離蘊、非即非離蘊三型），次破數論、勝論、大自在天等外道法執，再破小乘薩婆多、正量、經部等法執，末以「唯識」總收。","「假必依實」是論主與外人共許的原則，論主翻此原則以成己說：假說我法既須有所依，所依即識所變之見相二分，而非識外實境。","「能變唯三」的三能變是果能變的分類；別有因能變義（種子生現行），二義並立方為完整，論中隨後於初能變處詳釋。","識體變現須立四分（相分、見分、自證分、證自證分），此為護法正義。安慧唯立自證一分、難陀立見相二分、陳那立三分，本論並陳而以四分為究竟。"],"ming":[["假說我法","「我」謂主宰義，「法」謂軌持義。二者皆隨情假立，無實自性，故云假說。"],["因能變","第八識中等流、異熟二因習氣，能生自類現行與異熟果，就種子生現行而言為能變。"],["果能變","八識現行識體變似見分、相分二用，就現行識變現而言為能變。頌云「此能變唯三」即約果能變。"],["四分","相分（所緣影像）、見分（能緣作用）、自證分（證知見分）、證自證分（證知自證分）。護法所立，說明識自體之自我證知不待外求。"],["異熟・思量・了境","三能變之標名：第八以異熟為義，第七以恆審思量為義，前六以了別境相為義。"]]},{"id":2,"label":"初能變・阿賴耶識","verses":[3,4],"kind":"verse","juan":[2,3,4],"chars":15467,"blocks":[{"t":"v","num":3,"lines":["不可知執受，處了常與觸，","作意、受、想、思，相應唯捨受。"],"juan":2},{"t":"v","num":4,"lines":["是無覆無記，觸等亦如是，","恒轉如⸢38⸣瀑⸤流，阿羅漢位捨。"],"juan":2},{"t":"p","text":"論曰：初能變識，大小乘教名阿賴⸢39⸣耶⸤，此識具有能藏、所藏、執藏義故。謂與雜染互為緣故，有情執為自內我故，此即顯示初能變識所有自相，攝持因果為自相故。此識自相，分位雖多，藏⸢40⸣識⸤過重，是故偏說。","juan":2},{"t":"p","text":"此是能引諸界、趣、生，善、不善業異熟⸢41⸣果⸤故，說名異熟。離此命根、眾同分等恒時相續勝異熟果不可得故。此即顯示初能變識所有果相。此識果相，雖多位、多種，異熟⸢42⸣寬⸤、不共，故偏說之。","juan":2},{"t":"p","text":"此能執持諸法種子令不失故，名一切種。離此餘法能遍執持諸法種子不可得故，此即顯示初能變識所有因相。此識因相雖有多種，持種不共，是故偏說。","juan":2},{"t":"p","text":"初能變識，體相雖多，略說唯有如是三相。","juan":2},{"t":"p","text":"一切種相應更分別。此中何法名為種子？","juan":2},{"t":"p","text":"謂本識中親生自果，功能差別。","juan":2},{"t":"p","text":"此與本識及所生果不一、不異，體用、因果理應爾故。","juan":2},{"t":"p","text":"雖非一、異，而是實有，假法如無，非因緣故。此與諸法既非一、異，應如瓶等是假非實。若爾，真如應是假有，許則便無真勝義諦。","juan":2},{"t":"p","text":"然諸種子唯依世俗說為實有，不同真如。","juan":2},{"t":"p","text":"種子雖依第八識體，而是此識相分；非餘，見分恒取此為境故。","juan":2},{"t":"p","text":"諸有漏種與異熟識，體無別故，無記性攝；因果俱有善等性故，亦名善等。","juan":2},{"t":"p","text":"諸無漏種，非異熟識性所攝故；因果俱是善性攝故，唯名為善。若爾，何故〈決擇分〉說二十二根一切皆有異熟種子，皆異熟生？雖名異熟而非無記，依異熟故名異熟種，異性相依如眼等識。或無漏種，由熏習力轉變成熟，立異熟名，非無記性所攝異熟。","juan":2},{"t":"p","text":"此中有義：一切種子皆本性有，不從熏生。","juan":2},{"t":"p","text":"由熏習力但可增長。","juan":2},{"t":"p","text":"如契經說：一切有情無始時來有種種界，如惡叉聚，法爾而有。界即種子差別名故。又契經說：「無始時來界，一切法等依」，界是因義。《瑜伽》亦說：諸種子體無始時來性雖本有，而由染淨新所熏發。諸有情類無始時來，若般涅槃法者，一切種子皆悉具足，不般涅槃法者，便⸢43⸣闕⸤三種菩提種子。如是等文，誠證非一。","juan":2},{"t":"p","text":"又諸有情既說本有五種⸢44⸣性⸤別，故應定有法⸢45⸣爾⸤種子，不由熏生。又《瑜伽》說：地獄成就三無漏根，是種非現。又從無始展轉傳來，法爾所得本性住⸢46⸣性⸤。由此等證，無漏種子法爾本有，不從熏生。","juan":2},{"t":"p","text":"有漏亦應法爾有種，由熏增長，不別熏生。","juan":2},{"t":"p","text":"如是建立，因果不亂。","juan":2},{"t":"p","text":"有義：種子皆熏故生。","juan":2},{"t":"p","text":"所熏、能熏俱無始有，故諸種子無始成就。種子既是習氣異名，習氣必由熏習而有，如麻香氣，花熏故生。","juan":2},{"t":"p","text":"如契經說：諸有情心，染淨諸法所熏習故，無量種子之所積集。論說：內種定有熏習，外種熏習或有或無。又名言等三種熏習，總攝一切有漏法種。彼三既由熏習而有，故有漏種必藉熏生。","juan":2},{"t":"p","text":"無漏種生亦由熏習，說聞熏習、聞淨法界等流正法而熏起故，是出世心種子⸢47⸣性⸤故。","juan":2},{"t":"p","text":"有情本來⸢48⸣種姓⸤差別，不由無漏種子有無，但依有障、無障建立。如《瑜伽》說：於真如境，若有畢竟二障種者，立為不般涅槃法⸢49⸣性⸤；若有畢竟所知障種非煩惱者，一分立為聲聞種⸢50⸣性⸤，一分立為獨覺種⸢51⸣性⸤；若無畢竟二障種者，即立彼為如來種⸢52⸣性⸤。故知本來種⸢53⸣性⸤差別，依障建立，非無漏種。","juan":2},{"t":"p","text":"所說：「成就無漏種」言，依當可生，非已有體。","juan":2},{"t":"p","text":"有義：種子各有二類。","juan":2},{"t":"p","text":"一者本有，謂無始來異熟識中法爾而有，生蘊、處、界功能差別。世尊依此，說諸有情無始時來有種種界，如惡叉聚，法爾而有，餘所引證廣說如初。此即名為本性住種。","juan":2},{"t":"p","text":"二者始起，謂無始來，數數現行熏習而有。世尊依此，說有情心染淨諸法所熏習故，無量種子之所積集。諸論亦說：染淨種子由染淨法熏習故生，此即名為習所成種。","juan":2},{"t":"p","text":"若唯本有，轉識不應與阿賴⸢54⸣耶⸤為因緣性。如契經說：","juan":2},{"t":"v","num":null,"lines":["「諸法於識藏，識於法亦爾，","更互為果性，亦常為因性。」"],"juan":2},{"t":"p","text":"此頌意言：阿賴⸢55⸣耶⸤識與諸轉識，於一切時展轉相生，互為因果。《攝大乘》說：阿賴⸢56⸣耶⸤識與雜染法互為因緣，如炷與焰展轉生燒，又如⸢57⸣束⸤蘆互相依住，唯依此二建立因緣，所餘因緣不可得故。若諸種子不由熏生，如何轉識與阿賴⸢58⸣耶⸤有因緣義？非熏令長可名因緣，勿善、惡業與異熟果為因緣故。","juan":2},{"t":"p","text":"又諸聖教說有種子由熏習生，皆違彼義；故唯本有，理、教相違。","juan":2},{"t":"p","text":"若唯始起，有為無漏無因緣故，應不得生，有漏不應為無漏種，勿無漏種生有漏故，許應諸佛有漏復生，善等應為不善等種。","juan":2},{"t":"p","text":"分別論者雖作是說：心性本淨，客塵煩惱所染污，故名為雜染，離煩惱時，轉成無漏，故無漏法非無因生。","juan":2},{"t":"p","text":"而心性言，彼說何義？若說空理，空非心因，常法定非諸法種子，以體前後無轉變故。若即說心，應同數論，相雖轉變而體常一，惡、無記心又應是善，許則應與信等相應，不許便應非善心體，尚不名善，況是無漏？有漏善心既稱雜染，如惡心等，性非無漏，故不應與無漏為因，勿善、惡等互為因故。若有漏心性是無漏，應無漏心性是有漏，差別因緣不可得故。又異生心若是無漏，則異生位無漏現行應名聖者。若異生心性雖無漏，而相有染，不名無漏，無斯過者，則心種子亦非無漏，何故汝論說有異生唯得成就無漏種子，種子、現行性、相同故。","juan":2},{"t":"p","text":"然契經說：心性淨者，說心空理所顯真如，真如是心真實性故。或說心體非煩惱故，名性本淨，非有漏心性是無漏，故名本淨。","juan":2},{"t":"p","text":"由此應信有諸有情無始時來有無漏種，不由熏習，法爾成就，後勝進位熏令增長，無漏法起，以此為因。無漏起時，復熏成種，有漏法種類此應知。","juan":2},{"t":"p","text":"諸聖教中，雖說內種定有熏⸢59⸣習⸤，而不定說一切種子皆熏故生，寧全撥無本有種子？然本有種亦由熏習，令其增盛方能得果，故說內種定有熏習。","juan":2},{"t":"p","text":"其聞熏習非唯有漏，聞正法時亦熏本有無漏種子，令漸增盛，展轉乃至生出世心，故亦說此名聞熏習。","juan":2},{"t":"p","text":"聞熏習中，有漏性者是修所斷，感勝異熟，為出世法勝增上緣。無漏性者非所斷攝，與出世法正為因緣。此正因緣微隱難了，有寄麁顯勝增上緣，方便說為出世心種。","juan":2},{"t":"p","text":"依障建立種⸢60⸣姓⸤別者，意顯無漏種子有無，謂：若全無無漏種者，彼二障種永不可害，即立彼為非涅槃法；若唯有二乘無漏種者，彼所知障種永不可害，一分立為聲聞種⸢61⸣姓⸤，一分立為獨覺種⸢62⸣姓⸤；若亦有佛無漏種者，彼二障種俱可永害，即立彼為如來種⸢63⸣姓⸤。故由無漏種子有無，障有可斷、不可斷義，然無漏種微隱難知，故約彼障顯⸢64⸣性⸤差別。不爾，彼障有何別因而有可害、不可害者？若謂法爾有此障別，無漏法種寧不許然？若本全無無漏法種，則諸聖道永不得生，誰當能害二障種子，而說依障立種姓別？既彼聖道必無生義，說當可生，亦定非理。","juan":2},{"t":"p","text":"然諸聖教處處說有本有種子，皆違彼義，故唯始起，理、教相違。","juan":2},{"t":"p","text":"由此應知，諸法種子各有本有、始起二類。","juan":2},{"t":"p","text":"然種子義，略有六種。","juan":2},{"t":"p","text":"一、剎那滅。謂體纔生無間必滅，有勝功力，方成種子。此遮常法，常無轉變，不可說有能生用故。","juan":2},{"t":"p","text":"二、果俱有。謂與所生現行果法俱現和合，方成種子。此遮前後及定相離，現、種異類互不相違，一身俱時有能生用，非如種子自類相生，前後相違，必不俱有。雖因與果有俱、不俱，而現在時可有因用，未生、已滅無自體故，依生現果立種子名，不依引生自類名種，故但應說與果俱有。","juan":2},{"t":"p","text":"三、恒隨轉。謂要長時一類相續，至究竟位，方成種子。此遮轉識，轉易間斷，與種子法不相應故。此顯種子自類相生。","juan":2},{"t":"p","text":"四、性決定。謂隨因力生善、惡等，功能決定，方成種子。此遮餘部執異性因生異性果有因緣義。","juan":2},{"t":"p","text":"五、待眾緣。謂此要待自眾緣合，功能殊勝，方成種子。此遮外道執自然因不待眾緣恒頓生果；或遮餘部緣恒非無。顯所待緣非恒有性，故種於果非恒頓生。","juan":2},{"t":"p","text":"六、引自果。謂於別別色、心等果，各各引生方成種子。此遮外道執唯一因生一切果；或遮餘部執色、心等互為因緣。","juan":2},{"t":"p","text":"唯本識中功能差別具斯六義，成種非餘，外穀麥等，識所變故，假立種名，非實種子。","juan":2},{"t":"p","text":"此種勢力生近、正果，名曰生因；引遠、殘果，令不頓絕，即名引因。","juan":2},{"t":"p","text":"內種必由熏習生長，親能生果，是因緣性。","juan":2},{"t":"p","text":"外種熏習或有、或無，為增上緣，辦所生果。","juan":2},{"t":"p","text":"必以內種為彼因緣，是共相種所生果故。","juan":2},{"t":"p","text":"依何等義立熏習名？","juan":2},{"t":"p","text":"所熏、能熏各具四義，令種生長，故名熏習。","juan":2},{"t":"p","text":"何等名為所熏四義？","juan":2},{"t":"p","text":"一、堅住性。若法始終一類相續能持習氣，乃是所熏。此遮轉識及聲、風等，性不堅住，故非所熏。","juan":2},{"t":"p","text":"二、無記性。若法平等，無所違逆，能容習氣，乃是所熏。此遮善染勢力強盛，無所容納，故非所熏。由此如來第八淨識，唯帶舊種，非新受熏。","juan":2},{"t":"p","text":"三、可熏性。若法自在，性非堅密，能受習氣，乃是所熏。此遮心所及無為法，依他、堅密，故非所熏。","juan":2},{"t":"p","text":"四、與能熏共和合性。若與能熏同時、同處，不即、不離，乃是所熏。此遮他身、剎那前後，無和合義，故非所熏。","juan":2},{"t":"p","text":"唯異熟識具此四義，可是所熏，非心所等。","juan":2},{"t":"p","text":"何等名為能熏四義？","juan":2},{"t":"p","text":"一、有生滅。若法非常，能有作用，生長習氣，乃是能熏。此遮無為前後不變，無生長用，故非能熏。","juan":2},{"t":"p","text":"二、有勝用。若有生滅，勢力增盛，能引習氣，乃是能熏。此遮異熟心、心所等，勢力羸劣，故非能熏。","juan":2},{"t":"p","text":"三、有增減。若有勝用，可增可減，攝⸢65⸣植⸤習氣，乃是能熏。此遮佛果圓滿善法，無增無減，故非能熏。彼若能熏，便非圓滿，前後佛果應有勝劣。","juan":2},{"t":"p","text":"四、與所熏和合而轉。若與所熏同時、同處，不即、不離，乃是能熏。此遮他身、剎那前後，無和合義，故非能熏。","juan":2},{"t":"p","text":"唯七轉識及彼心所有勝勢用，而增減者，具此四義，可是能熏。","juan":2},{"t":"p","text":"如是能熏與所熏識，俱生俱滅，熏習義成。令所熏中種子生長，如熏苣⸢66⸣蕂⸤，故名熏習。","juan":2},{"t":"p","text":"能熏識等，從種生時，即能為因，復熏成種，三法展轉因果同時，如炷生焰、焰生焦炷，亦如蘆⸢67⸣束⸤更互相依，因果俱時，理不傾動。","juan":2},{"t":"p","text":"能熏生種，種起現行，如俱有因得士用果；種子前後自類相生，如同類因引等流果。此二於果是因緣性，除此餘法皆非因緣，設名因緣，應知假說。","juan":2},{"t":"p","text":"是謂略說一切種相。","juan":2},{"t":"p","text":"此識行相、所緣云何？","juan":2},{"t":"p","text":"謂不可知執受、處了。","juan":2},{"t":"p","text":"「了」謂了別，即是行相。識以了別為行相故。","juan":2},{"t":"p","text":"「處」謂處所，即器世間，是諸有情所依處故。","juan":2},{"t":"p","text":"「執受」有二：謂諸種子及有根身。諸種子者，謂諸相、名、分別習氣，有根身者，謂諸色根及根依處。此二皆是識所執受，攝為自體，同安危故。","juan":2},{"t":"p","text":"執受及處俱是所緣，阿賴⸢68⸣耶⸤識因緣力故，自體生時，內變為種及有根身，外變為器，即以所變為自所緣，行相⸢69⸣仗⸤之而得起故。","juan":2},{"t":"p","text":"此中「了」者，謂異熟識於自所緣有了別用，此了別用，見分所攝。","juan":2},{"t":"p","text":"然有漏識自體生時，皆似所緣、能緣相現，彼相應法應知亦爾。似所緣相說名相分，似能緣相說名見分。若心、心所無所緣相，應不能緣自所緣境，或應一一能緣一切，自境如餘，餘如自故。","juan":2},{"t":"p","text":"若心、心所無能緣相，應不能緣，如虛空等，或虛空等；亦是能緣。","juan":2},{"t":"p","text":"故心、心所必有二相。如契經說：","juan":2},{"t":"v","num":null,"lines":["「一切唯有覺，所覺義皆無，","能覺所覺分，各自然而轉。」"],"juan":2},{"t":"p","text":"執有離識所緣境者，彼說外境是所緣，相分名行相，見分名事，是心、心所自體相故。心與心所同所依、緣，行相相似，事雖數等，而相各異，識、受、想等相各別故。","juan":2},{"t":"p","text":"達無離識所緣境者，則說相分是所緣，見分名行相，相、見所依自體名事，即自證分。此若無者，應不自憶心、心所法，如不曾更境必不能憶故，心與心所同所依根，所緣相似，行相各別，了別、領納等作用各異故，事雖數等，而相各異，識、受等體有差別故。","juan":2},{"t":"p","text":"然心、心所一一生時，以理推徵各有三分，所量、能量、量果別故，相、見必有所依體故。如《集量論》伽他中說：","juan":2},{"t":"v","num":null,"lines":["「似境相所量，能取相、自證，","即能量及果，⸢70⸣此⸤三體無別。」"],"juan":2},{"t":"p","text":"又心、心所若細分別應有四分，三分如前，復有第四證自證分。此若無者，誰證第三？心分既同應皆證故。又自證分應無有果，諸能量者必有果故。不應見分是第三果，見分或時非量攝故。由此見分不證第三，證自體者必現量故。","juan":2},{"t":"p","text":"此四分中前二是外，後二是內。初唯所緣，後三通⸢71⸣二⸤，謂第二分但緣第一，或量、非量，或現、或比。第三能緣第⸢72⸣二⸤，第四證自證分，唯緣第三，非第二者，以無用故，第三、第四皆現量攝，故心、心所四分合成，具所、能緣，無無窮過，非即、非離，唯識理成。","juan":2},{"t":"p","text":"是故契經伽他中說：","juan":2},{"t":"v","num":null,"lines":["「眾生心二性，內外一切分，","所取能取纏，見種種差別。」"],"juan":2},{"t":"p","text":"此頌意說：眾生心性二分合成，若內、若外皆有所取、能取纏縛，見有種種，或量、非量，或現、或比，多分差別，此中見者是見分故。","juan":2},{"t":"p","text":"如是四分或攝為三，第四攝入自證分故。或攝為二，後三俱是能緣性故，皆見分攝，此言見者是能緣義。或攝為一，體無別故。如《入楞⸢73⸣伽⸤》伽他中說：","juan":2},{"t":"v","num":null,"lines":["「由自心執著，心似外境轉，","彼所見非有，是故說唯心。」"],"juan":2},{"t":"p","text":"如是處處說唯一心，此一心言亦攝心所。","juan":2},{"t":"p","text":"故識行相即是了別，了別即是識之見分。","juan":2},{"t":"p","text":"所言「處」者，謂異熟識由共相種成熟力故，變似色等器世間相，即外大種及所造色。雖諸有情所變各別而相相似，處所無異，如眾燈明各遍似一。","juan":2},{"t":"p","text":"誰異熟識變為此相？","juan":2},{"t":"p","text":"有義：一切。所以者何？如契經說：一切有情，業增上力共所起故。","juan":2},{"t":"p","text":"有義：若爾，諸佛菩薩應實變為此雜穢土，諸異生等應實變為他方、此界諸淨妙土。又諸聖者厭離有色，生無色界，必不下生，變為此土，復何所用？是故現居及當生者，彼異熟識變為此界。經依少分說「一切」言，諸業同者皆共變故。","juan":2},{"t":"p","text":"有義：若爾，器將壞時，既無現居及當生者，誰異熟識變為此界？又諸異生厭離有色，生無色界，現無色身，預變為土，此復何用？設有色身，與異地器，麁細懸隔，不相依持，此變為彼，亦何所益？然所變土本為色身依持、受用，故若於身可有持用便變為彼。由是設生他方自地，彼識亦得變為此土，故器世界將壞、初成，雖無有情而亦現有。此說一切共受用者，若別受用准此應知，鬼、人、天等所見異故。","juan":2},{"t":"p","text":"諸種子者，謂異熟識所持一切有漏法種，此識性攝，故是所緣。無漏法種雖依附此識，而非此性攝，故非所緣。雖非所緣而不相離，如真如性，不違唯識。","juan":2},{"t":"p","text":"有根身者，謂異熟識不共相種成熟力故，變似色根及根依處，即內大種及所造色，有共相種成熟力故，於他身處亦變似彼。不爾，應無受用他義。","juan":2},{"t":"p","text":"此中有義：亦變似根。《⸢74⸣辯⸤中邊》說：「似自、他身五根現」故。","juan":2},{"t":"p","text":"有義：唯能變似依處，他根於己非所用故，「似自、他身五根現」者，說自、他識各自變義，故生他地或般涅槃，彼餘尸骸猶見相續。","juan":2},{"t":"p","text":"前來且說業力所變外器、內身、界、地差別；若定等力所變器、身、界、地、自、他，則不決定。所變身、器，多恒相續；變聲、光等，多分暫時，隨現緣力擊發起故。","juan":2},{"t":"p","text":"略說此識所變境者，謂有漏種、十有色處，及墮法處所現實色。","juan":2},{"t":"p","text":"何故此識不能變似心、心所等為所緣⸢75⸣耶⸤？","juan":2},{"t":"p","text":"有漏識變略有二種：一、隨因緣勢力故變；二、隨分別勢力故變。初必有用，後但為境。異熟識變但隨因緣，所變色等必有實用，若變心等便無實用，相分心等不能緣故，須彼實用別從此生。變無為等亦無實用，故異熟識不緣心等。至無漏位，勝慧相應，雖無分別，而澄淨故，設無實用，亦現彼影。不爾，諸佛應非遍⸢76⸣知⸤。故有漏位，此異熟識但緣器、身及有漏種。","juan":2},{"t":"p","text":"在欲、色界具三所緣；無色界中緣有漏種，厭離色故，無業果色，有定果色，於理無違。彼識亦緣此色為境。","juan":2},{"t":"p","text":"「不可知」者，謂此行相極微細故，難可了知；或此所緣內執受境亦微細故；外器世間量難測故，名不可知。","juan":2},{"t":"p","text":"云何是識取所緣境，行相難知？如滅定中，不離身識，應信為有，然必應許滅定有識，有情攝故，如有心時。無想等位，當知亦爾。","juan":2},{"t":"p","text":"此識與幾心所相應？","juan":3},{"t":"p","text":"常與觸、作意、受、想、思相應。","juan":3},{"t":"p","text":"阿賴耶識無始時來乃至未轉，於一切位恒與此五心所相應，以是遍行心所攝故。","juan":3},{"t":"p","text":"「觸」謂三和分別變異，令心、心所觸境為性，受、想、思等所依為業。","juan":3},{"t":"p","text":"謂根、境、識更相隨順，故名三和。觸依彼生，令彼和合，故說為彼；三和合位皆有順生心所功能，說名變異；觸似彼起，故名分別。","juan":3},{"t":"p","text":"根變異力，引觸起時，勝彼識、境，故《集論》等但說分別根之變異。","juan":3},{"t":"p","text":"和合一切心及心所，令同觸境，是觸自性。","juan":3},{"t":"p","text":"既似順起心所功能，故以受等所依為業。","juan":3},{"t":"p","text":"《起盡經》說：受、想、行蘊一切皆以觸為緣故，由斯故說識、觸、受等因二、三、四和合而生。","juan":3},{"t":"p","text":"《瑜伽》但說與受、想、思為所依者，思於行蘊為主勝故，舉此攝餘。《集論》等說為受依者，以觸生受近而勝故，謂觸所取可意等相與受所取順益等相，極相隣近，引發勝故。","juan":3},{"t":"p","text":"然觸自性，是實非假，六六法中，心所性故，是食攝故，能為緣故，如受等性，非即三和。","juan":3},{"t":"p","text":"作意謂能警心為性，於所緣境，引心為業；謂此警覺，應起心種，引令趣境，故名作意。雖此亦能引起心所；心是主故，但說引心。","juan":3},{"t":"p","text":"有說：令心迴趣異境，或於一境，持心令住，故名作意。彼俱非理，應非遍行，不異定故。","juan":3},{"t":"p","text":"「受」謂領納順、違、俱非境相為性，起愛為業，能起合、離、非二欲故。","juan":3},{"t":"p","text":"有作是說：受有二種：一、境界受，謂領所緣；二、自性受，謂領俱觸。唯自性受是受自相。以境界受共餘相故。","juan":3},{"t":"p","text":"彼說非理，受定不緣俱生觸故。","juan":3},{"t":"p","text":"若似觸生，名領觸者，似因之果，應皆受性。","juan":3},{"t":"p","text":"又既受因，應名因受，何名自性？","juan":3},{"t":"p","text":"若謂如王食諸國邑，受能領觸所生受體，名自性受。理亦不然，違自所執不自證故。","juan":3},{"t":"p","text":"若不捨自性，名自性受，應一切法皆是受自性。","juan":3},{"t":"p","text":"故彼所說，但誘嬰兒。","juan":3},{"t":"p","text":"然境界受，非共餘相，領順等相，定屬己者，名境界受，不共餘故。","juan":3},{"t":"p","text":"「想」謂於境取像為性，施設種種名言為業，謂要安立境分齊相，方能隨起種種名言。","juan":3},{"t":"p","text":"「思」謂令心造作為性，於善品等役心為業，謂能取境正因等相，驅役自心令造善等。","juan":3},{"t":"p","text":"此五既是遍行所攝，故與藏識決定相應，其遍行相後當廣釋。","juan":3},{"t":"p","text":"此觸等五與異熟識行相雖異，而時、依同，所緣、事等，故名相應。","juan":3},{"t":"p","text":"此識行相極不明了，不能分別違、順境相，微細、一類、相續而轉，是故唯與捨受相應。","juan":3},{"t":"p","text":"又，此相應受唯是異熟，隨先引業轉；不待現緣，⸢77⸣住⸤善、惡業勢力轉故。唯是捨受；苦、樂二受是異熟生，非真異熟，待現緣故，非此相應。","juan":3},{"t":"p","text":"又，由此識常無轉變，有情恒執為自內我；若與苦、樂二受相應，便有轉變，寧執為我，故此但與捨受相應。","juan":3},{"t":"p","text":"若爾，如何此識亦是惡業異熟？既許善業能招捨受，此亦應然。捨受不違苦、樂品故，如無記法，善、惡俱招。","juan":3},{"t":"p","text":"如何此識非別境等心所相應？","juan":3},{"t":"p","text":"互相違故。","juan":3},{"t":"p","text":"謂欲希望所樂事轉；此識任⸢78⸣運⸤，無所希望。勝解印持決定事轉；此識瞢昧，無所印持。念唯明記曾習事轉，此識昧劣，不能明記。定能令心專注一境；此識任運；剎那別緣。慧唯簡擇德等事轉；此識微昧，不能簡擇。故此不與別境相應。","juan":3},{"t":"p","text":"此識唯是異熟性故，善、染污等亦不相應。","juan":3},{"t":"p","text":"惡作等四無記性者，有間斷故，定非異熟。","juan":3},{"t":"p","text":"法有四種：謂善、不善、有覆無記、無覆無記，阿賴耶識何法攝耶？","juan":3},{"t":"p","text":"此識唯是無覆無記，異熟性故。","juan":3},{"t":"p","text":"異熟若是善、染污者，流轉還滅應不得成，又此識是善、染依故，若善、染者，互相違故，應不與二俱作所依；又此識是所熏性故，若善、染者，如極香臭，應不受熏。","juan":3},{"t":"p","text":"無熏習故，染、淨因果俱不成立，故此唯是無覆無記。","juan":3},{"t":"p","text":"「覆」謂染法障聖道故，又能蔽心，令不淨故；此識非染，故名「無覆」。「⸢79⸣記⸤」謂善、惡，有愛、非愛果，及殊勝自體可記別故；此非善、惡，故名「無記」。","juan":3},{"t":"p","text":"「觸等亦如是」者，謂如阿賴耶識，唯是無覆無記性攝，觸、作意、受、想、思亦爾，諸相應法，必同性故。","juan":3},{"t":"p","text":"又，觸等五，如阿賴耶，亦是異熟，所緣、行相俱不可知，緣三種境，五法相應，無覆無記，故說「觸等亦如是」言。","juan":3},{"t":"p","text":"有義：觸等如阿賴耶，亦是異熟及一切種，廣說乃至無覆無記，「亦如是」言，無簡別故。","juan":3},{"t":"p","text":"彼說非理。","juan":3},{"t":"p","text":"所以者何？","juan":3},{"t":"p","text":"觸等依識，不自在故。如貪、信等不能受熏，如何同識，能持種子？","juan":3},{"t":"p","text":"又，若觸等亦能受熏，應一有情有六種體。","juan":3},{"t":"p","text":"若爾，果起從何種生？理不應言從六種起，未見多種生一⸢80⸣芽⸤故。","juan":3},{"t":"p","text":"若說果生唯從一種，則餘五種便為無用；亦不可說次第生果，熏習同時，勢力等故；又不可說六果頓生，勿一有情一剎那頃，六眼識等俱時生故。","juan":3},{"t":"p","text":"誰言觸等亦能受熏持諸種子？不爾，如何觸等如識名一切種？","juan":3},{"t":"p","text":"謂觸等五，有似種相，名一切種，觸等與識所緣等故，無色觸等有所緣故，親所緣緣定應有故，此似種相不為因緣生現識等，如觸等上似眼根等非識所依，亦如似火無能燒用，彼救非理，觸等所緣似種等相，後執受處方應與識而相例故。","juan":3},{"t":"p","text":"由此前說一切種言，定目受熏、能持種義；不爾，本頌有重言失。","juan":3},{"t":"p","text":"又彼所說，「亦如是」言，無簡別故，咸相例者，定不成證，勿觸等五，亦能了別，觸等亦與觸等相應。","juan":3},{"t":"p","text":"由此故知「亦如是」者，隨所應說，非謂一切。","juan":3},{"t":"p","text":"阿賴耶識為斷？為常？","juan":3},{"t":"p","text":"非斷、非常，以「恒轉」故。「恒」謂此識無始時來，一類、相續，常無間斷，是界、趣、生施設本故，性堅、持種令不失故。「轉」謂此識無始時來，念念生滅前後變異，因滅果生，非常、一故，可為轉識熏成種故。","juan":3},{"t":"p","text":"「恒」言遮斷，「轉」表非常，猶如⸢81⸣瀑流⸤，因果法爾。","juan":3},{"t":"p","text":"如瀑流水，非斷、非常，相續長時有所漂溺，此識亦爾，從無始來生滅相續，非常、非斷，漂溺有情令不出離。","juan":3},{"t":"p","text":"又如瀑流，雖風等擊，起諸波浪而流不斷，此識亦爾，雖遇眾緣，起眼識等而恒相續。","juan":3},{"t":"p","text":"又如瀑流，漂水⸢82⸣下上⸤魚、草等物，隨流不捨，此識亦爾，與內習氣外觸等法恒相隨轉。","juan":3},{"t":"p","text":"如是法喻，意顯此識無始因果非斷、常義。謂此識性無始時來，剎那剎那果生因滅。果生故非斷，因滅故非常，非斷、非常是緣起理，故說此識恒轉如流。","juan":3},{"t":"p","text":"過去、未來既非實有，非常可爾；非斷如何？斷豈得成緣起正理？","juan":3},{"t":"p","text":"過去、⸢83⸣未來⸤若是實有，可許非斷；如何非常？常亦不成緣起正理。","juan":3},{"t":"p","text":"豈斥他過，己義便成？","juan":3},{"t":"p","text":"若不摧邪難以顯正。前因滅位後果即生，如⸢84⸣秤⸤兩頭低、昂時等，如是因果相續如流，何假去、來，方成非斷？","juan":3},{"t":"p","text":"因現有位，後果未生，因是誰因？果現有時，前因已滅，果是誰果？既無因果，誰離斷、常？","juan":3},{"t":"p","text":"若有因時，已有後果，果既本有，何待前因？因義既無，果義寧有？無因無果，豈離斷、常？","juan":3},{"t":"p","text":"因果義成，依法作用，故所詰難，非預我宗。","juan":3},{"t":"p","text":"體既本有，用亦應然，所待因緣，亦本有故。","juan":3},{"t":"p","text":"由斯汝義因果定無，應信大乘緣起正理。謂此正理深妙離言，因果等言皆假施設。觀現在法有引後用，假立⸢85⸣當⸤果對說現因；觀現在法有酬前相，假立曾因對說現果。假謂現識似彼相現。","juan":3},{"t":"p","text":"如是因果，理趣顯然，遠離二邊，契會中道，諸有智者應順修學。","juan":3},{"t":"p","text":"有餘部說：雖無去、來而有因果恒相續義。","juan":3},{"t":"p","text":"謂現在法極迅速者，猶有初、後，生、滅二時，生時酬因，滅時引果，時雖有二，而體是一，前因正滅，後果正生，體相雖殊，而俱是有。","juan":3},{"t":"p","text":"如是因果非假施設，然離斷、常，又無前難，誰有智者捨此信餘？","juan":3},{"t":"p","text":"彼有虛言，都無實義，何容一念而有二時？生、滅相違，寧同現在？滅若現在，生應未來。有故名生，既是現在，無故名滅，寧非過去？滅若非無，生應非有；生既現有，滅應現無，又二相違，如何體一？非苦、樂等見有是事，生、滅若一，時應無二；生、滅若異，寧說體同？故生、滅時俱現在有，同依一體，理必不成。","juan":3},{"t":"p","text":"經部師等因果相續，理亦不成，彼不許有阿賴耶識能持種故。","juan":3},{"t":"p","text":"由此應信大乘所說因果相續緣起正理。","juan":3},{"t":"p","text":"此識無始恒轉如流，乃至何位當究竟捨？","juan":3},{"t":"p","text":"阿羅漢位方究竟捨。","juan":3},{"t":"p","text":"謂諸聖者斷煩惱障究竟盡時，名阿羅漢。爾時，此識煩惱麁重永遠離故，說之為「捨」。","juan":3},{"t":"p","text":"此中所說阿羅漢者，通攝三乘無學果位，皆已永害煩惱賊故；應受世間妙供養故；永不復受分段生故。","juan":3},{"t":"p","text":"云何知然？","juan":3},{"t":"p","text":"〈決擇分〉說：諸阿羅漢、獨覺、如來皆不成就阿賴耶故；《集論》復說：若諸菩薩得菩提時，頓斷煩惱及所知障，成阿羅漢及如來故。","juan":3},{"t":"p","text":"若爾，菩薩煩惱種子未永斷盡非阿羅漢，應皆成就阿賴耶識，何故即彼〈決擇分〉說不退菩薩亦不成就阿賴耶識？","juan":3},{"t":"p","text":"彼說二乘無學果位迴心趣向大菩提者，必不退起煩惱障故，趣菩提故，即復轉名不退菩薩，彼不成就阿賴耶識。","juan":3},{"t":"p","text":"即攝在此阿羅漢中，故彼論文不違此義。","juan":3},{"t":"p","text":"又不動地⸢86⸣已⸤上菩薩，一切煩惱永不行故，法⸢87⸣駛⸤流中任運轉故；能諸行中起諸行故；剎那剎那轉增進故，此位方名不退菩薩。","juan":3},{"t":"p","text":"然此菩薩雖未斷盡異熟識中煩惱種子，而緣此識我見、愛等，不復執藏為自內我，由斯永捨阿賴耶名，故說不成阿賴耶識，此亦說彼名阿羅漢。","juan":3},{"t":"p","text":"有義：初地⸢88⸣已⸤上菩薩，已證二空所顯理故；已得二種殊勝智故；已斷分別二重障故；能一行中起諸行故；雖為利益起諸煩惱，而彼不作煩惱過失故，此亦名不退菩薩。","juan":3},{"t":"p","text":"然此菩薩雖未斷盡俱生煩惱，而緣此識所有分別我見、愛等，不復執藏為自內我，由斯亦捨阿賴耶名，故說不成阿賴耶識，此亦說彼名阿羅漢。","juan":3},{"t":"p","text":"故《集論》中作如是說：十地菩薩雖未永斷一切煩惱，然此煩惱猶如呪、藥所伏諸毒，不起一切煩惱過失。一切地中，如阿羅漢已斷煩惱，故亦說彼名阿羅漢。","juan":3},{"t":"p","text":"彼說非理。七地已前猶有俱生我見、愛等，執藏此識為自內我，如何已捨阿賴耶名？","juan":3},{"t":"p","text":"若彼分別我見、愛等，不復執藏，說名為捨，則預流等諸有學位，亦應已捨阿賴耶名，許便違害諸論所說。","juan":3},{"t":"p","text":"地上菩薩所起煩惱皆由正知，不為過失，非預流等得有斯事，寧可以彼例此菩薩？","juan":3},{"t":"p","text":"彼六識中所起煩惱，雖由正知不為過失，而第七識有漏心位，任運現行執藏此識，寧不與彼預流等同？由此故知彼說非理。","juan":3},{"t":"p","text":"然阿羅漢斷此識中煩惱麁重究竟盡故，不復執藏阿賴耶識為自內我。由斯永失阿賴耶名，說之為捨，非捨一切第八識體。勿阿羅漢無識持種，爾時便入無餘涅槃。","juan":3},{"t":"p","text":"然第八識雖諸有情皆悉成就，而隨義別立種種名。","juan":3},{"t":"p","text":"謂或名心，由種種法熏習種子所積集故；或名阿陀那，執持種子及諸色根令不壞故；或名所知依，能與染、淨所知諸法為依止故；或名種子識，能遍任持世、出世間諸種子故。","juan":3},{"t":"p","text":"此等諸名通一切位。","juan":3},{"t":"p","text":"或名阿賴耶，攝藏一切雜染品法令不失故，我見、愛等執藏以為自內我故。此名唯在異生、有學，非無學位、不退菩薩，有雜染法執藏義故。","juan":3},{"t":"p","text":"或名異熟識，能引生死善、不善業異熟果故。此名唯在異生、二乘諸菩薩位，非如來地猶有異熟無記法故。","juan":3},{"t":"p","text":"或名無垢識，最極清淨諸無漏法所依止故。此名唯在如來地有，菩薩、二乘及異生位，持有漏種可受熏習，未得善淨第八識故。如契經說：","juan":3},{"t":"v","num":null,"lines":["如來無垢識，是淨無漏界，","解脫一切障，圓鏡智相應。"],"juan":3},{"t":"p","text":"阿賴耶名過失重故，最初捨故，此中偏說。異熟識體菩薩將得菩提時捨，聲聞、獨覺入無餘依涅槃時捨。無垢識體無有捨時，利樂有情無盡時故。心等通故，隨義應說。","juan":3},{"t":"p","text":"然第八識總有二位：一、有漏位，無記性攝。","juan":3},{"t":"p","text":"唯與觸等五法相應，但緣前說執受、處境。","juan":3},{"t":"p","text":"二、無漏位，唯善性攝。","juan":3},{"t":"p","text":"與二十一心所相應，謂遍行、別境各五，善十一，與一切心恒相應故。常樂證⸢89⸣智⸤所觀境故；於所觀境恒印持故；於曾受境恒明記故；世尊無有不定心故；於一切法常決擇故。極淨信等常相應故，無染污故。無散動故。","juan":3},{"t":"p","text":"此亦唯與捨受相應，任運恒時平等轉故。","juan":3},{"t":"p","text":"以一切法為所緣境，鏡智遍緣一切法故。","juan":3},{"t":"p","text":"云何應知此第八識離眼等識有別自體？","juan":3},{"t":"p","text":"聖教、正理為定量故。","juan":3},{"t":"p","text":"謂⸢90⸣有⸤《大乘阿毘達磨》契經中說：","juan":3},{"t":"v","num":null,"lines":["「無始時來界，一切法等依，","由此有諸趣，及涅槃證得。」"],"juan":3},{"t":"p","text":"此第八識自性微細，故以作用而顯示之。","juan":3},{"t":"p","text":"頌中初半，顯第八識為因緣用，後半顯與流轉還滅，作依持用。","juan":3},{"t":"p","text":"「界」是因義，即種子識，無始時來展轉相續，親生諸法，故名為因。","juan":3},{"t":"p","text":"「依」是緣義，即執持識無始時來，與一切法等為依止，故名為緣。","juan":3},{"t":"p","text":"謂能執持諸種子故，與現行法為所依故，即變為彼及為彼依。","juan":3},{"t":"p","text":"變為彼者，謂變為器及有根身；「為彼依」者，謂與轉識作所依止。以能執受五色根故，眼等五識依之而轉，又與末那為依止故，第六意識依之而轉。末那、意識轉識攝故。如眼等識依俱有根，第八理應是識性故，亦以第七為俱有依。","juan":3},{"t":"p","text":"是謂此識為因、緣用。","juan":3},{"t":"p","text":"「由此有」者，由有此識；「有諸趣」者，有善、惡趣。","juan":3},{"t":"p","text":"謂由有此第八識故，執持一切順流轉法，令諸有情流轉生死。","juan":3},{"t":"p","text":"雖惑、業、生皆是流轉，而趣是果，勝故偏說；或「諸趣」言通能、所趣，諸趣資具亦得趣名。","juan":3},{"t":"p","text":"諸惑、業、生皆依此識，是與流轉作依持用。","juan":3},{"t":"p","text":"「及涅槃證得」者，由有此識故，有涅槃證得。","juan":3},{"t":"p","text":"謂由有此第八識故，執持一切順還滅法，令修行者證得涅槃。","juan":3},{"t":"p","text":"此中但說能證得道，涅槃不依此識有故。","juan":3},{"t":"p","text":"或此但說所證涅槃，是修行者正所求故。","juan":3},{"t":"p","text":"或此雙說涅槃與道俱是還滅品類攝故。謂「涅槃」言顯所證滅，後「證得」言顯能得道，由能斷道，斷所斷惑，究竟盡位，證得涅槃。","juan":3},{"t":"p","text":"能、所斷、證皆依此識，是與還滅作依持用。","juan":3},{"t":"p","text":"又此頌中初句，顯示此識自性無始恒有，後三顯與雜染、清淨二法，總、別為所依止。","juan":3},{"t":"p","text":"雜染法者，謂苦、集諦，即所能趣生及業、惑；清淨法者，謂滅、道諦，即所、能證涅槃及道；彼二皆依此識而有，依轉識等，理不成故。","juan":3},{"t":"p","text":"或復初句顯此識體無始相續，後三顯與三種⸢91⸣自⸤性為所依止：","juan":3},{"t":"p","text":"謂依他起、遍計所執、圓成實性，如次應知。","juan":3},{"t":"p","text":"今此頌中諸所說義，離第八識皆不得有。","juan":3},{"t":"p","text":"即彼經中復作是說：","juan":3},{"t":"v","num":null,"lines":["「由攝藏諸法，一切種子識，","故名阿賴耶，勝者我開示。」"],"juan":3},{"t":"p","text":"由此本識具諸種子，故能攝藏諸雜染法。","juan":3},{"t":"p","text":"依斯建立阿賴耶名，非如勝性轉為大等，種子與果體非一故；能依、所依俱生滅故；與雜染法互相攝藏，亦為有情執藏為我，故說此識名「阿賴耶」。","juan":3},{"t":"p","text":"已入見道諸菩薩眾得真現觀，名為「勝者」，彼能證解阿賴耶識，故我世尊正為開示；或諸菩薩皆名「勝者」，雖見道前未能證解阿賴耶識，而能信解，求彼轉依，故亦為說。","juan":3},{"t":"p","text":"非諸轉識有如是義。","juan":3},{"t":"p","text":"《解深密經》亦作是說：","juan":3},{"t":"v","num":null,"lines":["「阿陀那識甚深細，一切種子如瀑流，","我於凡愚不開演，恐彼分別執為我。」"],"juan":3},{"t":"p","text":"以能執持諸法種子，及能執受色根依處，亦能執取結生相續，故說此識名「阿陀那」。無⸢92⸣性⸤有情不能窮底，故說「甚深」；趣寂種性不能通達，故名「甚細」。","juan":3},{"t":"p","text":"是一切法真實種子，緣擊便生轉識波浪，恒無間斷，猶如瀑流。","juan":3},{"t":"p","text":"「凡」即無⸢93⸣性⸤，「愚」即趣寂。恐彼於此起分別執，墮諸惡趣，障生聖道，故我世尊不為開演。","juan":3},{"t":"p","text":"唯第八識有如是相。","juan":3},{"t":"p","text":"《入楞伽經》亦作是說：","juan":3},{"t":"v","num":null,"lines":["「如海遇風緣，起種種波浪，","現前作用轉，無有間斷時。","藏識海亦然，境等風所擊，","恒起諸識浪，現前作用轉。」"],"juan":3},{"t":"p","text":"眼等諸識，無如大海恒相續轉起諸識浪，故知別有第八識性。","juan":3},{"t":"p","text":"此等無量大乘經中，皆別說有此第八識。","juan":3},{"t":"p","text":"諸大乘經：皆順無我，違數取趣；棄背流轉，趣向還滅；讚佛、法、僧，毀諸外道；表蘊等法，遮勝性等；樂大乘者，許能顯示無顛倒理，契經攝故，如《增壹》等至教量攝。","juan":3},{"t":"p","text":"又，聖慈氏以七種因，證大乘經真是佛說。","juan":3},{"t":"p","text":"一、先不記故。若大乘經佛滅度後，有餘為壞正法故說，何故世尊非如當起諸可怖事，先預記別？","juan":3},{"t":"p","text":"二、本俱行故。大小乘教本來俱行，寧知大乘獨非佛說？","juan":3},{"t":"p","text":"三、非餘境故。大乘所說廣大甚深，非外道等思量境界。彼經論中曾所未說，設為彼說，亦不信受，故大乘經非非佛說。","juan":3},{"t":"p","text":"四、應極成故。若謂大乘是餘佛說，非今佛語，則大乘教是佛所說，其理極成。","juan":3},{"t":"p","text":"五、有、無有故。若有大乘，即應信此諸大乘教是佛所說，離此大乘不可得故。","juan":3},{"t":"p","text":"若無大乘，聲聞乘⸢94⸣教亦⸤應非有，以離大乘決定無有得成佛義，誰出於世說聲聞乘？故聲聞乘是佛所說，非大乘教不應正理。","juan":3},{"t":"p","text":"六、能對治故。依大乘經勤修行者，皆能引得無分別智，能正對治一切煩惱，故應信此是佛所說。","juan":3},{"t":"p","text":"七、義異文故。大乘所說意趣甚深，不可隨文而取其義，便生誹謗謂非佛語。","juan":3},{"t":"p","text":"是故大乘真是佛說。","juan":3},{"t":"p","text":"如《莊嚴論》頌此義言：","juan":3},{"t":"v","num":null,"lines":["「先不記、俱行、非餘所行境、","極成、有無有、對治、異文故。」"],"juan":3},{"t":"p","text":"餘部經中亦密意說阿賴耶識有⸢95⸣別⸤自性。","juan":3},{"t":"p","text":"謂大眾部阿笈摩中，密意說此名根本識，是眼識等所依止故。譬如樹根是莖等本，非眼等識有如是義。","juan":3},{"t":"p","text":"上坐部經分別論者，俱密⸢96⸣意⸤說此名有分識，「有」謂三有；「分」是因義，唯此恒、遍，為三有因。","juan":3},{"t":"p","text":"化地部說此名窮生死蘊，離第八識無別蘊法，窮生死際無間斷時。謂無色界諸色間斷，無想天等餘心等滅，不相應行離色、心等無別自體，已極成故，唯此識名窮生死蘊。","juan":3},{"t":"p","text":"說一切有部《增壹》經中，亦密意說此名阿賴耶，謂愛阿賴耶、樂阿賴耶、欣阿賴耶、憙阿賴耶。","juan":3},{"t":"p","text":"謂阿賴耶識是貪總、別三世境故，立此四名。有情執為真自內我，乃至未斷恒生愛著，故阿賴耶識是真愛著處。","juan":3},{"t":"p","text":"不應執餘五取蘊等，謂生一向苦受處者，於餘⸢97⸣五⸤取蘊不生愛著，彼恒厭逆餘五取蘊，念我何時當捨此命、此眾同分、此苦身心，令我自在受快樂故。","juan":3},{"t":"p","text":"五欲亦非真愛著處，謂離欲者於五妙欲，雖不貪著而愛我故。","juan":3},{"t":"p","text":"樂受亦非真愛著處，謂離第三靜慮染者，雖厭樂受而愛我故。","juan":3},{"t":"p","text":"身見亦非真愛著處，謂非無學信無我者，雖於身見不生貪著，而於內我猶生愛故。","juan":3},{"t":"p","text":"轉識等亦非真愛著處，謂非無學求滅心者，雖厭轉識等而愛我故。","juan":3},{"t":"p","text":"色身亦非真愛著處，離色染者，雖厭色身而愛我故。","juan":3},{"t":"p","text":"不相應行離色、心等無別自體，是故亦非真愛著處。","juan":3},{"t":"p","text":"異生、有學起我愛時，雖於餘蘊有愛、非愛，而於此識，我愛定生，故唯此是真愛著處。","juan":3},{"t":"p","text":"由是彼說阿賴耶名，定唯顯此阿賴耶識。","juan":3},{"t":"p","text":"已引聖教，當顯正理。","juan":3},{"t":"p","text":"謂契經說：雜染、清淨諸法種子之所集起，故名為心，若無此識，彼持種心不應有故。","juan":3},{"t":"p","text":"謂諸轉識在滅定等有間斷故，根、境、作意、善等類別易脫起故，如電光等不堅住故，非可熏習，不能持種，非染、淨種所集起心。","juan":3},{"t":"p","text":"此識一類、恒無間斷，如苣⸢98⸣蕂⸤等堅住可熏，契當彼經所說心義。","juan":3},{"t":"p","text":"若不許有能持種心，非但違經，亦違正理。","juan":3},{"t":"p","text":"謂諸所起染、淨品法，無所熏故，不熏成種，則應所起唐捐其功。染、淨起時既無因種，應同外道執自然生。","juan":3},{"t":"p","text":"色、不相應，非心性故，如聲、光等，理非染、淨內法所熏，豈能持種？又彼離識無實自性，寧可執為內種依止？","juan":3},{"t":"p","text":"轉識相應諸心所法，如識間斷，易脫起故，不自在故，非心性故，不能持種，亦不受熏。","juan":3},{"t":"p","text":"故持種心，理應別有。","juan":3},{"t":"p","text":"有說：六識無始時來，依根、境等前後分位，事雖轉變而類無別，是所熏習，能持種子。由斯染、淨因果皆成，何要執有第八識性？","juan":3},{"t":"p","text":"彼言無義！","juan":3},{"t":"p","text":"所以者何？","juan":3},{"t":"p","text":"執類是實，則同外道；許類是假，便無勝用，應不能持內法實種。","juan":3},{"t":"p","text":"又執識類何性所攝？若是善、惡，應不受熏，許有記故，猶如擇滅；若是無記，善、惡心時，無無記心，此類應斷，非事善、惡類可無記；別類必同別事性故。","juan":3},{"t":"p","text":"又無心位此類定無，既有間斷，性非堅住，如何可執持種、受熏？","juan":3},{"t":"p","text":"又阿羅漢或異生心，識類同故，應為諸染，無漏法熏，許便有失。又眼等根或所餘法，與眼等識根、法類同，應互相熏，然汝不許。","juan":3},{"t":"p","text":"故不應執識類受熏。","juan":3},{"t":"p","text":"又六識身，若事、若類，前後二念既不俱有；如隔念者，非互相熏。能熏、所熏必俱時故。","juan":3},{"t":"p","text":"執唯六識俱時轉者，由前理趣，既非所熏，故彼亦無能持種義。","juan":3},{"t":"p","text":"有執色、心自類無間，前為後種，因果義立，故先所說，為證不成。","juan":3},{"t":"p","text":"彼執非理，無熏習故。謂彼自類既無熏習，如何可執前為後種？","juan":3},{"t":"p","text":"又間斷者，應不更生，二乘無學應無後蘊，死位色、心為後種故。","juan":3},{"t":"p","text":"亦不應執色、心展轉互為種生，轉識、色等非所熏習，前已說故。","juan":3},{"t":"p","text":"有說：三世諸法皆有，因果感赴，無不皆成，何勞執有能持種識？然經說心為種子者，起染、淨法，勢用強故。","juan":3},{"t":"p","text":"彼說非理。過去、未來，非常、非現，如空花等，非實有故。","juan":3},{"t":"p","text":"又無作用，不可執為因緣性故。若無能持染、淨種識，一切因果皆不得成。","juan":3},{"t":"p","text":"有執大乘遣相空理為究竟者，依似比量，撥無此識及一切法，彼特違害前所引經。","juan":3},{"t":"p","text":"⸢99⸣智⸤、斷、證、修、染、淨因果皆執非實，成大邪見。","juan":3},{"t":"p","text":"外道毀謗染、淨因果亦不謂全無，但執非實故。","juan":3},{"t":"p","text":"若一切法皆非實有，菩薩不應為捨生死，精勤修集菩提資糧。誰有智者為除幻敵，求石女兒用為軍旅？","juan":3},{"t":"p","text":"故應信有能持種心，依之建立染、淨因果。","juan":3},{"t":"p","text":"彼心即是此第八識。","juan":3},{"t":"p","text":"又契經說有異熟心，善、惡業感，若無此識，彼異熟心不應有故。","juan":3},{"t":"p","text":"謂眼等識有間斷故，非一切時是業果故，如電、光等，非異熟心。異熟不應斷已更續，彼命根等，無斯事故。","juan":3},{"t":"p","text":"眼等六識，業所感者，猶如聲等，非恒續故，是異熟生，非真異熟。","juan":3},{"t":"p","text":"定應許有真異熟心，酬牽引業，遍而無斷，變為身、器作有情依，身、器離心，理非有故。不相應法無實體故，諸轉識等非恒有故，若無此心，誰變身、器？復依何法恒立有情？","juan":3},{"t":"p","text":"又在定中，或不在定，有別思慮、無思慮時，理有眾多身受生起。此若無者，不應後時身有怡適，或復勞損，若不恒有真異熟心，彼位如何有此身受？","juan":3},{"t":"p","text":"非佛起餘善心等位，必應現起真異熟心，如許起彼時，非佛有情故。","juan":3},{"t":"p","text":"由是恒有真異熟心，彼心即是此第八識。","juan":3},{"t":"p","text":"又契經說：有情流轉五趣、四生。若無此識，彼趣、生體不應有故。","juan":3},{"t":"p","text":"謂要實有、恒、遍、無雜，彼法可立正實趣、生。","juan":3},{"t":"p","text":"非異熟法趣、生雜亂，住此起餘趣、生法故。","juan":3},{"t":"p","text":"諸異熟色及五識中業所感者不遍趣、生，無色界中全無彼故。","juan":3},{"t":"p","text":"諸生得善及意識中業所感者，雖遍趣、生，起無雜亂而不恒有。","juan":3},{"t":"p","text":"不相應行無實自體，皆不可立正實趣、生。","juan":3},{"t":"p","text":"唯異熟心及彼心所，實恒、遍、無雜，是正實趣、生。","juan":3},{"t":"p","text":"此心若無，生無色界起善等位應非趣、生。設許趣、生攝諸有漏，生無色界起無漏心應非趣、生，便違正理。勿有前過及有此失，故唯異熟法是正實趣、生。","juan":3},{"t":"p","text":"由是如來非趣、生攝，佛無異熟無記法故，亦非界攝，非有漏故，世尊已捨苦、集諦故，諸戲論種已永斷故。","juan":3},{"t":"p","text":"正實趣、生既唯異熟心及心所，彼心、心所離第八識理不得成，故知別有此第八識。","juan":3},{"t":"p","text":"又契經說：有色根身是有執受，若無此識，彼能執受，不應有故。","juan":3},{"t":"p","text":"謂五色根及彼依處，唯現在世是有執受，彼定由有能執受心，唯異熟心，先業所引，非善、染等，一類、能遍、相續執受有色根身；眼等轉識無如是義。","juan":3},{"t":"p","text":"此言意顯眼等轉識，皆無一類、能遍、相續執受自內有色根身，非顯能執受唯異熟心，勿諸佛色身無執受故；然能執受有漏色身唯異熟心，故作是說。","juan":3},{"t":"p","text":"謂諸轉識現緣起故，如聲、風等，彼善、染等，非業引故，如非擇滅。異熟生者，非異熟故、非遍依故、不相續故，如電、光等，不能執受有漏色身。","juan":3},{"t":"p","text":"諸心識言，亦攝心所，定相應故，如唯識言。","juan":3},{"t":"p","text":"非諸色根、不相應行可能執受有色根身，無所緣故，如虛空等。","juan":3},{"t":"p","text":"故應別有能執受心，彼心即是此第八識。","juan":3},{"t":"p","text":"又契經說：壽、煖、識三，更互依持，得相續住。若無此識能持壽、煖，令久住識不應有故。","juan":3},{"t":"p","text":"謂諸轉識有間、有轉，如聲、風等，無恒持用，不可立為持壽、煖識。","juan":3},{"t":"p","text":"唯異熟識無間、無轉，猶如壽、煖，有恒持用，故可立為持壽、煖識。","juan":3},{"t":"p","text":"經說三法更互依持，而壽與煖一類相續，唯識不然，豈符正理？","juan":3},{"t":"p","text":"雖說三法更互依持，而許唯煖不遍三界，何不許識獨有間、轉？","juan":3},{"t":"p","text":"此於前理，非為過難。謂若是處具有三法無間轉者，可恒相持。不爾，便無恒相持用。前以此理，顯三法中所說識言，非詮轉識，舉⸢100⸣煖⸤不遍，豈壞前理？故前所說，其理極成。","juan":3},{"t":"p","text":"又三法中，壽、煖二種既唯有漏，故知彼識如壽與煖，定非無漏；生無色界起無漏心，爾時，何識能持彼壽？","juan":3},{"t":"p","text":"由此故知有異熟識，一類、恒、遍、能持壽、煖，彼識即是此第八識。","juan":3},{"t":"p","text":"又契經說：諸有情類，受生、命終，必住散心，非無心定。若無此識，生、死時心不應有故。","juan":3},{"t":"p","text":"謂生死時，身心惽昧，如睡無夢、極悶絕時，明了轉識必不現起。","juan":3},{"t":"p","text":"又此位中，六種轉識行相、所緣不可知故，如無心位，必不現行。","juan":3},{"t":"p","text":"六種轉識行相、所緣有必可知，如餘時故。","juan":3},{"t":"p","text":"真異熟識極微細故，行相、所緣俱不可了，是引業果，一期相續，恒無轉變；是散、有心，名生死心，不違正理。","juan":3},{"t":"p","text":"有說：五識此位定無，意識取境，或因五識、或因他教、或定為因，生位，諸因既不可得；故受生位，意識亦無。","juan":3},{"t":"p","text":"若爾，有情生無色界，後時意識應永不生，定心必由散意識引，五識、他教彼界必無，引定散心無由起故。","juan":3},{"t":"p","text":"若謂彼定由串習力，後時率爾能現在前。","juan":3},{"t":"p","text":"彼初生時，寧不現起？又欲、色界初受生時，串習意識亦應現起。","juan":3},{"t":"p","text":"若由惛昧，初未現前。","juan":3},{"t":"p","text":"此即前因，何勞別說？","juan":3},{"t":"p","text":"有餘部執：生、死等位，別有一類微細意識，行相、所緣俱不可了。應知即是此第八識，極成意識不如是故。","juan":3},{"t":"p","text":"又將死時，由善、惡業，下、上身分，冷觸漸起，若無此識，彼事不成。轉識不能執受身故。","juan":3},{"t":"p","text":"眼等五識，各別依故；或不行故。第六意識，不住身故，境不定故，遍寄身中恒相續故，不應冷觸由彼漸生。","juan":3},{"t":"p","text":"唯異熟心，由先業力，恒、遍、相續執受身分。捨執受處，冷觸便生，壽、煖識三不相離故。","juan":3},{"t":"p","text":"冷觸起處即是非情，雖變、亦緣，而不執受。故知定有此第八識。","juan":3},{"t":"p","text":"又契經說：識緣名色，名色緣識，如是二法展轉相依，譬如蘆束，俱時而轉，若無此識，彼識自體，不應有故。","juan":3},{"t":"p","text":"謂彼經中自作是釋：名謂非色四蘊，色謂羯邏藍等。此二與識相依而住，如二蘆束，更互為緣，恒俱時轉，不相捨離。","juan":3},{"t":"p","text":"眼等轉識，攝在名中，此識若無，說誰為識？","juan":3},{"t":"p","text":"亦不可說名中識蘊謂五識身，識謂第六，羯邏藍時無五識故。","juan":3},{"t":"p","text":"又諸轉識有間、轉故，無力恒時執持名色，寧說恒與名色為緣？","juan":3},{"t":"p","text":"故彼識言，顯第八識。","juan":3},{"t":"p","text":"又契經說：一切有情皆依食住，若無此識，彼識食體不應有故。","juan":4},{"t":"p","text":"謂契經說食有四種：","juan":4},{"t":"p","text":"一者、段食，變壞為相。謂欲界繫香、味、觸三，於變壞時能為食事。由此色處非段食攝，以變壞時，色無用故。","juan":4},{"t":"p","text":"二者、觸食，觸境為相，謂有漏觸纔取境時，攝受喜等，能為食事。此觸雖與諸識相應，屬六識者食義偏勝，觸麁顯境，攝受喜、樂及順益捨，資養勝故。","juan":4},{"t":"p","text":"三、意思食，希望為相。謂有漏思與欲俱轉，希可愛境，能為食事。此思雖與諸識相應，屬意識者食義偏勝，意識於境，希望勝故。","juan":4},{"t":"p","text":"四者、識食，執持為相。謂有漏識由段、觸、思勢力增長，能為食事。此識雖通諸識自體，而第八識食義偏勝，一類相續執持勝故。","juan":4},{"t":"p","text":"由是《集論》說此四食，三蘊、五處、十一界攝。","juan":4},{"t":"p","text":"此四能持有情身命，令不壞斷，故名為食。","juan":4},{"t":"p","text":"段食唯於欲界有用，觸、意思食雖遍三界而依識轉，隨識有無。","juan":4},{"t":"p","text":"眼等轉識有間、有轉，非遍、恒時能持身命，謂無心定、⸢101⸣睡⸤眠、悶絕、無想天中有間斷故，設有心位，隨所依、緣、性、界、地等有轉易故，於持身命，非遍、非恒。","juan":4},{"t":"p","text":"諸有執無第八識者，依何等食？《經》作是言：「一切有情皆依食住。」","juan":4},{"t":"p","text":"非無心位過去、未來識等為食；彼非現、常；如空花等，無體用故。設有體用非現在攝，如虛空等，非食性故，亦不可說入定心等與無心位有情為食，住無心時彼已滅故，過去非食已極成故。","juan":4},{"t":"p","text":"又不可說無想定等不相應行即為彼食，段等四食所不攝故，不相應法非實有故。","juan":4},{"t":"p","text":"有執滅定等猶有第六識，於彼有情能為食事。彼執非理，後當廣破。","juan":4},{"t":"p","text":"又彼應說生上二界無漏心時，以何為食？無漏識等破壞有故，於彼身、命不可為食。亦不可執無漏識中有有漏種能為彼食，無漏識等猶如涅槃，不能執持有漏種故。","juan":4},{"t":"p","text":"復不可說上界有情身、命相持即互為食，四食不攝彼身、命故，又無色無身，命無能持故，眾同分等無實體故。","juan":4},{"t":"p","text":"由此定知異諸轉識，有異熟識一類恒、遍執持身、命，令不壞斷。世尊依此，故作是言：一切有情皆依食住。","juan":4},{"t":"p","text":"唯依「取蘊」建立有情，佛無有漏，非有情攝，說為有情依食住者，當知皆依示現而說。","juan":4},{"t":"p","text":"既異熟識是勝食性，彼識即是此第八識。","juan":4},{"t":"p","text":"又契經說：住滅定者，身、語、心行無不皆滅，而壽不滅，亦不離煖，根無變壞，識不離身。若無此識住滅定者，不離身識不應有故。","juan":4},{"t":"p","text":"謂眼等識行相麁、動，於所緣境起必勞慮，厭患彼故，暫求止息，漸次伏除至都盡位，依此位立住滅定者，故此定中彼識皆滅，若不許有微細一類恒、遍執持壽等識在，依何而說識不離身？","juan":4},{"t":"p","text":"若謂後時彼識還起，如隔日瘧名不離身，是則不應說心行滅，識與想等起滅同故。壽、煖諸根應亦如識，便成大過，故應許識如壽、煖等實不離身。又此位中若全無識，應如瓦礫非有情數，豈得說為住滅定者？又異熟識此位若無，誰能執持諸根、壽、煖？無執持故皆應壞滅，猶如死屍便無壽等。既爾，後識必不還生，說不離身，彼何所屬？諸異熟識捨此身已，離⸢102⸣識⸤餘身無重生故。","juan":4},{"t":"p","text":"又若此位無持種識，後識無種，如何得生？過去、未來不相應法非實有體已極成故。諸色等法離識皆無受熏、⸢103⸣持⸤種亦已遮故。然滅定等無心位中，如有心位定實有識，具根、壽、煖，有情攝故。","juan":4},{"t":"p","text":"由斯理趣，住滅定者，決定有識，實不離身。","juan":4},{"t":"p","text":"若謂此位有第六識，名不離身，亦不應理，此定亦名無心定故。","juan":4},{"t":"p","text":"若無五識名無心者，應一切定皆名無心，諸定皆無五識身故。意識攝在六轉識中，如五識身，滅定非有。或此位識行相、所緣不可知故，如壽、煖等，非第六識。若此位有行相、所緣可知識者，應如餘位，非此位攝。","juan":4},{"t":"p","text":"本為止息行相、所緣可了知識，入此定故。","juan":4},{"t":"p","text":"又若此位有第六識，彼心所法為有？為無？","juan":4},{"t":"p","text":"若有心所，經不應言住此定者心行皆滅，又不應名滅受想定。","juan":4},{"t":"p","text":"此定加行，但厭受、想，故此定中唯受、想滅；受、想二法資助心強，諸心所中獨名心行，說心行滅，何所相違？","juan":4},{"t":"p","text":"無想定中應唯想滅，但厭想故，然汝不許，既唯受、想資助心強，此二滅時，心亦應滅。","juan":4},{"t":"p","text":"如身行滅而身猶在，寧要責心令同行滅？","juan":4},{"t":"p","text":"若爾，語行尋、伺滅時，語應不滅，而非所許。然行於法有遍、非遍，遍行滅時，法定隨滅；非遍行滅，法或猶在。非遍行者謂入出息，見息滅時，身猶在故；尋、伺於語是遍行攝，彼若滅時，語定無故。受、想於心亦遍行攝，許如思等大地法故。受、想滅時，心定隨滅，如何可說彼滅心在？又許思等是大地法，滅受、想時，彼亦應滅。既爾，信等此位亦無，非遍行滅餘可在故，如何可言有餘心所？既許思等此位非無，受、想應然，大地法故。又此定中若有思等亦應有觸，餘心所法無不皆依觸力生故。若許有觸亦應有受，觸緣受故。既許有受，想亦應生，不⸢104⸣相⸤離故。","juan":4},{"t":"p","text":"如受緣愛，非一切受皆能起愛，故觸緣受，非一切觸皆能生受，由斯所難，其理不成。","juan":4},{"t":"p","text":"彼救不然，有差別故。謂佛自簡唯無明觸所生諸受為緣生愛，曾無有處簡觸生受。故若有觸，必有受生，受與想俱，其理決定。或應如餘位，受、想亦不滅，執此位中有思等故，許便違害心行滅言，亦不得成滅受想定。","juan":4},{"t":"p","text":"若無心所，識亦應無，不見餘心離心所故，餘遍行滅，法隨滅故，受等應非大地法故，此識應非相應法故。許則應無所依、緣等，如色等法亦非心故。又契經說：意、法為緣，生於意識，三和合觸，與觸俱起，有受、想、思。若此定中有意識者，三和合故，必應有觸，觸既定與受、想、思俱，如何有識而無心所？","juan":4},{"t":"p","text":"若謂餘時，三⸢105⸣和⸤有力，成觸、生觸，能起受等。由此定前厭患心所，故在定位三事無能，不成生觸，亦無受等。","juan":4},{"t":"p","text":"若爾，應名滅心所定，如何但說滅受、想耶？","juan":4},{"t":"p","text":"若謂厭時唯厭受、想，此二滅故，心所皆滅，依前所厭，以立定名。","juan":4},{"t":"p","text":"既爾，此中心亦應滅，所厭俱故，如餘心所。不爾，如何名無心定？","juan":4},{"t":"p","text":"又此定位意識是何？","juan":4},{"t":"p","text":"不應是染或無記性，諸善定中無此事故；餘染、無記心必有心所故，不應厭善起染等故。非求寂靜翻起散故。","juan":4},{"t":"p","text":"若謂是善，相應善故，應無貪等善根相應。此心不應是自性善或勝義善，違自宗故，非善根等及涅槃故。若謂此心是等起善，加行善根所引發故，理亦不然，違自宗故，如餘善心非等起故。善心無間起三性心，如何善心由前等起？故心是善，由相應力。既爾，必與善根相應，寧說此心獨無心所？故無心所，心亦應無。","juan":4},{"t":"p","text":"如是推徵，眼等轉識於滅定位非不離身，故契經言不離身者，彼識即是此第八識，入滅定時不為止息，此極寂靜執持識故。","juan":4},{"t":"p","text":"無想等位，類此應知。","juan":4},{"t":"p","text":"又契經說：心雜染故，有情雜染；心清淨故，有情清淨。若無此識，彼染、淨心不應有故。","juan":4},{"t":"p","text":"謂染、淨法以心為本，因心而生，依心住故，心受彼熏，持彼種故。","juan":4},{"t":"p","text":"然雜染法略有三種：煩惱、業、果，種類別故。","juan":4},{"t":"p","text":"若無此識持煩惱種，界、地往還，無染心後，諸煩惱起，皆應無因，餘法不能持彼種故，過去、未來非實有故。若諸煩惱無因而生，則無三乘學、無學果，諸已斷者皆應起故。","juan":4},{"t":"p","text":"若無此識持業、果種，界、地往還，異類法後，諸業、果起，亦應無因，餘種、餘因前已遮故。若諸業、果無因而生，入無餘依涅槃界已，三界業果還復應生，煩惱亦應無因生故。","juan":4},{"t":"p","text":"又行緣識應不得成，轉識受熏，前已遮故。結生染識非行感故；應說名色，行為緣故，時分懸隔無緣義故。此不成故，後亦不成。","juan":4},{"t":"p","text":"諸清淨法亦有三種：世、出世道、斷果別故。","juan":4},{"t":"p","text":"若無此識持世、出世清淨道種，異類心後，起彼淨法皆應無因，所執餘因前已破故。若二淨道無因而生，入無餘依涅槃界已，彼二淨道還復應生，所依亦應無因生故。","juan":4},{"t":"p","text":"又出世道初不應生，無法持彼法爾種故；有漏類別非彼因故，無因而生非⸢106⸣釋⸤種故。初不生故，後亦不生，是則應無三乘道果。","juan":4},{"t":"p","text":"若無此識持煩惱種，轉依、斷果亦不得成，謂道起時，現行煩惱及彼種子俱非有故；染、淨二心不俱起故，道相應心不持彼種，自性相違，如涅槃故；去、來得等非實有故；餘法持種理不成故。既無所斷，能斷亦無，依誰由誰而立斷果？","juan":4},{"t":"p","text":"若由道力，後惑不生，立斷果者，則初道起應成無學；後諸煩惱皆已無因，永不生故。","juan":4},{"t":"p","text":"許有此識，一切皆成，唯此能持染、淨種故。","juan":4},{"t":"p","text":"證此識有，理趣無邊，恐厭繁文，略述綱要。","juan":4},{"t":"p","text":"別有此識，教理顯然，諸有智人，應深信受。","juan":4},{"t":"k","lv":6,"text":"2 釋第二能變","juan":4},{"t":"p","text":"如是已說初能變相；第二能變其相云何？","juan":4},{"t":"p","text":"頌曰：","juan":4}],"kepan":["2 釋第二能變"],"yi":"初能變識，其執受與所緣境相皆微細難知；恆與觸、作意、受、想、思五心所相應，而所相應的受唯是捨受。此識性攝於無覆無記，與之相應的觸等心所亦復如是。此識恆時相續而剎那轉變，猶如瀑流，非斷非常；至阿羅漢位，方捨阿賴耶之名。","yao":["第八識立三相：自相為阿賴耶（藏義），因相為一切種（持種義），果相為異熟（酬引業義）。三相攝盡本識體用。","「藏」有三義：能藏（持諸種子）、所藏（受前七識熏）、執藏（為第七識執為自內我）。阿羅漢位所捨者，唯捨執藏之名，非捨識體。","種子六義：剎那滅、果俱有、恆隨轉、性決定、待眾緣、引自果。六義缺一即非種子，此為判別種子與非種子的準繩。","熏習須具能熏四義（有生滅、有勝用、有增減、與所熏和合而轉）與所熏四義（堅住性、無記性、可熏性、與能熏共和合性）。前七為能熏，第八為所熏，故唯第八受熏持種。","論以五教十理證有本識，教證引《阿毘達磨經》《解深密經》等，理證則從持種、異熟、趣生體、有執受、壽煖識、生死心、緣起依、識食體、滅定有識、染淨心等處推立。","「不可知」通貫行相與所緣：行相微細故難知，所緣（種子、有根身、器世間）量廣故難測，非謂全無。","「恆轉如瀑流」是本論對治斷常二見的關鍵譬喻：恆故非斷，轉故非常，於相續中說因果不失。"],"ming":[["阿賴耶","梵 ālaya，藏義。第八識之自相，具能藏、所藏、執藏三義。"],["一切種","第八識之因相，謂此識能任持諸法種子而不失壞。"],["異熟","第八識之果相。異時而熟、異類而熟、變異而熟，酬引業之總報，故名真異熟。"],["種子","第八識中能生自果的功能差別。分本有與新熏，護法主張本有新熏並建。"],["熏習","前七識現行生起時，於第八識中留下自類功能，如香熏衣。有能熏四義、所熏四義之條件。"],["執受","第八識所緣境之一，攝種子與有根身。以令生覺受、安危共同，故名執受。"],["無覆無記","非染污（無覆）、非善非惡（無記）。第八識性唯如此，故能持染淨種而不自壞。"],["五遍行","觸、作意、受、想、思。遍一切心、一切地、一切時、一切性而起，故第八識亦與之相應。"],["捨受","非苦非樂之中容受。第八識行相微細不待轉變，故唯捨受相應。"]]},{"id":3,"label":"第二能變・末那識","verses":[5,6,7],"kind":"verse","juan":[4,5],"chars":9206,"blocks":[{"t":"v","num":5,"lines":["次第二能變，是識名末那，","依彼轉，緣彼，思量為性相。"],"juan":4},{"t":"v","num":6,"lines":["四煩惱常俱，謂：我癡、我見，","并我慢、我愛，及餘觸等俱。"],"juan":4},{"t":"v","num":7,"lines":["有覆無記攝，隨所生所繫。","阿羅漢、滅定、出世道無有。"],"juan":4},{"t":"p","text":"論曰：次初異熟能變識，後應辯思量能變識相。是識聖教別名末那，恒、審思量勝餘識故。","juan":4},{"t":"p","text":"此名何異第六意識？此持業釋，如藏識名，識即意故；彼依主釋，如眼識等，識異意故。然諸聖教恐此濫彼，故於第七但立意名。又⸢107⸣摽⸤意名，為簡心、識，積集、了別劣餘識故，或欲顯此與彼意識為近所依，故⸢108⸣但⸤名意。","juan":4},{"t":"p","text":"「依彼轉」者，顯此所依。","juan":4},{"t":"p","text":"「彼」謂即前初能變識，聖說此識依藏識故。","juan":4},{"t":"p","text":"有義：此意以彼識種而為所依，非彼現識，此無間斷，不假現識為俱有依方得生故。","juan":4},{"t":"p","text":"有義：此意以彼識種及彼現識俱為所依，雖無間斷，而有轉易，名轉識故，必假現識為俱有依，方得生故。","juan":4},{"t":"p","text":"「轉」謂流轉，顯示此識恒依彼識取所緣故。","juan":4},{"t":"p","text":"諸心、心所皆有所依，然彼所依，總有三種：","juan":4},{"t":"p","text":"一、因緣依，謂自種子，諸有為法皆託此依，離自因緣必不生故；二、增上緣依，謂內六處，諸心、心所皆託此依，離俱有根必不轉故；三、等無間緣依，謂前滅意，諸心、心所皆託此依，離開導根必不起故。","juan":4},{"t":"p","text":"唯心、心所具三所依，名有所依，非所餘法。","juan":4},{"t":"p","text":"初種子依，有作是說：要種滅已，現果方生，無種已生，《集論》說故，種與芽等不俱有故。","juan":4},{"t":"p","text":"有義：彼說為證不成。彼依引生後種說故；種生芽等非勝義故；種滅芽生非極成故。焰、炷同時互為因故。","juan":4},{"t":"p","text":"然種自類因果不俱，種、現相生決定俱有，故《瑜伽》說：無常法與他性為因，亦與後念自性為因，是因緣義。「自性」言顯種子自類前為後因，「他性」言顯種與現行互為因義。《攝大乘論》亦作是說：藏識染法互為因緣，猶如束蘆俱時而有。又說：種子與果必俱。故種子依，定非前後。","juan":4},{"t":"p","text":"設有處說種果前後，應知皆是隨轉理門。","juan":4},{"t":"p","text":"如是八識及諸心所，定各別有種子所依。","juan":4},{"t":"p","text":"次俱有依，有作是說：眼等五識意識為依，此現起時，必有彼故。無別眼等為俱有依，眼等五根即種子故。","juan":4},{"t":"p","text":"《二十唯識》伽他中言：","juan":4},{"t":"v","num":null,"lines":["「識從自種生，似境相而轉，","為成內、外處，佛說彼為十。」"],"juan":4},{"t":"p","text":"彼頌意說：世尊為成十二處故，說五識種為眼等根，五識相分為色等境，故眼等根即五識種。《觀所緣論》亦作是說：","juan":4},{"t":"v","num":null,"lines":["「識上色功能，名五根應理，","功能與境色，無始互為因。」"],"juan":4},{"t":"p","text":"彼頌意言：異熟識上能生眼等色識種子名色功能，說為五根，無別眼等，種與色識常互為因，能熏與種遞為因故。","juan":4},{"t":"p","text":"第七、八識無別此依，恒相續轉，自力勝故。","juan":4},{"t":"p","text":"第六意識別有此依，要託末那而得起故。","juan":4},{"t":"p","text":"有義：彼說理、教相違。","juan":4},{"t":"p","text":"若五色根即五識種，十八界種應成雜亂，然十八界各別有種，諸聖教中處處說故。","juan":4},{"t":"p","text":"又五識種各有能生相、見分異，為執何等名眼等根？若見分種，應識蘊攝；若相分種，應外處攝，便違聖教眼等五根，皆是色蘊內處所攝。","juan":4},{"t":"p","text":"又若五根即五識種，五根應是五識因緣，不應說為增上緣攝。","juan":4},{"t":"p","text":"又鼻、舌根即二識種，則應鼻、舌唯欲界繫；或應二識通色界繫，許便俱與聖教相違。眼、耳、身根即三識種，二⸢109⸣界⸤、五地為難亦然。","juan":4},{"t":"p","text":"又五識種既通善、惡，應五色根非唯無記。","juan":4},{"t":"p","text":"又五識種無執受攝，五根亦應非有執受。","juan":4},{"t":"p","text":"又五色根若五識種，應意識種即是末那，彼以五根為同法故。","juan":4},{"t":"p","text":"又《瑜伽論》說眼等識皆具三依，若五色根即五識種，依但應二。","juan":4},{"t":"p","text":"又諸聖教說眼等根皆通現種，執唯是種，便與一切聖教相違。","juan":4},{"t":"p","text":"有避如前所說過難，朋附彼執復轉救言：異熟識中能感五識增上業種，名五色根；非作因緣生五識種，妙符二頌，善順《瑜伽》。","juan":4},{"t":"p","text":"彼有虛言都無實義，應五色根非無記故；又彼應非唯有執受，唯色蘊攝，唯內處故；鼻、舌唯應欲界繫故；三根不應五地繫故；感意識業應末那故；眼等不應通現、種故；又應眼等非色根故。又若五識皆業所感，則應一向無記性攝；善等五識既非業感，應無眼等為俱有依，故彼所言非為善救。","juan":4},{"t":"p","text":"又諸聖教處處皆說阿賴耶識變似色根及根依處、器世間等，如何汝等撥無色根？許眼等識變似色等；不許眼等藏識所變，如斯迷謬，深違教、理。","juan":4},{"t":"p","text":"然伽他說：種子功能名五⸢110⸣根⸤者，為破離識實有色根，於識所變似眼⸢111⸣根⸤等，以有發生五識用故，假名種子及色功能。非謂色根即識業種。","juan":4},{"t":"p","text":"又緣五境明了意識，應以五識為俱有依，以彼必與五識俱故，若彼不依眼等識者，彼應不與五識為依，彼此相依勢力等故。","juan":4},{"t":"p","text":"又第七識雖無間斷，而見道等既有轉易，應如六識有俱有依，不爾，彼應非轉識攝，便違聖教轉識有七，故應許彼有俱有依，此即現行第八識攝。如《瑜伽》說有藏識故，得有末那；末那為依，意識得轉。彼論意言現行藏識為依止故，得有末那，非由彼種。不爾，應說有藏識故，意識得轉。","juan":4},{"t":"p","text":"由此彼說理、教相違。","juan":4},{"t":"p","text":"是故應言前五轉識，一一定有二俱有依，謂五色根、同時意識；第六轉識決定恒有一俱有依，謂第七識，若與五識俱時起者，亦以五識為俱有依；第七轉識決定唯有一俱有依，謂第八識；唯第八識恒無轉變，自能立故，無俱有依。","juan":4},{"t":"p","text":"有義：此說猶未盡理。第八類餘既同識性，如何不許有俱有依？第七、八識既恒俱轉，更互為依，斯有何失？","juan":4},{"t":"p","text":"許現起識以種為依，識種亦應許依現識，能熏異熟，為生、長、住依，識種離彼不生、長、住故。","juan":4},{"t":"p","text":"又異熟識有色界中能執持身，依色根轉，如契經說：阿賴耶識業風所飄，遍依諸根，恒相續轉；《瑜伽》亦說：眼等六識各別依故，不能執受有色根身。若異熟識不遍依止有色諸根，應如六識非能執受，或所立因有不定失。","juan":4},{"t":"p","text":"是故，藏識若現起者，定有一依，謂第七識，在有色界亦依色根；若識種子定有一依，謂異熟識，初熏習位亦依能熏。","juan":4},{"t":"p","text":"餘如前說。","juan":4},{"t":"p","text":"有義：前說皆不應理，未了所依與依別故。","juan":4},{"t":"p","text":"「依」謂一切有生滅法，仗因託緣而得生、住，諸所⸢112⸣仗⸤託皆說為依，如王與臣互相依等。","juan":4},{"t":"p","text":"若法決定、有境、為主、令心心所取自所緣，乃是所依，即內六處，餘非有境、定、為主故，此但如王，非如臣等。故諸聖教唯心、心所名有所依，非色等法，無所緣故。但說心所，心為所依；不說心所，為心所依，彼非主故。","juan":4},{"t":"p","text":"然有處說依為所依，或所依為依，皆隨宜假說。","juan":4},{"t":"p","text":"由此五識⸢113⸣俱⸤有所依定有四種：謂五色根、六、七、八識，隨闕一種必不轉故。同境、分別、染淨、根本，所依別故。聖教唯說依五根者，以不共故，又必同境，近相順故。","juan":4},{"t":"p","text":"第六意識俱有所依唯有二種：謂七、八識，隨闕一種必不轉故。雖五識俱取境明了，而不定有，故非所依。聖教唯說依第七者，染淨依故，同轉識攝，近相順故。","juan":4},{"t":"p","text":"第七意識俱有所依但有一種：謂第八識，藏識若無，定不轉故。如伽他說：","juan":4},{"t":"v","num":null,"lines":["阿賴耶為依，故有末那轉，","依止心及意，餘轉識得生。"],"juan":4},{"t":"p","text":"阿賴耶識俱有所依亦但一種：謂第七識，彼識若無，定不轉故。論說：藏識恒與末那俱時轉故；又說藏識恒依染污，此即末那。而說三位無末那者，依有覆說，如言四位無阿賴耶，非無第八，此亦應爾。雖有色界亦依五根，而不定有，非所依攝；識種不能現取自境，可有依義而無所依。","juan":4},{"t":"p","text":"心所所依，隨識應說，復各加自相應之心。","juan":4},{"t":"p","text":"若作是說，妙符理、教。","juan":4},{"t":"p","text":"後開導依，有義：五識自、他前後不相續故，必第六識所引生故，唯第六識為開導依。","juan":4},{"t":"p","text":"第六意識自相續故，亦由五識所引生故，以前六識為開導依。","juan":4},{"t":"p","text":"第七、八識自相續故，不假他識所引生故，但以自類為開導依。","juan":4},{"t":"p","text":"有義：前說未⸢114⸣為⸤究理。","juan":4},{"t":"p","text":"且前五識未自在位，遇非勝境，可如所說。","juan":4},{"t":"p","text":"若自在位，如諸佛等，於境自在，諸根互用，任運決定，不假尋求，彼五識身寧不相續？","juan":4},{"t":"p","text":"等流五識，既為決定、染淨、作意勢力引生，專注所緣，未能捨頃，如何不許多念相續？","juan":4},{"t":"p","text":"故《瑜伽》說：決定心後，方有染淨，此後乃有等流眼識善、不善轉，而彼不由自分別力，乃至此意不趣餘境，經爾所時，眼、意二識或善、或染，相續而轉，如眼識生，乃至身識，應知亦爾。","juan":4},{"t":"p","text":"彼意定顯經爾所時，眼、意二識俱相續轉，既眼識時非無意識，故非二識互相續生。","juan":4},{"t":"p","text":"若增盛境相續現前，逼奪身心不能暫捨，時五識身，理必相續，如熱地獄、戲忘天等。","juan":4},{"t":"p","text":"故《瑜伽》言：若此六識為彼六識等無間緣，即施設此名為意根。","juan":4},{"t":"p","text":"若五識前後定唯有意識，彼論應言：若此一識為彼六識等無間緣。或彼應言：若此六識為彼一識等無間緣。既不如是，故知五識有相續義。","juan":4},{"t":"p","text":"五識起時，必有意識能引後念意識令起，何假五識為開導依？","juan":4},{"t":"p","text":"無心⸢115⸣睡⸤眠、悶絕等位，意識斷已，後復起時，藏識、末那既恒相續，亦應與彼為開導依。若彼用前自類開導，五識自類何不許然？此既不然，彼云何爾？","juan":4},{"t":"p","text":"平等性智相應末那初起必由第六意識，亦應用彼為開導依。","juan":4},{"t":"p","text":"圓鏡智俱第八淨識，初必六、七方便引生。又異熟心依染污意，或依悲願相應善心。既爾，必應許第八識亦以六、七為開導依。","juan":4},{"t":"p","text":"由此彼言都未究理。","juan":4},{"t":"p","text":"應說五識前六識內，隨用何⸢116⸣識⸤為開導依；第六意識用前自類或第七、八為開導依；第七末那用前自類或第六識為開導依；阿陀那識用前自類及第六、七為開導依。皆不違理，由前說故。","juan":4},{"t":"p","text":"有義：此說亦不應理。","juan":4},{"t":"p","text":"開導依者，謂有緣法、為主，能作等無間緣。此於後生心、心所法，開避引導名開導依。此但屬心，非心所等。","juan":4},{"t":"p","text":"若此與彼無俱起義，說此於彼有開導力；一身八識既容俱起，如何異類為開導依？若許為依，應不俱起，便同異部心不並生。","juan":4},{"t":"p","text":"又一身中諸識俱起，多少不定，若容互作等無間緣，色等應爾，便違聖說等無間緣唯心、心所。","juan":4},{"t":"p","text":"然《攝大乘》說：色亦容有等無間緣者，是縱奪言，謂假縱小乘色、心前後有等無間緣，奪因緣故，不爾，「等」言應成無用。若謂「等」言非遮多少，但表同類，便違汝執異類識作等無間緣。","juan":4},{"t":"p","text":"是故八識各唯自類為開導依，深契教理，自類必無俱起義故。心所此依，應隨識說。","juan":4},{"t":"p","text":"雖心、心所異類並生，而互相應，和合似一，定俱生滅，事業必同，一開導時，餘亦開導，故展轉作等無間緣，諸識不然，不應為例。","juan":4},{"t":"p","text":"然諸心所非開導依，於所引生無主義故。","juan":4},{"t":"p","text":"若心、心所等無間緣各唯自類，第七、八識初轉依時，相應信等，此緣便闕，則違聖說諸心、心所皆四緣生。","juan":4},{"t":"p","text":"無心睡眠、悶絕等位意識雖斷，而後起時彼開導依即前自類，間斷五識應知亦然，無自類心於中為隔名無間故，彼先滅時，已於今識為開導故，何煩異類為開導依？","juan":4},{"t":"p","text":"然聖教中說前六識互相引起，或第七、八依六、⸢117⸣七⸤生，皆依殊勝增上緣說，非等無間，故不相違。《瑜伽論》說：若此識無間，諸識決定生，說此為彼等無間緣。又此六識為彼六識等無間緣，即施設此名意根者，言總意別，亦不相違。","juan":4},{"t":"p","text":"故自類依，深契教理。","juan":4},{"t":"p","text":"傍論已了，應辯正論。此能變識雖具三所依，而「依彼轉」言但顯前二，為顯此識依、緣同故，又前二依有勝用故，或開導依易了知故。","juan":4},{"t":"p","text":"如是已說此識所依，所緣云何？","juan":4},{"t":"p","text":"謂即「緣彼」。","juan":4},{"t":"p","text":"「彼」謂即前此所依識，聖說此識緣藏識故。","juan":4},{"t":"p","text":"有義：此意緣彼識體，及相應法。","juan":4},{"t":"p","text":"論說：末那我、我所執恒相應故。","juan":4},{"t":"p","text":"謂緣彼體及相應法，如次執為我及我所。","juan":4},{"t":"p","text":"然諸心所不離識故，如「唯識」言，無違教失。","juan":4},{"t":"p","text":"有義：彼說理不應然，曾無處言緣觸等故。","juan":4},{"t":"p","text":"應言此意但緣彼識見及相分，如次執為我及我所，相、見⸢118⸣俱⸤以識為體故，不違聖說。","juan":4},{"t":"p","text":"有義：此說亦不應理。五色根境非識蘊故，應同五識，亦緣外故；應如意識，緣共境故；應生無色者不執我所故，厭色生彼不變色故。","juan":4},{"t":"p","text":"應說此意但緣藏識及彼種子，如次執為我及我所。","juan":4},{"t":"p","text":"以種即是彼識功能，非實有物，不違聖教。","juan":4},{"t":"p","text":"有義：前說皆不應理。色等種子，非識蘊故，論說種子是實有故。假應如無，非因緣故。又此識俱薩迦耶見，任運一類，恒相續生，何容別執有我、我所？無一心中有斷、常等二境，別執俱轉義故，亦不應說二執前後，此無始來一味轉故。","juan":4},{"t":"p","text":"應知此意但緣藏識見分非餘，彼無始來一類相續似常、一故，恒與諸法為所依故。","juan":4},{"t":"p","text":"此唯執彼為自內我，乘語勢故，說我所言。或此執彼是我、之我，故於一見義說二言。","juan":4},{"t":"p","text":"若作是說，善順教理。多處唯言有我見故，我、我所執，不俱起故。","juan":4},{"t":"p","text":"未轉依位，唯緣藏識。既轉依已，亦緣真如及餘諸法。平等性智，證得十種平等性故。知諸有情勝解差別，示現種種佛影像故。","juan":4},{"t":"p","text":"此中且說未轉依時，故但說此緣彼藏識。悟迷通局，理應爾故。無我、我境，遍、不遍故。","juan":4},{"t":"p","text":"如何此識緣自所依？如有後識，即緣前意。彼既極成，此亦何咎？","juan":4},{"t":"p","text":"頌言：「思量為性相」者，雙顯此識自性、行相。","juan":4},{"t":"p","text":"意以思量為自性故，即復用彼為行相故。由斯兼釋所立別名，能審思量名末那故。未轉依位，恒、審思量所執我相；已轉依位，亦審⸢119⸣思⸤量無我相故。","juan":4},{"t":"p","text":"此意相應有幾心所？","juan":4},{"t":"p","text":"且與四種煩惱常俱。","juan":4},{"t":"p","text":"此中「俱」言，顯相應義。","juan":4},{"t":"p","text":"謂從無始，至未轉依，此意任運恒緣藏識，與四根本煩惱相應。","juan":4},{"t":"p","text":"其四者何？","juan":4},{"t":"p","text":"「謂我癡、我見并我慢、我愛」，是名四種。","juan":4},{"t":"p","text":"我癡者：謂無明，愚於我相，迷無我理，故名我癡。我見者：謂我執，於非我法，妄計為我，故名我見。我慢者：謂⸢120⸣倨⸤傲，恃所執我，令心高舉，故名我慢。我愛者：謂我貪，於所執我，深生耽著，故名我愛。「并」表慢、愛、有見、慢俱，遮餘部執無相應義。","juan":4},{"t":"p","text":"此四常起，擾濁內心，令外轉識恒成雜染。有情由此生死⸢121⸣輪⸤迴，不能出離，故名煩惱。","juan":4},{"t":"p","text":"彼有十種，此何唯四？","juan":4},{"t":"p","text":"有我見故，餘見不生。無一心中，有二慧故。如何此識，要有我見？二取、邪見，但分別生，唯見所斷。此俱煩惱，唯是俱生，修所斷故。我所、邊見，依我見生。此相應見，不依彼起。恒內執有我，故要有我見。","juan":4},{"t":"p","text":"由見審決，疑無容起。愛著我故，瞋不得生。故此識俱煩惱唯四。","juan":4},{"t":"p","text":"見、慢、愛三，如何俱起？行相無違，俱起何失？","juan":4},{"t":"p","text":"《瑜伽論》說：貪令心下，慢令心舉，寧不相違？分別、俱生；外境、內境；所陵、所恃，麁、細有殊，故彼此文，義無乖返。","juan":4},{"t":"p","text":"此意心所唯有四耶？","juan":4},{"t":"p","text":"不爾，「及餘觸等俱」故。","juan":4},{"t":"p","text":"有義：此意心所唯九，前四及餘觸等五法，即觸、作意、受、想與思，意與遍行，定相應故。前說觸等，異熟識俱，恐謂同前，亦是無覆，顯此異彼，故置「餘」言。","juan":4},{"t":"p","text":"「及」是⸢122⸣集義⸤，前四後五合，與末那恒相應故。","juan":4},{"t":"p","text":"此意何故無餘心所？","juan":4},{"t":"p","text":"謂「欲」，希望未遂合事，此識任運，緣遂合境，無所希望，故無有欲。「勝解」，印持曾未定境，此識無始，恒緣定事，⸢123⸣無⸤所印持，故無勝解。「念」唯記憶曾所習事，此識恒緣現所受境，無所記憶，故無有念。「定」唯繫心專注一境，此識任運，剎那別緣，既不專一，故無有定。「慧」即我見，故不別說。","juan":4},{"t":"p","text":"善是淨故，非此識俱。","juan":4},{"t":"p","text":"隨煩惱生，必依煩惱前後分位差別建立。此識恒與四煩惱俱，前後一類，分位無別，故此識俱無隨煩惱。","juan":4},{"t":"p","text":"「惡作」追悔先所造業，此識任運，恒緣現境，非悔先業，故無惡作。「睡眠」必依身、心重昧，外眾緣力，有時暫起，此識無始一類內執，不假外緣，故彼非有。「尋」、「伺」俱依外門而轉，淺深推度，麁細發言，此識唯依內門而轉，一類執我，故非彼俱。","juan":4},{"t":"p","text":"有義：彼釋「餘」義非理。頌別說此有覆攝故。又闕意俱隨煩惱故。煩惱必與隨煩惱俱，故此「餘」言，顯隨煩惱。","juan":4},{"t":"p","text":"此中有義：五隨煩惱，遍與一切染心相應。","juan":4},{"t":"p","text":"如《集論》說：惛沈、掉舉、不信、懈怠、放逸，於一切染污品中，恒共相應。","juan":4},{"t":"p","text":"若離無堪任性等，染污性成，無是處故。煩惱起時，心既染污，故染心位，必有彼五。煩惱若起，必由無堪任、囂動、不信、懈怠、放逸故。","juan":4},{"t":"p","text":"掉舉雖遍一切染心，而貪位增，但說貪分。如眠與悔，雖遍三性心，而癡位增，但說為癡分。","juan":4},{"t":"p","text":"雖餘處說，有隨煩惱，或六、或十，遍諸染心，而彼俱依別義說遍，非彼實遍一切染心。謂依二十隨煩惱中，解通麁細，無記、不善，通障定、慧，相顯說六。依二十二隨煩惱中，解通麁細二性，說十。故此彼說：非互相違。","juan":4},{"t":"p","text":"然此意俱心所十五，謂前九法、五隨煩惱，并別境慧。我見雖是別境慧攝，而五十一心所法中，義有差別，故開為二。","juan":4},{"t":"p","text":"何緣此意無餘心所？謂忿等十行相麁動，此識審細，故非彼俱；無慚、無愧，唯是不善，此無記故，非彼相應；散亂，令心馳流外境，此恒內執一類境生，不外馳流，故彼非有；不正知者，謂起外門身、語、意行，違越軌則，此唯內執，故非彼俱。無餘心所，義如前說。","juan":4},{"t":"p","text":"有義：應說六隨煩惱，遍與一切染心相應，《瑜伽論》說：不信、懈怠、放逸、忘念、散亂、惡慧，一切染心皆相應故。","juan":4},{"t":"p","text":"忘念、散亂、惡慧若無，心必不能起諸煩惱。要緣曾受境界種類，發起忘念及邪簡擇，方起貪等諸煩惱故。煩惱起時，心必流蕩，皆由於境，起散亂故。","juan":4},{"t":"p","text":"惛沈、掉舉，行相互違，非諸染心皆能遍起。論說五法遍染心者，解通麁、細，違唯善法，純隨煩惱，通二性故。","juan":4},{"t":"p","text":"說十遍言，義如前說。","juan":4},{"t":"p","text":"然此意俱心所十九。謂前九法、六隨煩惱，并念、定、慧，及加惛沈。此別說念，准前慧釋。并有定者，專注一類所執我境，曾不捨故。加惛沈者，謂此識俱無明尤重，心惛沈故。","juan":4},{"t":"p","text":"無掉舉者，此相違故。無餘心所，如上應知。","juan":4},{"t":"p","text":"有義：復說十隨煩惱，遍與一切染心相應。","juan":4},{"t":"p","text":"《瑜伽論》說：放逸、掉舉、惛沈、不信、懈怠、邪欲、邪勝解、邪念、散亂、不正知。此十一切染污心起，通一切處，三界繫故。","juan":4},{"t":"p","text":"若無邪欲、邪勝解時，心必不能起諸煩惱。於所受境，要樂合、離，印持事相，方起貪等諸煩惱故。","juan":4},{"t":"p","text":"諸疑理者，於色等事，必無猶豫；故疑相應，亦有勝解。於所緣事，亦猶豫者，非煩惱疑，如疑人杌。","juan":4},{"t":"p","text":"餘處不說此二遍者，緣非愛事，疑相應心，邪欲、勝解非麁⸢124⸣顯⸤故。","juan":4},{"t":"p","text":"餘互有無，義如前說。","juan":4},{"t":"p","text":"此意心所有二十四：謂前九法、十隨煩惱，加別境五，准前理釋。","juan":4},{"t":"p","text":"無餘心所如上應知。","juan":4},{"t":"p","text":"有義：前說皆未盡理。","juan":4},{"t":"p","text":"且疑他世為有、為無，於彼有何欲、勝解相？煩惱起位，若無惛沈，應不定有無堪任性；掉舉若無，應無囂動，便如善等，非染污位。若染心中，無散亂者，應非流蕩，非染污心。若無失念、不正知者，如何能起煩惱現前？","juan":4},{"t":"p","text":"故染污心決定皆與八隨煩惱相應而生，謂惛沈、掉舉、不信、懈怠、放逸、忘念、散亂、不正知。忘念、不正知，念、慧為性者，不遍染心，非諸染心，皆緣曾受，有簡擇故；若以無明為自性者，遍染心起，由前說故。","juan":4},{"t":"p","text":"然此意俱心所十八：謂前九法、八隨煩惱，并別境慧。無餘心所及論三文，准前應釋。","juan":4},{"t":"p","text":"若作是說，不違理、教。","juan":4},{"t":"p","text":"此染污意，何受相應？","juan":5},{"t":"p","text":"有義：此俱唯有喜受，恒內執我，生喜愛故。","juan":5},{"t":"p","text":"有義：不然。應許喜受，乃至有頂，違聖言故。","juan":5},{"t":"p","text":"應說：此意四受相應。謂生惡趣憂受相應，緣不善業所引果故。生人、欲天、初、二靜慮，喜受相應，緣有喜地善業果故。第三靜慮，樂受相應，緣有樂地善業果故。第四靜慮乃至有頂，捨受相應，緣唯捨地善業果故。","juan":5},{"t":"p","text":"有義：彼說亦不應理。此無始來，任運一類，緣內執我，恒無轉易，與變異受，不相應故。","juan":5},{"t":"p","text":"又此末那與前藏識義有異者，皆別說之。若四受俱，亦應別說。既不別說，定與彼同。故此相應，唯有捨受。","juan":5},{"t":"p","text":"未轉依位，與前所說心所相應；已轉依位，唯二十一心所俱起，謂遍行、別境各五，善十一。如第八識，已轉依位，唯捨受俱，任運轉故。恒於所緣平等轉故。","juan":5},{"t":"p","text":"末那心所，何性所攝？","juan":5},{"t":"p","text":"有覆無記所攝，非餘。","juan":5},{"t":"p","text":"此意相應四煩惱等，是染法故；障礙聖道，隱蔽自心，說名有覆；非善、不善，故名無記。","juan":5},{"t":"p","text":"如上二界諸煩惱等，定力攝藏，是無記攝。此俱染法，所依細故，任運轉故，亦無記攝。","juan":5},{"t":"p","text":"若已轉依，唯是善性。","juan":5},{"t":"p","text":"末那心所，何地繫耶？","juan":5},{"t":"p","text":"隨彼所生，彼地所繫。","juan":5},{"t":"p","text":"謂生欲界，現行末那相應心所，即欲界繫。乃至有頂應知亦然；任運恒緣自地藏識，執為內我，非他地故。","juan":5},{"t":"p","text":"若起彼地異熟藏識現在前者，名生彼地；染污末⸢126⸣那，⸤緣彼執我，即繫屬彼，名彼所繫。","juan":5},{"t":"p","text":"或為彼地諸煩惱等之所繫縛，名彼所繫。","juan":5},{"t":"p","text":"若已轉依，即非所繫。","juan":5},{"t":"p","text":"此染污意，無始相續，何位永斷？或暫斷耶？","juan":5},{"t":"p","text":"「阿羅漢、滅定、出世道無有。」","juan":5},{"t":"p","text":"阿羅漢者，總顯三乘無學果位。此位染意種及現行，俱永斷滅，故說無有。學位滅定、出世道中，俱暫伏滅，故說無有。","juan":5},{"t":"p","text":"謂染污意，無始時來，微細一類，任運而轉，諸有漏道，不能伏滅；⸢127⸣三⸤乘聖道，有伏滅義。真無我解，違我執故。後得無漏現在前時，是彼等流，亦違此意。真無我解，及後所得，俱無漏故，名出世道。","juan":5},{"t":"p","text":"滅定既是聖道等流，極寂靜故，此亦非有。","juan":5},{"t":"p","text":"由未永斷此種子故，從滅盡定、聖道起已，此復現行，乃至未滅。","juan":5},{"t":"p","text":"然此染意相應煩惱，是俱生故，非見所斷。是染污故，非非所斷。","juan":5},{"t":"p","text":"極微細故，所有種子，與有頂地，下下煩惱，一時頓斷，勢力等故；金剛喻定現在前時，頓斷此種，成阿羅漢，故無學位，永不復起。","juan":5},{"t":"p","text":"二乘無學，迴趣大乘，從初發心，至未成佛，雖實是菩薩，亦名阿羅漢。應義等故，不別說之。","juan":5},{"t":"p","text":"此中有義：末那唯有煩惱障俱。聖教皆言：三位無故。又說：四惑恒相應故。又說：為識雜染依故。","juan":5},{"t":"p","text":"有義：彼說教、理相違，出世末那，經說有故。","juan":5},{"t":"p","text":"無染意識，如有染時，定有俱生不共依故。","juan":5},{"t":"p","text":"論說：藏識決定恒與一識俱轉，所謂末那；意識起時，則二俱轉，所謂意識，及與末那；若五識中隨起一識，則三俱轉，乃至或時頓起五識，則七俱轉。若住滅定，無第七識，爾時，藏識應無識俱，便非恒定一識俱轉。住聖道時，若無第七。爾時，藏識應一識俱，如何可言，若起意識，爾時，藏識定二俱轉？","juan":5},{"t":"p","text":"《顯揚論》說：末那恒與四煩惱相應，或翻彼相應，恃舉為行，或平等行。故知此意通染、不染。","juan":5},{"t":"p","text":"若由論說：阿羅漢位無染意故，便無第七。應由論說：阿羅漢位捨⸢128⸣賴耶⸤故，便無第八。彼既不爾，此云何然？","juan":5},{"t":"p","text":"又諸論言：轉第七識，得平等智。彼如餘智，定有所依相應淨識。此識無者，彼智應無。非離所依有能依故。不可說彼依六轉識，許佛恒行，如鏡智故。","juan":5},{"t":"p","text":"又無學位，若無第七識，彼第八識，應無俱有依。然必有此依，如餘識性故。","juan":5},{"t":"p","text":"又如未證補特伽羅無我者，彼我執恒行；亦應未證法無我者，法我執恒行，此識若無，彼依何識？非依第八，彼無慧故。由此應信，二乘聖道、滅定、無學此識恒行，彼未證得法無我故。","juan":5},{"t":"p","text":"又諸論中，以五同法證有第七，為第六依。聖道起時，及無學位，若無第七為第六依，所立宗、因，便俱有失。或應五識亦有無依。五恒有依，六亦應爾。","juan":5},{"t":"p","text":"是故定有無染污意，於上三位，恒起現前。言彼無⸢129⸣⸤者，依染意說；如說四位無阿賴耶，非無第八，此亦應爾。","juan":5},{"t":"p","text":"此意差別，略有三種：","juan":5},{"t":"p","text":"一、補特伽羅我見相應；二、法我見相應；三、平等性智相應。","juan":5},{"t":"p","text":"初通一切異生相續、二乘有學、七地以前一類菩薩有漏心位，彼緣阿賴耶識，起補特伽羅我見。","juan":5},{"t":"p","text":"次通一切異生、聲聞、獨覺相續、一切菩薩法空智果不現前位，彼緣異熟識，起法我見。","juan":5},{"t":"p","text":"後通一切如來相續、菩薩見道及修道中法空智果現在前位，彼緣無垢異熟識等，起平等性智。","juan":5},{"t":"p","text":"補特伽羅我見起位，彼法我見亦必現前。我執必依法執而起。如⸢130⸣夜⸤迷杌等，方謂人等故。","juan":5},{"t":"p","text":"⸢131⸣我⸤、法二見，用雖有別，而不相違，同依一⸢132⸣慧⸤。如眼識等，體雖是一，而有了別青等多用，不相違故，此亦應然。","juan":5},{"t":"p","text":"二乘有學聖道，滅定現在前時；頓悟菩薩，於修道位；有學漸悟，生空智果現在前時，皆唯起法執，我執已伏故。","juan":5},{"t":"p","text":"二乘無學及此漸悟法空智果不現前時，亦唯起法執，我執已斷故。","juan":5},{"t":"p","text":"八地以上，一切菩薩所有我執皆永不行，或已永斷；或永伏故。法空智果不現前時，猶起法執，不相違故。","juan":5},{"t":"p","text":"如⸢133⸣契⸤經說：八地以上，一切煩惱，不復現行；唯有所依所知障在。此所知障，是現非種。不爾，煩惱亦應在故。","juan":5},{"t":"p","text":"法執俱意，於二乘等，雖名不染；於諸菩薩，亦名為染，障彼智故。由此亦名有覆無記。於二乘等，說名無覆，不障彼智故。是異熟生攝，從異熟識恒時生故，名異熟生，非異熟果，此名通故，如增上緣，餘不攝者，皆入此攝。","juan":5},{"t":"p","text":"云何應知此第七識，離眼等識，有別自體？","juan":5},{"t":"p","text":"聖教正理，為定量故。","juan":5},{"t":"p","text":"謂薄伽梵處處經中說：心、意、識三種別義。集起名心，思量名意，了別名識，是三別義。","juan":5},{"t":"p","text":"如是三義，雖通八識，而隨勝顯。第八名心，集諸法種，起諸法故；第七名意，緣藏識等，恒、審思量，為我等故；餘六名識，於六別境，麁動間斷，了別轉故。","juan":5},{"t":"p","text":"如《入楞伽》伽他中說：","juan":5},{"t":"v","num":null,"lines":["「藏識說名心，思量性名意，","能了諸境相，是說名為識。」"],"juan":5},{"t":"p","text":"又大乘經處處別說有第七識，故此別有。諸大乘經是至教量，前已廣說，故不重成。","juan":5},{"t":"p","text":"《解脫經》中，亦別說有此第七識。如彼頌言：","juan":5},{"t":"v","num":null,"lines":["「染污意恒時，諸惑俱生滅，","若解脫諸惑，非曾非當有。」"],"juan":5},{"t":"p","text":"彼經自釋此頌義言：有染污意，從無始來，與四煩惱，恒俱生滅。謂我見、我愛，及我慢、我癡。對治道生，斷煩惱已，此意從彼便得解脫。爾時，此意相應煩惱，非唯現無，亦無⸢134⸣過、未⸤，過去、未來，無自性故。如是等教，諸部皆有，恐厭廣文，故不繁述。","juan":5},{"t":"p","text":"已引聖教；當顯正理。","juan":5},{"t":"p","text":"謂契經說：不共無明，微細恒行，覆蔽真實。若無此識，彼應非有。","juan":5},{"t":"p","text":"謂諸異生，於一切分，恒起迷理不共無明，覆真實義，障聖慧眼。如伽他說：","juan":5},{"t":"v","num":null,"lines":["「真義心當生，常能為障礙，","俱行一切分，謂不共無明。」"],"juan":5},{"t":"p","text":"是故契經說：異生類恒處長夜，無明所盲，惛醉纏心，曾無醒覺。","juan":5},{"t":"p","text":"若異生位，有暫不起此無明時，便違經義。俱異生位，迷理無明，有行、不行，不應理故。此依六識，皆不得成。應此間斷，彼恒染故。許有末那，便無此失。","juan":5},{"t":"p","text":"染意恒與四惑相應，此俱無明，何名不共？","juan":5},{"t":"p","text":"有義：此俱我見、慢、愛，非根本煩惱，名不共何失？","juan":5},{"t":"p","text":"有義：彼說理、教相違。純隨煩惱中，不說此三故，此三，⸢135⸣六⸤、十煩惱攝故。處處皆說染污末那與四煩惱恒相應故。","juan":5},{"t":"p","text"
