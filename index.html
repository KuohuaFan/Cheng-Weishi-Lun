:"應說四中，無明是主，雖三俱起，亦名不共。從無始際，恒內惽迷，曾不省察，癡增上故。","juan":5},{"t":"p","text":"此俱見等，應名相應，若為主時，應名不共？如無明故，許亦無失。","juan":5},{"t":"p","text":"有義：此癡名不共者，如不共佛法，唯此識有故。","juan":5},{"t":"p","text":"若爾，餘識相應煩惱，此識中無，應名不共。依殊勝義，立不共名，非互所無，皆名不共。謂第七識相應無明，無始恒行，障真義智，如是勝用，餘識所無，唯此識有，故名不共。既爾，此俱三亦應名不共。無明是主，獨得此名。或許餘三，亦名不共；對餘「癡」故，且說無明。","juan":5},{"t":"p","text":"不共無明，總有二種：一、恒行不共，餘識所無；二、獨行不共，此識非有。","juan":5},{"t":"p","text":"故《瑜伽》說無明有二：若貪等俱者，名相應無明；非貪等俱者，名獨行無明。是主獨行，唯見所斷。如契經說：「諸聖有學，不共無明，已永斷故，不造新業。」非主獨行，亦修所斷。忿等皆通見、⸢136⸣修⸤所斷故。","juan":5},{"t":"p","text":"恒行不共，餘部所無；獨行不共，此、彼俱有。","juan":5},{"t":"p","text":"又契經說：眼、色為緣，生於眼識。廣說乃至意、法為緣，生於意識。若無此識，彼意非有。","juan":5},{"t":"p","text":"謂如五識，必有眼等增上不共俱有所依。意識既是六識中攝，理應許有如是所依。此識若無，彼依寧有？","juan":5},{"t":"p","text":"不可說色為彼所依，意非色故。意識應無隨念、計度二分別故。","juan":5},{"t":"p","text":"亦不可說五識無有俱有所依，彼與五根俱時而轉，如⸢137⸣牙⸤、影故。又識與根，既必同境，如心、心所，決定俱時。","juan":5},{"t":"p","text":"由此理趣，極成意識如眼等識必有不共，顯自名、處。等無間不攝，增上⸢138⸣生所⸤依，極成六識隨一攝故。","juan":5},{"t":"p","text":"又契經說：思量名意。若無此識，彼應非有。","juan":5},{"t":"p","text":"謂若意識現在前時，等無間意已滅非有。過去、未來，理非有故。彼思量用，定不得成。既爾，如何說名為意？若謂假說，理亦不然。無正思量，假依何立？若謂現在，曾有思量，爾時名識，寧說為意？","juan":5},{"t":"p","text":"故知別有第七末那，恒、審思量，正名為意，已滅依此，假立「意」名。","juan":5},{"t":"p","text":"又契經說：無想、滅定染意若無，彼應無別。","juan":5},{"t":"p","text":"謂彼二定，俱滅六識及彼心所，體數無異。若無染意，於二定中，一有一無，彼二何別？若謂加行、界、地、依等有差別者，理亦不然。彼差別因，由此有故。此若無者，彼因亦無。","juan":5},{"t":"p","text":"是故定應別有此意。","juan":5},{"t":"p","text":"又契經說：無想有情，一期生中，心、心所滅。若無此識，彼應無染。","juan":5},{"t":"p","text":"謂彼長時，無六轉識；若無此意，我執便無。非於餘處有具縛者，一期生中，都無我執。彼無我執，應如涅槃，便非聖賢同所訶厭。","juan":5},{"t":"p","text":"初、後有故，無如是失。中間長時無故，有過。去、來有故，無如是失。彼非現、常，無故，有過。所得無故，能得亦無。","juan":5},{"t":"p","text":"不相應法，前已遮破。","juan":5},{"t":"p","text":"藏識無故，熏習亦無。餘法受熏，已⸢139⸣辯⸤非理。","juan":5},{"t":"p","text":"故應別有染污末那，於無想天恒起我執，由斯賢聖同訶厭彼。","juan":5},{"t":"p","text":"又契經說：異生善、染、無記心時，恒帶我執，若無此識，彼不應有。","juan":5},{"t":"p","text":"謂異生類，三性心時，雖外起諸業，而⸢140⸣內⸤恒執我。由執我故，令六識中所起施等，不能亡相。","juan":5},{"t":"p","text":"故《瑜伽》說：染污末那，為識依止，彼未滅時，相了別縛，不得解脫。末那滅已，相縛解脫。","juan":5},{"t":"p","text":"言相縛者，謂於境相不能了達，如幻事等。由斯見分相分所拘，不得自在，故名相縛。","juan":5},{"t":"p","text":"依如是義，有伽他言：","juan":5},{"t":"v","num":null,"lines":["「如是染污意，是識之所依，","此意未滅時，識縛終不脫。」"],"juan":5},{"t":"p","text":"又善、無覆無記心時，若無我執，應非有漏。自相續中，六識煩惱與彼善等不俱起故。去、來緣縛，理非有故。非由他⸢141⸣惑⸤，成有漏故；勿由他解，成無漏故。","juan":5},{"t":"p","text":"又不可說：別有隨眠，是不相應，現相續起，由斯善等成有漏法。彼非實有，已極成故。","juan":5},{"t":"p","text":"亦不可說：從有漏種，生彼善等，故成有漏。彼種先無因可成有漏故。","juan":5},{"t":"p","text":"非由漏種，彼成有漏；勿學無漏心，亦成有漏故。","juan":5},{"t":"p","text":"雖由煩惱，引施等業，而不俱起，故非有漏正因；以有漏言，表漏俱故；又無記業，非煩惱引，彼復如何得成有漏？","juan":5},{"t":"p","text":"然諸有漏，由與自身現行煩惱俱生、俱滅，互相增益，方成有漏。由此熏成有漏法種，後時現起，有漏義成；異生既然，有學亦爾。無學有漏，雖非漏俱；而從先時有漏種起，故成有漏，於理無違。","juan":5},{"t":"p","text":"由有末那恒起我執，令善等法有漏義成。此意若無，彼定非有，故知別有此第七識。","juan":5},{"t":"p","text":"證有此識，理趣甚多，隨《攝大乘》，略述六種，諸有智者，應隨信學。","juan":5},{"t":"p","text":"然有經中說六識者，應知彼是隨轉理門，或隨所依六根說六，而識類別，實有八種。","juan":5},{"t":"k","lv":6,"text":"3 釋第三能變","juan":5},{"t":"p","text":"如是已說第二能變。第三能變，其相云何？","juan":5},{"t":"p","text":"頌曰：","juan":5}],"kepan":["3 釋第三能變"],"yi":"其次第二能變，此識名為末那，依第八識而轉起、又緣第八識為境，以恆審思量為其體性與行相。常與我癡、我見、我慢、我愛四種根本煩惱相應，並與觸等遍行心所俱起。此識性攝有覆無記，隨其所生之地而繫屬其地；於阿羅漢位、滅盡定中、出世聖道現前時，則無此識現行。","yao":["「依彼轉，緣彼」二句：所依與所緣同是第八識，末那緣第八見分執為實我，是俱生我執的根本所在。","八識中唯第七獨得「思量」之名，因其恆而且審：第八恆而不審，第六審而不恆，前五不恆不審，唯第七恆審俱備。","四惑「常俱」顯示我執非偶發之心理活動，而是有情生命結構中恆時運作的底層，故一般伏斷第六識分別我執仍不足以了生死。","「有覆無記」：染污故有覆，不感異熟果故無記。有覆是其障道義，無記是其非招報義，二者須合看。","三位無有的差別：阿羅漢是永斷，滅盡定與出世道是暫伏。故論文特別分辨伏與斷，不可混同。","末那轉依時得平等性智，此處已伏筆於第三十頌四智之說。"],"ming":[["末那","梵 manas，意也。恆審思量為性相，為染污意，故別立第七。"],["恆審思量","恆謂相續不斷，審謂審察決定。第七識二義俱足，是我執之所依。"],["我癡","無明，迷於我之真相，四惑之首。"],["我見","薩迦耶見，於非我法計執為我。"],["我慢","恃所執我而令心高舉。"],["我愛","於所執我深生耽著。"],["有覆無記","體性染污能障聖道，然勢用羸劣不招異熟，故名有覆無記。"],["滅盡定","滅受想定。聖者所入，前六識與末那染分皆不現行。"]]},{"id":4,"label":"第三能變・六識總標","verses":[8],"kind":"verse","juan":[5],"chars":902,"blocks":[{"t":"v","num":8,"lines":["次第三能變，差別有六種，","了境為性、相，善、不善、俱非。"],"juan":5},{"t":"p","text":"論曰：次中思量能變識後，應⸢142⸣辯⸤了境能變識相。","juan":5},{"t":"p","text":"此識差別總有六種，隨六根、境，種類異故。","juan":5},{"t":"p","text":"謂名眼識乃至意識，隨根立名，具五義故。五謂依、發、屬、助、如根，雖六識身皆依意轉，然隨不共，立意識名，如五識身，無相濫過。或唯依意，故名意識，⸢143⸣辯⸤識得名，心、意非例。","juan":5},{"t":"p","text":"或名色識乃至法識，隨境立名，順識義故。謂於六境了別名識，色等五識，唯了色等，法識通能了一切法，或能了別法，獨得法識名，故六識名無相濫失。","juan":5},{"t":"p","text":"此後隨境立六識名，依五色根未自在說；若得自在，諸根互用，一根發識，緣一切境；但可隨根，無相濫失。","juan":5},{"t":"p","text":"《莊嚴論》說：如來五根，一一皆於五境轉者，且依麁顯、同類境說。","juan":5},{"t":"p","text":"《佛地經》說：成所作智，決擇有情心行差別，起三業化、作四記等。若不遍緣，無此能故。","juan":5},{"t":"p","text":"然六轉識所依、所緣，麁顯極成，故此不說。前隨義便，已說所依；此所緣境，義便當說。","juan":5},{"t":"p","text":"次言「了境為性相」者，雙顯六識自性、行相，識以了境為自性故；即復用彼為行相故。由斯兼釋所立別名，能了別境，名為識故。","juan":5},{"t":"p","text":"如契經說：眼識云何？謂依眼根，了別諸色；廣說乃至意識云何？謂依意根，了別諸法。","juan":5},{"t":"p","text":"彼經且說，不共所依，未轉依⸢144⸣位⸤，見分所了；餘所依、了，如前已說。","juan":5},{"t":"p","text":"此六轉識，何性攝耶？","juan":5},{"t":"p","text":"謂善、不善、俱非性攝。","juan":5},{"t":"p","text":"俱非者，謂無記，非善、不善，故名「俱非」；能為此世、他世順益，故名為善，人、天樂果，雖於此世能為順益，非於他世，故不名「善」；能為此世、他世違損，故名「不善」，惡趣苦果，雖於此世能為違損，非於他世，故非不善。於善、不善；益、損義中，不可記別，故名無記。","juan":5},{"t":"p","text":"此六轉識若與信等十一相應，是善性攝；與無慚等十法相應，不善性攝；俱不相應，無記性攝。","juan":5},{"t":"p","text":"有義：六識三性不俱。","juan":5},{"t":"p","text":"同外門轉，互相違故；五識必由意識導引，俱生、同境成善、染故。若許五識三性俱行，意識爾時應通三性。便違正理，故定不俱。","juan":5},{"t":"p","text":"《瑜伽》等說：藏識一時與轉識相應，三性俱起者，彼依多念。如說一心，非一生滅，無相違過。","juan":5},{"t":"p","text":"有義：六識三性容俱。","juan":5},{"t":"p","text":"率爾、等流眼等五識，或多或少，容俱起故。","juan":5},{"t":"p","text":"五識與意，雖定俱生，而善性等，不必同故。前所設難，於此唐捐。","juan":5},{"t":"p","text":"故《瑜伽》說：若遇聲緣從定起者，與定相應意識俱轉，餘耳識生。非唯彼定相應意識，能取此聲。若不爾者，於此音聲，不領受故，不應出定。非取聲時，即便出定，領受聲已，若有希望，後時方出。","juan":5},{"t":"p","text":"在定，耳識率爾聞聲，理應非善。未轉依者，率爾墮心，定無記故。","juan":5},{"t":"p","text":"由此誠證五俱意識，非定與五善等性同。","juan":5},{"t":"p","text":"諸處但言五俱意識亦緣五境，不說同性。","juan":5},{"t":"p","text":"《雜集論》說：等引位中五識無者，依多分說。","juan":5},{"t":"p","text":"若五識中，三性俱轉，意隨偏注，與彼性同。無偏注者，便無記性。故六轉識，三性容俱。","juan":5},{"t":"p","text":"得自在位，唯善性攝。佛色心等，道諦攝故。已永滅除戲論種故。","juan":5},{"t":"p","text":"六識與幾心所相應？","juan":5},{"t":"p","text":"頌曰：","juan":5}],"kepan":[],"yi":"其次第三能變，隨所依根、所緣境之別，差別有六種：眼、耳、鼻、舌、身、意識。皆以了別境相為其體性與行相，其性通於善、不善，以及非善非不善（無記）三性。","yao":["六識立名依根不依境（如「眼識」而非「色識」），論中辨此有五義：依、發、屬、助、如根。","「了境為性相」中，性與相同以了別為說，顯示前六識體用不隔，與第八識之行相微細者對照。","三性通局是六識與七、八二識的分水嶺：唯第六識能造善惡強業，感異熟果，故修行下手處在此。","本節文短而地位樞紐：自此以下至第十四頌，皆是廣釋第三能變之心所相應，故論文結構在此轉入六位心所的長篇分析。"],"ming":[["了境","了別境相。前六識之共通行相。"],["六識身","眼識、耳識、鼻識、舌識、身識、意識之總稱。"],["俱非","非善非不善，即無記性。"],["五義依根立名","依根、發識、屬根、助根、如根。論以此五義說明識何以從根得名。"]]},{"id":5,"label":"六位心所總標","verses":[9],"kind":"verse","juan":[5],"chars":1635,"blocks":[{"t":"v","num":9,"lines":["此心所遍行、別境、善、煩惱、","隨煩惱、不定，⸢145⸣皆三受⸤相應。"],"juan":5},{"t":"p","text":"論曰：此六轉識，總與六位心所相應，謂遍行等。","juan":5},{"t":"p","text":"恒依心起，與心相應，繫屬於心，故名心所，如屬我物，立我所名。","juan":5},{"t":"p","text":"心於所緣，唯取總相；心所於彼，亦取別相，助成心事，得心所名。如畫師、資，作模、填彩。","juan":5},{"t":"p","text":"故《瑜伽》說：識能了別事之總相，作意了此所未了相。即諸心所⸢146⸣所取⸤別相，觸能了此可意等相，受能了此攝受等相，想能了此言說因相，思能了此正因等相。故作意等名心所法。此表心所亦緣總相。餘處復說：欲亦能了可樂事相，勝解亦了決定事相，念亦能了串習事相，定、慧亦了⸢147⸣德⸤失等相。","juan":5},{"t":"p","text":"由此於境，起善、染等。","juan":5},{"t":"p","text":"諸心所法，皆於所緣，兼取別相。","juan":5},{"t":"p","text":"雖諸心所，名義無異，而有六位種類差別：","juan":5},{"t":"p","text":"謂遍行有五，別境亦五，善有十一，煩惱有六，隨煩惱有二十，不定有四。","juan":5},{"t":"p","text":"如是六位，合五十一。","juan":5},{"t":"p","text":"一切心中，定可得故。緣別別境，而得生故。唯善心中，可得生故。性是根本煩惱攝故。唯是煩惱等流性故。於善、染等，皆不定故。","juan":5},{"t":"p","text":"然《瑜伽論》合六為五，煩惱、隨煩惱，俱是染故。復以四一切，⸢148⸣辯⸤五差別：謂一切性及地、時、俱。五中遍行具四一切。別境唯有初、二一切。善唯有一，謂一切地。染四皆無。不定唯一，謂一切性。","juan":5},{"t":"p","text":"由此五位，種類差別。","juan":5},{"t":"p","text":"此六轉識，易脫不定，故皆容與三受相應。皆領順、違、非二相故。領順境相，適悅身心，說名樂受；領違境相，逼迫身心，說名苦受；領中容境相，於身於心，非逼非悅，名不苦樂受。","juan":5},{"t":"p","text":"如是三受，或各分二：五識相應，說名身受，別依身故；意識相應，說名心受，唯依心故。又三皆通有漏、無漏，苦受亦由無漏起故。","juan":5},{"t":"p","text":"或各分三：謂見所斷、修所斷、非所斷；又學、無學、非二，為三。","juan":5},{"t":"p","text":"或總分四：謂善、不善、有覆、無覆二無記受。","juan":5},{"t":"p","text":"有義：三受容各分四，五識俱起任運貪、癡，純苦趣中任運煩惱，不發業者，是無記故。","juan":5},{"t":"p","text":"彼皆容與苦根相應。","juan":5},{"t":"p","text":"《瑜伽論》說：若任運生一切煩惱，皆於三受現行可得。若通一切識身者，遍與一切根相應；不通一切識身者，意地一切根相應。《雜集論》說：若欲界繫任運煩惱，發惡行者，亦是不善。所餘皆是有覆無記。","juan":5},{"t":"p","text":"故知三受各容有四。","juan":5},{"t":"p","text":"或總分五：謂苦、樂、憂、喜、捨。","juan":5},{"t":"p","text":"三中苦、樂各分二者，逼、悅身、心相各異故；由無分別、有分別故；尤重、輕微有差別故。不苦不樂不分二者，非逼、非悅相無異故；無分別故；平等轉故。","juan":5},{"t":"p","text":"諸適悅受，五識相應，恒名為樂。","juan":5},{"t":"p","text":"意識相應，若在欲界、初、二靜慮近分名喜，但悅心故。若在初、二靜慮根本，名樂、名喜，悅身、心故。若在第三靜慮近分、根本名樂，安靜尤重，無分別故。","juan":5},{"t":"p","text":"諸逼迫受，五識相應，恒名為苦。","juan":5},{"t":"p","text":"意識俱者，有義：唯憂，逼迫心故。諸聖教說：意地慼受，名憂根故。","juan":5},{"t":"p","text":"《瑜伽論》說：生地獄中諸有情類，異熟無間有異熟生，苦、憂相續。又說：地獄尋、伺憂俱，一分鬼趣，傍生亦爾。","juan":5},{"t":"p","text":"故知意地尤重慼受，尚名為憂，況餘輕者？","juan":5},{"t":"p","text":"有義：通二，人、天中者，恒名為憂，非尤重故。傍生、鬼界名憂、名苦，雜受、純受有輕重故。⸢149⸣㮈⸤落迦中唯名為苦，純受尤重，無分別故。","juan":5},{"t":"p","text":"《瑜伽論》說：若任運生一切煩惱，皆於三受現行可得，廣說如前。又說：俱生薩迦耶見，唯無記性。彼邊執見，應知亦爾。此俱苦受，非憂根攝，論說憂根非無記故。又《瑜伽》說：地獄諸根，餘三現行，定不成就。純苦鬼界，傍生亦爾。","juan":5},{"t":"p","text":"「餘三」定是樂、喜、憂根，以彼必成現行捨故。","juan":5},{"t":"p","text":"豈不⸢150⸣客⸤捨彼定不成？","juan":5},{"t":"p","text":"寧知彼文，唯說⸢151⸣客⸤受？應不說彼定成意根，彼六⸢152⸣客⸤識有時無故。不應彼論唯說⸢153⸣客⸤受，通說意根，無異因故。","juan":5},{"t":"p","text":"又若彼論依⸢154⸣客⸤受說，如何說彼定成八根？","juan":5},{"t":"p","text":"若謂五識不相續故，定說憂根為第八者，死、生、悶絕寧有憂根？","juan":5},{"t":"p","text":"有執苦根為第八者，亦同此破。","juan":5},{"t":"p","text":"設執一形為第八者，理亦不然，形不定故。彼惡業招，容無形故。彼由惡業，令五根門恒受苦故，定成眼等。必有一形，於彼何用？非於無間大地獄中，可有希求婬欲事故。","juan":5},{"t":"p","text":"由斯第八定是捨根，第七、八識捨相應故。","juan":5},{"t":"p","text":"如極樂地，意悅名樂，無有喜根。故極苦處，意迫名苦，無有憂根。","juan":5},{"t":"p","text":"故「餘三」言，定憂、喜、樂。","juan":5},{"t":"p","text":"餘處說彼有等流樂，應知彼依隨轉理說。或彼通說：餘雜受處，無異熟樂，名純苦故。","juan":5},{"t":"p","text":"然諸聖教，意地⸢155⸣慼⸤受，名憂根者，依多分說，或隨轉門，無相違⸢156⸣過⸤。","juan":5},{"t":"p","text":"《瑜伽論》說：生地獄中諸有情類，異熟無間有異熟生，苦、憂相續。又說：地獄尋、伺憂俱。一分鬼趣，傍生亦爾者，亦依隨轉門。","juan":5},{"t":"p","text":"又彼苦根，意識俱者，是餘憂類，假說為憂。","juan":5},{"t":"p","text":"或彼苦根，損身心故，雖苦根攝，而亦名憂。如近分喜，益身心故，雖是喜根，而亦名樂。《顯揚論》等，具顯此義。然未至地定無樂根，說彼唯有十一根故。","juan":5},{"t":"p","text":"由此應知，意地⸢157⸣慼⸤受，純受苦處，亦苦根攝。","juan":5},{"t":"p","text":"此等聖教，差別多門，恐文增廣，故不繁述。","juan":5},{"t":"p","text":"有義：六識三受不俱，皆外門轉，互相違故。五俱意識，同五所緣，五三受俱，意亦應爾，便違正理，故必不俱。《瑜伽》等說：藏識一時與轉識相應，三受俱起者，彼依多念。如說一心，非一生滅，無相違過。","juan":5},{"t":"p","text":"有義：六識三受容俱。順、違、中境，容俱受故。意不定與五受同故。於偏注境，起一受故；無偏注者，便起捨故。由斯六識三受容俱。","juan":5},{"t":"p","text":"得自在位，唯樂、喜、捨，諸佛已斷憂、苦事故。","juan":5},{"t":"p","text":"前所略⸢158⸣摽⸤六位心所，今應廣顯彼差別相。","juan":5},{"t":"p","text":"且初、二位，其相云何？","juan":5},{"t":"p","text":"頌曰：","juan":5}],"kepan":[],"yi":"與此第三能變相應的心所，總分六位：遍行、別境、善、煩惱、隨煩惱、不定。此六位心所，皆能與苦、樂、捨三受相應。","yao":["六位心所是唯識學心理分析的骨幹，合計五十一法，攝於百法明門的心所有法。","「心所」之立名有三義：恆依心起、與心相應、繫屬於心。三義俱足方名心所，非泛指一切心理現象。","六位排列有其次第：遍行最寬（遍四一切），別境次之，善與煩惱相對，隨煩惱依根本煩惱而起，不定則四法性類不定。","「皆三受相應」一句攝盡六位，顯示受非獨立於心所之外，而是遍與諸心所俱轉。"],"ming":[["心所","心所有法。恆依心起、與心相應、繫屬於心，具此三義者方是。"],["遍行","遍一切心、一切地、一切時、一切性而起之五心所。"],["別境","各別緣境方起之五心所，不遍一切。"],["不定","悔、眠、尋、伺四法，善惡無記三性不定，故別立一位。"],["三受","苦受、樂受、捨受。若開為五，則加憂受、喜受。"]]},{"id":6,"label":"遍行五・別境五","verses":[10],"kind":"verse","juan":[5,6],"chars":2028,"blocks":[{"t":"v","num":10,"lines":["初遍行觸等；次別境謂欲、","勝解、念、定、慧，所緣事不同。"],"juan":5},{"t":"p","text":"論曰：六位中初遍行心所，即觸等五，如前廣說。","juan":5},{"t":"p","text":"此遍行相，云何應知？","juan":5},{"t":"p","text":"由教及理，為定量故。","juan":5},{"t":"p","text":"此中教者，如契經言：眼、色為緣，生於眼識，三和合觸，與觸俱生有受、想、思，乃至廣說。由斯觸等四是遍行。","juan":5},{"t":"p","text":"又契經說：若根不壞，境界現前，作意正起，方能生識。餘經復言：⸢159⸣若⸤於此作意，即於此了別。若於此了別，即於此作意。是故此二，恒共和合，乃至廣說，由此作意，亦是遍行。","juan":5},{"t":"p","text":"此等聖教，誠證非一。","juan":5},{"t":"p","text":"理謂識起必有三和。彼定生觸，必由觸有。若無觸者，心、心所法，應不和合觸一境故。","juan":5},{"t":"p","text":"作意引心令趣自境。此若無者，心應無故。","juan":5},{"t":"p","text":"受能領納順、違、中境，令心等起歡、慼、捨相。無心起時，無隨一故。","juan":5},{"t":"p","text":"想能安立自境分齊。若心起時無此想者，應不能取境分齊相。","juan":5},{"t":"p","text":"思令心取正因等相，造作善等。無心起位，無此隨一，故必有思。","juan":5},{"t":"p","text":"由此證知，觸等五法，心起必有，故是遍行。餘非遍行，義至當說。","juan":5},{"t":"p","text":"次別境者：謂欲至慧，所緣境事，多分不同，於六位中，次初說故。","juan":5},{"t":"p","text":"云何為欲？","juan":5},{"t":"p","text":"於所樂境，希望為性，勤依為業。","juan":5},{"t":"p","text":"有義：所樂，謂可欣境。於可欣事，欲見、聞等，有希望故。","juan":5},{"t":"p","text":"於可厭事，希彼不合，望彼別離，豈非有欲？","juan":5},{"t":"p","text":"此但求彼不合離時，可欣自體，非可厭事。","juan":5},{"t":"p","text":"故於可厭及中容境，一向無欲。緣可欣事，若不希望，亦無欲起。","juan":5},{"t":"p","text":"有義：所樂，謂所求境。於可欣、厭，求合、離等，有希望故。於中容境，一向無欲。緣欣、厭事，若不希求，亦無欲起。","juan":5},{"t":"p","text":"有義：所樂，謂欲觀境，於一切事，欲觀察者，有希望故。若不欲觀，隨因境勢，任運緣者，即全無欲。","juan":5},{"t":"p","text":"由斯理趣，欲非遍行。","juan":5},{"t":"p","text":"有說：要由希望境力，諸心、心所方取所緣，故經說「欲為諸法本」。","juan":5},{"t":"p","text":"彼說不然。心等取境，由作意故。諸聖教說，作意現前能生識故。曾無處說由欲能生心、心所故。","juan":5},{"t":"p","text":"如說諸法，愛為根本，豈心、心所皆由愛生故？說⸢160⸣欲為⸤諸法本者，說欲所起一切事業。或說善欲，能發正勤。由彼助成一切善事，故論說此勤依為業。","juan":5},{"t":"p","text":"云何勝解？於決定境，印持為性，不可引轉為業。","juan":5},{"t":"p","text":"謂⸢161⸣邪⸤、正等教、理、證力，於所取境，審決印持，由此異緣不能引轉。","juan":5},{"t":"p","text":"故猶豫境，勝解全無。非審決心，亦無勝解。由斯勝解，非遍行攝。","juan":5},{"t":"p","text":"有說：心等取自境時，無拘礙故，皆有勝解。","juan":5},{"t":"p","text":"彼說非理。所以者何？能不礙者，即諸法故。所不礙者，即心等故。勝發起者，根、作意故。若由此故，彼勝發起，此應復待餘，便有無窮失。","juan":5},{"t":"p","text":"云何為念？於曾習境，令心明記不忘為性，定依為業。","juan":5},{"t":"p","text":"謂數憶持曾所受境，令不忘失，能引定故；於曾未受體、類境中，全不起念。設曾所受，不能明記，念亦不生。故念必非遍行所攝。","juan":5},{"t":"p","text":"有說：心起必⸢162⸣有⸤念俱，能為後時憶念因故。","juan":5},{"t":"p","text":"彼說非理。勿於後時有癡、信等，前亦有故。前心、心所，或想勢力，足為後時⸢163⸣憶⸤念因故。","juan":5},{"t":"p","text":"云何為定？於所觀境，令心專注不散為性，智依為業。","juan":5},{"t":"p","text":"謂觀⸢164⸣德⸤、失、俱非境中，由定令心專注不散，依斯便有決擇智生。","juan":5},{"t":"p","text":"「心專注」言，顯所欲住，即便能住，非唯一境。不爾，見道歷觀諸諦，前後境別，應無等持。","juan":5},{"t":"p","text":"若不繫心，專注境位，便無定起，故非遍行。","juan":5},{"t":"p","text":"有說：爾時亦有定起，但相微隱。應說誠言。","juan":5},{"t":"p","text":"若定能令心等和合，同趣一境，故是遍行，理亦不然，是觸用故。","juan":5},{"t":"p","text":"若謂此定，令剎那頃，心不易緣，故遍行攝，亦不應理；一剎那心，自於所緣，無易義故。","juan":5},{"t":"p","text":"若言由定，心取所緣，故遍行攝，彼亦非理；作意令心取所緣故。","juan":5},{"t":"p","text":"有說：此定體即是心。經說為心學，心一境性故。彼非誠證，依定攝心，令心一境，說彼言故。","juan":5},{"t":"p","text":"根、力、覺支、道支等攝。如念、慧等，非即心故。","juan":5},{"t":"p","text":"云何為慧？於所觀境，簡擇為性，斷疑為業。","juan":5},{"t":"p","text":"謂觀⸢165⸣德⸤、失、俱非境中，由慧推求，得決定故。於非觀境，愚昧心中，無簡擇故，非遍行攝。","juan":5},{"t":"p","text":"有說：爾時，亦有慧起，但相微隱。⸢166⸣天愛⸤寧知？對法說為大地法故；諸部對法，展轉相違，汝等如何執為定量？","juan":5},{"t":"p","text":"唯觸等五，經說遍行。說十非經，不應固執。然欲等五，非觸等故，定非遍行，如信、貪等。","juan":5},{"t":"p","text":"有義：此五定互相資。隨一起時，必有餘四。","juan":5},{"t":"p","text":"有義：不定。《瑜伽》說此四一切中，無後二故。又說此五，緣四境生，所緣、能緣，非定俱故。","juan":5},{"t":"p","text":"應說此五，或時起一：謂於所樂，唯起希望；或於決定，唯起印解；或於曾習，唯起憶念；或於所觀，唯起專注。謂愚昧類，為止散心，雖專注所緣，而不能簡擇。世共知彼有定無慧。","juan":5},{"t":"p","text":"彼加行位，少有聞、思，故說等持，緣所觀境；或依多分，故說是言。如「戲⸢167⸣忘⸤天」，專注一境，起貪、瞋等，有⸢168⸣定⸤無慧，諸如是等，其類⸢169⸣寔⸤繁。","juan":5},{"t":"p","text":"或於所觀，唯起簡擇，謂不專注，馳散推求。","juan":5},{"t":"p","text":"或時起二：謂於所樂、決定境中，起欲、勝解；或於所樂、曾習境中，起欲及念。如是乃至於所觀境，起定及慧，⸢170⸣合⸤有十二。","juan":5},{"t":"p","text":"或時起三：謂於所樂、決定、曾習，起欲、解、念；如是乃至於曾、所觀起念、定、慧，合有十三。","juan":5},{"t":"p","text":"或時起四：謂於所樂、決定、曾習、所觀境中，起前四種；如是乃至於定、曾習、所觀境中，起後四種，合有五四。","juan":5},{"t":"p","text":"或時起五：謂於所樂、決定、曾習、所觀境中，具起五種。","juan":5},{"t":"p","text":"如是於四，起欲等五，總、別合有三十一句。","juan":5},{"t":"p","text":"或有心位，五皆不起，如非四境，率爾墮心，及藏識俱，此類非一。","juan":5},{"t":"p","text":"第七、八識，此別境五，隨位有無，如前已說。","juan":5},{"t":"p","text":"第六意識諸位容俱，依轉、未轉，皆不遮故。","juan":5},{"t":"p","text":"有義：五識，此五皆無；緣已得境，無希望故；不能審決，無印持故；恒取新境，無追憶故；自性散動，無專注故；不能推度，無簡擇故。","juan":5},{"t":"p","text":"有義：五識，容有此五：雖無於境增上希望，而有微劣樂境義故；於境雖無增上審決，而有微劣印境義故；雖無明記曾習境體，而有微劣念境類故。","juan":5},{"t":"p","text":"雖不作意繫念一境，而有微劣專注義故。遮等引故，說性散動，非遮等持，故容有定。","juan":5},{"t":"p","text":"雖於所緣不能推度，而有微劣簡擇義故。由此聖教說眼、耳通，是眼、耳識相應智性。餘三准此有慧無失。","juan":5},{"t":"p","text":"未自在位，此五或無；得自在時，此五定有。","juan":5},{"t":"p","text":"樂觀諸境，欲無減故；印境勝解，常無減故；⸢171⸣憶習⸤曾受，念無減故；又佛五識，緣三世故；如來無有不定心故；五識皆有作事智故。","juan":5},{"t":"p","text":"此別境五，何受相應？","juan":5},{"t":"p","text":"有義：欲三，除憂、苦受，以彼二境，非所樂故。餘四通四，唯除苦受，以審決等，五識無故。","juan":5},{"t":"p","text":"有義：一切，五受相應。論說憂根於無上法，思慕愁慼，求欲證故。純受苦處，希求解脫，意有苦根，前已說故。論說貪愛，憂、苦相應。此貪愛俱，必有欲故。苦根既有，意識相應，審決等四，苦俱何咎？又五識俱，亦有微細印境等四，義如前說。","juan":5},{"t":"p","text":"由斯欲等，五受相應。","juan":5},{"t":"p","text":"此五復依性、界、學等諸門分別，如理應思。","juan":5},{"t":"p","text":"已說遍行、別境二位。善位心所，其相云何？","juan":6},{"t":"p","text":"頌曰：","juan":6}],"kepan":[],"yi":"六位之初是遍行，即觸、作意、受、想、思五法；其次是別境，即欲、勝解、念、定、慧五法。別境所以別立，因其各各所緣之事不同，非如遍行之通一切境。","yao":["遍行五法的成立以「四一切」為準：遍一切性、一切地、一切時、一切俱。四義具足者唯此五法。","觸為三和（根、境、識）所生，能令心心所觸境，是餘心所生起之所依，故列遍行之首。","別境五法各有定境：欲緣所樂、勝解緣決定、念緣曾習、定緣所觀、慧緣所觀而簡擇。境不同故行相不同，不可互攝。","定與慧同緣所觀境而作用有別：定令心專注不散，慧於境揀擇決斷；止觀雙運之教理根據即在此。"],"ming":[["觸","根境識三和，令心心所觸對於境。遍行之首。"],["作意","警覺應起之心種，引心趣境。"],["受","領納順違俱非之境相。"],["想","於境取像，施設種種名言。"],["思","令心造作，於善惡等役心為業，即業之自性。"],["欲","於所樂境希望為性。"],["勝解","於決定境印持為性，不可引轉。"],["念","於曾習境令心明記不忘。"],["定","於所觀境令心專注不散。"],["慧","於所觀境簡擇為性，斷疑為業。"]]},{"id":7,"label":"善十一","verses":[11],"kind":"verse","juan":[6],"chars":2740,"blocks":[{"t":"v","num":11,"lines":["善謂信、慚、愧、無貪等三根，","勤、安、不放逸、行捨及不害。"],"juan":6},{"t":"p","text":"論曰：唯善心俱，名善心所。謂信、慚等，定有十一。","juan":6},{"t":"p","text":"云何為信？於實、德、能，深忍、樂、欲，心淨為性；對治不信，樂善為業。","juan":6},{"t":"p","text":"然信差別，略有三種：一、信實有，謂於諸法實事、理中，深信忍故；二、信有德，謂於三寶真淨德中，深信樂故；三、信有能，謂於一切世、出世善，深信有力，能得能成，起希望故。","juan":6},{"t":"p","text":"由斯對治⸢172⸣彼不信⸤心，愛樂證修世、出世善。","juan":6},{"t":"p","text":"忍謂勝解，此即信因；樂欲謂欲即是信果。⸢173⸣礭⸤陳此信，自相是何？","juan":6},{"t":"p","text":"豈不適言，心淨為性？","juan":6},{"t":"p","text":"此猶未了，彼「心淨」言，若淨即心，應非心所；若令心淨，慚等何別？心俱淨法，為難亦然。","juan":6},{"t":"p","text":"此性澄清，能淨心等。以心勝故，立心淨名。如水清珠，能清濁水。慚等雖善，非淨為相。此淨為相，無濫彼失。又諸染法，各別有相。唯有不信，自相渾濁，復能渾濁餘心、心所。如極穢物，自穢穢他。信正翻彼，故淨為相。","juan":6},{"t":"p","text":"有說：信者愛樂為相。應通三性，體應即欲。又應苦、集非信所緣。","juan":6},{"t":"p","text":"有執信者隨順為相。應通三性，即勝解、欲。若印順者，即勝解故。若樂順者，即是欲故。離彼二體，無順相故。由此應知，心淨是信。","juan":6},{"t":"p","text":"云何為慚？依自、法力，崇重賢、善為性；對治無慚，止息惡行為業。謂依自、法尊、貴增上，崇重賢、善，羞恥過惡，對治無慚，息諸惡行。","juan":6},{"t":"p","text":"云何為愧？依世間力，輕拒暴惡為性；對治無愧，止息惡行為業。謂依世間訶、厭增上，輕拒暴惡，羞恥過罪，對治無愧，息諸惡業。","juan":6},{"t":"p","text":"羞恥過惡是二通相；故諸聖教，假說為體。","juan":6},{"t":"p","text":"若執羞恥，為二別相，應慚與愧，體無差別。則此二法定不相應，非受、想等有此義故。若待自、他，立二別者，應非實有，便違聖教。若許慚、愧實而別起，復違論說十遍善心。","juan":6},{"t":"p","text":"崇重、輕拒若二別相，所緣有異，應不俱生。二失既同，何乃偏責？誰言二法所緣有異？不爾，如何？善心起時，隨緣何境，皆有崇重善，及輕拒惡義。故「慚」與「愧」，俱遍善心，所緣無別。豈不我說亦有此義？汝執「慚」、「愧」自相既同，何理能遮前所設難？","juan":6},{"t":"p","text":"然聖教說：「⸢174⸣顧⸤自、他者」，自法名自，世間名他。或即此中，崇拒善惡，於己益損，名自、他故。","juan":6},{"t":"p","text":"「無貪等」者，等無瞋、癡。此⸢175⸣三⸤名根，生善勝故。三不善根，近對治故。","juan":6},{"t":"p","text":"云何無貪？於有、有具，無著為性；對治貪著，作善為業。","juan":6},{"t":"p","text":"云何無瞋？於苦、苦具，無恚為性；對治瞋恚，作善為業。","juan":6},{"t":"p","text":"善心起時，隨緣何境，皆於有等，無著、無恚，觀有等立，非要緣彼。如前慚、愧，觀善、惡立，故此二種，俱遍善心。","juan":6},{"t":"p","text":"云何無癡？於諸理事，明解為性；對治愚癡，作善為業。","juan":6},{"t":"p","text":"有義：無癡即慧為性。《集論》說：此報、教、證、智決擇為體，生得、聞、思、修所生慧。如次皆是決擇性故。","juan":6},{"t":"p","text":"此雖即慧，為顯善品，有勝功能，如煩惱見，故復別說。","juan":6},{"t":"p","text":"有義：無癡非即是慧，別有自性，正對無明。如無貪、瞋，善根攝故。","juan":6},{"t":"p","text":"論說：大悲無瞋、癡攝，非根攝故。若彼無癡，以慧為性，大悲如力等，應慧等根攝。又若無癡無別自性，如不害等，應非實物。便違論說：十一善中，三世俗有，餘皆是實。","juan":6},{"t":"p","text":"然《集論》說：慧為體者，舉彼因果，顯此自性。如以忍、樂，表「信」自體，理必應爾。","juan":6},{"t":"p","text":"以貪、瞋、癡六識相應，正煩惱攝。起惡勝故，立不善根。斷彼必由通、別對治。通唯善慧，別即三根。由此無癡必應別有。","juan":6},{"t":"p","text":"勤謂精進，於善、惡品修、斷事中，勇、悍為性；對治懈怠，滿善為業。","juan":6},{"t":"p","text":"「勇」表⸢176⸣勝⸤進，簡諸染法。「悍」表精純，簡淨無記。即顯精進，唯善性攝。","juan":6},{"t":"p","text":"此相差別略有五種。所謂：被甲、加行、無下、無退、無足。","juan":6},{"t":"p","text":"即經所說：有勢、有勤、有勇、堅猛、不捨善軛，如次應知。","juan":6},{"t":"p","text":"此五別者，謂初發心、自分、勝進，自分行中，三品別故；或初發心、長時、無間、慇重、無餘，修差別故；或資糧等，五道別故。二乘究竟道，欣大菩提故，諸佛究竟道，樂利樂他故；或二加行、無間、解脫、勝進別故。","juan":6},{"t":"p","text":"「安」謂輕安，遠離麁重，調暢身心，堪任為性；對治惛沈，轉依為業。","juan":6},{"t":"p","text":"謂此伏除能障定法，令所依止，轉安適故。","juan":6},{"t":"p","text":"「不放逸」者：精進、三根，於所斷、修，防、修為性；對治放逸，成滿一切世、出世間善事為業。","juan":6},{"t":"p","text":"謂即四法，於斷修事，皆能防、修，名不放逸。非別有體，無異相故。於防惡事、修善事中，離四功能，無別用故。雖信、慚等，亦有此能，而方彼四，勢用微劣；非根、遍策，故非此依。","juan":6},{"t":"p","text":"豈不防、修是此相用？","juan":6},{"t":"p","text":"防、修何異精進、三根？","juan":6},{"t":"p","text":"彼要待此，方有作用。","juan":6},{"t":"p","text":"此應復待餘，便有無窮失。","juan":6},{"t":"p","text":"勤唯遍策，根但為依，如何說彼有防、修用？","juan":6},{"t":"p","text":"汝防、修用，其相云何？","juan":6},{"t":"p","text":"若普依持，即無貪等。若遍策錄，不異精進。止惡、進善，即總四法。令不散亂，應是等持。令同取境，與觸何別？令不忘失，即應是念。","juan":6},{"t":"p","text":"如是推尋不放逸用，離無貪等，竟不可得。故不放逸，定無別體。","juan":6},{"t":"p","text":"云何「行捨」？精進、三根，令心平等、正直、無功用住為性；對治掉舉，靜住為業。","juan":6},{"t":"p","text":"謂即四法，令心遠離掉舉等障，靜住名捨。平等、正直、無功用住，初、中、後位，⸢177⸣辯⸤捨差別。由不放逸先除雜染；捨復令心寂靜而住。","juan":6},{"t":"p","text":"此無別體，如不放逸，離彼四法，無相、用故。能令寂靜，即四法故；所令寂靜，即心等故。","juan":6},{"t":"p","text":"云何「不害」？於諸有情，不為損惱，無瞋為性；能對治害，悲愍為業。","juan":6},{"t":"p","text":"謂即無瞋，於有情所，不為損惱，假名不害。","juan":6},{"t":"p","text":"無瞋，翻對斷物命瞋；不害，正違損惱物害。無瞋與樂；不害拔苦。是謂此二麁相差別。","juan":6},{"t":"p","text":"理實無瞋實有自體；不害依彼一分假立。為顯慈、悲，二相別故。利樂有情，彼二勝故。","juan":6},{"t":"p","text":"有說：不害非即無瞋，別有自體，謂賢善性。此相云何？謂不損惱。無瞋亦爾，寧別有性？謂於有情不為損惱，慈悲賢善，是無瞋故。","juan":6},{"t":"p","text":"「及」顯十一，義別心所，謂欣、厭等善心所法。雖義有別，說種種名，而體無異，故不別立。","juan":6},{"t":"p","text":"欣謂欲俱，無瞋一分，於所欣境，不憎恚故。","juan":6},{"t":"p","text":"不忿、恨、惱、嫉等亦然；隨應正翻瞋一分故。","juan":6},{"t":"p","text":"厭謂慧俱無貪一分，於所厭境，不染著故。","juan":6},{"t":"p","text":"不慳、憍等，當知亦然。隨應正翻，貪一分故。","juan":6},{"t":"p","text":"不覆、誑、諂無貪、癡一分；隨應正翻，貪、癡一分故。","juan":6},{"t":"p","text":"有義：不覆唯無癡一分；無處說覆亦貪一分故。","juan":6},{"t":"p","text":"有義：不慢信一分攝，謂若信彼，不慢彼故。有義：不慢捨一分攝，心平等者，不高慢故。有義：不慢慚一分攝，若崇重彼，不慢彼故。","juan":6},{"t":"p","text":"有義：不疑即信所攝，謂若信彼，無猶豫故。有義：不疑：即正勝解，以決定者，無猶豫故。有義：不疑即正慧攝，以正見者，無猶豫故。","juan":6},{"t":"p","text":"不散亂體，即正定攝。正見、正知，俱善慧攝。不忘念者，即是正念。","juan":6},{"t":"p","text":"悔、眠、尋、伺，通染、不染，如觸、欲等，無別翻對。","juan":6},{"t":"p","text":"何緣諸染所翻善中，有別建立，有不爾者？","juan":6},{"t":"p","text":"相、用別者，便別立之；餘善不然，故不應責。又諸染法遍六識者，勝故翻之，別立善法。慢等、忿等，唯意識俱。害雖亦然，而數現起損惱他故；障無上乘勝因悲故；為了知彼增上過失，翻立不害。失念、散亂及不正知，翻入別境，善中不說。","juan":6},{"t":"p","text":"染、淨相翻，淨寧少染？","juan":6},{"t":"p","text":"淨勝染劣，少敵多故。又解理通，說多同體，迷情事局，隨相分多。故於染、淨，不應齊責。","juan":6},{"t":"p","text":"此十一法，三是假有，謂不放逸、捨及不害，義如前說。餘八實有，相、用別故。","juan":6},{"t":"p","text":"有義：十一四遍善心，精進、三根，遍善品故。餘七不定。","juan":6},{"t":"p","text":"推尋事理，未決定時，不生信故。慚、愧同類，依處各別，隨起一時，第二無故。要世間道斷煩惱時，有輕安故。不放逸、捨，無漏道時，方得起故。悲愍有情時，乃有不害故。","juan":6},{"t":"p","text":"論說：十一六位中起。謂決定位，有信相應。止息染時，有慚、愧起，顧自、他故。於善品位，有精進、三根。世間道時，有輕安起，於出世道，有捨、不放逸。攝眾生時，有不害故。","juan":6},{"t":"p","text":"有義：彼說未為應理。推尋事理，未決定心，信若不生，應非是善。如染心等，無淨信故。","juan":6},{"t":"p","text":"慚、愧類異，依別境同，俱遍善心，前已說故。","juan":6},{"t":"p","text":"若出世道輕安不生，應此覺支非無漏故。","juan":6},{"t":"p","text":"若世間道無捨、不放逸，應非寂靜防惡修善故；又應不伏掉、放逸故。有漏善心既具四法，如出世道應有二故。","juan":6},{"t":"p","text":"善心起時，皆不損物，違能損法，有不害故。","juan":6},{"t":"p","text":"論說：「六位起十一」者，依彼彼增，作此此說。故彼所說，定非應理。","juan":6},{"t":"p","text":"應說信等十一法中，十遍善心，輕安不遍。要在定位，方有輕安，調暢身心，餘位無故。","juan":6},{"t":"p","text":"〈決擇分〉說：十善心所定、不定地皆遍善心，定地心中，增輕安故。","juan":6},{"t":"p","text":"有義：定加行，亦得定地名。彼亦微有調暢義故。由斯欲界亦有輕安。不爾，便違〈本地分〉說：信等十一通一切地。","juan":6},{"t":"p","text":"有義：輕安唯在定有。由定滋養，有調暢故。論說：欲界諸心、心所，由⸢178⸣闕⸤輕安，名不定地。說一切地有十一者，通有尋伺等三地皆有故。","juan":6},{"t":"p","text":"此十一種，前已具說。第七、八識，隨位有無。第六識中，定位皆具。若非定位，唯⸢179⸣闕⸤輕安。","juan":6},{"t":"p","text":"有義：五識唯有十種，自性散動，無輕安故。","juan":6},{"t":"p","text":"有義：五識亦有輕安。定所引善者，亦有調暢故。成所作智俱，必有輕安故。","juan":6},{"t":"p","text":"此善十一，何受相應？十五相應。一除憂、苦，有逼迫受，無調暢故。","juan":6},{"t":"p","text":"此與別境皆得相應。信等欲等，不相違故。","juan":6},{"t":"p","text":"十一唯善。","juan":6},{"t":"p","text":"輕安非欲，餘通三界。","juan":6},{"t":"p","text":"皆學等三。","juan":6},{"t":"p","text":"非見所斷。《瑜伽論》說：信等六根，唯修所斷，非⸢180⸣見所斷⸤。","juan":6},{"t":"p","text":"餘門分別，如理應思。","juan":6},{"t":"p","text":"如是已說善位心所，煩惱心所其相云何？","juan":6},{"t":"p","text":"頌曰：","juan":6}],"kepan":[],"yi":"善位心所謂：信、慚、愧，無貪、無瞋、無癡等三善根，以及勤（精進）、輕安、不放逸、行捨與不害，合為十一。","yao":["信列善首，論釋信有三相：信實有（於諸法實事理深信忍可）、信有德（於三寶淨德深生希慕）、信有能（於一切善深信己力能得能成）。以心淨為性，對治不信。","慚愧二法別依自他：慚崇重賢善、顧己而恥過，愧輕拒暴惡、顧他而羞惡。論主與有部就自他配屬有異，讀者宜留意其抉擇。","三善根（無貪、無瞋、無癡）是善法之根本，與根本煩惱之貪瞋癡正相對治，一切善法多依此而生長。","不放逸與行捨並非別有自體，論主判為依精進與三善根分位假立，此「假立」之判是唯識學辨析法體的典型手法。"],"ming":[["信","於實德能深忍樂欲，心淨為性，對治不信、樂善為業。"],["慚","依自法力，崇重賢善，羞恥過惡。"],["愧","依世間力，輕拒暴惡，羞恥罪過。"],["三善根","無貪、無瞋、無癡。與貪瞋癡三不善根相翻。"],["輕安","遠離麁重，調暢身心，堪任為性。唯定地有。"],["行捨","令心平等正直、無功用住，依精進與三根分位假立。"],["不害","於諸有情不為損惱，依無瞋分位假立，慈悲之體。"]]},{"id":8,"label":"根本煩惱六","verses":[12],"kind":"verse","juan":[6],"chars":2490,"blocks":[{"t":"v","num":12,"lines":["煩惱謂貪、瞋、癡、慢、疑、惡見。"],"juan":6},{"t":"p","text":"論曰：此貪等六性是根本煩惱攝故，得煩惱名。","juan":6},{"t":"p","text":"云何為貪？於有、有⸢181⸣具⸤，染著為性；能障無貪，生苦為業。","juan":6},{"t":"p","text":"謂由愛力，取蘊生故。","juan":6},{"t":"p","text":"云何為瞋？於苦、苦具，憎恚為性；能障無瞋，不安⸢182⸣隱性⸤，惡行所依為業。","juan":6},{"t":"p","text":"謂瞋必令身、心熱惱，起諸惡業，不善性故。","juan":6},{"t":"p","text":"云何為癡？於諸理、事，迷闇為性；能障無癡，一切雜染所依為業。","juan":6},{"t":"p","text":"謂由無明，起疑、邪⸢183⸣見⸤、貪等煩惱、隨煩惱業，能招後生雜染法故。","juan":6},{"t":"p","text":"云何為慢？恃己於他，高舉為性；能障不慢，生苦為業。","juan":6},{"t":"p","text":"謂若有慢，於德、有德，心不謙下，由此生死輪轉無窮，受諸苦故。","juan":6},{"t":"p","text":"此慢差別有七、九種，謂於三品、我、德處生。","juan":6},{"t":"p","text":"一切皆通見修所斷，聖位我慢既得現行，慢類由斯起亦無失。","juan":6},{"t":"p","text":"云何為疑？於諸諦理，猶豫為性；能障不疑善品為業。","juan":6},{"t":"p","text":"謂猶豫者，善不生故。","juan":6},{"t":"p","text":"有義：此疑以慧為體，猶豫簡擇說為疑故。「毘」助「末底」，是疑義故，「末底」般若義無異故。","juan":6},{"t":"p","text":"有義：此疑別有自體，令慧不決，非即慧故。《瑜伽論》說：「六煩惱中，見世俗有，即慧分故。餘是實有，別有性故。」「毘」助「末底」，執慧為疑，「毘」助「若南」，智應為識。界由助力，義便轉變，是故此疑非⸢184⸣慧⸤為體。","juan":6},{"t":"p","text":"云何惡見？於諸諦理，顛倒推⸢185⸣⸤⸢186⸣度⸤，染慧為性；能障善見，招苦為業。","juan":6},{"t":"p","text":"謂惡見者，多受苦故。","juan":6},{"t":"p","text":"此見行相，差別有五：","juan":6},{"t":"p","text":"一、薩迦⸢187⸣耶⸤見：謂於五取蘊，執我、我所，一切見趣所依為業。","juan":6},{"t":"p","text":"此見差別，有二十句、六十五等，分別起攝。","juan":6},{"t":"p","text":"二、邊執見：謂即於彼，隨執斷、常，障處中行、出離為業。","juan":6},{"t":"p","text":"此見差別，諸見趣中，有執前際四遍常論、一分常論；及計後際有想十六；無想、俱非各有八論；七斷⸢188⸣滅⸤論等，分別⸢189⸣起⸤攝。","juan":6},{"t":"p","text":"三、邪見：謂謗因果、作用、實事及非四見諸餘邪執，如增上緣，名義遍故。","juan":6},{"t":"p","text":"此見差別，諸見趣中，有執前際二無因論、四有邊等、不死矯亂；及計後際五現涅槃；或計自在、世主、釋、梵及餘物類，常恒不易；或計自在等是一切物因；或有橫計諸邪解脫；或有妄執非道為道，諸如是等皆邪見攝。","juan":6},{"t":"p","text":"四、見取：謂於諸見及所依蘊，執為最勝，能得清淨，一切鬪諍所依為業。","juan":6},{"t":"p","text":"五、戒禁取：謂於隨順諸見戒禁及所依蘊，執為最勝，能得清淨，無利勤苦所依為業。","juan":6},{"t":"p","text":"然有處說：執為最勝，名為見取，執能得⸢190⸣清⸤淨，名戒取者，是影略說，或隨轉門。不爾，如何非滅計滅、非道計道，說為邪見，非二取攝。","juan":6},{"t":"p","text":"如是總別十煩惱中，六通俱生及分別起，任運、思察，俱得生故。疑後三見，唯分別起，要由惡友⸢191⸣或⸤邪教力，自審思察，方得生故。","juan":6},{"t":"p","text":"邊執見中通俱生者，有義：唯斷。常見相麁，惡友等力方引生故。《瑜伽》等說：「何邊執見是俱生⸢192⸣耶⸤？謂斷見攝。」學現觀者，起如是怖：「今者我，我何所在⸢193⸣耶⸤？」故禽獸等若遇違緣，皆恐我斷，而起驚怖。","juan":6},{"t":"p","text":"有義：彼論依麁相說，理實俱生，亦通常見。謂禽獸等，執我常存，熾然⸢194⸣聚⸤集長時資具。故《顯揚》等諸論皆說：於五取蘊，執斷、計常，或是俱生或分別起。","juan":6},{"t":"p","text":"此十煩惱，誰幾相應？","juan":6},{"t":"p","text":"貪與瞋、⸢195⸣疑，⸤定不俱起，愛、憎二境，必不同故；於境不決，無染著故。","juan":6},{"t":"p","text":"貪與慢、見，或得相應，所愛、所陵境非一故，說不俱起。所染、所恃境可同故，說得相應。於五見境，皆可愛故，貪與五見相應無失。","juan":6},{"t":"p","text":"瞋與慢、疑或得俱起；所瞋、所恃境非一故，說不相應。所蔑、所憎境可同故，說得俱起；初猶豫時，未憎彼故，說不俱起。久思不決，便憤發故，說得相應；疑順、違事，隨應亦爾。","juan":6},{"t":"p","text":"瞋與二取，必不相應，執為勝、道，不憎彼故。","juan":6},{"t":"p","text":"此與三見，或得相應，於有樂蘊，起身、常見，不生憎故，說不相應。於有苦蘊，起身、常見，生憎恚故，說得俱起。斷見翻此，說瞋有、無。邪見誹撥惡事、好事，如次說瞋或無或有。","juan":6},{"t":"p","text":"慢於境定，疑則不然。故慢與疑，無相應義。","juan":6},{"t":"p","text":"慢與五見，皆容俱起，行相展轉，不相違故。然與斷見，必不俱生，執我斷時，無陵、恃故。","juan":6},{"t":"p","text":"與身、⸢196⸣邪⸤見一分亦爾。","juan":6},{"t":"p","text":"疑不審決，與見相違，故疑與見，定不俱起。","juan":6},{"t":"p","text":"五見展轉，必不相應，非一心中，有多慧故。","juan":6},{"t":"p","text":"癡與九種，皆定相應，諸煩惱生，必由癡故。","juan":6},{"t":"p","text":"此十煩惱，何識相應？藏識全無；末那有四；意識具十；五識唯三：謂貪、瞋、癡。無分別故。由稱量等，起慢等故。","juan":6},{"t":"p","text":"此十煩惱，何受相應？","juan":6},{"t":"p","text":"貪、瞋、癡三，俱生分別，一切容與五受相應。貪會違緣，憂、苦俱故；瞋遇順境，喜、樂俱故。","juan":6},{"t":"p","text":"有義：俱生分別起慢，容與非苦四受相應，恃苦劣蘊，憂相應故。","juan":6},{"t":"p","text":"有義：俱生亦苦俱起，意有苦受，前已說故。","juan":6},{"t":"p","text":"分別慢等，純苦趣無，彼無邪師、邪教等故。然彼不造引惡趣業，要分別起能發彼故。","juan":6},{"t":"p","text":"疑後三見，容四受俱。欲疑無苦等，亦喜受俱故；二取若緣憂俱見等，爾時得與憂相應故。","juan":6},{"t":"p","text":"有義：俱生身邊二見，但與喜、樂、捨、受相應，非五識俱，唯無記故。分別二見，容四受俱，執苦俱蘊為我、我所。常、斷見翻此，與憂相應故。","juan":6},{"t":"p","text":"有義：二見若俱生者，亦苦受俱，純受苦處，緣極苦蘊，苦相應故。論說：俱生一切煩惱，皆於三受現行可得，廣說如前，餘如前說。","juan":6},{"t":"p","text":"此依實義，隨麁相者，貪、慢、四見，樂、喜、捨俱。瞋唯苦、憂、捨受俱起。癡與五受皆得相應。邪見及疑四俱，除苦。","juan":6},{"t":"p","text":"貪、癡俱樂，通下四地，餘七俱樂，除欲通三，疑、獨行癡欲唯憂、捨，餘受俱起，如理應知。","juan":6},{"t":"p","text":"此與別境幾互相應？","juan":6},{"t":"p","text":"貪、瞋、癡、慢容五俱起，專注一境，得有定故。疑及五見，各容四俱，疑除勝解，不決定故；見非慧俱，不異慧故。","juan":6},{"t":"p","text":"此十煩惱何性所攝？","juan":6},{"t":"p","text":"瞋唯不善，損自、他故，餘九通二。","juan":6},{"t":"p","text":"上二界者，唯無記攝，定所伏故。若欲界繫分別起者，唯不善攝，發惡行故。若是俱生，發惡行者，亦不善攝，損自、他故。餘無記攝，細不障善，非極損惱自、他處故。當知俱生身、邊二見，唯無記攝，不發惡業，雖數現⸢197⸣起⸤，不障善故。","juan":6},{"t":"p","text":"此十煩惱何界繫⸢198⸣耶⸤？瞋唯在欲，餘通三界。","juan":6},{"t":"p","text":"生在下地，未離下染，上地煩惱，不現在前。要得彼地根本定者，彼地煩惱容現前故。","juan":6},{"t":"p","text":"⸢199⸣謂⸤有漏道，雖不能伏分別起惑及細俱生，而能伏除俱生麁惑，漸次證得上根本定。","juan":6},{"t":"p","text":"彼但迷事，依外門轉，散亂、麁動，正障定故。","juan":6},{"t":"p","text":"得彼定已，彼地分別、俱生諸⸢200⸣惑⸤，皆容現前。","juan":6},{"t":"p","text":"生在上地，下地諸惑，分別、俱生皆容現起。","juan":6},{"t":"p","text":"生第四定中有中者，由謗解脫，生地獄故；身在上地，將生下時，起下潤生俱生愛故。","juan":6},{"t":"p","text":"而言生上，不起下者，依多分說，或隨轉門。","juan":6},{"t":"p","text":"下地煩惱，亦緣上地。《瑜伽》等說：欲界繫貪，求上地生，味上定故。既說瞋恚憎嫉滅、道，亦應憎嫉離欲地故。總緣諸行，執我、我所斷常，慢者得緣上故。餘五緣上，其理極成。","juan":6},{"t":"p","text":"而有處言：貪、瞋、慢等不緣上者，依麁相說，或依別緣，不見世間執他地法為我等故；邊見必依身見起故。","juan":6},{"t":"p","text":"上地煩惱亦緣下地，說生上者，於下有情，恃己勝德，而陵彼故。","juan":6},{"t":"p","text":"總緣諸行，執我、我所、斷、常、愛者，得緣下故。疑後三見，如理應思。","juan":6},{"t":"p","text":"而說上⸢201⸣或⸤不緣下者，彼依多分或別緣說。","juan":6},{"t":"p","text":"此十煩惱，學等何攝？非學無學，彼唯善故。","juan":6},{"t":"p","text":"此十煩惱何所斷⸢202⸣耶⸤？","juan":6},{"t":"p","text":"非非所斷，彼非染故。","juan":6},{"t":"p","text":"分別起者，唯見所斷，麁易斷故；若俱生者，唯修所斷，細難斷故。","juan":6},{"t":"p","text":"見所斷十，實俱頓斷，以真見道總緣諦故。","juan":6},{"t":"p","text":"然迷諦相，有總、有別。總謂十種，皆迷四諦。苦、集是彼因依處故；滅、道是彼怖畏處故。","juan":6},{"t":"p","text":"別謂別迷四諦相起，二唯迷苦，八通迷四，身、邊二見，唯果處起，別空、非我，屬苦諦故。","juan":6},{"t":"p","text":"謂疑、三見，親迷苦理。二取執彼三見、戒禁及所依蘊為勝能淨，於自、他見及彼眷屬，如次隨應，起貪、恚、慢。相應無⸢203⸣明⸤，與九同迷；不共無明，親迷苦理。疑及邪見，親迷集等。二取、貪等，⸢204⸣准⸤苦應知。然瞋亦能親迷滅、道，由怖畏彼，生憎嫉故。","juan":6},{"t":"p","text":"迷諦親疎，麁相如是。","juan":6},{"t":"p","text":"委細說者，貪、瞋、慢、三見、疑俱生，隨應如彼。","juan":6},{"t":"p","text":"俱生二見及彼相應愛、慢、無明，雖迷苦諦，細難斷故，修道方斷。","juan":6},{"t":"p","text":"瞋餘愛等，迷別事生，不違諦觀，故修所斷。","juan":6},{"t":"p","text":"雖諸煩惱，皆有相分，而所⸢205⸣仗⸤質，或有或無，名緣有事、無事煩惱。","juan":6},{"t":"p","text":"彼親所緣，雖皆有漏，而所⸢206⸣仗⸤質，亦通無漏，名緣有漏、無漏煩惱。","juan":6},{"t":"p","text":"緣自地者，相分似質，名緣分別所起事境。緣滅、道諦及他地者，相分與質不相似故，名緣分別所起名境。","juan":6},{"t":"p","text":"餘門分別如理應思。","juan":6},{"t":"p","text":"已說根本六煩惱相，諸隨煩惱其相云何？","juan":6},{"t":"p","text":"頌曰：","juan":6},{"t":"v","num":null,"lines":["隨煩惱謂：忿、恨、覆、惱、嫉、慳、"],"juan":6}],"kepan":[],"yi":"根本煩惱有六：貪、瞋、癡（無明）、慢、疑，以及惡見。此六是一切雜染法的根本，能生隨煩惱、能發起業行、能潤生後有，故長行於此廣辨其體性、業用、相應識類、界地繫屬，以及俱生與分別之別。","yao":["惡見開為五種：薩迦耶見（身見）、邊執見、邪見、見取見、戒禁取見。六煩惱開為十使，即所謂十根本煩惱。","六煩惱有俱生與分別二類：俱生者任運而起，無始串習所成，唯修道所斷；分別者依邪教邪思而起，見道所斷。二障之伏斷次第即依此分。","煩惱之「根本」義在於能生隨煩惱、能發業潤生，故名根本；隨煩惱則是其分位差別或等流。","本論於此處詳辨我見唯屬何識、疑與見是否相應、瞋唯欲界繫等問題，是判斷煩惱現行界地的細部依據。"],"ming":[["貪","於有及有具染著為性，能障無貪、生苦為業。"],["瞋","於苦及苦具憎恚為性，能障無瞋、不安隱性所依為業。"],["癡","無明。於諸理事迷闇為性，一切雜染所依。"],["慢","恃己於他高舉為性。開為七慢、九慢。"],["疑","於諸諦理猶豫為性，能障不疑及諸善品。"],["惡見","於諸諦理顛倒推度、染慧為性。開為五見。"],["薩迦耶見","於五取蘊執我我所，一切見趣之所依。"],["戒禁取","於非因計因、非道計道，執取邪戒邪禁為得清淨。"]]},{"id":9,"label":"隨煩惱二十・不定四","verses":[13,14],"kind":"verse","juan":[6,7],"chars":4901,"blocks":[{"t":"v","num":13,"lines":["誑、諂與害、憍、無慚⸢207⸣與⸤無愧、","掉舉與惛沈、不信并懈怠、"],"juan":6},{"t":"v","num":14,"lines":["放逸及失念、散亂不正知。"],"juan":6},{"t":"p","text":"論曰：唯是煩惱分位差別、等流性，故名隨煩惱。","juan":6},{"t":"p","text":"此二十種，類別有三：謂忿等十，各別起故，名小隨煩惱；無慚等二，遍不善故，名中隨煩惱；掉舉等八，遍染心故，名大隨煩惱。","juan":6},{"t":"p","text":"云何為忿？依對現前不饒益境，憤發為性；能障不忿，執⸢208⸣杖⸤為業。謂懷忿者，多發暴惡身表業故。此即瞋恚一分為體，離瞋無別忿相用故。","juan":6},{"t":"p","text":"云何為恨？由忿為先，懷惡不捨，結怨為性；能障不恨，熱惱為業。謂結恨者，不能含忍，恒熱惱故。此亦瞋恚一分為體，離瞋無別恨相用故。","juan":6},{"t":"p","text":"云何為覆？於自作罪，恐失利、譽，隱藏為性；能障不覆，悔惱為業。謂覆罪者，後必悔惱，不安隱故。","juan":6},{"t":"p","text":"有義：此覆，癡一分攝。論唯說此癡一分故，不懼當苦，覆自罪故。","juan":6},{"t":"p","text":"有義：此覆，貪、癡一分攝，亦恐失利譽，覆自罪故。論據麁顯，唯說癡分，如說掉舉是貪分故，然說掉舉遍諸染心，不可執為唯是貪分。","juan":6},{"t":"p","text":"云何為惱？忿、恨為先，追觸暴熱，⸢209⸣佷⸤戾為性；能障不惱，⸢210⸣䖧⸤螫為業。謂追往惡，觸現違緣，心便⸢211⸣佷⸤戾，多發囂暴、凶鄙麁言，⸢212⸣䖧⸤螫他故。此亦瞋恚一分為體，離瞋無別惱相用故。","juan":6},{"t":"p","text":"云何為嫉？⸢213⸣徇⸤自名利，不耐他榮，⸢214⸣妬⸤忌為性；能障不嫉，憂慼為業。謂嫉⸢215⸣妬⸤者聞見他榮，深懷憂慼，不安⸢216⸣隱⸤故。此亦瞋恚一分為體，離瞋無別嫉相用故。","juan":6},{"t":"p","text":"云何為慳？耽著財、法，不能⸢217⸣慧⸤捨，祕悋為性；能障不慳，鄙畜為業。謂慳悋者，心多鄙澁，畜積財法，不能捨故。此即貪愛一分為體，離貪無別慳相用故。","juan":6},{"t":"p","text":"云何為誑？為獲利譽，矯現有德，詭詐為性；能障不誑，邪命為業。謂矯誑者，心懷異謀，多現不實邪命事故。此即貪、癡一分為體，離二無別誑相用故。","juan":6},{"t":"p","text":"云何為諂？為⸢218⸣網⸤他故，矯設異儀，險、曲為性；能障不諂教誨為業。謂諂曲者，為⸢219⸣網帽⸤他，曲順時宜，⸢220⸣矯⸤設方便，為取他意或藏己⸢221⸣失⸤。不任師、友正教誨故，此亦貪、癡一分為體，離二無別諂相用故。","juan":6},{"t":"p","text":"云何為害？於諸有情，心無悲愍，損惱為性；能障不害，逼惱為業。謂有害者，逼惱他故。此亦瞋恚一分為體，離瞋無別害相用故。瞋、害別相，准善應說。","juan":6},{"t":"p","text":"云何為憍？於自盛事，深生染著，醉傲為性；能障不憍，染依為業。謂憍醉者，生長一切雜染法故。此亦貪愛一分為體，離貪無別憍相用故。","juan":6},{"t":"p","text":"云何無慚？不顧自、法，輕拒賢善為性；能障礙慚，生長惡行為業。謂於自、法無所顧者，輕拒賢善，不恥過惡，障慚生長，諸惡行故。","juan":6},{"t":"p","text":"云何無愧？不顧世間，崇重暴惡為性；能障礙愧，生長惡行為業。謂於世間無所顧者，崇重暴惡，不恥過罪，障愧生長，諸惡行故。","juan":6},{"t":"p","text":"不恥過惡，是二通相；故諸聖教，假說為體。","juan":6},{"t":"p","text":"若執不恥為二別相，則應此二體無差別。由斯二法應不俱生，非受、想等有此義故；若待自、他，立二別者，應非實有，便違聖教；若許此二實而別起，復違論說俱遍惡心。","juan":6},{"t":"p","text":"不善心時，隨緣何境，皆有輕拒善及崇重惡義故，此二法俱遍惡心，所緣不異，無別起⸢222⸣失⸤。","juan":6},{"t":"p","text":"然諸聖教說不顧自、他者，自、法名自，世間名他。或即此中拒善、崇惡，於己益損，名自、他故。而論說為貪等分者，是彼等流，非即彼性。","juan":6},{"t":"p","text":"云何掉舉？令心於境不寂靜為性；能障行捨、奢摩他為業。","juan":6},{"t":"p","text":"有義：掉舉貪一分攝，論唯說此是貪分故，此由憶昔樂事生故。","juan":6},{"t":"p","text":"有義：掉舉非唯貪攝，論說掉舉遍染心故，又掉舉相謂不寂靜，說是煩惱共相攝故，掉舉離此無別相故。雖依一切煩惱假立，而貪位增，說為貪分。","juan":6},{"t":"p","text":"有義：掉舉別有自性，遍諸染心，如不信等，非說他分，體便非實，勿不信等亦假有故。而論說為世俗有者，如睡眠等，隨他相說。掉舉別相，謂即囂動，令俱生法，不寂靜故。若離煩惱無別此相，不應別說障奢摩他，故不寂靜非此別相。","juan":6},{"t":"p","text":"云何惛沈？令心於境，無堪任為性；能障輕安、毘鉢舍那為業。","juan":6},{"t":"p","text":"有義：惛沈癡一分攝，論唯說此是癡分故，惛昧沈重是癡相故。","juan":6},{"t":"p","text":"有義：惛沈非但癡攝，謂無堪任是惛沈相，一切煩惱皆無堪任，離此無別惛沈相故。雖依一切煩惱假立，而癡相增，但說癡分。","juan":6},{"t":"p","text":"有義：惛沈別有自性，雖名癡分而是等流，如不信等，非即癡攝。隨他相說名世俗有，如睡眠等，是實有性。惛沈別相，謂即瞢⸢223⸣重⸤，令俱生法，無堪任故。若離煩惱無別惛沈相，不應別說障毘鉢舍那故。無堪任非此別相，此與癡相有差別者，謂癡於境，迷闇為相，正障無癡，而非瞢⸢224⸣重⸤，惛沈於境瞢⸢225⸣重⸤為相，正障輕安而非迷闇。","juan":6},{"t":"p","text":"云何不信？於實、德、能不忍樂欲，心穢為性；能障淨信，惰依為業。謂不信者多懈怠故。","juan":6},{"t":"p","text":"不信三相，翻信應知。然諸染法，各有別相，唯此不信，自相渾濁，復能渾濁餘心、心所，如極穢物，自穢、穢他，是故說此心穢為性。由不信故，於實、德、能不忍樂欲，非別有性，若於餘事，邪忍樂欲，是此因果，非此自性。","juan":6},{"t":"p","text":"云何懈怠？於善、惡品修、斷事中，懶惰為性；能障精進，增染為業。謂懈怠者，滋長染故。於諸染事而策勤者，亦名懈怠，退善法故。於無記事而策勤者，於諸善品無進、退故，是欲、勝解，非別有性。如於無記，忍可樂欲，非淨、非染，無信不信。","juan":6},{"t":"p","text":"云何放逸？於染、淨品，不能防、修，縱蕩為性；障不放逸，增惡損善所依為業。謂由懈怠及貪、瞋、癡，不能防修染淨品法，總名放逸，非別有體。雖慢、疑等亦有此能，而方彼四，勢用微劣，障三善根、遍策法故。推究此相，如不放逸。","juan":6},{"t":"p","text":"云何失念？於諸所緣，不能明記為性；能障正念、散亂所依為業。謂失念者，心散亂故。","juan":6},{"t":"p","text":"有義：失念念一分攝，說是煩惱相應念故。","juan":6},{"t":"p","text":"有義：失念癡一分攝，《瑜伽》說此是癡分故，癡令念失，故名失念。","juan":6},{"t":"p","text":"有義：失念俱一分攝，由前⸢226⸣二⸤文影略說故，論復說此遍染心故。","juan":6},{"t":"p","text":"云何散亂？於諸所緣，令心流蕩為性；能障正定，惡慧所依為業。謂散亂者發惡慧故。","juan":6},{"t":"p","text":"有義：散亂癡一分攝，《瑜伽》說此是癡分故。","juan":6},{"t":"p","text":"有義：散亂貪、瞋、癡攝，《集論》等說是三分故，說癡分者，遍染心故，謂貪、瞋、癡令心流蕩，勝餘法故，說為散亂。","juan":6},{"t":"p","text":"有義：散亂別有自體，說三分者是彼等流，如無慚等，非即彼攝，隨他相說名世俗有。散亂別相，謂即躁擾，令俱生法皆流蕩故。若離彼三，無別自體，不應別說障三摩地。掉舉、散亂二用何別？彼令易解，此令易緣，雖一剎那，解、緣無易，而於相續有易義故。染污心時，由掉亂力，常應念念易解、易緣，或由念等力所制伏，如繫猨猴有暫時住，故掉與亂，俱遍染心。","juan":6},{"t":"p","text":"云何不正知？於所觀境，謬解為性；能障正知、毀犯為業。謂不正知者，多所毀犯故。","juan":6},{"t":"p","text":"有義：不正知慧一分攝，說是煩惱相應慧故。","juan":6},{"t":"p","text":"有義：不正知癡一分攝，《瑜伽》說此是癡分故，令知不正，名不正知。","juan":6},{"t":"p","text":"有義：不正知俱一分攝，由前二文，影略說故，論復說此遍染心故。","juan":6},{"t":"p","text":"「與」、「并」、「及」言顯隨煩惱非唯二十，《雜事》等說貪等多種隨煩惱故。","juan":6},{"t":"p","text":"隨煩惱名，亦攝煩惱，是前煩惱等流性故；煩惱同類餘染污法，但名隨煩惱，非煩惱攝故。","juan":6},{"t":"p","text":"唯說二十隨煩惱者，謂非煩惱，唯染、麁故；此餘染法，或此分位，或此等流，皆此所攝。隨其類別，如理應知。","juan":6},{"t":"p","text":"如是二十隨煩惱中，小十、大三，定是假有；無慚、無愧、不信、懈怠定是實有；教、理成故。掉舉、惛沈、散亂三種，有義是假，有義是實。所引理、教，如前應知。","juan":6},{"t":"p","text":"二十皆通俱生、分別，隨二煩惱勢力起故。","juan":6},{"t":"p","text":"此二十中，小十，展轉定不俱起。互相違故，行相麁猛，各為主故。","juan":6},{"t":"p","text":"中二，一切不善心俱，隨應皆得小、大俱起。論說：大八遍諸染心。展轉小、中，皆容俱起。","juan":6},{"t":"p","text":"有處說：六遍染心者，惛、掉增時，不俱起故。有處但說：五遍染者，以惛、掉等違唯善故。","juan":6},{"t":"p","text":"此唯染故，非第八俱。第七識中唯有大八，取捨差別，如上應知。第六識俱容有一切。小十麁猛，五識中無。中、大相通，五識容有。","juan":6},{"t":"p","text":"由斯中、大五受相應。","juan":6},{"t":"p","text":"有⸢227⸣義⸤：小十除三，忿等唯喜、憂、捨⸢228⸣三⸤受相應。諂、誑、憍三，四俱，除苦。","juan":6},{"t":"p","text":"有義：忿等四俱，除樂；諂、誑、憍三，五受俱起。意有苦受，前已說故。","juan":6},{"t":"p","text":"此受俱相，如煩惱說。","juan":6},{"t":"p","text":"實義如是，⸢229⸣若⸤隨麁⸢230⸣相⸤，忿、恨、惱、嫉、害憂、捨俱；覆、慳喜、捨；餘三增樂。中、大隨麁，亦如實義。","juan":6},{"t":"p","text":"如是二十，與別境五，皆容俱起，不相違故。","juan":6},{"t":"p","text":"染念、染慧，雖非念、慧俱，而癡分者，亦得相應故。念亦緣現、曾習類境。忿亦得緣剎那過去，故忿與念，亦得相應。染定起時，心亦躁擾，故亂與定相應無失。","juan":6},{"t":"p","text":"中二、大八十煩惱俱。","juan":6},{"t":"p","text":"小十定非見、疑俱起。此相麁動，彼審細故。忿等五法，容慢、癡俱，非貪、恚並，是瞋分故。慳癡、慢俱，非貪、瞋並，是貪分故。憍唯癡俱，與慢解別，是貪分故。覆、誑與諂，貪、癡、慢俱。行相無違，貪、癡分故。","juan":6},{"t":"p","text":"小七、中二，唯不善攝。小三、大八，亦通無記。","juan":6},{"t":"p","text":"小七、中二，唯欲界攝。誑、諂欲、色，餘通三界。","juan":6},{"t":"p","text":"生在下地，容起上十一。耽定於他，起憍、誑、諂故。","juan":6},{"t":"p","text":"若生上地，起下後十。邪見愛俱，容起彼故。小十，生上無由起下。非正潤生，及謗滅故。","juan":6},{"t":"p","text":"中二、大八，下亦緣上。上緣貪等，相應起故。","juan":6},{"t":"p","text":"有義：小十，下不緣上。行相麁近，不遠取故。","juan":6},{"t":"p","text":"有義：嫉等亦得緣上。於勝地法，生嫉等故。","juan":6},{"t":"p","text":"大八諂、誑，上亦緣下。下緣慢等，相應起故。梵於釋子，起諂、誑故。憍不緣下，非所恃故。","juan":6},{"t":"p","text":"二十皆非學、無學攝。此但是染，彼唯淨故。","juan":6},{"t":"p","text":"後十，唯通見、修所斷，與二煩惱相應起故。見所斷者，隨迷諦相，或總、或別，煩惱俱生，故隨所應，皆通四⸢231⸣諦⸤。迷諦親疎等，皆如煩惱說。","juan":6},{"t":"p","text":"前十，有義：唯修所斷，緣麁事境，任運生故。有義：亦通見、修所斷。依二煩惱勢⸢232⸣力⸤起故。緣他見等，生忿等故。見所斷者，隨所⸢233⸣應⸤緣，總、別惑力，皆通四⸢234⸣諦⸤。此中有義：忿等但緣迷諦惑生，非親迷諦。行相麁淺，不深取故。有義：嫉等亦親迷諦，於滅、道等生嫉等故。","juan":6},{"t":"p","text":"然忿等十，但緣有事，要⸢235⸣託⸤本質，方得生故。緣有漏等，准上應知。","juan":6},{"t":"p","text":"已說二十隨煩惱相。不定有四，其相云何？","juan":7},{"t":"p","text":"頌曰：","juan":7},{"t":"v","num":null,"lines":["「不定謂悔、眠、尋、伺，二各二。」"],"juan":7},{"t":"p","text":"論曰：悔、眠、尋、伺於善、染等皆不定故，非如觸等定遍心故，非如欲等定遍地故，立不定名。","juan":7},{"t":"p","text":"悔謂惡作，惡所作業，追悔為性，障止為業。此即於果假立因名，先惡所作業，後方追悔故；悔先不作，亦惡⸢236⸣作⸤攝，如追悔言：我先不作如是事業，是我惡作。","juan":7},{"t":"p","text":"眠謂睡眠，令⸢237⸣身⸤不自在，昧、略為性，障觀為業。謂睡眠位，身不自在，心極闇劣，一門轉故。昧簡在定，略別寤時，令顯睡眠非無體用。有無心位假立此名，如餘蓋纏心相應故。","juan":7},{"t":"p","text":"有義：此二唯癡為體，說隨煩惱及癡分故。","juan":7},{"t":"p","text":"有義：不然，亦通善故。應說此二染癡為體；淨即無癡，論依染分說隨煩惱及癡分攝。","juan":7},{"t":"p","text":"有義：此說亦不應理，無記非癡、無癡性故。應說惡作思、慧為體，明了思擇所作業故。睡眠合用思、想為體，思、想種種夢境相故。論俱說為世俗有故。彼染污者是癡等流，如不信等，說為癡分。","juan":7},{"t":"p","text":"有義：彼說理亦不然，非思、慧、想纏彼性故。應說此二各別有體，與餘心所行相別故。隨癡相說，名世俗有。","juan":7},{"t":"p","text":"尋謂尋求，令心怱遽於意言境，麁轉為性；伺謂伺察，令心怱遽於意言境，細轉為性。此二俱以安、不安住身心分位所依為業。並用思、慧一分為體，於意言境不深推度及深推度，義類別故，若離思、慧，尋、伺二種體類差別不可得故。","juan":7},{"t":"p","text":"「二各二」者，有義：尋、伺各有染、淨二類差別。","juan":7},{"t":"p","text":"有義：此釋不應正理，悔、眠亦有染、淨二故。","juan":7},{"t":"p","text":"應說如前諸染心所，有是煩惱、隨煩惱性，此二各有不善、無記，或復各有纏及隨眠。","juan":7},{"t":"p","text":"有義：彼釋亦不應理，不定四後有此言故。","juan":7},{"t":"p","text":"應言「二」者顯二種二：一謂悔、眠；二謂尋、伺。此二二種，種類各別，故一「二」言，顯二二種。","juan":7},{"t":"p","text":"此各有二，謂染、不染。","juan":7},{"t":"p","text":"非如善、染各唯一故。或唯簡染，故說此言，有亦說為隨煩惱故。為顯不定義，說「二各二」言，故置此言深為有用。","juan":7},{"t":"p","text":"四中尋、伺定是假有，思、慧合成，聖所說故。","juan":7},{"t":"p","text":"悔、眠，有義：亦是假有，《瑜伽》說為世俗有故。","juan":7},{"t":"p","text":"有義：此二是實物有，唯後二種說假有故。世俗有言隨他相說，非顯前二定是假有，又如內種體雖是實，而論亦說世俗有故。","juan":7},{"t":"p","text":"四中尋、伺定不相應，體類是同，麁、細異故。依於尋、伺有染、離染立三地別，不依彼種現起有無，故無雜亂。","juan":7},{"t":"p","text":"俱與前二容互相應，前二亦有互相應義。","juan":7},{"t":"p","text":"四皆不與第七、八俱，義如前說；悔、眠唯與第六識俱，非五法故。","juan":7},{"t":"p","text":"有義：尋、伺亦五識俱，論說：五識有尋、伺故。","juan":7},{"t":"p","text":"又說：尋、伺即七分別，謂有相等。《雜集》復言：任運分別謂五識故。","juan":7},{"t":"p","text":"有義：尋、伺唯意識俱。","juan":7},{"t":"p","text":"論說：尋求、伺察等法皆是意識不共法故。又說：尋、伺憂、喜相應，曾不說與苦、樂俱故。捨受遍故，可不⸢238⸣待⸤說。何緣不說與苦、樂俱？雖初靜慮有意地樂，而不離喜，總說喜名；雖純苦處有意地苦，而似憂故，總說為憂。又說：尋、伺以名身等義為所緣，非五識身以名身等義為境故。","juan":7},{"t":"p","text":"然說五識有尋、伺者，顯多由彼起，非說彼相應。《雜集》所言：任運分別謂五識者，彼與《瑜伽》所說分別，義各有異：彼說任運即是五識，《瑜伽》說此是五識俱分別意識相應尋、伺。","juan":7},{"t":"p","text":"故彼所引為證不成，由此五識定無尋、伺。","juan":7},{"t":"p","text":"有義：惡作憂、捨相應，唯慼行轉，通無記故。","juan":7},{"t":"p","text":"睡眠喜、憂、捨受俱起，行通歡、慼、中庸轉故。","juan":7},{"t":"p","text":"尋、伺憂、喜、捨、樂相應，初靜慮中意樂俱故。","juan":7},{"t":"p","text":"有義：此四亦苦受俱，純苦趣中，意⸢239⸣苦⸤俱故。","juan":7},{"t":"p","text":"四皆容與五別境俱，行相、所緣不相違故。","juan":7},{"t":"p","text":"悔、眠但與十善容俱，此唯在欲，無輕安故。尋、伺容與十一善俱，初靜慮中輕安俱故。","juan":7},{"t":"p","text":"悔但容與無明相應，此行相麁，貪等細故。","juan":7},{"t":"p","text":"睡眠、尋、伺十煩惱俱，此彼展轉不相違故。","juan":7},{"t":"p","text":"悔與中、大隨惑容俱，非忿等十，各為主故。睡眠、尋、伺二十容俱，眠等位中皆起彼故。","juan":7},{"t":"p","text":"此四皆通善等三性，於無記業亦追悔故。","juan":7},{"t":"p","text":"有義：初二唯生得善，行相麁鄙及昧略故；後二亦通加行善攝，聞所成等有尋、伺故。","juan":7},{"t":"p","text":"有義：初二亦加行善，聞、思位中有悔、眠故。","juan":7},{"t":"p","text":"後三皆通染、淨無記，惡作非染，解麁猛故。四無記中，悔唯中二，行相麁猛，非定果故。眠除第四，非定引生，異熟生心亦得眠故。尋、伺除初，彼解微劣，不能尋察名等義故。","juan":7},{"t":"p","text":"惡作、睡眠唯欲界有，尋、伺在欲及初靜慮，餘界地法皆妙靜故。","juan":7},{"t":"p","text":"悔、眠生上必不現起，尋、伺上下亦起下上。","juan":7},{"t":"p","text":"下上尋、伺能緣上下。","juan":7},{"t":"p","text":"有義：悔、眠不能緣上，行相麁近，極昧略故。","juan":7},{"t":"p","text":"有義：此二亦緣上境，有邪見者悔修定故，夢能普緣所更事故。","juan":7},{"t":"p","text":"悔非無學，離欲捨故；睡眠、尋、伺皆通三種。求解脫者有為善法皆名學故；學究竟者有為善法皆無學故。","juan":7},{"t":"p","text":"悔、眠唯通見、修所斷，亦邪見等勢力起故，非無漏道親所引生故，亦非如憂，深求解脫故。若已斷故名非所斷，則無學眠非所斷、攝。","juan":7},{"t":"p","text":"尋、伺雖非真無漏道，而能引彼，從彼引生，故通見、修、非所斷攝。","juan":7},{"t":"p","text":"有義：尋、伺非所斷者，於五法中唯分別攝，《瑜伽》說彼是分別故。","juan":7},{"t":"p","text":"有義：此二亦正⸢240⸣智⸤攝，說：正思惟是無漏故，彼能令心尋求等故。又說：彼是言說因故，未究竟位於藥、病等未能遍知，後得智中為他說法必假尋、伺，非如佛地無功用說，故此二種亦通無漏。雖說尋、伺必是分別，而不定說唯屬第三，後得正智中亦有分別故。","juan":7},{"t":"p","text":"餘門准上，如理應思。","juan":7},{"t":"p","text":"如是六位諸心所法，為離心體有別自性？為即是心分位差別？","juan":7},{"t":"p","text":"設爾何失？","juan":7},{"t":"p","text":"二俱有過。","juan":7},{"t":"p","text":"若離心體有別自性，如何聖教說唯有識？又如何說心遠、獨行，染、淨由心，士夫六界？","juan":7},{"t":"p","text":"《莊嚴論》說復云何通？如彼頌言：","juan":7},{"t":"v","num":null,"lines":["「許心似二現，如是似貪等，","或似於信等，無別染、善法。」"],"juan":7},{"t":"p","text":"若即是心分位差別，如何聖教說心相應？他性相應，非自性故。又如何說心與心所俱時而起，如日與光？《瑜伽論》說復云何通？彼說心所非即心故。如彼頌言：","juan":7},{"t":"v","num":null,"lines":["「五種性不成，分位差過失，","因緣無別故，與聖教相違。」"],"juan":7},{"t":"p","text":"應說離心有別自性，以心勝故，說唯識等，心所依心勢力生故，說似彼現，非彼即心。又識心言亦攝心所，恒相應故。唯識等言及現似彼，皆無有失，此依世俗。","juan":7},{"t":"p","text":"若依勝義，心所與心非離非即，諸識相望應知亦然，是謂大乘真、俗妙理。","juan":7},{"t":"p","text":"已說六識心所相應，云何應知現起分位？","juan":7},{"t":"p","text":"頌曰：","juan":7}],"kepan":[],"yi":"隨煩惱謂：忿、恨、覆、惱、嫉、慳、誑、諂、害、憍此十小隨，無慚、無愧二中隨，掉舉、惛沈、不信、懈怠、放逸、失念、散亂、不正知此八大隨，合為二十。另有悔、眠、尋、伺四種不定心所。","yao":["隨煩惱依行相麁猛與現起範圍分三類：小隨十（各別而起）、中隨二（遍不善心）、大隨八（遍染污心）。此三分是判斷其現起界限的準據。","多數隨煩惱論主判為依根本煩惱分位假立，唯無慚、無愧、不信、懈怠、掉舉、惛沈、散亂等有別體與否，論中諸師異說並陳，讀者須辨「有義」歸屬。","不定四法所以不定，有二義：三性不定（通善染無記）、界地不定（非遍諸地）。悔與眠通三性，尋伺一往麁細有別。","尋伺之細判關涉三界建立：初禪有尋有伺，中間定無尋唯伺，二禪以上無尋無伺，是禪定階次的心所依據。"],"ming":[["小隨煩惱","忿、恨、覆、惱、嫉、慳、誑、諂、害、憍。行相麁猛，各別現起。"],["中隨煩惱","無慚、無愧。遍一切不善心。"],["大隨煩惱","掉舉、惛沈、不信、懈怠、放逸、失念、散亂、不正知。遍一切染污心。"],["掉舉","令心於境不寂靜，障奢摩他。"],["惛沈","令心於境無堪任，障毘缽舍那。"],["悔（惡作）","追悔先所作業，性通善染，故屬不定。"],["尋","令心麁轉，於意言境麁略推度。"],["伺","令心細轉，於意言境細密伺察。"]]},{"id":10,"label":"諸識現起分位","verses":[15,16],"kind":"verse","juan":[7],"chars":2336,"blocks":[{"t":"v","num":15,"lines":["依止根本識，五識隨緣現，","或俱或不俱，如濤波依水。"],"juan":7},{"t":"v","num":16,"lines":["意識常現起，除生無想天，","及無心二定、睡眠與悶絕。"],"juan":7},{"t":"p","text":"論曰：「根本識」者，阿陀那識，染、淨諸識生根本故。「依止」者，謂前六轉識以根本識為共親依。","juan":7},{"t":"p","text":"「五識」者，謂前五轉識，種類相似，故總說之。「隨緣現」言顯非常起，「緣」謂作意、根、境等緣，謂五識身內依本識，外隨作意、五根、境等眾緣和合方得現前，由此或俱或不俱起，外緣合者有頓、漸故。如水濤波隨緣多少，此等法喻廣說如經。","juan":7},{"t":"p","text":"由五轉識行相麁動，所⸢241⸣藉⸤眾緣時多不⸢242⸣具⸤，故起時少，不起時多。第六意識雖亦麁動，而所⸢243⸣藉⸤緣無時不具，由違緣故，有時不起。第七、八識行相微細，所⸢244⸣藉⸤眾緣一切時有，故無緣礙令總不行。","juan":7},{"t":"p","text":"又五識身不能思慮，唯外門轉起，⸢245⸣藉⸤多緣，故斷時多，現行時少；第六意識自能思慮，內、外門轉，不⸢246⸣藉⸤多緣。唯除五位，常能現起，故斷時少，現起時多，由斯不說此隨緣現。","juan":7},{"t":"p","text":"五位者何？","juan":7},{"t":"p","text":"「生無想」等。","juan":7},{"t":"p","text":"無想天者，謂修彼定，厭麁想力，生彼天中，違不恒行心及心所，想滅為首，名無想天。","juan":7},{"t":"p","text":"故六轉識於彼皆斷。","juan":7},{"t":"p","text":"有義：彼天常無六識，聖教說彼無轉識故；說彼唯有有色支故；又說彼為無心地故。","juan":7},{"t":"p","text":"有義：彼天將命終位，要起轉識然後命終，彼必起下潤生愛故，《瑜伽論》說：「後想生已，是諸有情從彼沒」故。然說彼無轉識等者，依長時說，非謂全無。","juan":7},{"t":"p","text":"有義：生時亦有轉識，彼中有必起潤生煩惱故，如餘本有，初必有轉識故。《瑜伽論》說：「若生於彼，唯入不起，其想若生，從彼沒」故，彼本有初，若無轉識，如何名入？先有後無，乃名入故。","juan":7},{"t":"p","text":"〈決擇分〉言：「所有生得心、心所滅，名無想」故，此言意顯彼本有初，有異熟生轉識暫起宿因緣力，後不復生。由斯引起異熟無記分位差別，說名無想，如善引生二定名善。不爾，轉識一切不行，如何可言唯生得滅？故彼初位轉識暫起。","juan":7},{"t":"p","text":"彼天唯在第四靜慮，下想麁動難可斷故，上無無想異熟處故。","juan":7},{"t":"p","text":"即能引發無想定思，能感彼天異熟果故。","juan":7},{"t":"p","text":"「及無心二定」者，謂無想、滅盡定，俱無六識，故名無心。","juan":7},{"t":"p","text":"無想定者，謂有異生伏遍淨貪，未伏上染，由出離想，作意為先，令不恒行心、心所滅，想滅為首，立無想名，令身安和，故亦名定。","juan":7},{"t":"p","text":"修習此定，品別有三：下品修者，現法必退，不能速疾還引現前，後生彼天，不甚光淨，形色廣大，定當中夭。中品修者，現不必退，設退速疾還引現前，後生彼天，雖甚光淨，形色廣大，而不最極，雖有中夭而不決定。上品修者，現必不退，後生彼天，最極光淨，形色廣大，必無中夭，窮滿壽量後方殞沒。","juan":7},{"t":"p","text":"此定唯屬第四靜慮。又唯是善，彼所引故。下上地無，由前說故。","juan":7},{"t":"p","text":"四業通三，除順現受。","juan":7},{"t":"p","text":"有義：此定唯欲界起，由諸外道說力起故，人中慧解極猛利故。","juan":7},{"t":"p","text":"有義：欲界先修習已，後生色界能引現前，除無想天至究竟故。","juan":7},{"t":"p","text":"此由厭想、欣彼果入，故唯有漏。非聖所起。","juan":7},{"t":"p","text":"滅盡定者，謂有無學或有學聖，已伏或離無所有貪，上貪不定，由止息想，作意為先，令不恒行、恒行染污心、心所滅，立滅盡名，令身安和，故亦名定。由偏厭受、想，亦名滅彼定。","juan":7},{"t":"p","text":"修習⸢247⸣此⸤定，品別有三：下品修者，現法必退，不能速疾還引現前；中品修者，現不必退，設退速疾還引現前；上品修者，畢竟不退。","juan":7},{"t":"p","text":"此定初修必依有頂，遊觀無漏為加行入，次第定中最居後故，雖屬有頂而無漏攝。若修此定已得自在，餘地心後，亦得現前。","juan":7},{"t":"p","text":"雖屬道諦而是非學非無學攝，似涅槃故。","juan":7},{"t":"p","text":"此定初起唯在人中，佛及弟子說力起故，人中慧解極猛利故，後上二界亦得現前，《鄔陀夷經》是此誠證，無色亦名意成天故。於藏識教未信受者，若生無色不起此定，恐無色、心成斷滅故；已信生彼亦得現前，知有藏識不斷滅故。","juan":7},{"t":"p","text":"要斷三界見所斷惑方起此定，異生不能伏滅有頂心、心所故，此定微妙，要證二空隨應後得所引發故。","juan":7},{"t":"p","text":"有義：下八地修所斷惑中，要全斷欲，餘伏⸢248⸣或⸤斷，然後方能初起此定，欲界惑種二性繁雜，障定強故，唯說不還、三乘無學及諸菩薩得此定故，彼隨所應生上八地皆得後起。","juan":7},{"t":"p","text":"有義：要斷下之四地修所斷惑，餘伏⸢249⸣或⸤斷，然後方能初起此定，變異受俱煩惱種子障定強故，彼隨所應，生上五地，皆得後起。","juan":7},{"t":"p","text":"若伏下惑能起此定，後不斷退生上地者，豈生上已却斷下惑？斷亦無失，如生上者，斷下末那⸢250⸣俱⸤生⸢251⸣惑⸤故。然不還者對治力強，正潤生位不起煩惱，但由惑種潤上地生，雖所伏惑有退、不退，而無伏下生上地義，故無生上却斷下失。","juan":7},{"t":"p","text":"若諸菩薩先二乘位已得滅定，後迴心者，一切位中能起此定。若不爾者，或有乃至七地滿心，方能永伏一切煩惱，雖未永斷欲界修惑，而如已斷，能起此定，論說已入遠地，菩薩方能現起滅盡定故。有從初地即能永伏一切煩惱，如阿羅漢，彼十地中皆起此定，經說菩薩前六地中亦能現起滅盡定故。","juan":7},{"t":"p","text":"無心「睡眠與悶絕」者，謂有極重睡眠、悶絕，令前六識皆不現行。","juan":7},{"t":"p","text":"疲極等緣所引身位，違前六識，故名極重睡眠，此睡眠時，雖無彼體，而由彼似彼故，假說彼名。","juan":7},{"t":"p","text":"風熱等緣所引身位，亦違六識，故名極重悶絕，或此俱是觸處少分。","juan":7},{"t":"p","text":"除斯五位，意識恒起。","juan":7},{"t":"p","text":"正死、生時亦無意識，何故但說五位不行？","juan":7},{"t":"p","text":"有義：死、生「及」、「與」言顯。彼說非理，所以者何？但說六時名無心故，謂前五位及無餘依。應說死、生即悶絕攝，彼是最極悶絕位故，說「及」、「與」言顯五無雜。","juan":7},{"t":"p","text":"此顯六識斷已，後時依本識中自種還起，由此不說入無餘依。","juan":7},{"t":"p","text":"此五位中異生有四，除在滅定，聖唯後三，於中如來、自在菩薩唯得⸢252⸣有⸤一，無睡、悶故。","juan":7},{"t":"k","lv":5,"text":"㊁總料簡八識一、異","juan":7},{"t":"p","text":"是故八識一切有情心與末那二，恒俱轉；若起第六，則三俱轉；餘隨緣合，起一至五，則四俱轉，乃至八俱，是謂略說識俱轉義。","juan":7},{"t":"k","lv":6,"text":"1 明俱轉","juan":7},{"t":"k","lv":6,"text":"2 問、答分別","juan":7},{"t":"p","text":"若一有情多識俱轉，如何說彼是一有情？若立有情依識多少，汝無心位應非有情？又，他分心現在前位，如何可說自分有情？然立有情依命根數或異熟識俱不違理，彼俱恒時唯有一故。","juan":7},{"t":"p","text":"一身唯一等無間緣，如何俱時有多識轉？既許此一引多心所，寧不許此能引多心？又誰定言此緣唯一？說多識俱者，許此緣多故。又欲一時取多境者，多境現前寧不頓取？諸根、境等和合力齊，識前後生不應理故。又心所性雖無差別而類別者，許多俱生，寧不許心異類俱起？又如浪像依一起多，故依一心多識俱轉。又若不許意與五俱，取彼所緣應不明了，如散意識緣久滅故。","juan":7},{"t":"p","text":"如何五俱唯一意識，於色等境取一或多？如眼等識各於自境取一或多，此亦何失？相、見俱有種種相故。","juan":7},{"t":"p","text":"何故諸識同類不俱？於自所緣若可了者，一已能了，餘無用故。若爾，五識已了自境，何用俱起意識了為？五俱意識助五令起，非專為了五識所緣。又於彼所緣能明了取，異於眼等識，故非無用。由此聖教說彼意識名有分別，五識不爾。","juan":7},{"t":"p","text":"多識俱轉何不相應？非同境故，設同境者，彼此所依體、數異故，如五根識互不相應。","juan":7},{"t":"k","lv":6,"text":"3 一、異分別","juan":7},{"t":"p","text":"八識自性不可言定一，行相、所依、緣、相應異故；又一滅時餘不滅故，能、所熏等相各異故；亦非定異，經說八識如水波等，無差別故；定異應非因果性故。如幻事等，無定性故。","juan":7},{"t":"p","text":"如前所說，識差別相依理世俗，非真勝義，真勝義中，心言絕故。","juan":7},{"t":"p","text":"如伽他說：","juan":7},{"t":"v","num":null,"lines":["「心、意、識八種，俗故相有別；","真故相無別，相、所相無故。」"],"juan":7},{"t":"k","lv":4,"text":"(二) 正解識變","juan":7},{"t":"k","lv":5,"text":"㊀結前、問後","juan":7},{"t":"p","text":"已廣分別三能變相為自所變二分所依。云何應知依識所變假說我、法非別實有，由斯一切唯有識⸢253⸣耶⸤？","juan":7},{"t":"k","lv":5,"text":"㊁舉頌答","juan":7},{"t":"p","text":"頌曰：","juan":7}],"kepan":["㊁總料簡八識一、異","1 明俱轉","2 問、答分別","3 一、異分別","(二) 正解識變","㊀結前、問後","㊁舉頌答"],"yi":"前五識依止根本識（第八）而起，隨眾緣具足而現行，或五識俱起、或不俱起，猶如波濤依水，緣風擊動則生。第六意識則常時現起，唯除生於無想天、入無想定與滅盡定二無心定、極重睡眠與悶絕此五位，方暫不現行。","yao":["「依止根本識」明五識之親依：根本識即第八，通因緣依（種子）與增上緣依（俱有依）二義，故五識之起必以第八為所依。","五識現起須具緣：眼識九緣、耳識八緣、鼻舌身識七緣。緣有多少，故五識或俱或不俱，非恆相續。","五位無心是判定意識間斷的標準，也是論證第八識必須恆存的關鍵理據——若無第八，無心位中持種者為誰？","無想定與滅盡定同名無心而性質迥異：無想定是異生外道厭麁想所修，滅盡定是聖者依滅受想所入，一為染一為淨，不可混同。"],"ming":[["根本識","第八阿賴耶識。為諸轉識生起之根本所依。"],["五位無心","無想天、無想定、滅盡定、極重睡眠、極重悶絕。此五位第六識不現行。"],["無想定","外道厭麁想所修，能招無想天異熟，屬有漏。"],["俱有依","與識同時存在而為其所依之根，如眼根之於眼識。"],["如濤波依水","喻轉識依本識而起：波不離水，起伏不定；水體恆流，未嘗間斷。"]]},{"id":11,"label":"唯識所因・正立宗義","verses":[17],"kind":"verse","juan":[7],"chars":1544,"blocks":[{"t":"v","num":17,"lines":["是諸識轉變，分別所分別，","由此彼皆無，故一切唯識。"],"juan":7},{"t":"k","lv":5,"text":"㊂長行釋","juan":7},{"t":"k","lv":6,"text":"1 正釋頌","juan":7},{"t":"p","text":"論曰：「是諸識」者，謂前所說三能變識及彼心所，皆能變似見、相二分，立「轉變」名。","juan":7},{"t":"p","text":"所變見分說名「分別」，能取相故；所變相分名「所分別」，見所取故。","juan":7},{"t":"p","text":"由此正理，彼實我、法離識所變皆定非有，離能、所取無別物故，非有實物離二相故。","juan":7},{"t":"p","text":"是故一切有為、無為，若實、若假，皆不離識。「唯」言為遮離識實物，非不離識心所法等。","juan":7},{"t":"p","text":"或轉變者，謂諸內識轉似我、法外境相現。","juan":7},{"t":"p","text":"此能轉變即名分別，虛妄分別為自性故，謂即三界心及心所。此所執境名所分別，即所妄執實我、法性。","juan":7},{"t":"p","text":"由此分別變似外境假我、法相，彼所分別實我、法性，決定皆無，前引教理已廣破故。","juan":7},{"t":"p","text":"是故一切皆唯有識，虛妄分別有極成故。「唯」既不遮不離識法，故真空等亦是有性。","juan":7},{"t":"p","text":"由斯遠離增、減二邊，唯識義成，契會中道。","juan":7},{"t":"k","lv":6,"text":"2 問、答廣辨","juan":7},{"t":"p","text":"由何教理唯識義成？","juan":7},{"t":"p","text":"豈不已說？","juan":7},{"t":"p","text":"雖說未了，非破他義己義便成；應更⸢254⸣礭⸤陳，成此教理。","juan":7},{"t":"p","text":"如契經說：「三界唯心」；又說：「所緣唯識所現」；又說：「諸法皆不離心」；又說：「有情隨心垢、淨」。","juan":7},{"t":"p","text":"又說：「成就四智菩薩能隨悟入唯識無境」。","juan":7},{"t":"p","text":"一、相違識相智：謂於一處，鬼、人、天等隨業差別所見各異，境若實有，此云何成？二、無所緣識智：謂緣過、未、夢境像等非實有境，識現可得，彼境既無，餘亦應爾。三、自應無倒智：謂愚夫智若得實境，彼應自然成無顛倒，不由功用應得解脫。四、隨三智轉智：一、隨自在者智轉智：謂已證得心自在者，隨欲轉變地等皆成，境若實有，如何可變？二、隨觀察者智轉智：謂得勝定修法觀者，隨觀一境，眾相現前，境若是⸢255⸣實⸤，寧隨心轉？三、隨無分別智轉智：謂起證實無分別智，一切境相皆不現前，境若是實，何容不現？","juan":7},{"t":"p","text":"菩薩成就⸢256⸣此四⸤智者，於唯識理決定悟入。","juan":7},{"t":"p","text":"又伽他說：","juan":7},{"t":"v","num":null,"lines":["心、意、識所緣，皆非離自性，","故我說一切唯有識無餘。"],"juan":7},{"t":"p","text":"此等聖教誠證非一。","juan":7},{"t":"p","text":"極成眼等識，五隨一故，如餘，不親緣離自色等。餘識識故，如眼識等，亦不親緣離自諸法。此⸢257⸣親⸤所緣定非離此，二隨一故，如彼能緣。所緣法故，如相應法，決定不離心及心所。","juan":7},{"t":"p","text":"此等正理，誠證非一，故於唯識，應深信受。","juan":7},{"t":"p","text":"我、法非有；空、識非無。離有、離無，故契中道。","juan":7},{"t":"p","text":"慈尊依此說二頌言：","juan":7},{"t":"v","num":null,"lines":["「虛妄分別有，於此二都無，","此中唯有空，於彼亦有此，","故說一切法，非空非不空，","有無及有故，是則契中道。」"],"juan":7},{"t":"p","text":"此頌且依染依他說，理實亦有淨分依他。","juan":7},{"t":"p","text":"若唯內識似外境起，寧見世間情、非情物，處、時、身、用定、不定轉？","juan":7},{"t":"p","text":"如夢境等，應釋此疑。","juan":7},{"t":"p","text":"何緣世尊說十二處？","juan":7},{"t":"p","text":"依識所變，非別實有。為入我空說六二法，如遮斷見說續有情。為入法空復說唯識，令知外法亦非有故。","juan":7},{"t":"p","text":"此唯識性豈不亦空？","juan":7},{"t":"p","text":"不爾。","juan":7},{"t":"p","text":"如何？","juan":7},{"t":"p","text":"非所執故。","juan":7},{"t":"p","text":"謂依識變，妄執實法，理不可得，說為法空；非無離言正智所證唯識性故，說為法空。","juan":7},{"t":"p","text":"此識若無，便無俗諦；俗諦無故，真諦亦無。真、俗相依而建立故。","juan":7},{"t":"p","text":"撥無二諦是惡取空，諸佛說為不可治者。應知諸法有空、不空，由此慈尊說前二頌。","juan":7},{"t":"p","text":"若諸色處亦識為體，何緣⸢258⸣乃⸤似色相顯現，一類堅住相續而轉？","juan":7},{"t":"p","text":"名言熏習勢力起故。","juan":7},{"t":"p","text":"與染、淨法為依處故。謂此若無，應無顛倒，便無雜染，亦無淨法，是故諸識亦似色現。如有頌言：","juan":7},{"t":"v","num":null,"lines":["亂相及亂體，應許為色識，","及與非色識，若無餘亦無。"],"juan":7},{"t":"p","text":"色等外境分明⸢259⸣現⸤證，現量所得，寧撥為無？","juan":7},{"t":"p","text":"現量證時，不執為外，後意分別，妄生外想。故現量境是自相分，識所變故，亦說為有；意識所執外實色等，妄計有故。說彼為無。","juan":7},{"t":"p","text":"又色等境，非色、似色，非外、似外，如夢所緣，不可執為是實外色。","juan":7},{"t":"p","text":"若覺時，色皆如夢境不離識者，如從夢覺知彼唯心，何故覺時於自色境不知唯識？","juan":7},{"t":"p","text":"如夢未覺不能自知，要至覺時方能追覺，覺時境色應知亦爾，未真覺位不能自知，至真覺時亦能追覺。未得真覺恒處夢中，故佛說為生死長夜，由斯未了色境唯識。","juan":7},{"t":"p","text":"外色實無，可非內識境；他心實有，寧非自所緣？","juan":7},{"t":"p","text":"誰說他心非自識境？但不說彼是親所緣。","juan":7},{"t":"p","text":"謂識生時無實作用，非如手等親執外物，日等舒光親照外境；但如鏡等似外境現，名「了他心」，非「親能了」。親所了者，謂自所變。","juan":7},{"t":"p","text":"故契經言：無有少法能取餘法，但識生時，似彼相現，名取彼物。","juan":7},{"t":"p","text":"如緣他心，色等亦爾。","juan":7},{"t":"p","text":"既有異境，何名唯識？","juan":7},{"t":"p","text":"奇哉！固執觸處生疑！豈唯識教但說一識？","juan":7},{"t":"p","text":"不爾，如何？","juan":7},{"t":"p","text":"汝應諦聽：若唯一識，寧有十方凡聖、尊卑、因果等別？誰為誰說？何法何求？故「唯識」言有深意趣。「識」言總顯一切有情各有八識、六位心所，所變相、見、分位差別及彼空理所顯真如。識自相故，識相應故，二所變故，三分位故，四實性故，如是諸法皆不離識，總立識名。「唯」言，但遮愚夫所執定離諸識實有色等。","juan":7},{"t":"p","text":"若如是知唯識教意，便能無倒善備資糧速入法空，證無上覺，救拔含識生死輪迴；非全撥無惡取空者，違背教理能成是事，故定應信一切唯識。","juan":7},{"t":"k","lv":4,"text":"(三) 釋諸妨難解唯識義","juan":7},{"t":"p","text":"若唯有識都無外緣，由何而生種種分別？","juan":7},{"t":"k","lv":5,"text":"㊀釋違理","juan":7},{"t":"k","lv":6,"text":"1 釋分別生難","juan":7},{"t":"p","text":"頌曰：","juan":7}],"kepan":["㊂長行釋","1 正釋頌","2 問、答廣辨","(三) 釋諸妨難解唯識義","㊀釋違理","1 釋分別生難"],"yi":"以上所說諸識，皆是識體轉變而現：轉變為能分別的見分，與所分別的相分。由於能所二分皆是識變，故離識之外別無實我實法可得，因此說一切唯識。","yao":["此頌是全論宗義的正式成立處，前十六頌廣說唯識相，至此收攝為「一切唯識」之結論，故科判以「明唯識相」之總結視之。","「轉變」一詞為安慧與護法異解之所在：安慧就識體自證分之轉變說，護法就識體變現見相二分說。本論取後義，是四分說得以成立的樞紐。","「由此彼皆無」的推論結構：能分別與所分別既皆識之所變，則實我實法無所依託，非謂識亦無。此處須嚴防墮入惡取空。","「唯」字論主釋為遮遣義而非除簡義：遮遣識外實境，不遣識內心所與相分，故唯識非唯一識。"],"ming":[["轉變","識體變現見相二分之作用。本論取護法義，非唯識體自體之流轉。"],["分別","能分別，即見分，識之能緣作用。"],["所分別","所分別，即相分，識所變現之境相。"],["唯","遮遣義。遮無識外實境，非謂唯有一識、無心所及餘識。"]]},{"id":12,"label":"釋外難・分別緣生","verses":[18],"kind":"verse","juan":[7,8],"chars":4243,"blocks":[{"t":"v","num":18,"lines":["由一切種識，如是如是變，","以展轉力故，彼彼分別生。"],"juan":7},{"t":"p","text":"論曰：「一切種識」謂本識中能生自果功能差別，此生等流、異熟、士用、增上果故，名一切種，除離繫者，非種生故，彼雖可證，而非種果，要現起道，斷結得故，有展轉義，非此所說，此說能生分別種故。此識為體，故立識名，種離本識無別性故。「種識」二言，簡非種識；有識非種；種非識故。又「種識」言，顯識中種，非持種識，後當說故。","juan":7},{"t":"p","text":"此識中種餘緣助故，即便如是如是轉變，謂從生位轉至熟時。顯變種多，重言「如是」。謂一切種攝三熏習，共、不共等識種盡故。","juan":7},{"t":"p","text":"「展轉力」者，謂八現識及彼相應相、見分等，彼皆互有相助力故。","juan":7},{"t":"p","text":"即現識等，總名「分別」，虛妄分別為自性故，「分別」類多，故言「彼彼」。","juan":7},{"t":"p","text":"此頌意說：雖無外緣，由本識中有一切種轉變差別，及以現行八種識等展轉力故，彼彼分別而亦得生，何假外緣方起分別？","juan":7},{"t":"p","text":"諸淨法起應知亦然，淨種現行為緣生故。","juan":7},{"t":"p","text":"所說種、現緣生分別，云何應知此緣生相？","juan":7},{"t":"p","text":"緣且有四。","juan":7},{"t":"p","text":"一、因緣：謂有為法親辦自果。","juan":7},{"t":"p","text":"此體有二：一、種子；二、現行。種子者，謂本識中善、染、無記、諸界、地等功能差別，能引次後自類功能及起同時自類現果，此唯望彼是因緣性。現行者，謂七轉識及彼相應所變相、見、性、界、地等，除佛果善、極劣無記，餘熏本識生自類種，此唯望彼是因緣性。","juan":7},{"t":"p","text":"第八心品無所熏故，非簡所依獨能熏故，極微、圓故，不熏成種。現行同類展轉相望皆非因緣，自種生故；一切異類展轉相望亦非因緣，不親生故。","juan":7},{"t":"p","text":"有說異類、同類現行展轉相望為因緣者，應知假說，或隨轉門。有唯說種是因緣性，彼依顯勝，非盡理說，聖說轉識與阿賴⸢260⸣耶⸤展轉相望為因緣故。","juan":7},{"t":"p","text":"二、等無間緣，謂八現識及彼心所前聚於後自類無間，等而開導，令彼定生。","juan":7},{"t":"p","text":"多同類種俱時轉故，如不相應非此緣攝，由斯八識非互為緣。心所與心雖恒俱轉，而相應故，和合似一，不可施設離別殊異，故得互作等無間緣。入無餘心最極微劣，無開導用，又無當起等無間法，故非此緣。云何知然？論有誠說：若此識等無間，彼識等決定生，即說此是彼等無間緣故。","juan":7},{"t":"p","text":"即依此義，應作是說：阿陀那識三界九地皆容互作等無間緣，下、上，死、生相開⸢261⸣導⸤故，有漏無間有無漏生；無漏定無生有漏者，鏡智起已必無、斷故，善與無記相望亦然。","juan":7},{"t":"p","text":"此何界後引生無漏？","juan":7},{"t":"p","text":"或從色界，或欲界後。","juan":7},{"t":"p","text":"謂諸異生求佛果者，定色界後引生無漏，⸢262⸣彼⸤必生在淨居天上大自在宮得菩提故。","juan":7},{"t":"p","text":"二乘迴趣大菩提者，定欲界後引生無漏，迴趣留身唯欲界故，彼雖必往大自在宮方得成佛，而本願力所留生身是欲界故。","juan":7},{"t":"p","text":"有義：色界亦有聲聞迴趣大乘願留身者，既與教理俱不相違，是故聲聞第八無漏色界心後亦得現前。然五淨居無迴趣者，經不說彼發大心故。","juan":7},{"t":"p","text":"第七轉識三界九地亦容互作等無間緣，隨第八識生處繫故。有漏、無漏容互相生，十地位中得相引故。善與無記相望亦然，於無記中，染與不染亦相開導，生空智果前、後位中得相引故。此欲、色界有漏得與無漏相生，非無色界，地上菩薩不生彼故。","juan":7},{"t":"p","text":"第六轉識三界九地有漏無漏、善不善等，各容互作等無間緣，潤生位等更相引故，初起無漏唯色界後，決擇分善唯色界故。","juan":7},{"t":"p","text":"眼、耳、身識二界二地，鼻、舌兩識一界一地，自類互作等無間緣，善等相望應知亦爾。","juan":7},{"t":"p","text":"有義：五識有漏、無漏自類互作等無間緣，未成佛時容互起故。","juan":7},{"t":"p","text":"有義：無漏有漏後起，非無漏後容起有漏。無漏五識非佛無故；彼五色根定有漏故；是異熟識相分攝故；有漏不共必俱同境根發無漏識，理不相應故；此二於境明、昧異故。","juan":7},{"t":"p","text":"三、所緣緣：謂若有法是帶己相心或相應所慮、所託。","juan":7},{"t":"p","text":"此體有二：一、親；二、疎。若與能緣體不相離，是見分等內所慮託，應知彼是親所緣緣；若與能緣體雖相離，為質能起內所慮託，應知彼是疎所緣緣。","juan":7},{"t":"p","text":"親所緣緣能緣皆有，離內所慮託必不生故。疎所緣緣能緣或有，離外所慮託亦得生故。","juan":7},{"t":"p","text":"第八心品：有義：唯有親所緣緣，隨業因力任運變故。","juan":7},{"t":"p","text":"有義：亦定有疎所緣緣，要⸢263⸣仗⸤他變質自方變故。","juan":7},{"t":"p","text":"有義：二說俱不應理。自、他身、土可互受用，他所變者為自質故。自種於他無受用理，他變為此不應理故，非諸有情種皆等故，應說此品疎所緣緣，一切位中有、無不定。","juan":7},{"t":"p","text":"第七心品未轉依位是俱生故，必⸢264⸣仗⸤外質，故亦定有疎所緣緣；已轉依位此非定有，緣真如等無外質故。","juan":7},{"t":"p","text":"第六心品行相猛利，於一切位能自在轉，所⸢265⸣仗⸤外質或有、或無，疎所緣緣有、無不定。","juan":7},{"t":"p","text":"前五心品未轉依位，麁、鈍、劣故，必⸢266⸣仗⸤外質，故亦定有疎所緣緣；已轉依位此非定有，緣過、未等，無外質故。","juan":7},{"t":"p","text":"四、增上緣：謂若有法有勝勢用，能於餘法或順、或違。雖前三緣亦是增上，而今第四除彼取餘，為顯諸緣差別相故。","juan":7},{"t":"p","text":"此順、違用於四處轉：生、⸢267⸣住⸤、成、得四事別故。","juan":7},{"t":"p","text":"然增上用隨事雖多，而勝顯者唯二十二，應知即是二十二根。","juan":7},{"t":"p","text":"前五色根以本識等所變眼等淨色為性；男女二根，身根所攝故，即以彼少分為性；命根但依本識親種分位假立，非別有性；意根總以八識為性；五受根如應，各自受為性；信等五根即以信等及善念等而為自性。","juan":7},{"t":"p","text":"未知當知根，體位有三種：一、根本位，謂在見道，除後剎那，無所未知可當知故。二、加行位，謂煖、頂、忍、世第一法，近能引發根本位故。三、資糧位，謂從為得諦現觀故，發起決定勝善法欲，乃至未得順決擇分所有善根名資糧位，能遠資生根本位故。","juan":7},{"t":"p","text":"於此三位，信等五根、意、喜、樂、捨為此根性，加行等位於後勝法求證愁慼亦有憂根，非正善根，故多不說。","juan":7},{"t":"p","text":"前三無色有此根者，有勝見道傍修得故，或二乘位迴趣大者，為證法空，地前亦起九地所攝生空無漏，彼皆菩薩，此根攝故。","juan":7},{"t":"p","text":"菩薩見道亦有此根，但說地前，以時促故。","juan":7},{"t":"p","text":"始從見道最後剎那乃至金剛喻定，所有信等無漏九根皆是已知根性。未離欲者，於上解脫求證愁慼，亦有憂根，非正善根，故多⸢268⸣不⸤說。","juan":7},{"t":"p","text":"諸無學位，無漏九根一切皆是具知根性。有頂雖有遊觀無漏，而不明利，非後三根。","juan":7},{"t":"p","text":"二十二根自性如是，諸餘門義，如論應知。","juan":7},{"t":"p","text":"如是四緣，依十五處，義差別故，立為十因。云何此依十五處立？","juan":8},{"t":"p","text":"一、語依處：謂法名、想所起語性，即依此處立隨說因。謂依此語隨見、聞等，說諸義故。此即能說為所說因；有論說此是名、想、見，由如名字取相，執著隨起說故，若依彼說便顯此因是語依處。","juan":8},{"t":"p","text":"二、領受依處：謂所觀待能、所受性，即依此處立觀待因。謂觀待此令彼諸事或生、或住、或成、或得，此是彼觀待因。","juan":8},{"t":"p","text":"三、習氣依處：謂內、外種，未成熟位。即依此處，立牽引因。謂能牽引遠自果故。","juan":8},{"t":"p","text":"四、有潤種子依處：謂內、外種，已成熟位。即依此處，立生起因。謂能生起近自果故。","juan":8},{"t":"p","text":"五、無間滅依處：謂心、心所等無間緣。六、境界依處：謂心、心所所緣緣。七、根依處：謂心、心所所依六根。八、作用依處：謂於所作業、作具、作用，即除種子餘助現緣。九、士用依處：謂於所作業、作者、作用，即除種子餘作現緣。十、真實見依處：謂無漏見，除引自種於無漏法能助引證。總依此六，立攝受因。謂攝受五⸢269⸣辦⸤有漏法，具攝受六⸢270⸣辦⸤無漏故。","juan":8},{"t":"p","text":"十一、隨順依處：謂無記、染、善現種諸行，能隨順同類勝品諸法。即依此處，立引發因。謂能引起同類勝行，及能引得無為法故。","juan":8},{"t":"p","text":"十二、差別功能依處：謂有為法，各於自果，有能起證差別勢力。即依此處，立定、異因。謂各能生自界等果，及各能得自⸢271⸣乘⸤果故。","juan":8},{"t":"p","text":"十三、和合依處：謂從領受，乃至差別功能依處，於所生、住、成、得果中，有和合力。即依此處，立同事因。謂從觀待乃至定、異，皆同生等，一事業故。","juan":8},{"t":"p","text":"十四、障礙依處：謂於生、住、成、得事中，能障礙法。即依此處，立相違因。謂彼能違生等事故。","juan":8},{"t":"p","text":"十五、不障礙依處：謂於生、住、成、得事中，不障礙法。即依此處，立不相違因。謂彼不違生等事故。","juan":8},{"t":"p","text":"如是十因，二因所攝：一、能生；二、方便。〈菩薩地〉說：「牽引種子、生起種子，名能生因；所餘諸因，方便因攝。」","juan":8},{"t":"p","text":"此說牽引、生起、引發、定異、同事、不相違中，諸因緣種未成熟位，名牽引種；已成熟位名生起種。彼六因中，諸因緣種，皆攝在此二位中故。⸢272⸣雖⸤有現起是能生因，如四因中生自種者，而多間斷，此略不說。或親⸢273⸣辦⸤果亦立種名，如說現行穀、麥等種。","juan":8},{"t":"p","text":"所餘因謂初、二、五、九，及六因中非因緣法，皆是生、熟因緣種餘，故總說為方便因攝。","juan":8},{"t":"p","text":"非此二種，唯屬彼二因；餘四因中，有因緣種故。非唯彼八，名所餘因，彼二因亦有非因緣種故。","juan":8},{"t":"p","text":"有尋等地，說生起因，是能生因，餘方便攝。","juan":8},{"t":"p","text":"此文意說：六因中現種是因緣者皆名生起因；能親生起自類果故。此所餘因，皆方便攝。","juan":8},{"t":"p","text":"非此生起，唯屬彼因，餘五因中，有因緣故。非唯彼九，名所餘因，彼生起因中，有非因緣故。","juan":8},{"t":"p","text":"或〈菩薩地〉所說「牽引、生起種子」，即彼二因；「所餘諸因」即彼餘八。","juan":8},{"t":"p","text":"雖二因內，有非能生因，而因緣種勝，顯故偏說；雖餘因內，有非方便因，而增上者多，顯故偏說。","juan":8},{"t":"p","text":"有尋等地說：「生起因是能生因；餘方便」者，「生起」即是彼生起因；「餘因」應知即彼餘九。","juan":8},{"t":"p","text":"雖生起中有非因緣種，而去果近，親顯故偏說；雖牽引中亦有因緣種，而去果遠，親隱故不說。餘方便攝，准上應知。","juan":8},{"t":"p","text":"所說四緣，依何處立？復如何攝十因、二因？","juan":8},{"t":"p","text":"論說因緣，依種子立；依無間滅，立等無間；依境界，立所緣；依所餘，立增上。","juan":8},{"t":"p","text":"此中種子，即是三、四、十一、十二、十三、十五，六依處中因緣種攝；雖現四處，亦有因緣，而多間斷，此略不說。或彼亦能親⸢274⸣辦⸤自果，如外麥等，亦立種名。或種子言，唯屬第四，親、疎、隱、顯，取捨如前。","juan":8},{"t":"p","text":"言無間滅、境界處者，應知總顯二緣依處，非唯五、六，餘依處中，亦有中間二緣義故。或唯五、六，餘處雖有，而少、隱故，略不說之。","juan":8},{"t":"p","text":"論說因緣，能生因攝；增上緣性，即方便因；中間二緣，攝受因攝。雖方便內具後三緣，而增上多，故此偏說；餘因亦有中間二緣，然攝受中，顯故偏說。初能生攝，進退如前。","juan":8},{"t":"p","text":"所說因、緣，必應有果。此果有幾？依何處得？","juan":8},{"t":"p","text":"果有五種：一者異熟，謂有漏善及不善法所招自相續異熟生無記；二者等流，謂習善等所引同類，或似先業，後果隨轉；三者離繫，謂無漏道斷障所證善無為法；四者士用，謂諸作者，假諸作具，所⸢275⸣辦⸤事業；五者增上，謂除前四，餘所得果。","juan":8},{"t":"p","text":"《瑜伽》等說：習氣依處，得異熟果；隨順依處，得等流果；真見依處，得離繫果；士用依處，得士用果；所餘依處，得增上果。","juan":8},{"t":"p","text":"習氣處言，顯諸依處感異熟果一切功能；隨順處言，顯諸依處引等流果一切功能；真見處言，顯諸依處證離繫果一切功能；士用處言，顯諸依處招士用果一切功能；所餘處言，顯諸依處得增上果一切功能。不爾，便應太寬、太狹。","juan":8},{"t":"p","text":"或習氣者，唯屬第三，雖異熟因餘處亦有，此處亦有非異熟因；而異熟因，去果相遠，習氣亦爾，故此偏說。隨順唯屬第十一處，雖等流果餘處亦得，此處亦得非等流果；而此因招勝行相顯，隨順亦爾，故偏說之。真見處言，唯詮第十，雖證離繫餘處亦能，此處亦能得非離繫；而此證離繫，相顯故偏說。士用處言，唯詮第九，雖士用果餘處亦招，此處亦能招增⸢276⸣上⸤等；而名相顯，是故偏說。所餘唯屬餘十一處，雖十一處亦得餘果，招增上果餘處亦能；而此十一多招增上，餘已顯餘，故此偏說。","juan":8},{"t":"p","text":"如是即說此五果中：若異熟果，牽引、生起、定異、同事、不相違因，增上緣得；若等流果，牽引、生起、攝受、引發、定異、同事、不相違因，初、後緣得；若離繫果，攝受、引發、定異、同事、不相違因，增上緣得；若士用果，有義：觀待、攝受、同事、不相違因，增上緣得，有義：觀待、牽引、生起、攝受、引發、定異、同事、不相違因，除所緣緣，餘三緣得；若增上果，十因、四緣一切容得。","juan":8},{"t":"p","text":"傍論已了，應⸢277⸣辯⸤正論。","juan":8},{"t":"p","text":"本識中種，容作三緣，生現分別，除等無間。謂各親種，是彼因緣；為所緣緣，於能緣者；若種於彼，有能助力，或不障礙，是增上緣。","juan":8},{"t":"p","text":"生淨現行，應知亦爾。","juan":8},{"t":"p","text":"現起分別，展轉相望，容作三緣，無因緣故。","juan":8},{"t":"p","text":"謂有情類自、他，展轉容作二緣，除等無間。","juan":8},{"t":"p","text":"自八識聚，展轉相望，定有增上緣，必無等無間。所緣緣義，或無或有：八於七有；七於八無。餘七非八所⸢278⸣仗⸤質故。第七於六五無一有，餘六於彼一切皆無。第六於五無，餘五於彼有。五識唯託第八相故。","juan":8},{"t":"p","text":"自類前後，第六容三，餘除所緣，取現境故。許五後見緣前相者，五、七前後亦有三緣。前七於八，所緣容有，能熏成彼相、見種故。","juan":8},{"t":"p","text":"同聚異體，展轉相望，唯有增上。諸相應法，所⸢279⸣仗⸤質同，不相緣故。或依見分，說不相緣；依相分說，有相緣義。謂諸相分，互為質起，如識中種，為觸等相質。不爾，無色，彼應無境故；設許變色，亦定緣種，勿見分境不同質故。","juan":8},{"t":"p","text":"同體相分，為見二緣；見分於彼，但有增上。","juan":8},{"t":"p","text":"見與自證，相望亦爾。餘二展轉，俱作二緣。此中不依種相分說，但說現起互為緣故。","juan":8},{"t":"p","text":"淨八識聚，自、他展轉，皆有所緣，能遍緣故，唯除見分，非相所緣，相分理無能緣用故。","juan":8},{"t":"p","text":"既現分別緣種現生，種亦理應緣現種起，現種於種能作幾緣？種必不由中二緣起，⸢280⸣待⸤心、心所立彼二故。現於親種具作二緣，與非親種但為增上。種望親種亦具二緣，於非親種亦但增上。","juan":8},{"t":"p","text":"依斯內識互為緣起，分別因、果，理、教皆成。所執外緣，設有無用，況違理、教，何固執為？","juan":8},{"t":"p","text":"雖「分別」言，總顯三界心及心所，而隨勝者，諸聖教中多門顯示，或說為二、三、四、五等。如餘論中，具廣分別。","juan":8},{"t":"k","lv":6,"text":"2 釋生死相續難","juan":8},{"t":"p","text":"雖有內識，而無外緣，由何有情生死相續？","juan":8},{"t":"p","text":"頌曰：","juan":8}],"kepan":["2 釋生死相續難"],"yi":"由於第八一切種識，如是如是地展轉變現；復以諸識彼此展轉為緣的力量，所以種種分別得以生起。並非要有識外實境為緣，分別才能生。","yao":["此頌正答外人「若無外境，分別何由而生」之難，是唯識義能否自圓的關鍵處。","答義有二重：一者種子力（一切種識如是如是變），二者現行展轉力（以展轉力故）。二力並用，故不待外境。","「如是如是變」顯種子功能之差別性：不同種子生不同現行，故所現境相千差萬別而井然有序，非雜亂無因。","本頌與下頌相連，共同承擔「不立外境而能成立因果相續」的論證任務，是唯識學回應實在論最集中的一段。"],"ming":[["一切種識","第八識持一切法種子，故名。此處就其能生現行之因能變義而說。"],["展轉力","諸識與心所互為增上緣之力用，如見聞覺知相引而起。"],["彼彼分別","種種能分別之識與心所。由種子及展轉緣力而生，非由外境。"]]},{"id":13,"label":"生死相續・二種習氣","verses":[19],"kind":"verse","juan":[8],"chars":3653,"blocks":[{"t":"v","num":19,"lines":["由諸業習氣，二取習氣俱；","前異熟既盡，復生餘異熟。"],"juan":8},{"t":"p","text":"論曰：諸業謂福、非福、不動，即有漏善、不善思業。業之眷屬亦立業名，同招引、滿異熟果故。","juan":8},{"t":"p","text":"此雖纔起，無間即滅，無義能招當異熟果，而熏本識，起自功能，即此功能，說為習氣，是業氣分，熏習所成，簡曾現業，故名習氣。","juan":8},{"t":"p","text":"如是習氣，展轉相續，至成熟時，招異熟果，此顯當果勝增上緣。","juan":8},{"t":"p","text":"相見、名色、心及心所、本末，彼取皆二取攝。彼所熏發，親能生彼本識上功能，名二取習氣。此顯來世異熟果心，及彼相應諸因緣種。「俱」謂業種、二取種俱，是疎、親緣，互相助義。","juan":8},{"t":"p","text":"業招生顯，故頌先說。","juan":8},{"t":"p","text":"「前異熟」者，謂前前生業異熟果；「餘異熟」者，謂後後生業異熟果。","juan":8},{"t":"p","text":"雖二取種受果無窮，而業習氣受果有盡，由異熟果性別難招；等流、增上性同易感。","juan":8},{"t":"p","text":"由感餘生業等種熟，前異熟果受用盡時，復別能生餘異熟果。","juan":8},{"t":"p","text":"由斯生死輪轉無窮，何假外緣方得相續？此頌意說：由業、二取，生死輪迴皆不離識，心、心所法為彼⸢281⸣性⸤故。","juan":8},{"t":"p","text":"復次，生死相續，由諸習氣。","juan":8},{"t":"p","text":"然諸習氣總有三種：一、名言習氣，謂有為法各別親種。名言有二：一表義名言，即能詮義，音聲差別；二顯境名言，即能了境心、心所法。隨二名言所熏成種，作有為法各別因緣。","juan":8},{"t":"p","text":"二、我執習氣，謂虛妄執我、我所種。我執有二：一、俱生我執，即修所斷我、我所執；二、分別我執，即見所斷我、我所執。隨二我執所熏成種，令有情等自、他差別。","juan":8},{"t":"p","text":"三、有支習氣，謂招三界異熟業種。有支有二：一、有漏善，即是能招可愛果業；二、諸不善，即是能招非愛果業。隨二有支所熏成種，令異熟果善、惡趣別。應知我執、有支習氣，於差別果是增上緣。","juan":8},{"t":"p","text":"此頌所言「業習氣」者，應知即是有支習氣；「二取習氣」，應知即是我執、名言二種習氣。取我、我所及取名言而熏成故，皆說名「取」。","juan":8},{"t":"p","text":"「俱」等餘文，義如前釋。","juan":8},{"t":"p","text":"復次，生死相續，由惑、業、苦。","juan":8},{"t":"p","text":"發業、潤生煩惱，名惑；能感後有諸業，名業；業所引生眾苦，名苦。惑、業、苦種，皆名習氣。前二習氣，與生死苦為增上緣，助生苦故。第三習氣，望生死苦能作因緣，親生苦故。頌三習氣，如應當知：⸢282⸣惑⸤、苦名取，能、所取故。取是著義，業不得名。","juan":8},{"t":"p","text":"「俱」等餘文，義如前釋。","juan":8},{"t":"p","text":"此⸢283⸣惑⸤、業、苦，應知總攝十二有支。謂從無明乃至老死，如論廣釋。","juan":8},{"t":"p","text":"然十二支，略攝為四：","juan":8},{"t":"p","text":"一、能引支：謂無明、行，能引識等五果種故。","juan":8},{"t":"p","text":"此中無明，唯取能發正感後世善、惡業者，即彼所發，乃名為行。由此一切順現受業，別助當業，皆非行支。","juan":8},{"t":"p","text":"二、所引支：謂本識內親生當來異熟果，攝識等五種，是前二支所引發故。","juan":8},{"t":"p","text":"此中識種，謂本識因，除後三因，餘因皆是名色種攝。後之三因，如名次第，即後三種。或名色種，總攝五因，於中隨勝，立餘四種，六處與識，總別亦然。","juan":8},{"t":"p","text":"《集論》說識亦是能引，識中業種，名識支故；異熟識種，名色攝故。經說識支通能、所引，業種、識種，俱名識故；識是名色依，非名色攝故。識等五種由業熏發，雖實同時，而依主伴、總別、勝劣、因果相異，故諸聖教假說前後，或依當來、現起分位有次第故，說有前後。由斯識等，亦說現行；因時定無現行義故。復由此說生、引同時；潤、⸢284⸣未⸤潤時必不俱故。","juan":8},{"t":"p","text":"三、能生支：謂愛、取、有，近生當來生、老死故。","juan":8},{"t":"p","text":"謂緣迷內異熟果愚，發正能招後有諸業為緣，引發親生當來生、老死位五果種已，復依迷外增上果愚，緣境界受，發起貪愛，緣愛復生欲等四取，愛、取合潤，能引業種及所引因，轉名為「有」，俱能近有後有果故。有處唯說業種名「有」，此能正感異熟果故。復有唯說五種名有，親生當來識等種故。","juan":8},{"t":"p","text":"四、所生支：謂生、老死，是愛、取、有近所生故。","juan":8},{"t":"p","text":"謂從「中有」至「本有」中，未衰變來，皆「生支」攝，諸衰變位，總名為老；身壞命終，乃名為「死」。","juan":8},{"t":"p","text":"老非定有，附死立支。","juan":8},{"t":"p","text":"病何非支？不遍、定故。老雖不定，遍故立支，諸界、趣、生除中夭者，將終皆有衰朽行故。","juan":8},{"t":"p","text":"名色不遍，何故立支？","juan":8},{"t":"p","text":"定故立支，胎、卵、濕生者，六處未滿，定有名色故。","juan":8},{"t":"p","text":"又名色支，亦是遍有。有色化生，初受生位，雖具五根，而未有用，爾時未名六處支故。初生無色，雖定有意根而不明了，未名意處故；由斯論說，十二有支，一切一分，上二界有。","juan":8},{"t":"p","text":"愛非遍有，寧別立支？生惡趣者，不愛彼故。","juan":8},{"t":"p","text":"定故別立，不求無有生善趣者，定有愛故。不還潤生，愛雖不起，然如彼取，定有種故。","juan":8},{"t":"p","text":"又愛亦遍，生惡趣者，於現我境，亦有愛故。依無希求，惡趣身愛，經說非有，非彼全無。","juan":8},{"t":"p","text":"何緣所生立生、老死？所引別立識等五支？","juan":8},{"t":"p","text":"「因位」難知差別相故，依當果位，別立五支。","juan":8},{"t":"p","text":"謂續生時，因識相顯，次根未滿，名色相增；次根滿時，六處明盛；依斯發觸，因觸起受；爾時乃名受果究竟。依此果位，立因為五。果位易了，差別相故，總立二支，以顯三苦。然所生果若在未來，為生厭故，說生、老死；若至現在，為令了知分位相生，說識等五。","juan":8},{"t":"p","text":"何緣發業總立無明，潤業位中別立愛、取？","juan":8},{"t":"p","text":"雖諸煩惱皆能發、潤，而發業位無明力增，以具十一殊勝事故。謂所緣等，廣如經說。","juan":8},{"t":"p","text":"於潤業位，愛力偏增，說愛如水，能沃潤故。要數溉灌方生「有」⸢285⸣芽⸤。且依初、後，分愛、取二，無重發義，立一無明。雖取支中，攝諸煩惱，而愛潤勝，說是愛增。","juan":8},{"t":"p","text":"諸緣起支皆依自地？有所發行依他無明，如下無明發上地行。不爾，初伏下地染者，所起上定，應非行支，彼地無明猶未起故。","juan":8},{"t":"p","text":"從上、下地生⸢286⸣下⸤、上者，彼緣何受而起愛支？彼愛亦緣當生地受，若現、若種，於理無違。","juan":8},{"t":"p","text":"此十二支，十因、二果，定不同世。因中前七與愛、取、有，或異或同。若二、三、七各定同世。如是十二，一重因果，足顯輪轉，及離斷、常，施設兩重，實為無用，或應過此，便致無窮。","juan":8},{"t":"p","text":"此十二支義門別者：九實、三假。已潤六支，合為有故；即識等五，三相位別，名生等故。","juan":8},{"t":"p","text":"五是一事，謂無明、識、觸、受、愛五；餘非一事。","juan":8},{"t":"p","text":"三唯是染，煩惱性故；七唯不染，異熟果故；七分位中容起染故，假說通二，餘通二種。","juan":8},{"t":"p","text":"無明、愛、取說名獨相，不與餘支相交雜故；餘是雜相。","juan":8},{"t":"p","text":"六唯非色，謂無明、識、觸、受、愛、取；餘通二種。","juan":8},{"t":"p","text":"皆是有漏，唯有為攝。","juan":8},{"t":"p","text":"無漏無為，非有支故。","juan":8},{"t":"p","text":"「無明」、「愛」、「取」，唯通不善、有覆無記；「行」唯善、惡；「有」通善、惡、無覆無記；餘七唯是無覆無記。七分位中，亦起善、染。","juan":8},{"t":"p","text":"雖皆通三界，而有分、有全。","juan":8},{"t":"p","text":"上地行支，能伏下地，即麁、苦等六種行相。有求上生，而起彼故。","juan":8},{"t":"p","text":"一切皆唯非學、無學聖者所起有漏善業，明為緣故，違有支故，非有支攝。由此應知聖必不造感後有業，於後苦果不迷求故。雜修靜慮，資下故業，生淨居等，於理無違。","juan":8},{"t":"p","text":"有義：無明唯見所斷，要迷諦理能發行故，聖必不造後有業故；愛、取二支唯修所斷，貪求當有而潤生故，九種命終心俱生愛俱故；餘九皆通見、修所斷。","juan":8},{"t":"p","text":"有義：一切皆通二斷。","juan":8},{"t":"p","text":"論說：預流果已斷一切一分有支，無全斷者故。若無明支唯見所斷，寧說預流無全斷者？若愛、取支唯修所斷，寧說彼已斷一切支一分？又說⸢287⸣全⸤界一切煩惱，皆能結生，往惡趣行，唯分別起煩惱能發，不言潤生唯修所斷，⸢288⸣諸⸤感後有行，皆見所斷發。","juan":8},{"t":"p","text":"由此故知無明、愛、取三支，亦通見、修所斷。然無明支正發行者，唯見所斷，助者不定；愛、取二支正潤生者，唯修所斷，助者不定。","juan":8},{"t":"p","text":"又染污法自性應斷，對治起時彼永斷故。一切有漏不染污法，非性應斷，不違道故。然有二義說之為斷：一、離縛故，謂斷緣彼、雜彼煩惱；⸢289⸣二⸤、不生故，謂斷彼依令永不起。依離縛斷，說有漏善、無覆無記，唯修所斷；依不生斷說諸惡趣、無想定等，唯見所斷。說十二支通二斷者，於前諸斷，如應當知。","juan":8},{"t":"p","text":"十樂、捨俱，受不與受共相應故；老死位中，多分無樂及容捨故。十一苦俱，非受俱故。","juan":8},{"t":"p","text":"十一少分壞苦所攝，老死位中，多無樂受，依樂立壞，故不說之。十二少分苦苦所攝，一切支中，有苦受故；十二全分，行苦所攝，諸有漏法皆行苦故，依捨受說十一少分，除老死支，如壞苦說。實義如是，諸聖教中，隨彼相增，所說不定。","juan":8},{"t":"p","text":"皆苦諦攝，取蘊性故。五亦集諦攝，業煩惱性故。","juan":8},{"t":"p","text":"諸支相望，增上定有，餘之三緣，有無不定。契經依定，唯說有一。愛望於取，有望於生，有因緣義。若說識支是業種者，行望於識，亦作因緣。餘支相望，無因緣義。而《集論》說，無明望行，有因緣者，依無明時，業習氣說，無明俱故，假說無明，實是行種。《瑜伽論》說，諸支相望無因緣者，依現愛、取，唯業有說。無明望行，愛望於取，生望老死有餘二緣。有望於生，受望於愛，無等無間，有所緣緣。餘支相望，二俱非有。","juan":8},{"t":"p","text":"此中且依隣近、順次、不相雜亂，實緣起說。異此相望，為緣不定。諸聰慧者，如理應思。","juan":8},{"t":"p","text":"惑、業、苦三攝十二者：無明、愛、取，是惑所攝；行、有一分，是業所攝；七、有一分，是苦所攝。","juan":8},{"t":"p","text":"有處說業全攝有者，應知彼依「業有」說故。有處說識業所攝者，彼說業種為識支故。","juan":8},{"t":"p","text":"惑、業所招獨名苦者，唯苦諦攝，為生厭故。","juan":8},{"t":"p","text":"由⸢290⸣惑⸤、業、苦即十二支故，此能令生死相續。","juan":8},{"t":"p","text":"復次，生死相續，由內因緣，不待外緣，故唯有識。","juan":8},{"t":"p","text":"因謂有漏、無漏二業正感生死，故說為因；緣謂煩惱、所知二障助感生死，故說為緣。","juan":8},{"t":"p","text":"所以者何？","juan":8},{"t":"p","text":"生死有二：","juan":8},{"t":"p","text":"一、分段生死，謂諸有漏善、不善業，由煩惱障緣助勢力，所感三界麁異熟果，身命短長，隨因緣力，有定齊限，故名分段。","juan":8},{"t":"p","text":"二、不思議變易生死，謂諸無漏有分別業，由所知障緣助勢力，所感殊勝細異熟果。","juan":8},{"t":"p","text":"由悲願力，改轉身命，無定齊限，故名變易；無漏定願正所資、感，妙用難測，名不思議。","juan":8},{"t":"p","text":"或名「意成身」，隨意願成故。如契經說：如取為緣，有漏業因，續後有者，而生三有。如是無明習地為緣，無漏業因，有阿羅漢、獨覺、已得自在菩薩，生三種意成身。","juan":8},{"t":"p","text":"亦名變化身，無漏定力，轉令異本，如變化故。如有論說：聲聞無學永盡後有，云何能證無上菩提？依變化身，證無上覺，非業報身，故不違理。","juan":8},{"t":"p","text":"若所知障助無漏業，能感生死，二乘定⸢291⸣性⸤，應不永入無餘涅槃。如諸異生拘煩惱故。","juan":8},{"t":"p","text":"如何道諦實能感苦？誰言實感？不爾，如何？無漏定、願，資有漏業，令所得果，相續長時，展轉增勝，假說名感。如是感時，由所知障為緣助力，非獨能感。然所知障，不障解脫，無能發業潤生用故。","juan":8},{"t":"p","text":"何用資感生死苦為？自證菩提，利樂他故。謂不定⸢292⸣性⸤獨覺、聲聞，及得自在大願菩薩，已永斷伏煩惱障故，無容復受當分段身。恐⸢293⸣廢⸤長時修菩薩行，遂以無漏勝定願力，如延壽法資現身因，令彼長時與果不絕，數數如是定願資助，乃至證得無上菩提。","juan":8},{"t":"p","text":"彼復何須所知障助？既未圓證無相大悲，不執菩提、有情實有，無由發起猛利悲願；又所知障，障大菩提，為永斷除，留身久住；又所知障為有漏依，此障若無，彼定非有，故於身住，有大助力。","juan":8},{"t":"p","text":"若所留身，有漏定願所資助者，分段身攝，二乘、異生所知境故。無漏定願所資助者，變易身攝，非彼境故。","juan":8},{"t":"p","text":"由此應知，變易生死，性是有漏，異熟果攝，於無漏業，是增上果。有聖教中說為無漏，出三界者，隨助因說。","juan":8},{"t":"p","text":"頌中所言諸業習氣，即前所說二業種子；二取習氣即前所說二障種子，俱執著故。「俱」等餘文，義如前釋。","juan":8},{"t":"p","text":"變易生死，雖無分段前後異熟別盡別生，而數資助，前後改轉，亦有前盡餘復生義。雖亦由現生死相續，而種定有，頌偏說之。或為顯示真異熟，因果皆不離本識，故不說現。現異熟因，不即與果。轉識間斷，非異熟故。","juan":8},{"t":"p","text":"前、中、後際，生死輪迴，不待外緣，既由內識，淨法相續，應知亦然。謂無始來，依附本識，有、無漏種，由轉識等，數數熏發，漸漸增勝，乃至究竟，得成佛時，轉捨本來雜染識種，轉得始起清淨種識，任持一切功德種子。由本願力，盡未來際，起諸妙用，相續無窮。","juan":8},{"t":"p","text":"由此應知，唯有內識。","juan":8},{"t":"k","lv":5,"text":"㊁釋違教","juan":8},{"t":"p","text":"若唯有識，何故世尊處處經中說有三性？","juan":8},{"t":"k","lv":6,"text":"1 釋三自性不成難","juan":8},{"t":"p","text":"應知三性亦不離識。","juan":8},{"t":"p","text":"所以者何？","juan":8},{"t":"p","text":"頌曰：","juan":8}],"kepan":["㊁釋違教","1 釋三自性不成難"],"yi":"由於諸業習氣，與能取所取二取習氣共同運作，前一期的異熟果報既已窮盡，便又生起其餘的異熟果報，如是生死相續不斷。","yao":["業習氣即善惡業所熏成的功能，能招異熟總報；二取習氣即名言習氣，是異熟果得以各別現起的親因。二者一為增上緣、一為因緣，配合方成生死相續。","此頌立於不立外境、不立作者的前提下解釋輪迴，故是「唯識而有因果」的正面回答，回應了外人「無我誰受果報」之詰。","「前異熟既盡，復生餘異熟」顯示異熟果的次第性：一期報盡而後起，非同時多果並受，故有生死之相。","本頌是唯識學緣起論的樞紐：與十二有支相配，業習氣當行支與有支，二取習氣當識、名色、六處等，論中並辨其相攝。"],"ming":[["業習氣","善不善業所熏第八識中之功能，能感異熟總報，屬增上緣。"],["二取習氣","能取（見分）與所取（相分）熏成之名言種子，為異熟別報之親因緣。"],["異熟","由業所感之無記果報。此處指一期生命之總報體。"],["名言種子","由名言熏習所成、能親生自類現行之種子。分表義名言與顯境名言。"]]},{"id":14,"label":"三性","verses":[20,21,22],"kind":"verse","juan":[8,9],"chars":2949,"blocks":[{"t":"v","num":20,"lines":["由彼彼遍計，遍計種種物，","此遍計所執，自性無所有。"],"juan":8},{"t":"v","num":21,"lines":["依他起自性，分別緣所生。","圓成實於彼，常遠離前性。"],"juan":8},{"t":"v","num":22,"lines":["故此與依他，非異非不異，","如無常等性，非不見此彼。"],"juan":8},{"t":"p","text":"論曰：周遍計度，故名遍計；品類眾多，說為「彼彼」。謂能遍計虛妄分別。即由彼彼虛妄分別，遍計種種所遍計物：謂所妄執蘊、處、界等，若法、若我自性差別。此所妄執自性差別，總名遍計所執自性。如是自性，都無所有，理、教推徵，不可得故。","juan":8},{"t":"p","text":"或初句顯能遍計識，第二句示所遍計境，後半方申遍計所執若我、若法自性非有，已廣顯彼不可得故。","juan":8},{"t":"p","text":"初能遍計，自性云何？","juan":8},{"t":"p","text":"有義：八識及諸心所，有漏攝者，皆能遍計，虛妄分別為自性故；皆似所取、能取現故；說阿賴耶以遍計所執自性，妄執種為所緣故。","juan":8},{"t":"p","text":"有義：第六、第七心品執我、法者，是能遍計。","juan":8},{"t":"p","text":"唯說意識能遍計故，意及意識名意識故；計度分別能遍計故；執我、法者必是慧故；二執必與無明俱故；不說無明有善性故；癡、無癡等不相應故；不見有執導空智故；執有、⸢294⸣達⸤無不俱起故；曾無有執非能熏故。","juan":8},{"t":"p","text":"有漏心等不證實故，一切皆名虛妄分別。雖似所取、能取相現，而非一切能遍計攝，勿無漏心亦有執故，如來後得應有執故。經說佛智現身、土等種種影像，如鏡等故，若無緣用應非智等。雖說藏識緣遍計種，而不說唯，故非誠證。由斯理趣，唯於第六、第七心品，有能遍計。","juan":8},{"t":"p","text":"識品雖二，而有二、三、四、五、六、七、八、九、十等遍計不同，故言「彼彼」。","juan":8},{"t":"p","text":"次所遍計自性云何？《攝大乘》說是依他起，遍計心等所緣緣故。圓成實性寧非彼境？真非妄執所緣境故，依展轉說亦所遍計。遍計所執雖是彼境，而非所緣緣，故非所遍計。","juan":8},{"t":"p","text":"遍計所執，其相云何？與依他起，復有何別？","juan":8},{"t":"p","text":"有義：三界心及心所，由無始來虛妄熏習，雖各體一，而似二生：謂見、相分，即能、所取。如是二分，情有理無，此相說為遍計所執。二所依體，實託緣生，此性非無，名依他起，虛妄分別緣所生故。","juan":8},{"t":"p","text":"云何知然？諸聖教說：虛妄分別是依他起，二取名為遍計所執。","juan":8},{"t":"p","text":"有義：一切心及心所，由熏習力所變二分，從緣生故，亦依他起。遍計依斯妄執定實有無、一異、俱不俱等，此二方名遍計所執。","juan":8},{"t":"p","text":"諸聖教說：唯量、唯二、⸢295⸣唯⸤種種，皆名依他起故。又相等四法、十一識等，論皆說為依他起攝故。","juan":8},{"t":"p","text":"不爾，無漏後得智品二分，應名遍計所執。許應聖智不緣彼生，緣彼智品應非道諦；不許應知有漏亦爾。又若二分是遍計所執，應如⸢296⸣兔⸤角等非所緣緣，遍計所執體非有故。又應二分不熏成種，後識等生，應無二分。又諸習氣是相分攝，豈非有法能作因緣？若緣所生內相、見分，非依他起，二所依體，例亦應然，無異因故。","juan":8},{"t":"p","text":"由斯理趣，眾緣所生心、心所體及相、見分，有漏、無漏皆依他起。","juan":8},{"t":"p","text":"依他眾緣而得起故。頌言：「分別緣所生」者，應知且說染分依他，淨分依他亦圓成故。或諸染淨心、心所法，皆名分別，能緣慮故。是則一切染、淨依他，皆是此中依他起攝。","juan":8},{"t":"p","text":"二空所顯圓滿成就，諸法實性，名圓成實。顯此遍、常，體非虛謬，簡自、共相、虛空、我等。無漏有為，離倒、究竟、勝用周遍，亦得此名。然今頌中，說初非後。","juan":8},{"t":"p","text":"此即於彼依他起上，常遠離前遍計所執，二空所顯真如為性。","juan":8},{"t":"p","text":"說「於彼」言：顯圓成實與依他起，不即不離；「常遠離」言：顯妄所執能、所取性，理恒非有。「前」言義顯不空依他；「性」顯二空非圓成實，真如離有離無性故。","juan":8},{"t":"p","text":"由前理故，此圓成實與彼依他起，非異非不異。異應真如非彼實性；不異此性應是無常。彼此俱應淨、非淨境，則本後智，用應無別。","juan":8},{"t":"p","text":"云何二性，非異非一？如彼無常、無我等⸢297⸣性⸤。無常等性與行等法異，應彼法非無常等；不異此應非彼共相。","juan":8},{"t":"p","text":"由斯喻顯，此圓成實與彼依他，非一非異，法與法性，理必應然，勝義、世俗，相待有故。","juan":8},{"t":"p","text":"非不證見此圓成實，而能見彼依他起性。","juan":8},{"t":"p","text":"未達遍計所執性空，不如實知依他有故。無分別智證真如已，後得智中，方能了達依他起性如幻事等。","juan":8},{"t":"p","text":"雖無始來心、心所法，已能緣自相、見分等，而我、法執恒俱行故，不如實知。眾緣所引自心、心所，虛妄變現，猶如幻事、陽焰、夢境、鏡像、光影、谷響、水月、變化所成，非有似有。依如是義，故有頌言：","juan":8},{"t":"v","num":null,"lines":["「非不見真如，而能了諸行，","皆如幻事等，雖有而非真。」"],"juan":8},{"t":"p","text":"此中意說：三種自性，皆不遠離心、心所法。","juan":8},{"t":"p","text":"謂心、心所及所變現，眾緣生故，如幻事等，非有、似有，誑惑愚夫，一切皆名依他起性。愚夫於此橫執我法、有無、一異、俱不俱等，如空花等，性、相都無，一切皆名遍計所執。依他起上，彼所妄執我、法俱空，此空所顯識等真性，名圓成實。","juan":8},{"t":"p","text":"是故此三，不離心等。","juan":8},{"t":"p","text":"虛空、擇滅、非擇滅等，何性攝耶？","juan":8},{"t":"p","text":"三皆容攝。","juan":8},{"t":"p","text":"心等變似虛空等相，隨心生故，依他起攝；愚夫於中，妄執實有，此即遍計所執性攝；若於真如，假施設有虛空等義，圓成實攝。有漏心等，定屬依他；無漏心等，容二性攝。眾緣生故，攝屬依他；無顛倒故，圓成實攝。","juan":8},{"t":"p","text":"如是三性與七真如，云何相攝？","juan":8},{"t":"p","text":"七真如者：一、流轉真如，謂有為法，流轉實性；二、實相真如，謂二無我，所顯實性；三、唯識真如，謂染淨法，唯識實性；四、安立真如，謂苦實性；五、⸢298⸣邪⸤行真如，謂集實性；六、清淨真如，謂滅實性；七、正行真如，謂道實性。","juan":8},{"t":"p","text":"此⸢299⸣七⸤實性，圓成實攝，根本、後得二智境故；隨相攝者，流轉、⸢300⸣苦⸤、集三，前二性攝，妄執雜染故；餘四皆是圓成實攝。","juan":8},{"t":"p","text":"三性六法，相攝云何？彼六法中，皆具三性。色、受、想、行、識及無為，皆有妄執緣生理故。","juan":8},{"t":"p","text":"三性五事，相攝云何？","juan":8},{"t":"p","text":"諸聖教說，相攝不定：","juan":8},{"t":"p","text":"謂或有處說：依他起攝彼相、名、分別、正智；圓成實性攝彼真如；遍計所執不攝五事。彼說有漏心、心所法，變似所詮，說名為相；似能詮現，施設為名；能變心等，立為分別；無漏心等，離戲論故，但總名正智，不說能、所詮。四從緣生，皆依他攝。","juan":8},{"t":"p","text":"或復有處說：依他起攝相、分別；遍計所執，唯攝彼名；正智、真如，圓成實攝。彼說有漏心及心所相分名相，餘名分別；遍計所執，都無體故，為顯非有，假說為名；二無倒故，圓成實攝。","juan":8},{"t":"p","text":"或有處說：依他起性唯攝分別；遍計所執，攝彼相、名；正智、真如，圓成實攝。彼說有漏心及心所相、見分等，總名分別，虛妄分別為自性故，遍計所執，能詮、所詮，隨情立為名、相二事。","juan":8},{"t":"p","text":"復有處說：名屬依他起性，義屬遍計所執。彼說有漏心、心所法相、見分等，由名勢力成所遍計，故說為名；遍計所執，隨名橫計，體實非有，假立義名。","juan":8},{"t":"p","text":"諸聖教中所說五事，文雖有異，而義無違。然初所說不相雜亂，如《瑜伽論》廣說應知。","juan":8},{"t":"p","text":"又聖教中說有五相，⸢301⸣此與⸤三性相攝云何？","juan":8},{"t":"p","text":"所詮、能詮各具三性：謂妄所計，屬初性攝；相、名、分別，隨其所應，所詮、能詮，屬依他起；真如、正智，隨其所應，所詮、能詮，屬圓成實，後得變似能詮相故。","juan":8},{"t":"p","text":"二相屬相，唯初性攝，妄執義、名，定相屬故。","juan":8},{"t":"p","text":"⸢302⸣彼⸤執著相，唯依他起，虛妄分別為自性故。","juan":8},{"t":"p","text":"不執著相，唯圓成實，無漏智等為自性故。","juan":8},{"t":"p","text":"又聖教中說四真實，與此三性相攝云何？","juan":8},{"t":"p","text":"世間、道理所成真實，依他起攝；三事攝故；二障淨智所行真實，圓成實攝；二事攝故。","juan":8},{"t":"p","text":"《⸢303⸣辯⸤中邊論》說：初真實唯初性攝，共所執故；第二真實通屬三性，理通執無執，雜染、清淨故；後二真實唯屬第三。","juan":8},{"t":"p","text":"三性四諦，相攝云何？","juan":8},{"t":"p","text":"四中一一皆具三性。","juan":8},{"t":"p","text":"且苦諦中無常等四各有三性。無常三者：一、無性無常，性常無故；二、起盡無常，有生滅故；三、垢淨無常，位轉變故。","juan":8},{"t":"p","text":"苦有三者：一、所取苦，我、法二執所依取故；二、事相苦，三苦相故；三、和合苦，苦⸢304⸣相⸤合故。","juan":8},{"t":"p","text":"空有三者：一、無性空，性非有故；二、異性空，與妄所執自性異故；三、自性空，二空所顯為自性故。","juan":8},{"t":"p","text":"無我三者：一、無相無我，我相無故；二、異相無我，與妄所執我相異故；三、自相無我，無我所顯為自相故。","juan":8},{"t":"p","text":"集諦三者：一、習氣集，謂遍計所執自性執習氣，執彼習氣假立彼名；二、等起集，謂業、煩惱；三、未離繫集，謂未離障真如。","juan":8},{"t":"p","text":"滅諦三者：一、自性滅，自性不生故；二、二取滅，謂擇滅二取不生故；三、本性滅，謂真如故。","juan":8},{"t":"p","text":"道諦三者：一、遍知道，能知遍計所執故；二、永斷道，能斷依他起故；三、作證道，能證圓成實故。然遍知道，亦通後二。","juan":8},{"t":"p","text":"七⸢305⸣三⸤三性，如次配釋。今於此中，所配三性，或假或實，如理應知。","juan":8},{"t":"p","text":"三解脫門所行境界，與此三性相攝云何？理實皆通，隨相各一。空、無願、相，如次應知。緣此復生三無生忍：一、本性無生忍；二、自然無生忍；三、⸢306⸣惑⸤苦無生忍。如次此三，是彼境故。","juan":8},{"t":"p","text":"此三云何攝彼二諦？應知世俗具此三種；勝義唯是圓成實性。世俗有三：一、假世俗；二、行世俗；三、顯了世俗。如次應知即此三性。勝義有三：一、義勝義，謂真如，勝之義故；二、得勝義，謂涅槃，勝即義故；三、行勝義，謂聖道，勝為義故。無變、無倒，隨其所應，故皆攝在圓成實性。","juan":8},{"t":"p","text":"如是三性，何智所行？遍計所執，都非智所行，以無自⸢307⸣體⸤，非所緣緣故。愚夫執有，聖者達無，亦得說為凡、聖智境。依他起性，二智所行。圓成實性，唯聖智境。","juan":8},{"t":"p","text":"此三性中，幾假？幾實？遍計所執，妄安立故，可說為假；無體相故，非假非實。依他起性，有實有假：聚集、相續、分位性故，說為假有；心、心所、色，從緣生故，說為實有。若無實法，假法亦無，假依實因而施設故。圓成實性，唯是實有，不依他緣而施設故。","juan":8},{"t":"p","text":"此三為異？為不異耶？應說俱非，無別體故；妄執、緣起、真義別故。","juan":8},{"t":"p","text":"如是三性，義類無邊，恐厭繁文，略示綱要。","juan":8},{"t":"k","lv":6,"text":"2 釋三無性不成難","juan":9},{"t":"p","text":"若有三性，如何世尊說一切法皆無自性？","juan":9},{"t":"p","text":"頌曰：","juan":9}],"kepan":["2 釋三無性不成難"],"yi":"由於種種能遍計的心識，普遍計度種種所遍計之物，這樣計執出來的自性，即遍計所執性，其實無所有。依他起自性，是依眾緣分別而生起者。圓成實性，則是於依他起上恆常遠離遍計所執性所顯的真實。所以圓成實與依他起，非異亦非不異；如同無常等性之於諸行，不見圓成實則亦不能如實見依他起。","yao":["三性是唯識學的存有論總綱：遍計所執是妄執之無，依他起是緣生之有，圓成實是離妄所顯之真。三者非三物並列，而是同一依他起上的三重觀照。","「能遍計」屬何識，論中異說：安慧主張八識皆能遍計，護法判唯第六、第七能遍計，因唯此二有計度分別。此為本節最重要的抉擇點。","「非異非不異」防兩邊：若異，則真如非依他實性；若不異，則圓成應同依他為有為法。論以「如無常等性」為喻，取其不即不離。","「非不見此彼」句反顯修證次第：未證圓成實者，其所見依他起仍雜遍計，故轉依必以見道證真如為分界。"],"ming":[["遍計所執性","由能遍計心於依他起上妄執實我實法，其所執性體實無所有。"],["依他起性","依託眾緣而生起之有為諸法，即心心所及其所變。非無而非實有。"],["圓成實性","圓滿、成就、真實。即二空所顯真如，於依他起上遠離遍計所執而顯。"],["能遍計","能起計度執著之識。護法判唯第六、第七二識。"],["所遍計","被計度之對象，即依他起法。"]]},{"id":15,"label":"三無性・唯識實性","verses":[23,24,25],"kind":"verse","juan":[9],"chars":826,"blocks":[{"t":"v","num":23,"lines":["即依此三性，立彼三無性，","故佛⸢308⸣密⸤意說，一切法無性。"],"juan":9},{"t":"v","num":24,"lines":["初即相無性，次無自然性，","後由遠離前，所執我法性，"],"juan":9},{"t":"v","num":25,"lines":["此諸法勝義，亦即是真如，","常如其性故，即唯識實性。"],"juan":9},{"t":"p","text":"論曰：即依此前所說三性，立彼後說三種無性，謂即相、生、勝義無性，故佛密意說一切法皆無自性，非性全無。","juan":9},{"t":"p","text":"說「密意」言顯非了義，謂後二性雖體非無，而有愚夫於彼增益，妄執實有我、法自性，此即名為遍計所執。為除此執，故佛世尊於有及無，總說無性。","juan":9},{"t":"p","text":"云何依此而立彼三？","juan":9},{"t":"p","text":"謂依此初遍計所執立相無性，由此體相畢竟非有，如空華故。依次依他立生無性，此如幻事託眾緣生，無如妄執自然性故，假說無性，非性全無。依後圓成實立勝義無性，謂即勝義由遠離前遍計所執我、法性，故假說無性，非性全無。如太虛空雖遍眾色，而是眾色無性所顯。","juan":9},{"t":"p","text":"雖依他起非勝義故，亦得說為勝義無性，而濫第二，故此不說。","juan":9},{"t":"k","lv":2,"text":"(貳) 明唯識性","juan":9},{"t":"p","text":"此性即是諸法勝義，是一切法勝義諦故。然勝義諦略有四種：一、世間勝義，謂蘊、處、界等；二、道理勝義，謂苦等四諦；三、證得勝義，謂二空真如；四、勝義勝義，謂一真法界。此中勝義依最後說，是最勝道所行義故，為簡前三，故作是說。此諸法勝義亦即是真如，真謂真實，顯非虛妄，如謂如常，表無變易，謂此真實於一切位常如其性，故曰真如，即是湛然不虛妄義。「亦」言顯此復有多名，謂名法界及實際等，如餘論中隨義廣釋。","juan":9},{"t":"k","lv":3,"text":"一、解第二十五頌唯識真性","juan":9},{"t":"k","lv":4,"text":"(一) 釋初三句","juan":9},{"t":"k","lv":4,"text":"(二) 釋第四句","juan":9},{"t":"p","text":"此性即是唯識實性，謂唯識性略有二種：一者虛妄，謂遍計所執；二者真實，謂圓成實性，為簡虛妄說「實性」言。復有二性：一者世俗，謂依他起；二者勝義，謂圓成實，為簡世俗故說「實性」。","juan":9},{"t":"k","lv":3,"text":"二、總釋二十三至二十五頌意","juan":9},{"t":"p","text":"三頌總顯諸契經中說無性言非極了義，⸢309⸣諸⸤有智者不應依之總撥諸法都無自性。","juan":9},{"t":"k","lv":2,"text":"(參) 明唯識位","juan":9},{"t":"k","lv":3,"text":"一、結上顯後所明","juan":9},{"t":"k","lv":4,"text":"(一) 結上示三問","juan":9},{"t":"p","text":"如是所成唯識相、性，誰於幾位？如何悟入？","juan":9},{"t":"p","text":"謂具大乘二⸢310⸣種姓⸤者，略於五位漸次悟入。","juan":9},{"t":"k","lv":4,"text":"(二) 略答","juan":9},{"t":"p","text":"何謂大乘二種種姓？一、本性住種姓，謂無始來依附本識，法爾所得無漏法因。二、習所成種姓，謂聞法界等流法已，聞所成等熏習所成。要具大乘此二種姓，方能漸次悟入唯識。","juan":9},{"t":"k","lv":4,"text":"(三) 別問別答廣前略答","juan":9},{"t":"k","lv":5,"text":"㊀廣能入人","juan":9},{"t":"k","lv":5,"text":"㊁廣所入位","juan":9},{"t":"p","text":"何謂悟入唯識五位？一、資糧位，謂修大乘順解脫分；二、加行位，謂修大乘順決擇分；三、通達位，謂諸菩薩所住見道；四、修習位，謂諸菩薩所住修道；五、究竟位，謂住無上正等菩提。","juan":9},{"t":"k","lv":5,"text":"㊂廣入方便","juan":9},{"t":"p","text":"云何漸次悟入唯識？謂諸菩薩於識相、性，資糧位中能深信解；在加行位能漸伏除所取、能取，引發真見；在通達位如實通達；修習位中如所見理，數數修習伏斷餘障；至究竟位出障圓明，能盡未來化有情類，復令悟入唯識相、性。","juan":9},{"t":"k","lv":3,"text":"二、舉頌正釋五位","juan":9},{"t":"p","text":"初資糧位，其相云何？","juan":9},{"t":"k","lv":4,"text":"(一) 資糧位","juan":9},{"t":"k","lv":5,"text":"㊀問起>","juan":9},{"t":"k","lv":5,"text":"㊁舉頌答","juan":9},{"t":"p","text":"頌曰：","juan":9}],"kepan":["(貳) 明唯識性","一、解第二十五頌唯識真性","(一) 釋初三句","(二) 釋第四句","二、總釋二十三至二十五頌意","(參) 明唯識位","一、結上顯後所明","(一) 結上示三問","(二) 略答","(三) 別問別答廣前略答","㊀廣能入人","㊁廣所入位","㊂廣入方便","二、舉頌正釋五位","(一) 資糧位","㊀問起>","㊁舉頌答"],"yi":"即依此三自性，建立那三種無性，所以佛以密意宣說一切法皆無自性。初者是相無性，次者是生無自然性，後者則由遠離前面所執的我法之性而立。此是諸法的勝義，也就是真如；因其常如其性、不變不異，即是唯識的實性。","yao":["三無性依三性而立，非別有法：相無性依遍計所執（體相都無），生無性依依他起（非自然生），勝義無性依圓成實（無我法性所顯）。","「密意說」三字極關鍵：般若一切法無自性之說，論主判為依三無性而作的密意言教，非了義的一切皆無。這是唯識學會通空宗的核心立場，亦是空有論諍的焦點。","第二十五頌正面標出「唯識實性」，與序分歸敬頌之「唯識性」首尾相應，全論宗趣至此圓滿確立。","真如「常如其性」的常，是無變異義而非有為法之恆常，論中特辨此常非常見之常，以防執真如為實體我。","本節於科判中節點最密（十七項），顯示論主在此處層層設難、逐一遮遣，是全論義理最緊之處。"],"ming":[["相無性","依遍計所執性立。其相本無，如空華兔角。"],["生無自然性","依依他起性立。依緣而生，非自然有，故無自然性。"],["勝義無性","依圓成實性立。由遠離遍計所執我法性而顯，是勝義故。"],["密意","佛依特定意趣而作的權說，須依了義而解，不可執言取義。"],["真如","真實不虛、如常不變。二空所顯之理，即唯識實性。"]]},{"id":16,"label":"唯識位一・資糧位","verses":[26],"kind":"verse","juan":[9],"chars":944,"blocks":[{"t":"v","num":26,"lines":["乃至未起識，求住唯識性，","於二取隨眠，猶未能伏滅。"],"juan":9},{"t":"k","lv":5,"text":"㊂長行釋","juan":9},{"t":"k","lv":6,"text":"1 別釋頌文","juan":9},{"t":"p","text":"論曰：從發深固大菩提心，乃至未起順決擇識，求住唯識真勝義性，齊此皆是資糧位攝，為趣無上正等菩提，修⸢311⸣集⸤種種勝資糧故。為有情故，勤求解脫，由此亦名順解脫分。","juan":9},{"t":"p","text":"此位菩薩依因、善友、作意、資糧四勝力故，於唯識義雖深信解，而未能了能、所取空，多住外門修菩薩行，故於二取所引隨眠，猶未有能伏滅功力，令彼不起二取現行。","juan":9},{"t":"p","text":"此「二取」言顯二取取，執取「能取」、「所取」性故。二取習氣名彼隨眠，隨逐有情，眠伏藏識，或隨增過，故名隨眠。即是所知、煩惱障種。","juan":9},{"t":"p","text":"煩惱障者，謂執遍計所執實我，薩迦耶見而為上首，百二十八根本煩惱，及彼等流諸隨煩惱。","juan":9},{"t":"p","text":"此皆擾惱有情身、心，能障涅槃，名煩惱障。","juan":9},{"t":"p","text":"所知障者，謂執遍計所執實法，薩迦耶見而為上首，見、疑、無明、愛、恚、慢等。","juan":9},{"t":"p","text":"覆所知境無顛倒性，能障菩提，名所知障。","juan":9},{"t":"p","text":"此所知障，決定不與異熟識俱，彼微劣故，不與無明、慧相應故，法空智品與俱起故。七轉識內，隨其所應或少或多，如煩惱說。眼等五識無分別故，法見、疑等定不相應，餘由意力皆容引起。","juan":9},{"t":"p","text":"此障但與不善、無記二心相應，論說無明唯通不善、無記性故，癡、無癡等不相應故。煩惱障中此障必有，彼定用此為所依故，體雖無異而用有別。故二隨眠，隨聖道用有勝、有劣，斷⸢312⸣惑⸤前後。此於無覆無記性中，是異熟生，非餘三種。彼威儀等勢用薄弱，非覆所知，障菩提故。此名無覆，望二乘說，若望菩薩亦是有覆。","juan":9},{"t":"p","text":"若所知障有見、疑等，如何此種，契經說為無明住地？無明增故，總名無明，非無見等。如煩惱種立見一處、欲、色、有愛四住地名，豈彼更無慢、無明等。","juan":9},{"t":"p","text":"如是二障分別起者，見所斷攝；任運起者，修所⸢313⸣⸤斷攝。","juan":9},{"t":"p","text":"⸢314⸣二⸤乘但能斷煩惱障，菩薩俱斷。","juan":9},{"t":"p","text":"永斷二種，唯聖道能；伏二現行，通有漏道。","juan":9},{"t":"p","text":"菩薩住此資糧位中，二麁現行雖有伏者，而於細者及二隨眠，止、觀力微，未能伏滅。","juan":9},{"t":"k","lv":6,"text":"2 辨位、修行","juan":9},{"t":"p","text":"此位未證唯識真如，⸢315⸣依⸤勝解力修諸勝行，應知亦是解行地攝。","juan":9},{"t":"p","text":"所修勝行，其相云何？","juan":9},{"t":"p","text":"略有二種：謂福及智，諸勝行中慧為性者皆名為智，餘名為福。且依六種波羅蜜多，通相皆二，別相前五說為福德，第六智慧；或復前三唯福德攝，後一唯智；餘通二種。","juan":9},{"t":"p","text":"復有二種：謂利自、他所修勝行，隨意樂力一切皆通自他利行，依別相說，六到彼岸、菩提分等，自利行攝；四種攝事、四無量等，一切皆是利他行攝。如是等行差別無邊，皆是此中所修勝行。","juan":9},{"t":"p","text":"此位二障雖未伏除，修勝行時有三退屈，而能三事練磨其心，於所證、修勇猛不退：一、聞無上正等菩提廣大深遠，心便退屈，引他已證大菩提者，練磨自心勇猛不退。二、聞施等波羅蜜多甚難可修，心便退屈，省己意樂能修施等，練磨自心勇猛不退。三、聞諸佛圓滿轉依極難可證，心便退屈，引他麁善況己妙因，練磨自心勇猛不退。由斯三事練磨其心，堅固熾然，修諸勝行。","juan":9},{"t":"k","lv":4,"text":"(二) 加行位","juan":9},{"t":"p","text":"次加行位，其相云何？","juan":9},{"t":"k","lv":5,"text":"㊀問起>","juan":9},{"t":"k","lv":5,"text":"㊁舉頌答","juan":9},{"t":"p","text":"頌曰：","juan":9}],"kepan":["㊂長行釋","1 別釋頌文","2 辨位、修行","(二) 加行位","㊀問起>","㊁舉頌答"],"yi":"乃至未能生起真正安住唯識性的智慧之前，行者雖已發心希求安住唯識實性，但對於能取所取二取的隨眠種子，仍未能夠伏除滅盡。此即資糧位。","yao":["五位修行的起點。資糧位攝十住、十行、十迴向三十心，歷第一無數大劫，以福智二資糧為積聚。","「猶未能伏滅」標明此位之限度：能伏現行之麁者，未能伏隨眠種子，故所修仍屬有漏，未入見道。","此位所依三退屈與三事練磨（菩提廣大屈、萬行難修屈、轉依難證屈）之說，是論中少見的實踐心理描寫。","唯識五位與《解深密經》《瑜伽論》之修道階位相配，論中並列教證，讀者可據以對觀。"],"ming":[["資糧位","五位之初。積集福德智慧資糧，攝三賢三十心。"],["隨眠","煩惱種子隨逐有情、眠伏藏識而不現行者。"],["二取","能取（見分）與所取（相分）。二取執是所應斷之根本。"],["三退屈","菩提廣大屈、萬行難修屈、轉依難證屈。以三事練磨對治。"]]},{"id":17,"label":"唯識位二・加行位","verses":[27],"kind":"verse","juan":[9],"chars":763,"blocks":[{"t":"v","num":27,"lines":["現前立少物，謂是唯識性，","以有所得故，非實住唯識。"],"juan":9},{"t":"k","lv":5,"text":"㊂長行釋","juan":9},{"t":"k","lv":6,"text":"1 顯位所由","juan":9},{"t":"p","text":"論曰：菩薩先於初無數劫，善備福德、智慧資糧。順解脫分既圓滿已，為入見道住唯識性，復修加行，伏除二取，謂煖、頂、忍、世第一法。","juan":9},{"t":"k","lv":6,"text":"2 釋位總名","juan":9},{"t":"p","text":"此四總名順決擇分，順趣真實決擇分故。近見道故立加行名，非前資糧無加行義。","juan":9},{"t":"
